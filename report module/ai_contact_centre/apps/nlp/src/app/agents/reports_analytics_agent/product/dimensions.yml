dimensions:
  channel:
    meaning: "Channel: webchat, email, call, whatsapp, instagram, facebook. Call count uses call. Social is whatsapp, instagram, facebook. Voice maps to call."
    user_phrases: [channel, call, social, voice]
    not_the_same_as: [CDR call count]
    sql_expr:
      agent_capacity: "agent_capacity.channel"
      assignment: "conversations.channel"
      automation_policy: "automation_policies.channel"
      conversation: "conversations.channel"
      copilot_turn: "conversations.channel"
      message: "conversations.channel"
      missed_contact: "missed_contacts.channel"
      missed_rate: "missed_rate_src.channel"
      nlp_turn: "conversations.channel"
      task: "tasks.channel"
      transfer: "transfers.channel"
  conversation_direction:
    meaning: "Inbound or outbound conversation. Not message direction."
    user_phrases: [direction, inbound, outbound]
    not_the_same_as: [message direction]
    sql_expr:
      assignment: "conversations.direction"
      conversation: "conversations.direction"
      copilot_turn: "conversations.direction"
      message: "conversations.direction"
      nlp_turn: "conversations.direction"
  conversation_status:
    meaning: "Inbox status: bot_active, queued, assigned, active, resolved, closed. Handled is resolved/closed or ended_at set. Not lifecycle_state, sla_status, queue status, or presence."
    user_phrases: [status, open, closed]
    not_the_same_as: [lifecycle_state, sla_status, queue status, presence]
    sql_expr:
      assignment: "conversations.status"
      conversation: "conversations.status"
      copilot_turn: "conversations.status"
      message: "conversations.status"
      nlp_turn: "conversations.status"
  queue:
    meaning: "Runtime published queue name. Default queue label. Not the admin setup-queue profile name."
    user_phrases: [queue, queue name]
    not_the_same_as: [setup_queue_name]
    sql_expr:
      assignment: "queues.name"
      call_cdr: "call_cdr.queue_name"
      conversation: "conversations.queue_name"
      live_queue_snapshot: "live_queue_snapshot.queue_name"
      missed_contact: "missed_contacts.queue_name"
      missed_rate: "missed_rate_src.queue_name"
      queue: "queues.name"
      routing_policy: "routing_policies.queue_name"
  team:
    meaning: "Team name. Never the team id."
    user_phrases: [team, team name]
    sql_expr:
      conversation: "conversations.team_name"
      team: "teams.name"
  agent:
    meaning: "Agent display name. Never the agent id."
    user_phrases: [agent, agent name]
    not_the_same_as: [user name]
    sql_expr:
      agent: "agents.display_name"
      assignment: "agents.display_name"
      conversation: "conversations.agent_name"
      missed_contact: "missed_contacts.agent_name"
      missed_rate: "missed_rate_src.agent_name"
      not_ready_escalation: "not_ready_escalations.agent_name"
  handler:
    meaning: "AI if never assigned, Agent if assigned. Split of handled. Not bot containment as a rate."
    user_phrases: [handler, AI, human]
    not_the_same_as: [bot_containment]
    sql_expr:
      assignment: "conversations.handler"
      conversation: "conversations.handler"
      copilot_turn: "conversations.handler"
      message: "conversations.handler"
      nlp_turn: "conversations.handler"
  priority:
    meaning: "0 normal, 1 high."
    user_phrases: [priority, high priority]
    sql_expr:
      assignment: "conversations.priority"
      conversation: "conversations.priority"
      copilot_turn: "conversations.priority"
      message: "conversations.priority"
      nlp_turn: "conversations.priority"
  end_reason:
    meaning: "Why the session ended."
    user_phrases: [end reason]
    sql_expr:
      conversation: "conversations.end_reason"
  end_actor:
    meaning: "Who ended it: agent, customer, system, bot, session."
    user_phrases: [end actor]
    sql_expr:
      conversation: "conversations.end_actor"
  disposition:
    meaning: "Human wrap-up label from the catalog. Not the raw code."
    user_phrases: [disposition, wrap up]
    not_the_same_as: [disposition_code]
    sql_expr:
      conversation: "conversations.disposition_label"
      disposition: "disposition_catalog.label"
  resolution_code:
    meaning: "resolved, unresolved, abandoned, transferred."
    user_phrases: [resolution]
    not_the_same_as: [resolved_at]
    sql_expr:
      conversation: "conversations.resolution_code"
  is_reopened:
    meaning: "True if previous_conversation_id is set. FCR excludes these."
    user_phrases: [reopened, repeat]
    not_the_same_as: [resolution_rate]
    sql_expr:
      conversation: "conversations.is_reopened"
  is_bot_only:
    meaning: "Never assigned to a person. Bot containment numerator."
    user_phrases: [bot only, contained]
    not_the_same_as: [bot_active]
    sql_expr:
      conversation: "conversations.is_bot_only"
  day:
    meaning: "UTC calendar day of the card's business date column."
    user_phrases: [day, date]
    not_the_same_as: [week, month, hour]
    sql_expr:
      default: "date_trunc('day', <business_date_column> AT TIME ZONE 'UTC')"
      missed_rate: "date_trunc('day', missed_rate_src.clock_at AT TIME ZONE 'UTC')"
  week:
    meaning: "UTC week Monday–Sunday of the card's business date column."
    user_phrases: [week]
    not_the_same_as: [day, month]
    sql_expr:
      default: "date_trunc('week', <business_date_column> AT TIME ZONE 'UTC')"
      missed_rate: "date_trunc('week', missed_rate_src.clock_at AT TIME ZONE 'UTC')"
  month:
    meaning: "UTC calendar month of the card's business date column."
    user_phrases: [month]
    not_the_same_as: [day, week]
    sql_expr:
      default: "date_trunc('month', <business_date_column> AT TIME ZONE 'UTC')"
      missed_rate: "date_trunc('month', missed_rate_src.clock_at AT TIME ZONE 'UTC')"
  hour:
    meaning: "UTC hour of the card's business date column."
    user_phrases: [hour]
    not_the_same_as: [day]
    sql_expr:
      default: "date_trunc('hour', <business_date_column> AT TIME ZONE 'UTC')"
      missed_rate: "date_trunc('hour', missed_rate_src.clock_at AT TIME ZONE 'UTC')"
  miss_reason:
    meaning: "Why the contact was missed (no agent, offer timeout). Not abandoned in queue."
    user_phrases: [miss reason]
    not_the_same_as: [abandoned, end_reason]
    sql_expr:
      miss_reason: "missed_reasons.name"
      missed_contact: "missed_contacts.reason_label"
  presence_state:
    meaning: "ready, not_ready, busy, break, away, after_contact_work, offline. Ready agents use this. Not roster agents.status."
    user_phrases: [presence, ready, logged in, presence state]
    not_the_same_as: [agent_roster_status, conversation_status]
    sql_expr:
      agent: "presence.presence_state"
      presence: "presence.presence_state"
      presence_interval: "presence_history.new_state"
      presence_reason: "presence_reasons.presence_state"
  assignment_state:
    meaning: "Offer state: offered, accepted, rejected, expired, ended. When the user says assignment status, use this. Not conversation status."
    user_phrases: [assignment status, offer state, ringing]
    not_the_same_as: [conversation status]
    sql_expr:
      assignment: "assignments.state"
  shift:
    meaning: "Shift type on queue membership."
    user_phrases: [shift, shift type]
    sql_expr:
      queue_member: "queue_members.shift_type"
      setup_queue_agent: "setup_queue_agents.shift_type"
      shift: "shifts.shift_type"
  task_type:
    meaning: "callback and other task types. callback_count filters this to callback."
    user_phrases: [task type, callback]
    sql_expr:
      task: "tasks.task_type"
  task_status:
    meaning: "open, completed, dismissed. Not conversation status."
    user_phrases: [task status]
    not_the_same_as: [conversation status]
    sql_expr:
      task: "tasks.status"
  delivery_state:
    meaning: "pending, delivered, read, failed. When the user says message status, use this. Failed-send numerator is failed."
    user_phrases: [delivery, failed, message status]
    not_the_same_as: [conversation status]
    sql_expr:
      message: "messages.delivery_state"
  visibility:
    meaning: "internal vs customer-visible. Failed-send denominator is outbound and customer-visible."
    user_phrases: [visibility, internal, customer visible]
    not_the_same_as: [conversation status]
    sql_expr:
      message: "messages.visibility"
  sender_type:
    meaning: "Who sent it: customer, agent, bot, system."
    user_phrases: [sender, sender type]
    not_the_same_as: [participant_type]
    sql_expr:
      message: "messages.sender_type"
  message_type:
    meaning: "Kind of message (text, file, and similar)."
    user_phrases: [message type]
    sql_expr:
      message: "messages.message_type"
  message_direction:
    meaning: "Message inbound or outbound. Not conversation direction. Failed-send uses outbound."
    user_phrases: [message direction]
    not_the_same_as: [conversation direction]
    sql_expr:
      message: "messages.direction"
  intent:
    meaning: "Detected intent on the bot turn."
    user_phrases: [intent]
    sql_expr:
      nlp_turn: "nlp_turns.intent"
  grounded:
    meaning: "Whether the bot reply was grounded. bot_grounded_rate numerator. Not bot containment."
    user_phrases: [grounded]
    not_the_same_as: [bot_containment]
    sql_expr:
      nlp_turn: "nlp_turns.grounded"
  handoff_recommended:
    meaning: "Bot recommended a handoff on this turn."
    user_phrases: [handoff recommended]
    not_the_same_as: [handoff_reason]
    sql_expr:
      nlp_turn: "nlp_turns.handoff_recommended"
  copilot_accepted:
    meaning: "Whether the agent accepted the suggestion. Null means no suggestion shown. copilot_acceptance_rate denominator is accepted IS NOT NULL."
    user_phrases: [accepted, copilot accepted]
    not_the_same_as: [offer accept]
    sql_expr:
      copilot_turn: "copilot_turns.accepted"
  copilot_turn_type:
    meaning: "Kind of copilot turn."
    user_phrases: [copilot turn type]
    sql_expr:
      copilot_turn: "copilot_turns.turn_type"
  customer_sentiment:
    meaning: "Customer sentiment label. Negative KPI uses negative and very_negative. Fanout: EXISTS, do not join into conversation COUNT."
    user_phrases: [sentiment, negative]
    not_the_same_as: [agent_label]
    sql_expr:
      sentiment_turn: "sentiment_turns.customer_label"
  agent_roster_status:
    meaning: "Roster active/inactive. Not ready. Ready agents use presence_state."
    user_phrases: [agent status, roster]
    not_the_same_as: [presence_state, conversation status]
    sql_expr:
      agent: "agents.status"
  queue_status:
    meaning: "Published queue active/inactive. Not conversation status."
    user_phrases: [queue status]
    not_the_same_as: [conversation status, presence]
    sql_expr:
      queue: "queues.status"
  setup_queue_name:
