  transfers:
    grain: "one transfer hop"
    description: "From/to queue and agent names. Transferred KPI uses conversations.transferred_at, not hop count."
    object: transfer
    source: |
      SELECT
        tr.accepted_agent_id,
        tr.accepted_at,
        tr.accepted_user_id,
        tr.cancelled_at,
        tr.channel,
        tr.completed_at,
        tr.conversation_id,
        tr.disposition_code,
        tr.expired_at,
        tr.from_agent_id,
        tr.from_queue_id,
        tr.from_user_id,
        tr.id,
        tr.notes,
        tr.offered_agent_id,
        tr.offered_at,
        tr.outcome_reason,
        tr.rejected_at,
        tr.requested_agent_id,
        tr.requested_at,
        tr.requested_by_user_id,
        tr.resolution_code,
        tr.routing_attempt_id,
        tr.state,
        tr.to_queue_id,
        fq.name AS from_queue_name,
        tq.name AS to_queue_name,
        fa.display_name AS from_agent_name,
        ta.display_name AS to_agent_name
      FROM ccass.conversation_transfers tr
      LEFT JOIN ccass.queues fq ON fq.id = tr.from_queue_id AND fq.organization_id = tr.organization_id
      LEFT JOIN ccass.queues tq ON tq.id = tr.to_queue_id AND tq.organization_id = tr.organization_id
      LEFT JOIN ccass.agents fa ON fa.id = tr.from_agent_id AND fa.organization_id = tr.organization_id
      LEFT JOIN ccass.agents ta ON ta.id = COALESCE(tr.accepted_agent_id, tr.offered_agent_id) AND ta.organization_id = tr.organization_id
      WHERE tr.organization_id = {org_id}
    columns:
      accepted_agent_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      accepted_at:
        type: timestamptz
        description: "Accepted at on this transfer. UTC when it is a timestamp."
        groupable: false
        user_phrases: [accepted at]
      accepted_user_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      cancelled_at:
        type: timestamptz
        description: "Cancelled at on this transfer. UTC when it is a timestamp."
        groupable: false
        user_phrases: [cancelled at]
      channel:
        type: text
        description: "Channel on this transfer."
        groupable: true
        user_phrases: [channel]
      completed_at:
        type: timestamptz
        description: "Completed at on this transfer. UTC when it is a timestamp."
        groupable: false
        user_phrases: [completed at]
      conversation_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      disposition_code:
        type: text
        description: "Disposition code on this transfer."
        groupable: true
        user_phrases: [disposition code]
      expired_at:
        type: timestamptz
        description: "Expired at on this transfer. UTC when it is a timestamp."
        groupable: false
        user_phrases: [expired at]
      from_agent_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      from_queue_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      from_user_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      notes:
        type: text
        description: "Notes on this transfer."
        groupable: true
        user_phrases: [notes]
      offered_agent_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      offered_at:
        type: timestamptz
        description: "Offered at on this transfer. UTC when it is a timestamp."
        groupable: false
        user_phrases: [offered at]
      outcome_reason:
        type: text
        description: "Outcome reason on this transfer."
        groupable: true
        user_phrases: [outcome reason]
      rejected_at:
        type: timestamptz
        description: "Rejected at on this transfer. UTC when it is a timestamp."
        groupable: false
        user_phrases: [rejected at]
      requested_agent_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      requested_at:
        type: timestamptz
        description: "Requested at on this transfer. UTC when it is a timestamp."
        groupable: false
        user_phrases: [requested at]
      requested_by_user_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      resolution_code:
        type: text
        description: "Resolution code on this transfer."
        groupable: true
        user_phrases: [resolution code]
      routing_attempt_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      state:
        type: text
        description: "Transfer hop state. Completed hops only count toward transferred when conversations.transferred_at is set."
        groupable: true
        user_phrases: [transfer state]
        not_the_same_as: [conversation status]
      to_queue_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      from_queue_name:
        type: text
        description: "Queue transferred from."
        groupable: true
        user_phrases: [from queue]
      to_queue_name:
        type: text
        description: "Queue transferred to."
        groupable: true
        user_phrases: [to queue, transferred to queue]
      from_agent_name:
        type: text
        description: "Agent transferred from."
        groupable: true
        user_phrases: [from agent]
      to_agent_name:
        type: text
        description: "Agent who accepted the transfer."
        groupable: true
        user_phrases: [to agent, transferred to agent]
    joins:
      - to: rpt.conversations
        on: transfers.conversation_id = conversations.id
        why: "Parent session."
      - to: rpt.queues
        on: transfers.to_queue_id = queues.id
        why: "To-queue name. From-queue is a second alias in source."
      - to: rpt.agents
        on: transfers.accepted_agent_id = agents.id
        why: "Accepted agent name."

  applied_dispositions:
