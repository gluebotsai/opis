  call_cdr:
    grain: "one CDR session"
    description: "Hold seconds = agent_hold_duration/1000. Talk/wait/queue durations for free SQL. Certified wait is conversations. Tenant domain_id. Join hub on session_id = external_thread_id and channel=call. Hide numbers and recording URLs."
    object: call_cdr
    source: |
      SELECT
        cdr.id,
        cdr.session_id,
        cdr.session_start_time,
        cdr.session_end_time,
        cdr.is_inbound,
        cdr.dial_duration,
        cdr.disconnected_by,
        cdr.queue_duration,
        cdr.wait_duration,
        cdr.is_transferred,
        cdr.agent_hold_duration,
        (cdr.agent_hold_duration / 1000.0) AS hold_seconds,
        cdr.is_bot,
        cdr.is_autobot,
        cdr.recording_duration,
        cdr.call_duration,
        cdr.leg_duration,
        cdr.leg_start_time,
        cdr.leg_end_time,
        cdr.is_abandoned,
        cdr.is_missed,
        cdr.is_listen,
        cdr.is_whisper,
        cdr.is_barge,
        cdr.hours_of_operation,
        cdr.umn_status,
        cdr.outbound_campaign,
        cdr.is_ccaas,
        cdr.is_crm,
        cdr.transferred_time,
        cdr.business_start_time,
        cdr.business_end_time,
        cdr.queue_id,
        q.name AS queue_name,
        cdr.disposition_id,
        cdr.transferred_type_id,
        cdr.created_at
      FROM ccass.call_cdr cdr
      LEFT JOIN ccass.queues q ON q.id = cdr.queue_id AND q.organization_id = cdr.domain_id
      WHERE cdr.domain_id = {org_id}
    columns:
      agent_hold_duration:
        type: bigint
        description: "Hold time in milliseconds. Certified avg_hold_time is this / 1000.0 seconds. Include zeros. Not AHT. Not ASA."
        groupable: false
        user_phrases: [hold, hold time]
        not_the_same_as: [avg_handle_time, asa]
      business_end_time:
        type: bigint
        description: "Business end time on this call_cdr."
        groupable: false
        user_phrases: [business end time]
      business_start_time:
        type: bigint
        description: "Business start time on this call_cdr."
        groupable: false
        user_phrases: [business start time]
      call_duration:
        type: bigint
        description: "Call duration on this call_cdr. Durations stay in source units unless a certified KPI converts them."
        groupable: false
        user_phrases: [call duration]
      created_at:
        type: timestamptz
        description: "CDR row time. avg_hold_time clock."
        groupable: false
        user_phrases: [cdr created]
      dial_duration:
        type: bigint
        description: "Dial duration on this call_cdr. Durations stay in source units unless a certified KPI converts them."
        groupable: false
        user_phrases: [dial duration]
      disconnected_by:
        type: text
        description: "Disconnected by on this call_cdr."
        groupable: true
        user_phrases: [disconnected by]
      disposition_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      hours_of_operation:
        type: smallint
        description: "Hours of operation on this call_cdr."
        groupable: false
        user_phrases: [hours of operation]
      id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      is_abandoned:
        type: smallint
        description: "Telephony abandon flag. Not the product abandoned KPI (queued, never assigned, ended)."
        groupable: true
        user_phrases: [cdr abandoned]
        not_the_same_as: [abandoned]
      is_autobot:
        type: integer
        description: "Is autobot on this call_cdr."
        groupable: false
        user_phrases: [is autobot]
      is_barge:
        type: smallint
        description: "Flag is barge on this call_cdr."
        groupable: true
        user_phrases: [is barge]
      is_bot:
        type: smallint
        description: "Flag is bot on this call_cdr."
        groupable: true
        user_phrases: [is bot]
      is_ccaas:
        type: integer
        description: "Is ccaas on this call_cdr."
        groupable: false
        user_phrases: [is ccaas]
      is_crm:
        type: integer
        description: "Is crm on this call_cdr."
        groupable: false
        user_phrases: [is crm]
      is_inbound:
        type: smallint
        description: "Flag is inbound on this call_cdr."
        groupable: true
        user_phrases: [is inbound]
      is_listen:
        type: smallint
        description: "Flag is listen on this call_cdr."
        groupable: true
        user_phrases: [is listen]
      is_missed:
        type: smallint
        description: "Telephony missed flag. Not product missed_contacts."
        groupable: true
        user_phrases: [cdr missed]
        not_the_same_as: [missed_contacts]
      is_transferred:
        type: smallint
        description: "Flag is transferred on this call_cdr."
        groupable: true
        user_phrases: [is transferred]
      is_whisper:
        type: smallint
        description: "Flag is whisper on this call_cdr."
        groupable: true
        user_phrases: [is whisper]
      leg_duration:
        type: bigint
        description: "Leg duration on this call_cdr. Durations stay in source units unless a certified KPI converts them."
        groupable: false
        user_phrases: [leg duration]
      leg_end_time:
        type: bigint
        description: "Leg end time on this call_cdr."
        groupable: false
        user_phrases: [leg end time]
      leg_start_time:
        type: bigint
        description: "Leg start time on this call_cdr."
        groupable: false
        user_phrases: [leg start time]
      outbound_campaign:
        type: smallint
        description: "Outbound campaign on this call_cdr."
        groupable: false
        user_phrases: [outbound campaign]
      queue_duration:
        type: bigint
        description: "CDR queue milliseconds. Not certified queue wait."
        groupable: false
        user_phrases: [cdr queue duration]
        not_the_same_as: [asa]
      queue_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      recording_duration:
        type: bigint
        description: "Recording duration on this call_cdr. Durations stay in source units unless a certified KPI converts them."
        groupable: false
        user_phrases: [recording duration]
      session_end_time:
        type: bigint
        description: "Session end time on this call_cdr."
        groupable: false
        user_phrases: [session end time]
      session_id:
        type: text
        description: "Join to conversations.external_thread_id when channel is call. Never show."
        groupable: false
        user_phrases: []
      session_start_time:
        type: bigint
        description: "Session start time on this call_cdr."
        groupable: false
        user_phrases: [session start time]
      transferred_time:
        type: bigint
        description: "Transferred time on this call_cdr."
        groupable: false
        user_phrases: [transferred time]
      transferred_type_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      umn_status:
        type: smallint
        description: "Umn status on this call_cdr."
        groupable: false
        user_phrases: [umn status]
      wait_duration:
        type: bigint
        description: "CDR wait milliseconds. Not certified ASA. Certified wait is conversations queued_at to assigned_at."
        groupable: false
        user_phrases: [cdr wait]
        not_the_same_as: [asa, queue wait]
      hold_seconds:
        type: numeric
        description: "agent_hold_duration / 1000.0 seconds. Certified avg_hold_time averages this / 60 as minutes, including zeros."
        groupable: false
        user_phrases: [hold, hold seconds]
        not_the_same_as: [avg_handle_time, asa]
      queue_name:
        type: text
        description: "Runtime queue name on the CDR row."
        groupable: true
        user_phrases: [queue]
    joins:
      - to: rpt.conversations
        on: call_cdr.session_id = conversations.external_thread_id
        why: "Call conversation. Also require channel = call."
      - to: rpt.queues
        on: call_cdr.queue_id = queues.id
        why: "Queue name."

