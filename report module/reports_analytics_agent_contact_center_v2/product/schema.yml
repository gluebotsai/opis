  customers:
    grain: "one customer"
    description: "Name, language, region, company, timezone, blocked, contact_type, acquisition_channel. Hide DOB and json. contact_id = cdp_id."
    object: customer
    source: |
      SELECT
        p.cdp_id,
        p.first_name,
        p.last_name,
        NULLIF(BTRIM(CONCAT(COALESCE(p.first_name, ''), ' ', COALESCE(p.last_name, ''))), '') AS customer_name,
        p.language,
        p.region,
        p.city,
        p.country,
        p.company,
        p.industry,
        p.timezone,
        p.blocked,
        p.contact_type,
        p.acquisition_channel,
        p.acquisition_date,
        p.gender,
        p.primary_product,
        p.first_referrer,
        p.first_seen_at,
        p.last_seen_at,
        p.created_at
      FROM cdp.customer_profile p
      WHERE p.organization_id = {org_id}
    columns:
      acquisition_channel:
        type: text
        description: "Acquisition channel on this customer."
        groupable: true
        user_phrases: [acquisition channel]
      acquisition_date:
        type: date
        description: "Acquisition date on this customer. UTC when it is a timestamp."
        groupable: false
        user_phrases: [acquisition date]
      blocked:
        type: boolean
        description: "Blocked on CDP. When the user says customer status, they often mean this."
        groupable: true
        user_phrases: [blocked, customer status]
        not_the_same_as: [conversation status]
      cdp_id:
        type: text
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      city:
        type: text
        description: "City on this customer."
        groupable: true
        user_phrases: [city]
      company:
        type: text
        description: "Customer company. Filter, not a Total GROUP BY."
        groupable: true
        user_phrases: [company]
        not_the_same_as: [tenant company_name]
      contact_type:
        type: text
        description: "Contact type on this customer."
        groupable: true
        user_phrases: [contact type]
      country:
        type: text
        description: "Country on this customer."
        groupable: true
        user_phrases: [country]
      created_at:
        type: timestamptz
        description: "Created at on this customer. UTC when it is a timestamp."
        groupable: false
        user_phrases: [created at]
      first_name:
        type: text
        description: "Customer first name. Show concatenated name; never cdp_id. Unknown customer if both names empty."
        groupable: false
        user_phrases: [first name, customer]
      first_referrer:
        type: text
        description: "First referrer on this customer."
        groupable: true
        user_phrases: [first referrer]
      first_seen_at:
        type: timestamptz
        description: "First seen at on this customer. UTC when it is a timestamp."
        groupable: false
        user_phrases: [first seen at]
      gender:
        type: text
        description: "Gender on this customer."
        groupable: true
        user_phrases: [gender]
      industry:
        type: text
        description: "Industry on this customer."
        groupable: true
        user_phrases: [industry]
      language:
        type: text
        description: "Customer language. Filter on conversation metrics; not a Total GROUP BY."
        groupable: true
        user_phrases: [language]
      last_name:
        type: text
        description: "Customer last name."
        groupable: false
        user_phrases: [last name]
      last_seen_at:
        type: timestamptz
        description: "Last seen at on this customer. UTC when it is a timestamp."
        groupable: false
        user_phrases: [last seen at]
      primary_product:
        type: text
        description: "Primary product on this customer."
        groupable: true
        user_phrases: [primary product]
      region:
        type: text
        description: "Customer region."
        groupable: true
        user_phrases: [region]
      timezone:
        type: text
        description: "Timezone on this customer."
        groupable: true
        user_phrases: [timezone]
      customer_name:
        type: text
        description: "first_name plus last_name. If empty say unknown customer."
        groupable: false
        user_phrases: [customer, customer name]
    joins:
      - to: rpt.identity_keys
        on: identity_keys.cdp_id = customers.cdp_id
        why: "Identity keys. EXISTS only."
      - to: rpt.conversations
        on: conversations.contact_id = customers.cdp_id
        why: "Sessions for this customer."

  identity_keys:
    grain: "one identity key"
    description: "key_type, verified, source_system. key_value hidden. EXISTS only."
    object: identity_key
    source: |
      SELECT
        k.identity_id,
        k.cdp_id,
        k.key_type,
        k.verified,
        k.source_system,
        k.confidence_score,
        k.created_at
      FROM cdp.identity_keys k
      WHERE k.organization_id = {org_id}
    columns:
      cdp_id:
        type: text
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      confidence_score:
        type: numeric
        description: "Confidence score on this identity_key."
        groupable: false
        user_phrases: [confidence score]
      created_at:
        type: timestamptz
        description: "Created at on this identity_key. UTC when it is a timestamp."
        groupable: false
        user_phrases: [created at]
      identity_id:
        type: text
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      key_type:
        type: text
        description: "Key type on this identity_key."
        groupable: true
        user_phrases: [key type]
      source_system:
        type: text
        description: "Source system on this identity_key."
        groupable: true
        user_phrases: [source system]
      verified:
        type: boolean
        description: "Whether verified on this identity_key."
        groupable: true
        user_phrases: [verified]
    joins:
      - to: rpt.customers
        on: identity_keys.cdp_id = customers.cdp_id
        why: "Parent customer. EXISTS only."

