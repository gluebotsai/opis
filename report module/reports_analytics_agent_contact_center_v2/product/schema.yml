        description: "Display label for this presence_reason. Show the name, never the id."
        groupable: true
        user_phrases: [label, presence_reason]
      presence_state:
        type: text
        description: "Presence state on this presence_reason."
        groupable: true
        user_phrases: [presence state]
      requires_note:
        type: boolean
        description: "Whether requires note on this presence_reason."
        groupable: true
