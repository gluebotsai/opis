  presence:
    grain: "one live presence row"
    description: "presence_state is ready/not_ready/busy/break/away/acw/offline. Not agents.status."
    object: presence
    source: |
      SELECT
        p.agent_id,
        p.heartbeat_at,
        p.id,
        p.lease_expires_at,
        p.presence_state,
        p.reason_code,
        p.source,
        p.status
      FROM ccass.agent_presence p
      WHERE p.organization_id = {org_id}
    columns:
      agent_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      heartbeat_at:
        type: timestamptz
        description: "Heartbeat at on this presence. UTC when it is a timestamp."
        groupable: false
        user_phrases: [heartbeat at]
      id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      lease_expires_at:
        type: timestamptz
        description: "Lease expires at on this presence. UTC when it is a timestamp."
        groupable: false
        user_phrases: [lease expires at]
      presence_state:
        type: text
        description: "Live presence: ready, not_ready, busy, break, away, after_contact_work, offline. Ready agents and logged-in agents use this. Not agents.status."
        groupable: true
        user_phrases: [presence, ready, logged in]
        not_the_same_as: [agents.status]
      reason_code:
        type: text
        description: "Reason code on this presence."
        groupable: true
        user_phrases: [reason code]
      source:
        type: text
        description: "Source on this presence."
        groupable: true
        user_phrases: [source]
      status:
        type: text
        description: "Presence row bookkeeping status. Not ready. Use presence_state for ready."
        groupable: true
        user_phrases: [presence row status]
        not_the_same_as: [presence_state, agents.status]
    joins:
      - to: rpt.agents
        on: presence.agent_id = agents.id
        why: "Agent name."

  presence_history:
    grain: "one presence interval"
    description: "Occupancy and presence hours grain. Clip started_at/ended_at to the UTC window."
    object: presence_interval
    source: |
      SELECT
        h.agent_id,
        h.ended_at,
        h.id,
        h.new_state,
        h.previous_state,
        h.reason_code,
        h.source,
        h.started_at
      FROM ccass.agent_presence_history h
      WHERE h.organization_id = {org_id}
    columns:
      agent_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      ended_at:
        type: timestamptz
        description: "Interval end. Null means still open; use now as end."
        groupable: false
        user_phrases: [presence end]
      id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      new_state:
        type: text
        description: "Presence state for this interval. Occupancy and presence hours GROUP BY this. Logged-in excludes offline."
        groupable: true
        user_phrases: [presence state, new state]
        not_the_same_as: [agents.status]
      previous_state:
        type: text
        description: "Previous state on this presence_interval."
        groupable: true
        user_phrases: [previous state]
      reason_code:
        type: text
        description: "Reason code on this presence_interval."
        groupable: true
        user_phrases: [reason code]
      source:
        type: text
        description: "Source on this presence_interval."
        groupable: true
        user_phrases: [source]
      started_at:
        type: timestamptz
        description: "Interval start. Clip to the UTC window for occupancy. Present-days clock."
        groupable: false
        user_phrases: [presence start]
    joins:
      - to: rpt.agents
        on: presence_history.agent_id = agents.id
        why: "Agent name."
      - to: rpt.users
        on: agents.setup_user_id = users.id
        why: "Setup user."
      - to: rpt.presence_reasons
        on: presence_history.reason_code = presence_reasons.code
        why: "Reason label."

  presence_reasons:
    grain: "one not-ready reason"
    description: "Catalog of presence reason labels."
    object: presence_reason
    source: |
      SELECT
        r.code,
        r.created_at,
        r.id,
        r.is_active,
        r.label,
        r.presence_state,
        r.requires_note
      FROM ccass.presence_reason_codes r
