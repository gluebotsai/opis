        groupable: true
        user_phrases: [grounded]
        not_the_same_as: [bot_containment]
      guard_passed:
        type: boolean
        description: "Whether guard passed on this nlp_turn."
        groupable: true
        user_phrases: [guard passed]
      handoff_reason:
        type: text
        description: "Handoff reason on this nlp_turn."
        groupable: true
        user_phrases: [handoff reason]
      handoff_recommended:
        type: boolean
        description: "Bot recommended a handoff on this turn."
        groupable: true
        user_phrases: [handoff recommended]
        not_the_same_as: [handoff_reason]
      id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      intent:
        type: text
        description: "Detected intent on the bot turn."
        groupable: true
        user_phrases: [intent]
      latency_ms:
        type: integer
        description: "Latency ms on this nlp_turn. Durations stay in source units unless a certified KPI converts them."
        groupable: false
        user_phrases: [latency ms]
      model_name:
        type: text
        description: "Model name on this nlp_turn."
        groupable: true
        user_phrases: [model name]
      nlp_conversation_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      queue_profile_version:
        type: text
        description: "Queue profile version on this nlp_turn."
        groupable: true
        user_phrases: [queue profile version]
      selected_queue_key:
        type: text
        description: "Selected queue key on this nlp_turn."
        groupable: true
        user_phrases: [selected queue key]
      sentiment:
        type: text
        description: "Sentiment on this nlp_turn."
        groupable: true
        user_phrases: [sentiment]
      skill_key:
        type: text
        description: "Skill key on this nlp_turn."
        groupable: true
        user_phrases: [skill key]
      status:
        type: text
        description: "Status of this nlp_turn. Not conversation inbox status, not presence ready, unless this object is that thing."
        groupable: true
        user_phrases: [nlp_turn status, status]
        not_the_same_as: [conversation status, presence_state, agents.status]
      summary:
        type: text
        description: "Summary on this nlp_turn."
        groupable: true
        user_phrases: [summary]
      turn_number:
        type: integer
        description: "Turn number on this nlp_turn."
        groupable: false
        user_phrases: [turn number]
    joins:
      - to: rpt.conversations
        on: nlp_turns.conversation_id = conversations.id
        why: "Parent session. EXISTS for rates."
      - to: rpt.nlp_conversations
        on: nlp_turns.nlp_conversation_id = nlp_conversations.id
        why: "Bot session."

  nlp_conversations:
    grain: "one bot session"
    description: "NLP session around a conversation."
    object: nlp_conversation
    source: |
      SELECT
        n.conversation_id,
        n.created_at,
        n.end_reason,
        n.ended_at,
        n.id,
        n.runtime_type,
        n.skill_version_id,
        n.started_at,
        n.status
      FROM ccass.nlp_conversations n
      WHERE n.organization_id = {org_id}
    columns:
      conversation_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      created_at:
        type: timestamptz
        description: "Created at on this nlp_conversation. UTC when it is a timestamp."
        groupable: false
        user_phrases: [created at]
      end_reason:
        type: text
        description: "End reason on this nlp_conversation."
        groupable: true
        user_phrases: [end reason]
      ended_at:
        type: timestamptz
        description: "Ended at on this nlp_conversation. UTC when it is a timestamp."
        groupable: false
        user_phrases: [ended at]
      id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      runtime_type:
        type: text
        description: "Runtime type on this nlp_conversation."
        groupable: true
        user_phrases: [runtime type]
      skill_version_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      started_at:
        type: timestamptz
        description: "Started at on this nlp_conversation. UTC when it is a timestamp."
        groupable: false
        user_phrases: [started at]
      status:
        type: text
        description: "Status of this nlp_conversation. Not conversation inbox status, not presence ready, unless this object is that thing."
        groupable: true
        user_phrases: [nlp_conversation status, status]
        not_the_same_as: [conversation status, presence_state, agents.status]
    joins:
      - to: rpt.conversations
        on: nlp_conversations.conversation_id = conversations.id
        why: "Parent session."

  copilot_turns:
    grain: "one copilot turn"
    description: "Accepted, latency, suggestion/final text for lists. Not copilot memory."
    object: copilot_turn
    source: |
      SELECT
        t.accepted,
        t.agent_input,
        t.conversation_id,
        t.copilot_response,
        t.created_at,
        t.final_text,
        t.id,
        t.latency_ms,
        t.model_name,
        t.sent_message_id,
        t.session_id,
        t.skill_key,
        t.status,
        t.suggestion_text,
        t.surface,
        t.turn_type
      FROM ccass.copilot_turns t
      WHERE t.organization_id = {org_id}
    columns:
      accepted:
        type: boolean
        description: "Whether the agent accepted the suggestion. Null means no suggestion shown. copilot_acceptance_rate denominator is accepted IS NOT NULL."
        groupable: true
        user_phrases: [accepted, copilot accepted]
        not_the_same_as: [offer accept]
      agent_input:
        type: text
        description: "Agent input on this copilot_turn."
        groupable: true
        user_phrases: [agent input]
      conversation_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      copilot_response:
        type: text
        description: "Copilot response on this copilot_turn."
        groupable: true
        user_phrases: [copilot response]
      created_at:
        type: timestamptz
        description: "Copilot turn time. copilot_acceptance_rate clock."
        groupable: false
        user_phrases: [copilot time]
      final_text:
        type: text
        description: "Final text on this copilot_turn."
        groupable: true
        user_phrases: [final text]
      id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      latency_ms:
        type: integer
        description: "Latency ms on this copilot_turn. Durations stay in source units unless a certified KPI converts them."
        groupable: false
        user_phrases: [latency ms]
      model_name:
        type: text
        description: "Model name on this copilot_turn."
        groupable: true
        user_phrases: [model name]
      sent_message_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      session_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      skill_key:
        type: text
        description: "Skill key on this copilot_turn."
        groupable: true
        user_phrases: [skill key]
      status:
        type: text
        description: "Status of this copilot_turn. Not conversation inbox status, not presence ready, unless this object is that thing."
        groupable: true
        user_phrases: [copilot_turn status, status]
        not_the_same_as: [conversation status, presence_state, agents.status]
      suggestion_text:
        type: text
        description: "Suggestion text on this copilot_turn."
        groupable: true
        user_phrases: [suggestion text]
      surface:
        type: text
        description: "Surface on this copilot_turn."
        groupable: true
        user_phrases: [surface]
      turn_type:
        type: text
        description: "Kind of copilot turn."
        groupable: true
        user_phrases: [copilot turn type]
    joins:
      - to: rpt.conversations
        on: copilot_turns.conversation_id = conversations.id
        why: "Parent session. EXISTS for rates."

  missed_contacts:
    grain: "one missed contact"
    description: "Missed offer/no-agent row. Reason label, queue name, agent name, customer name. Hide phone/email."
    object: missed_contact
    source: |
      SELECT
        mc.acknowledged_at,
        mc.agent_id,
        mc.assigned_user_id,
        mc.assignment_id,
        mc.channel,
        mc.contact_id,
        mc.conversation_id,
        mc.created_at,
        mc.customer_name,
        mc.id,
        mc.missed_at,
        mc.offered_at,
        mc.queue_id,
        mc.reason,
        mr.name AS reason_label,
        q.name AS queue_name,
        a.display_name AS agent_name
      FROM ccass.agent_missed_contacts mc
      LEFT JOIN ccass.missed_contact_reasons mr ON mr.code = mc.reason
      LEFT JOIN ccass.queues q ON q.id = mc.queue_id AND q.organization_id = mc.organization_id
      LEFT JOIN ccass.agents a ON a.id = mc.agent_id AND a.organization_id = mc.organization_id
      WHERE mc.organization_id = {org_id}
    columns:
      acknowledged_at:
        type: timestamptz
        description: "Acknowledged at on this missed_contact. UTC when it is a timestamp."
        groupable: false
        user_phrases: [acknowledged at]
      agent_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      assigned_user_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      assignment_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      channel:
        type: text
        description: "Channel on this missed_contact."
        groupable: true
        user_phrases: [channel]
      contact_id:
        type: text
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      conversation_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      created_at:
        type: timestamptz
        description: "Created at on this missed_contact. UTC when it is a timestamp."
        groupable: false
        user_phrases: [created at]
      customer_name:
        type: text
        description: "Name captured on the miss. Prefer CDP name when joined. Not a volume GROUP BY."
        groupable: false
        user_phrases: [customer]
      id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      missed_at:
        type: timestamptz
        description: "When the miss happened. missed_contacts clock."
        groupable: false
        user_phrases: [missed at]
      offered_at:
        type: timestamptz
        description: "Offered at on this missed_contact. UTC when it is a timestamp."
        groupable: false
        user_phrases: [offered at]
      queue_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      reason:
        type: text
        description: "Miss code such as no_agent_available or offer_timeout. Join missed_contact_reasons for the label. Not abandoned."
        groupable: true
        user_phrases: [miss reason]
        not_the_same_as: [abandoned, end_reason]
      reason_label:
        type: text
        description: "Human miss reason label."
        groupable: true
        user_phrases: [miss reason]
        not_the_same_as: [abandoned]
      queue_name:
        type: text
        description: "Runtime queue name."
        groupable: true
        user_phrases: [queue]
      agent_name:
        type: text
        description: "Agent display name."
        groupable: true
        user_phrases: [agent]
    joins:
      - to: rpt.conversations
        on: missed_contacts.conversation_id = conversations.id
        why: "Parent session."
      - to: rpt.queues
        on: missed_contacts.queue_id = queues.id
        why: "Queue name."
      - to: rpt.agents
        on: missed_contacts.agent_id = agents.id
        why: "Agent name."
      - to: rpt.missed_reasons
        on: missed_contacts.reason = missed_reasons.code
        why: "Reason label."
      - to: rpt.customers
        on: missed_contacts.contact_id = customers.cdp_id
        why: "Customer name."

  missed_reasons:
    grain: "one miss reason"
    description: "Catalog of miss reason labels."
    object: miss_reason
    source: |
      SELECT
        r.code,
        r.description,
        r.id,
        r.name,
        r.sort_order
      FROM ccass.missed_contact_reasons r
      WHERE {org_id} IS NOT NULL
    columns:
      code:
        type: text
        description: "Code on this miss_reason."
        groupable: true
        user_phrases: [code]
      description:
        type: text
        description: "Description on this miss_reason."
        groupable: true
        user_phrases: [description]
      id:
        type: smallint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      name:
        type: text
        description: "Display name for this miss_reason. Show the name, never the id."
        groupable: true
        user_phrases: [name, miss_reason]
      sort_order:
        type: smallint
        description: "Sort order on this miss_reason."
        groupable: false
        user_phrases: [sort order]

  tasks:
    grain: "one agent task"
    description: "Callback and follow-up tasks. callback_count is task_type=callback."
    object: task
    source: |
      SELECT
        tk.assigned_by_label,
        tk.assigned_by_user_id,
        tk.assigned_user_id,
        tk.channel,
        tk.completed_at,
        tk.contact_id,
        tk.conversation_id,
        tk.created_at,
        tk.created_by_user_id,
        tk.dismissed_at,
        tk.due_at,
        tk.id,
        tk.notes,
        tk.priority,
        tk.source,
        tk.status,
        tk.summary,
        tk.task_type,
        tk.title,
        NULLIF(BTRIM(CONCAT(COALESCE(u.first_name, ''), ' ', COALESCE(u.last_name, ''))), '') AS assignee_name
      FROM ccass.agent_tasks tk
      LEFT JOIN accounts.setup_users u ON u.id = tk.assigned_user_id AND u.organization_id = tk.organization_id
      WHERE tk.organization_id = {org_id}
    columns:
      assigned_by_label:
        type: text
        description: "Assigned by label on this task."
        groupable: true
        user_phrases: [assigned by label]
      assigned_by_user_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      assigned_user_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      channel:
        type: text
        description: "Channel on this task."
        groupable: true
        user_phrases: [channel]
      completed_at:
        type: timestamptz
        description: "Completed at on this task. UTC when it is a timestamp."
        groupable: false
        user_phrases: [completed at]
      contact_id:
        type: text
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      conversation_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      created_at:
        type: timestamptz
        description: "When the task was created. callback_count clock. due_at is a filter, not this clock."
        groupable: false
        user_phrases: [task created]
        not_the_same_as: [due_at]
      created_by_user_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      dismissed_at:
        type: timestamptz
        description: "Dismissed at on this task. UTC when it is a timestamp."
        groupable: false
        user_phrases: [dismissed at]
      due_at:
        type: timestamptz
        description: "When the task is due. Filter, not the callback_count window."
        groupable: false
        user_phrases: [due]
        not_the_same_as: [created_at]
      id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      notes:
        type: text
        description: "Notes on this task."
        groupable: true
        user_phrases: [notes]
      priority:
        type: text
        description: "Priority on this task."
        groupable: true
        user_phrases: [priority]
      source:
        type: text
        description: "Source on this task."
        groupable: true
        user_phrases: [source]
      status:
        type: text
        description: "open, completed, dismissed. Not conversation status."
        groupable: true
        user_phrases: [task status]
        not_the_same_as: [conversation status]
      summary:
        type: text
        description: "Summary on this task."
        groupable: true
        user_phrases: [summary]
      task_type:
        type: text
        description: "callback and other task types. callback_count filters this to callback."
        groupable: true
        user_phrases: [task type, callback]
      title:
        type: text
        description: "Display title for this task. Show the name, never the id."
        groupable: true
        user_phrases: [title, task]
      assignee_name:
        type: text
        description: "Assigned user first plus last."
        groupable: true
        user_phrases: [assignee, agent]
    joins:
      - to: rpt.conversations
        on: tasks.conversation_id = conversations.id
        why: "Parent session."
      - to: rpt.users
        on: tasks.assigned_user_id = users.id
        why: "Assignee name."
      - to: rpt.customers
        on: tasks.contact_id = customers.cdp_id
        why: "Customer."

  callback_attempts:
    grain: "one callback attempt"
    description: "Proactive callback attempts."
    object: callback_attempt
    source: |
      SELECT
        c.acknowledged_at,
        c.contact_id,
        c.conversation_id,
        c.created_at,
        c.error_message,
        c.id,
        c.missed_contact_id,
        c.queue_id,
        c.status,
        c.task_id
      FROM ccass.proactive_callback_attempts c
      WHERE c.organization_id = {org_id}
    columns:
      acknowledged_at:
        type: timestamptz
        description: "Acknowledged at on this callback_attempt. UTC when it is a timestamp."
        groupable: false
        user_phrases: [acknowledged at]
      contact_id:
        type: text
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      conversation_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      created_at:
        type: timestamptz
        description: "Created at on this callback_attempt. UTC when it is a timestamp."
        groupable: false
        user_phrases: [created at]
      error_message:
        type: text
        description: "Error message on this callback_attempt."
        groupable: true
        user_phrases: [error message]
      id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      missed_contact_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      queue_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      status:
        type: text
        description: "Status of this callback_attempt. Not conversation inbox status, not presence ready, unless this object is that thing."
        groupable: true
        user_phrases: [callback_attempt status, status]
        not_the_same_as: [conversation status, presence_state, agents.status]
      task_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
    joins:
      - to: rpt.tasks
        on: callback_attempts.task_id = tasks.id
        why: "Parent task."
      - to: rpt.conversations
        on: callback_attempts.conversation_id = conversations.id
        why: "Parent session."
      - to: rpt.queues
        on: callback_attempts.queue_id = queues.id
        why: "Queue name."
      - to: rpt.missed_contacts
        on: callback_attempts.missed_contact_id = missed_contacts.id
        why: "Originating miss."

  not_ready_escalations:
    grain: "one not-ready escalation"
    description: "Escalated not-ready with agent name."
    object: not_ready_escalation
    source: |
      SELECT
        e.acknowledged_at,
        e.agent_id,
        e.agent_name,
        e.escalated_at,
        e.id,
        e.setup_user_id
      FROM ccass.agent_not_ready_escalations e
      WHERE e.organization_id = {org_id}
    columns:
      acknowledged_at:
        type: timestamptz
        description: "Acknowledged at on this not_ready_escalation. UTC when it is a timestamp."
        groupable: false
        user_phrases: [acknowledged at]
      agent_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      agent_name:
        type: text
        description: "Agent name on this not_ready_escalation."
        groupable: true
        user_phrases: [agent name]
      escalated_at:
        type: timestamptz
        description: "Escalated at on this not_ready_escalation. UTC when it is a timestamp."
        groupable: false
        user_phrases: [escalated at]
      id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      setup_user_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
    joins:
      - to: rpt.agents
        on: not_ready_escalations.agent_id = agents.id
        why: "Agent name."
      - to: rpt.users
        on: not_ready_escalations.setup_user_id = users.id
        why: "Setup user."

  agent_capacity:
    grain: "one live concurrency row"
    description: "Live channel concurrency snapshot."
    object: agent_capacity
    source: |
      SELECT
        c.active_count,
        c.agent_id,
        c.channel,
        c.id,
        c.max_concurrency,
        c.reserved_count
      FROM ccass.agent_capacity c
      WHERE c.organization_id = {org_id}
    columns:
      active_count:
        type: integer
        description: "Active count on this agent_capacity."
        groupable: false
        user_phrases: [active count]
      agent_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      channel:
        type: text
        description: "Channel on this agent_capacity."
        groupable: true
        user_phrases: [channel]
      id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      max_concurrency:
        type: integer
        description: "Max concurrency on this agent_capacity."
        groupable: false
        user_phrases: [max concurrency]
      reserved_count:
        type: integer
        description: "Reserved count on this agent_capacity."
        groupable: false
        user_phrases: [reserved count]
    joins:
      - to: rpt.agents
        on: agent_capacity.agent_id = agents.id
        why: "Agent name."

  agents:
    grain: "one published agent"
    description: "Display name. Roster status is not ready."
    object: agent
    source: |
      SELECT
        a.id,
        a.display_name,
        a.status,
        a.setup_user_id,
        a.setup_user_id AS user_id,
        a.created_at
      FROM ccass.agents a
      WHERE a.organization_id = {org_id}
    columns:
