        groupable: true
        user_phrases: [agent label]
      agent_score:
        type: smallint
        description: "Agent score on this sentiment_turn."
        groupable: false
        user_phrases: [agent score]
      conversation_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      created_at:
        type: timestamptz
        description: "Created at on this sentiment_turn. UTC when it is a timestamp."
        groupable: false
        user_phrases: [created at]
      customer_label:
        type: text
        description: "Customer sentiment label. Negative KPI uses negative and very_negative. Fanout: EXISTS, do not join into conversation COUNT."
        groupable: true
        user_phrases: [sentiment, negative]
        not_the_same_as: [agent_label]
      customer_score:
        type: smallint
        description: "Customer score on this sentiment_turn."
        groupable: false
        user_phrases: [customer score]
      id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      message_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
