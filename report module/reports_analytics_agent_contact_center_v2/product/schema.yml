  routing_policies:
    grain: "one queue routing policy"
    description: "Overflow queue name, offer timeout, ACW seconds, email SLA seconds. Email seconds are config, not the 60s KPI."
    object: routing_policy
    source: |
      SELECT
        rp.after_contact_work_seconds,
        rp.created_at,
        rp.email_after_contact_work_seconds,
        rp.email_first_response_sla_seconds,
        rp.email_offer_timeout_seconds,
        rp.email_resolution_sla_seconds,
        rp.id,
        rp.max_attempts,
        rp.missed_callback_grace_minutes,
        rp.offer_timeout_seconds,
        rp.overflow_queue_id,
        rp.priority,
        rp.queue_id,
        rp.strategy,
        q.name AS queue_name,
        oq.name AS overflow_queue_name
      FROM ccass.routing_policies rp
      LEFT JOIN ccass.queues q ON q.id = rp.queue_id AND q.organization_id = rp.organization_id
      LEFT JOIN ccass.queues oq ON oq.id = rp.overflow_queue_id AND oq.organization_id = rp.organization_id
      WHERE rp.organization_id = {org_id}
    columns:
      after_contact_work_seconds:
        type: integer
        description: "ACW seconds on the policy. Config. Occupancy uses presence after_contact_work, not this."
        groupable: false
        user_phrases: [acw seconds, wrap up seconds]
        not_the_same_as: [occupancy]
      created_at:
        type: timestamptz
        description: "Created at on this routing_policy. UTC when it is a timestamp."
        groupable: false
        user_phrases: [created at]
      email_after_contact_work_seconds:
        type: integer
        description: "Email after contact work seconds on this routing_policy. Durations stay in source units unless a certified KPI converts them."
        groupable: false
        user_phrases: [email after contact work seconds]
      email_first_response_sla_seconds:
        type: integer
        description: "Email SLA seconds on the routing policy. Config only. Not the certified 60s first-reply SLA."
        groupable: false
        user_phrases: [email sla seconds]
        not_the_same_as: [first_reply_sla]
      email_offer_timeout_seconds:
        type: integer
        description: "Email offer timeout seconds on this routing_policy. Durations stay in source units unless a certified KPI converts them."
        groupable: false
        user_phrases: [email offer timeout seconds]
      email_resolution_sla_seconds:
        type: integer
        description: "Email resolution sla seconds on this routing_policy. Durations stay in source units unless a certified KPI converts them."
        groupable: false
        user_phrases: [email resolution sla seconds]
      id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      max_attempts:
        type: integer
        description: "Max attempts on this routing_policy."
        groupable: false
        user_phrases: [max attempts]
      missed_callback_grace_minutes:
        type: integer
        description: "Missed callback grace minutes on this routing_policy. Durations stay in source units unless a certified KPI converts them."
        groupable: false
        user_phrases: [missed callback grace minutes]
      offer_timeout_seconds:
        type: integer
        description: "How long an offer rings before timeout. Config. Neighbour of missed offer_timeout."
        groupable: false
        user_phrases: [offer timeout]
        not_the_same_as: [missed offer_timeout]
      overflow_queue_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      priority:
        type: integer
        description: "Priority on this routing_policy."
        groupable: false
        user_phrases: [priority]
      queue_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      strategy:
        type: text
        description: "Strategy on this routing_policy."
        groupable: true
        user_phrases: [strategy]
      overflow_queue_name:
        type: text
        description: "Overflow queue name."
        groupable: true
        user_phrases: [overflow queue]
      queue_name:
        type: text
        description: "Runtime queue this policy belongs to."
        groupable: true
        user_phrases: [queue]
    joins:
      - to: rpt.queues
        on: routing_policies.queue_id = queues.id
        why: "This queue."
      - to: rpt.queues
        on: routing_policies.overflow_queue_id = queues.id
        why: "Overflow queue. Source uses an overflow alias."

