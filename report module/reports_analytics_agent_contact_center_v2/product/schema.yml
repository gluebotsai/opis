        groupable: false
        user_phrases: []
      reason:
        type: text
        description: "Why the offer ended or was skipped."
        groupable: true
        user_phrases: [offer reason]
        not_the_same_as: [miss reason]
      rejected_at:
        type: timestamptz
        description: "Rejected at on this assignment. UTC when it is a timestamp."
