  roles:
    grain: "one role"
    description: "Role name and module permission."
    object: role
    source: |
      SELECT
        r.can_approve,
        r.can_create,
        r.can_delete,
        r.can_edit,
        r.can_export,
        r.can_view,
        r.created_at,
        r.description,
        r.id,
        r.module_permission,
        r.name,
        r.product_id
      FROM accounts.setup_roles r
      WHERE r.organization_id = {org_id}
    columns:
