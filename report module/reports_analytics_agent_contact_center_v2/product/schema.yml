version: 1
# LLM writes only rpt.<view>. Physical names stay in source. Tenant {org_id}.
# Do not copy V1 contact_center schema. Wait is conversations. Queue name is ccass.queues.

views:

  conversations:
    grain: "one customer session"
    description: "Hub object. One conversation even after many transfers. Call count is channel=call. Social is whatsapp, instagram, facebook. Wait/ASA uses queued_at to assigned_at. Queue name is the runtime published queue name. Never show ids."
    object: conversation
    source: |
      SELECT
        c.id,
        c.channel,
        c.direction,
        c.status,
        c.priority,
        c.subject,
        c.bot_active,
        c.handoff_reason,
        c.end_reason,
        c.end_actor,
        c.disposition_code,
        d.label AS disposition_label,
        c.disposition_note,
        c.resolution_code,
        c.resolution_summary,
        c.created_at,
        c.queued_at,
        c.assigned_at,
        c.first_response_at,
        c.first_agent_response_at,
        c.resolved_at,
        c.ended_at,
        c.closed_at,
        c.transferred_at,
        c.first_response_due_at,
        c.resolution_due_at,
        c.sla_status,
        c.lifecycle_state,
        c.live_agent_enabled,
        c.nlp_enabled,
        c.previous_conversation_id,
        (c.previous_conversation_id IS NOT NULL) AS is_reopened,
        (c.assigned_at IS NULL) AS is_bot_only,
        CASE WHEN c.assigned_at IS NULL THEN 'AI' ELSE 'Agent' END AS handler,
        c.queue_id,
        q.name AS queue_name,
        q.team_id,
        t.name AS team_name,
        c.assigned_agent_id,
        a.display_name AS agent_name,
        c.assigned_user_id,
        c.contact_id,
        NULLIF(BTRIM(CONCAT(COALESCE(p.first_name, ''), ' ', COALESCE(p.last_name, ''))), '') AS customer_name,
        p.language AS customer_language,
        p.company AS customer_company,
        COALESCE(p.blocked, false) AS customer_blocked,
        c.channel_config_id,
        c.mailbox_connection_id,
        c.external_thread_id,
        c.webchat_id,
        c.visitor_id
      FROM ccass.conversations c
      LEFT JOIN ccass.queues q ON q.id = c.queue_id AND q.organization_id = c.organization_id
      LEFT JOIN accounts.setup_teams t ON t.id = q.team_id AND t.organization_id = c.organization_id
      LEFT JOIN ccass.agents a ON a.id = c.assigned_agent_id AND a.organization_id = c.organization_id
      LEFT JOIN cdp.customer_profile p ON p.cdp_id = c.contact_id AND p.organization_id = c.organization_id
      LEFT JOIN ccass.dispositions d ON d.code = c.disposition_code AND d.organization_id = c.organization_id
      WHERE c.organization_id = {org_id}
    columns:
      assigned_agent_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      assigned_at:
        type: timestamptz
        description: "Assigned to a person. ASA end, 60s first-reply SLA start, AHT start. Null means bot-only / never assigned."
        groupable: false
        user_phrases: [assigned]
        not_the_same_as: [first_response_at]
      assigned_user_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      bot_active:
        type: boolean
        description: "True while the bot still owns the session. Live bot_active KPI uses this with not finished."
        groupable: true
        user_phrases: [bot, bot active]
        not_the_same_as: [bot_containment, is_bot_only]
      channel_config_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      channel:
        type: text
        description: "Communication channel: webchat, email, call, whatsapp, instagram, facebook. Call count uses call only. Social is whatsapp, instagram, facebook. Ontology word voice maps to call."
        groupable: true
        user_phrases: [channel, call, social, voice]
        not_the_same_as: [CDR call count]
      closed_at:
        type: timestamptz
        description: "Later close stamp. Not the handled clock."
        groupable: false
        user_phrases: [closed]
        not_the_same_as: [ended_at]
      contact_id:
        type: text
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      created_at:
        type: timestamptz
        description: "When the conversation started. Total, call_count, and social_count clock. UTC. Not the handled clock."
        groupable: false
        user_phrases: [created, started]
        not_the_same_as: [ended_at, resolved_at]
      direction:
        type: text
        description: "Inbound or outbound conversation. Not message direction."
        groupable: true
        user_phrases: [direction, inbound, outbound]
        not_the_same_as: [message direction]
      disposition_code:
        type: text
        description: "Wrap-up code. Prefer the catalog label for display."
        groupable: true
        user_phrases: [disposition code]
        not_the_same_as: [disposition label]
      disposition_note:
        type: text
        description: "Wrap-up note text for lists. Not a GROUP BY."
        groupable: false
        user_phrases: [disposition note]
      end_actor:
        type: text
        description: "Who ended it: agent, customer, system, bot, session."
        groupable: true
        user_phrases: [end actor]
      end_reason:
        type: text
        description: "Why the session ended."
        groupable: true
        user_phrases: [end reason]
      ended_at:
        type: timestamptz
        description: "When the session finished. Handled clock. Not closed_at."
        groupable: false
        user_phrases: [ended, finished, handled]
        not_the_same_as: [closed_at, resolved_at]
      external_thread_id:
        type: text
        description: "Provider/thread key. Join to call_cdr.session_id when channel is call. Never show."
        groupable: false
        user_phrases: []
      first_agent_response_at:
        type: timestamptz
        description: "First human agent reply. Certified SLA uses first_response_at, not this column."
        groupable: false
        user_phrases: [first agent response]
        not_the_same_as: [first_response_at]
      first_response_at:
        type: timestamptz
        description: "First reply timestamp. Certified 60s SLA is first_response_at minus assigned_at. Not first_agent_response_at."
        groupable: false
        user_phrases: [first response, first reply]
        not_the_same_as: [first_agent_response_at, first_response_due_at]
      first_response_due_at:
        type: timestamptz
        description: "Live first-response due. Not the certified 60s report SLA."
        groupable: false
        user_phrases: [first response due]
        not_the_same_as: [first_reply_sla]
      handoff_reason:
        type: text
        description: "Why the bot handed off. Filter and lists. Free text, not a clean volume dimension."
        groupable: false
        user_phrases: [handoff, handoff reason]
        not_the_same_as: [nlp handoff_recommended]
      id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      lifecycle_state:
        type: text
        description: "Finer phase than inbox status. Do not use for handled."
        groupable: true
        user_phrases: [lifecycle]
        not_the_same_as: [status]
      live_agent_enabled:
        type: boolean
        description: "Whether live agent is enabled on this session."
        groupable: true
        user_phrases: [live agent]
      mailbox_connection_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      nlp_enabled:
        type: boolean
        description: "Whether NLP/bot is enabled on this session."
        groupable: true
        user_phrases: [nlp enabled]
        not_the_same_as: [bot_active]
      previous_conversation_id:
        type: bigint
        description: "Prior conversation if this is a reopen. FCR excludes when set. Never show the id."
        groupable: false
        user_phrases: []
      priority:
        type: integer
        description: "0 normal, 1 high."
        groupable: true
        user_phrases: [priority, high priority]
      provider_thread_id:
        type: text
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      queue_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      queued_at:
        type: timestamptz
        description: "Entered the runtime queue. ASA and queue service level start. Not CDR wait_duration."
        groupable: false
        user_phrases: [queued, wait start]
        not_the_same_as: [CDR wait_duration, CDR queue_duration]
      resolution_code:
        type: text
        description: "Wrap-up code: resolved, unresolved, abandoned, transferred. The value transferred is a close code. It is not a completed transfer. A completed transfer is transferred_at."
        groupable: true
        user_phrases: [resolution]
        not_the_same_as: [transferred_at, resolved_at]
      resolution_due_at:
        type: timestamptz
        description: "Live resolution due. Used by sla_at_risk / sla_breached_live. Not the 60s report SLA."
        groupable: false
        user_phrases: [resolution due]
        not_the_same_as: [first_reply_sla]
      resolution_summary:
        type: text
        description: "Resolution summary text for lists."
        groupable: false
        user_phrases: [resolution summary]
      resolved_at:
        type: timestamptz
        description: "When resolution was saved. Resolved, FCR, and reopen_rate clock. Not ended_at."
        groupable: false
        user_phrases: [resolved]
        not_the_same_as: [ended_at, closed_at]
      sla_status:
        type: text
        description: "Product SLA flag. Certified 60s SLA does not read this."
        groupable: true
        user_phrases: [sla status]
        not_the_same_as: [first_reply_sla]
      status:
        type: text
        description: "Inbox status: bot_active, queued, assigned, active, resolved, closed. Handled is resolved/closed or ended_at set. Not lifecycle_state, sla_status, queue status, or presence."
        groupable: true
        user_phrases: [status, open, closed]
        not_the_same_as: [lifecycle_state, sla_status, queue status, presence]
      subject:
        type: text
        description: "Topic line for lists. Not a volume GROUP BY."
        groupable: false
        user_phrases: [subject, topic]
      transferred_at:
        type: timestamptz
        description: "Completed transfer clock. List or count transferred conversations with transferred_at IS NOT NULL. Not resolution_code = transferred. Not hop rows on conversation_transfers."
        groupable: false
        user_phrases: [transferred, transferred conversations]
        not_the_same_as: [resolution_code, transfer hop count]
      visitor_id:
        type: text
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      webchat_id:
        type: text
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      disposition_label:
        type: text
        description: "Human wrap-up label from the catalog."
        groupable: true
        user_phrases: [disposition, wrap up]
      is_reopened:
        type: boolean
        description: "True if previous_conversation_id is set. FCR excludes these."
        groupable: true
        user_phrases: [reopened, repeat]
        not_the_same_as: [resolution_rate]
      is_bot_only:
        type: boolean
        description: "Never assigned to a person. Bot containment numerator."
        groupable: true
        user_phrases: [bot only, contained]
        not_the_same_as: [bot_active]
      handler:
        type: text
        description: "AI if never assigned, Agent if assigned. Split of handled."
        groupable: true
        user_phrases: [handler, AI, human]
        not_the_same_as: [bot_containment]
      queue_name:
        type: text
        description: "Runtime published queue name. Default label for every KPI. Not the admin setup-queue profile name."
        groupable: true
        user_phrases: [queue]
        not_the_same_as: [setup queue name]
      team_id:
        type: bigint
        description: "Team id from the runtime queue. Joins only. Never show."
        groupable: false
        user_phrases: []
      team_name:
        type: text
        description: "Team name."
        groupable: true
        user_phrases: [team]
      agent_name:
        type: text
        description: "Assigned agent display name."
        groupable: true
        user_phrases: [agent, agent name]
      customer_name:
        type: text
        description: "Customer first plus last. Unknown customer if empty. Filter/lists not volume GROUP BY."
        groupable: false
        user_phrases: [customer, contact]
      customer_language:
        type: text
        description: "Customer language. Filter, not a Total GROUP BY."
        groupable: true
        user_phrases: [language]
      customer_company:
        type: text
        description: "Customer company. Filter, not a Total GROUP BY."
        groupable: true
        user_phrases: [company]
      customer_blocked:
        type: boolean
        description: "Blocked on CDP."
        groupable: true
        user_phrases: [blocked]
    joins:
      - to: rpt.queues
        on: conversations.queue_id = queues.id
        why: "Runtime queue name and team."
      - to: rpt.agents
        on: conversations.assigned_agent_id = agents.id
        why: "Agent display name."
      - to: rpt.users
        on: conversations.assigned_user_id = users.id
        why: "Setup user for agent scope."
      - to: rpt.customers
        on: conversations.contact_id = customers.cdp_id
        why: "Customer name and language."
      - to: rpt.messages
        on: messages.conversation_id = conversations.id
        why: "Transcript. EXISTS for counts."
      - to: rpt.assignments
        on: assignments.conversation_id = conversations.id
        why: "Offers. EXISTS for counts."
      - to: rpt.transfers
        on: transfers.conversation_id = conversations.id
        why: "Hops. Do not COUNT(*) after join."
      - to: rpt.call_cdr
        on: call_cdr.session_id = conversations.external_thread_id
        why: "Hold time for call channel. Also require channel = call."
      - to: rpt.channel_configs
        on: conversations.channel_config_id = channel_configs.id
        why: "Widget/mailbox name."
      - to: rpt.disposition_catalog
        on: conversations.disposition_code = disposition_catalog.code
        why: "Wrap-up label."
      - to: rpt.missed_contacts
        on: missed_contacts.conversation_id = conversations.id
        why: "Missed rows. EXISTS for counts."
      - to: rpt.nlp_turns
        on: nlp_turns.conversation_id = conversations.id
        why: "Bot turns. EXISTS for rates."
      - to: rpt.copilot_turns
        on: copilot_turns.conversation_id = conversations.id
        why: "Copilot turns. EXISTS for rates."
      - to: rpt.sentiment_turns
        on: sentiment_turns.conversation_id = conversations.id
        why: "Sentiment. EXISTS for rates."
      - to: rpt.webchat_sessions
        on: webchat_sessions.conversation_id = conversations.id
        why: "Page origin for webchat."

  messages:
    grain: "one message"
    description: "Customer/agent/bot message. Fanout: EXISTS for conversation counts. Failed send uses delivery_state, direction, visibility."
    object: message
    source: |
      SELECT
        m.attachment_count,
        m.body,
        m.conversation_id,
        m.created_at,
        m.delivered_at,
        m.delivery_state,
        m.direction,
        m.external_id,
        m.id,
        m.message_type,
        m.provider_received_at,
        m.recipient_type,
        m.reply_to_message_id,
        m.sender_type,
        m.sent_at,
        m.visibility
      FROM ccass.conversation_messages m
      WHERE m.organization_id = {org_id}
    columns:
      attachment_count:
        type: integer
        description: "Attachment count on this message."
        groupable: false
        user_phrases: [attachment count]
      body:
        type: text
        description: "Message text for lists. Not a certified KPI. Do not GROUP BY."
        groupable: false
        user_phrases: [message, body, transcript]
        not_the_same_as: [internal note]
      conversation_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      created_at:
        type: timestamptz
        description: "When the message was created. Failed-send and avg messages clocks."
        groupable: false
        user_phrases: [sent, message time]
      delivered_at:
        type: timestamptz
        description: "Delivered at on this message. UTC when it is a timestamp."
        groupable: false
        user_phrases: [delivered at]
      delivery_state:
        type: text
        description: "pending, delivered, read, failed. When the user says message status, use this. Failed-send numerator is failed."
        groupable: true
        user_phrases: [delivery, failed, message status]
        not_the_same_as: [conversation status]
      direction:
        type: text
        description: "Message inbound or outbound. Not conversation direction. Failed-send uses outbound."
        groupable: true
        user_phrases: [message direction]
        not_the_same_as: [conversation direction]
      external_id:
        type: text
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      message_type:
        type: text
        description: "Kind of message (text, file, and similar)."
        groupable: true
        user_phrases: [message type]
      provider_received_at:
        type: timestamptz
        description: "Provider received at on this message. UTC when it is a timestamp."
        groupable: false
        user_phrases: [provider received at]
      recipient_type:
        type: text
        description: "Recipient type on this message."
        groupable: true
        user_phrases: [recipient type]
      reply_to_message_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      sender_type:
        type: text
        description: "Who sent it: customer, agent, bot, system."
        groupable: true
        user_phrases: [sender, sender type]
        not_the_same_as: [participant_type]
      sent_at:
        type: timestamptz
        description: "Sent at on this message. UTC when it is a timestamp."
        groupable: false
        user_phrases: [sent at]
      visibility:
        type: text
        description: "internal vs customer-visible. Failed-send denominator is outbound and customer-visible."
        groupable: true
        user_phrases: [visibility, internal, customer visible]
        not_the_same_as: [conversation status]
    joins:
      - to: rpt.conversations
        on: messages.conversation_id = conversations.id
        why: "Parent session."
      - to: rpt.message_receipts
        on: message_receipts.message_id = messages.id
        why: "Delivered/read times. EXISTS."
      - to: rpt.message_delivery_attempts
        on: message_delivery_attempts.message_id = messages.id
        why: "Failed sends. EXISTS."

  message_receipts:
    grain: "one receipt"
    description: "Sent / delivered / read timestamps for a message."
    object: message_receipt
    source: |
      SELECT
        r.conversation_id,
        r.created_at,
        r.delivered_at,
        r.id,
        r.message_id,
        r.read_at,
        r.recipient_ref,
        r.recipient_type,
        r.sent_at,
        r.status
      FROM ccass.message_receipts r
      WHERE r.organization_id = {org_id}
    columns:
      conversation_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      created_at:
        type: timestamptz
        description: "Created at on this message_receipt. UTC when it is a timestamp."
        groupable: false
        user_phrases: [created at]
      delivered_at:
        type: timestamptz
        description: "Delivered at on this message_receipt. UTC when it is a timestamp."
        groupable: false
        user_phrases: [delivered at]
      id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      message_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      read_at:
        type: timestamptz
        description: "Read at on this message_receipt. UTC when it is a timestamp."
        groupable: false
        user_phrases: [read at]
      recipient_ref:
        type: text
        description: "Recipient ref on this message_receipt."
        groupable: true
        user_phrases: [recipient ref]
      recipient_type:
        type: text
        description: "Recipient type on this message_receipt."
        groupable: true
        user_phrases: [recipient type]
      sent_at:
        type: timestamptz
        description: "Sent at on this message_receipt. UTC when it is a timestamp."
        groupable: false
        user_phrases: [sent at]
      status:
        type: text
        description: "Status of this message_receipt. Not conversation inbox status, not presence ready, unless this object is that thing."
        groupable: true
        user_phrases: [message_receipt status, status]
        not_the_same_as: [conversation status, presence_state, agents.status]
    joins:
      - to: rpt.messages
        on: message_receipts.message_id = messages.id
        why: "Parent message."

  message_delivery_attempts:
    grain: "one send attempt"
    description: "Provider send attempts including failed sends and error text. No secrets."
    object: delivery_attempt
    source: |
      SELECT
        a.attempt_number,
        a.attempted_at,
        a.delivered_at,
        a.destination,
        a.error_message,
        a.id,
        a.message_id,
        a.status
      FROM ccass.message_delivery_attempts a
      WHERE a.organization_id = {org_id}
    columns:
      attempt_number:
        type: integer
        description: "Attempt number on this delivery_attempt."
        groupable: false
        user_phrases: [attempt number]
      attempted_at:
        type: timestamptz
        description: "Attempted at on this delivery_attempt. UTC when it is a timestamp."
        groupable: false
        user_phrases: [attempted at]
      delivered_at:
        type: timestamptz
        description: "Delivered at on this delivery_attempt. UTC when it is a timestamp."
        groupable: false
        user_phrases: [delivered at]
      destination:
        type: text
        description: "Destination on this delivery_attempt."
        groupable: true
        user_phrases: [destination]
      error_message:
        type: text
        description: "Error message on this delivery_attempt."
        groupable: true
        user_phrases: [error message]
      id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      message_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      status:
        type: text
        description: "Status of this delivery_attempt. Not conversation inbox status, not presence ready, unless this object is that thing."
        groupable: true
        user_phrases: [delivery_attempt status, status]
        not_the_same_as: [conversation status, presence_state, agents.status]
    joins:
      - to: rpt.messages
        on: message_delivery_attempts.message_id = messages.id
        why: "Parent message."

  assignments:
    grain: "one offer"
    description: "Queue offer to an agent. Offers ringing is state=offered. Fanout on conversations."
    object: assignment
    source: |
      SELECT
        a.accepted_at,
        a.agent_id,
        a.conversation_id,
        a.ended_at,
        a.expired_at,
        a.expires_at,
        a.id,
        a.offered_at,
        a.queue_id,
        a.reason,
        a.rejected_at,
        a.routing_attempt_id,
        a.state
      FROM ccass.conversation_assignments a
      WHERE a.organization_id = {org_id}
    columns:
      accepted_at:
        type: timestamptz
        description: "Accepted at on this assignment. UTC when it is a timestamp."
        groupable: false
        user_phrases: [accepted at]
      agent_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      conversation_id:
        type: bigint
        description: "Join key. Never show to the end user."
        groupable: false
        user_phrases: []
      ended_at:
        type: timestamptz
        description: "Ended at on this assignment. UTC when it is a timestamp."
