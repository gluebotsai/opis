  user_product_access:
    grain: "one user-product role"
    description: "Which product a user can access."
    object: user_access
    source: |
      SELECT
        a.created_at,
        a.id,
        a.product_id,
        a.role_id,
        a.user_id
      FROM accounts.setup_user_product_access a
      WHERE a.organization_id = {org_id}
    columns:
      created_at:
