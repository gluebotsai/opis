version: 1
# Contact Center access. Deny before the executor. Do not retry a deny.
roles:
  admin:
    default_scope: org
    my_rows_column: assigned_user_id
    stored_names: [admin, administrator, manager, supervisor]
  agent:
    default_scope: own
    my_rows_column: assigned_user_id
    also_match: assigned_agent_id
    stored_names: [agent]

scope_levels:
  - org
  - own
  - queue

matrix:
  org:
    admin: all
    agent: deny
  own:
    admin: all
    agent: all
  # Agent queue scope: engine ANDs UI queue_ids (intake extra). Do not invent ids in SQL.
  queue:
    admin: all
    agent: all

personal_data_columns:
  - customer_name
  - body
  - suggestion_text
  - final_text
  - notes

