missing_kpis: []

waivers:
  - item: business_hours_timezone
    reason: "v1 windows are UTC. Org local hours (often Asia/Kolkata) is a later change, not this freeze."
  - item: csat_nps_adherence_shrinkage_personas_orders_billing
    reason: "No tables in ccass/accounts/cdp identity. Out of catalog."
  - item: "Phase 4 occupancy shift dimension"
    reason: "queue_members is many-to-many per agent. Shift is an EXISTS filter on workforce KPIs so occupancy seconds do not multiply. GROUP BY shift is not_this_metric until a 1:1 shift clock exists."
  - item: "Phase 1 generic expose meanings"
    reason: "Closed-vocab columns have sample_values_sql. Remaining expose meanings are short object-scoped one-liners; user_phrases and not_the_same_as carry collisions. Not blocking certified KPIs."
  - item: "Phase 6 PII mask vs coverage hide"
    reason: "Phones, emails, identity key_value, CDR numbers, DID numbers, tokens are hide in coverage and omitted from rpt views. Remaining list fields (customer_name, message body) are named in access personal_data_columns for engine masking."
  - item: "Phase 7 domain/agent.md"
    reason: "User skipped Domain. This pack is SQL-only. sql_executor + skills are present. Domain prompt is out of this build."
  - item: "Phase 8 Domain contract"
    reason: "Domain agent.md is still skipped. execute_sql_task accepts a Domain task JSON (path, goal, time words, scope words, slice words) and returns facts. Briefing stays Domain's job."
  - item: "Phase 9 question bank LLM-judge"
    reason: "Domain synthesis is skipped. Question bank is deterministic (view/KPI, filters, row count, access, grounding on facts) plus mock-LLM executor turns."
  - item: "Phase 2 catalog columns not in source"
    reason: "conversations.provider_thread_id is a leftover catalog key; the physical join key on the view is external_thread_id. Engine CTE projects only columns the source SELECT emits. email_configs/social_configs leftover keys are the same class and are skipped at CTE build."
