version: 1
kpis:
  campaigns_ran:
    label: Campaigns ran
    family: volume
    aggregation: count
    grain: one saved campaign that actually ran
    dimension_grain: campaign
    unit: campaigns
    default_time_column: campaigns.launch_local_date
    time_kind: launch_date
    exclude_ppc_only: true
    allowed_scope_levels:
    - org
    - mine
    - own
    - created_by_me
    allowed_dimensions: &id001
    - status
    - channel
    - source_channel
    - created_by
    - day
    - week
    - month
    - campaign
    when_to_use: Count how many campaigns launched/ran in the period, not drafts.
    when_not: Do not use for total saved campaigns (including draft/scheduled) or message volume.
    not_confused_with:
    - campaigns_total
    - campaigns_sent
    - messages_delivered
    - audience_selected
    user_phrases:
    - campaigns ran
    - how many campaigns ran
    - campaigns launched
    dimension_notes: status means campaign lifecycle (live/completed/cancelled), not send outcome.
    definition:
      numerator: COUNT distinct campaigns with status in live, completed, cancelled
      denominator: none
      includes: 'ran campaigns in org+branch (operator: created by me); period on launch_local_date UTC'
      excludes: draft, scheduled; PPC-only campaigns
    admin_only: false
  campaigns_total:
    label: Total saved campaigns
    family: volume
    aggregation: count
    grain: one saved campaign row
    dimension_grain: campaign
    unit: campaigns
    default_time_column: campaigns.created_at
    time_kind: timestamptz
    exclude_ppc_only: false
    allowed_scope_levels:
    - org
    - mine
    - own
    - created_by_me
    allowed_dimensions: *id001
    when_to_use: 'How many campaigns exist in the workspace: every saved row, including draft and scheduled.'
    when_not: Not campaigns that ran. Not campaigns with a delivery.
    not_confused_with:
    - campaigns_ran
    - campaigns_sent
    user_phrases:
    - how many campaigns are there
    - total campaigns
    - campaigns exist
    - saved campaigns
    - how many campaigns
    dimension_notes: status means campaign lifecycle including draft/scheduled.
    definition:
      numerator: COUNT all saved campaigns in org+branch
      denominator: none
      includes: draft, scheduled, live, completed, cancelled; PPC-only included
      excludes: not a ran/launched filter
    admin_only: false
  campaigns_sent:
    label: Campaigns sent (headline)
    family: volume
    aggregation: count
    grain: one saved campaign with at least one delivered message
    dimension_grain: campaign
    unit: campaigns
    default_time_column: campaigns.launch_local_date
    time_kind: launch_date
    exclude_ppc_only: true
    allowed_scope_levels:
    - org
    - mine
    - own
    - created_by_me
    allowed_dimensions: *id001
    when_to_use: 'Dashboard Sent card: count of campaigns that delivered at least once, not message count.'
    when_not: Do not use when they asked how many emails/messages were delivered.
    not_confused_with:
    - messages_delivered
    - messages_sent
    - campaigns_ran
    user_phrases:
    - campaigns sent
    - how many campaigns delivered
    - sent headline
    dimension_notes: Still a campaign count even when grouped by channel.
    definition:
      numerator: COUNT distinct campaign ids with >=1 delivered recipient
      denominator: none
      includes: ran set intersect delivered outcome
      excludes: stubs, bounces, PPC-only
  campaigns_failed:
    label: Campaigns failed (headline)
    family: volume
    aggregation: count
    grain: one saved campaign with at least one failed send
    dimension_grain: campaign
    unit: campaigns
    default_time_column: campaigns.launch_local_date
    time_kind: launch_date
    exclude_ppc_only: true
    allowed_scope_levels:
    - org
    - mine
    - own
    - created_by_me
    allowed_dimensions: *id001
    when_to_use: 'Dashboard Failed card: campaigns with >=1 failed/cancelled recipient.'
    when_not: Not bounce counts and not failed message volume.
    not_confused_with:
    - messages_failed
    - messages_bounced
    - stub_sends
    user_phrases:
    - campaigns failed
    - failed campaigns
    dimension_notes: Failed outcome, not bounce.
    definition:
      numerator: COUNT distinct campaigns with >=1 failed outcome recipient
      denominator: none
      includes: status failed or cancelled
      excludes: skipped, bounce, stub
  email_open_rate:
    label: Email unique open rate
    family: engagement
    aggregation: ratio
    grain: rate over delivered email recipients
    dimension_grain: recipient
    unit: rate
    default_time_column: campaigns.launch_local_date
    time_kind: launch_date
    allowed_scope_levels:
    - org
    - mine
    - own
    - created_by_me
    allowed_dimensions:
    - channel
    - campaign
    - ab_variant
    - day
    - week
    - month
    when_to_use: Unique email opens divided by email delivered. Dashboard open rate.
    when_not: Not lifetime contact opens. Not total open_count. Not click rate.
    not_confused_with:
    - contact_lifetime_opens
    - total_opens
    - click_rate
    - ctor
    user_phrases:
    - open rate
    - unique opens percent
    - email opens
    dimension_notes: Opens are email only. Grouping by channel still email-filtered.
    definition:
      numerator: COUNT delivered email recipients with opened_at not null
      denominator: COUNT delivered email recipients
      includes: channel=email, is_delivered
      excludes: open_count repeats; non-email; stubs
  click_rate:
    label: Unique click rate
    family: engagement
    aggregation: ratio
    grain: rate over delivered click-tracked recipients
    dimension_grain: recipient
    unit: rate
    default_time_column: campaigns.launch_local_date
    time_kind: launch_date
    allowed_scope_levels:
    - org
    - mine
    - own
    - created_by_me
    allowed_dimensions:
    - channel
    - campaign
    - ab_variant
    - day
    - week
    - month
    when_to_use: Unique clicks on email, app push, web push over delivered on those channels.
    when_not: Do not mix WhatsApp/SMS. Not CTOR.
    not_confused_with:
    - ctor
    - total_clicks
    - contact_lifetime_clicks
    - email_open_rate
    user_phrases:
    - click rate
    - unique clicks percent
    - CTR messaging
    dimension_notes: 'Click-tracked channels only: email, push, web.'
    definition:
      numerator: COUNT delivered email/push/web with clicked_at not null
      denominator: COUNT delivered email/push/web
      includes: unique clicked_at
      excludes: whatsapp, sms, PPC
  delivered_by_channel:
    label: Delivered by channel
    family: volume
    aggregation: count
    grain: delivered recipient rows grouped by channel
    dimension_grain: recipient
    unit: messages
    default_time_column: campaigns.launch_local_date
    time_kind: launch_date
    allowed_scope_levels:
    - org
    - mine
    - own
    - created_by_me
    allowed_dimensions:
    - channel
    - campaign
    - day
    - week
    - month
    when_to_use: 'Dashboard channel strip: delivered volume (and typically grouped by channel).'
    when_not: Not campaign headline Sent.
    not_confused_with:
    - campaigns_sent
    - messages_sent
    user_phrases:
    - delivered by channel
    - channel cards
    - messages per channel
    dimension_notes: If they did not name a slice, still return channel breakdown.
    definition:
      numerator: COUNT delivered recipients
      denominator: none
      includes: is_delivered
      excludes: stubs, bounces
  delivery_trend:
    label: Delivery trend by day
    family: volume
    aggregation: count
    grain: UTC launch day with delivered/open/click counts
    dimension_grain: recipient
    unit: messages
    default_time_column: campaigns.launch_local_date
    time_kind: launch_date
    allowed_scope_levels:
    - org
    - mine
    - own
    - created_by_me
    allowed_dimensions:
    - day
    - week
    - month
    - channel
    when_to_use: Daily series of delivered messages plus unique email opens/clicks.
    when_not: Not a single headline number without days.
    not_confused_with:
    - delivered_by_channel
    user_phrases:
    - delivery trend
    - daily delivered
    - opens over time
    dimension_notes: Default slice is day even if they only said trend.
    definition:
      numerator: daily delivered count; optional unique email opens/clicks
      denominator: none
      includes: launch_local_date buckets UTC
      excludes: created_at buckets
  monitor_preview:
    label: Campaign monitor preview
    family: volume
    aggregation: count
    grain: one campaign with targeted/delivered/opened/clicked
    dimension_grain: campaign
    unit: campaigns
    default_time_column: campaigns.launch_local_date
    time_kind: launch_date
    allowed_scope_levels:
    - org
    - mine
    - own
    - created_by_me
    allowed_dimensions:
    - campaign
    - status
    when_to_use: Per-campaign targeted (audience_count) vs delivered/opened/clicked.
    when_not: Not org headline open rate.
    not_confused_with:
    - email_open_rate
    - audience_selected
    user_phrases:
    - monitor preview
    - campaign performance list
    - targeted vs delivered
    dimension_notes: One row per campaign.
    definition:
      numerator: audience_count plus delivered/open/click counts per campaign
      denominator: none
      includes: ran campaigns
      excludes: scheduled drafts performance cells
  messages_sent:
    label: Messages sent volume
    family: volume
    aggregation: count
    grain: one send recipient row
    dimension_grain: recipient
    unit: messages
    default_time_column: campaigns.launch_local_date
    time_kind: launch_date
    allowed_scope_levels:
    - org
    - mine
    - own
    - created_by_me
    allowed_dimensions: &id002
    - channel
    - outcome
    - campaign
    - ab_variant
    - day
    - week
    - month
    - contact
    - platform
    when_to_use: Count recipient rows with sent outcome including those that later bounce? Use shared sent outcome before
      bounce subtract. Prefer messages_delivered for rate denominator.
    when_not: Not a campaign-count headline.
    not_confused_with:
    - campaigns_sent
    - messages_delivered
    user_phrases:
    - messages sent
    - send volume
    dimension_notes: outcome/status on this grain is delivery outcome.
    definition:
      numerator: COUNT recipients with outcome mapped as sent
      denominator: none
      includes: org+branch campaign visibility
      excludes: wrong grain (campaigns)
    admin_only: false
  messages_failed:
    label: Messages failed volume
    family: volume
    aggregation: count
    grain: one send recipient row
    dimension_grain: recipient
    unit: messages
    default_time_column: campaigns.launch_local_date
    time_kind: launch_date
    allowed_scope_levels:
    - org
    - mine
    - own
    - created_by_me
    allowed_dimensions: *id002
    when_to_use: Count failed/cancelled recipient rows.
    when_not: Not a campaign-count headline.
    not_confused_with:
    - campaigns_failed
    user_phrases:
    - failed messages
    - failure volume
    dimension_notes: outcome/status on this grain is delivery outcome.
    definition:
      numerator: COUNT recipients with outcome mapped as failed
      denominator: none
      includes: org+branch campaign visibility
      excludes: wrong grain (campaigns)
    admin_only: false
  messages_bounced:
    label: Messages bounced
    family: volume
    aggregation: count
    grain: one send recipient row
    dimension_grain: recipient
    unit: messages
    default_time_column: campaigns.launch_local_date
    time_kind: launch_date
    allowed_scope_levels:
    - org
    - mine
    - own
    - created_by_me
    allowed_dimensions: *id002
    when_to_use: Bounce outcomes, not Dashboard Failed.
    when_not: Not a campaign-count headline.
    not_confused_with:
    - messages_failed
    - bounce_rate
    user_phrases:
    - bounces
    - hard bounce
    dimension_notes: outcome/status on this grain is delivery outcome.
    definition:
      numerator: COUNT recipients with outcome mapped as bounce
      denominator: none
      includes: org+branch campaign visibility
      excludes: wrong grain (campaigns)
    admin_only: false
  messages_delivered:
    label: Messages delivered
    family: volume
    aggregation: count
    grain: one send recipient row
    dimension_grain: recipient
    unit: messages
    default_time_column: campaigns.launch_local_date
    time_kind: launch_date
    allowed_scope_levels:
    - org
    - mine
    - own
    - created_by_me
    allowed_dimensions: *id002
    when_to_use: Sent minus bounce minus stub. Rate denominator.
    when_not: Not a campaign-count headline.
    not_confused_with:
    - campaigns_sent
    - messages_sent
    user_phrases:
    - delivered messages
    - delivered volume
    dimension_notes: outcome/status on this grain is delivery outcome.
    definition:
      numerator: COUNT recipients with outcome mapped as delivered
      denominator: none
      includes: org+branch campaign visibility
      excludes: wrong grain (campaigns)
    admin_only: false
  stub_sends:
    label: Stub sends
    family: volume
    aggregation: count
    grain: one send recipient row
    dimension_grain: recipient
    unit: messages
    default_time_column: campaigns.launch_local_date
    time_kind: launch_date
    allowed_scope_levels:
    - org
    - mine
    - own
    - created_by_me
    allowed_dimensions: *id002
    when_to_use: Demo deliveries that must not count as inbox success.
    when_not: Not a campaign-count headline.
    not_confused_with:
    - messages_delivered
    user_phrases:
    - stubs
    - stub sends
    dimension_notes: outcome/status on this grain is delivery outcome.
    definition:
      numerator: COUNT recipients with outcome mapped as stub
      denominator: none
      includes: org+branch campaign visibility
      excludes: wrong grain (campaigns)
    admin_only: false
  audience_selected:
    label: Audience selected
    family: volume
    aggregation: count
    grain: frozen audience people on a campaign
    dimension_grain: campaign
    unit: people
    default_time_column: campaigns.launch_local_date
    time_kind: launch_date
    allowed_scope_levels:
    - org
    - mine
    - own
    - created_by_me
    allowed_dimensions:
    - campaign
    - status
    - day
    when_to_use: How many people were planned/frozen. audience_count or campaign_audience rows.
    when_not: Not delivered. Not CDP directory size.
    not_confused_with:
    - cdp_contact_count
    - messages_delivered
    - audience_missed
    user_phrases:
    - selected
    - targeted
    - audience size
    - frozen audience
    dimension_notes: This is Selected, not Delivered.
    definition:
      numerator: SUM/COUNT frozen audience
      denominator: none
      includes: campaigns.audience_count or audience rows
      excludes: CDP full directory
  unique_opens:
    label: Unique opens
    family: engagement
    aggregation: count
    grain: delivered email recipients who opened
    dimension_grain: recipient
    unit: recipients
    default_time_column: campaigns.launch_local_date
    time_kind: launch_date
    allowed_scope_levels:
    - org
    - mine
    - own
    - created_by_me
    allowed_dimensions: *id002
    when_to_use: Count unique email opens (opened_at), not a rate.
    when_not: Use email_open_rate for percent. Not open_count.
    not_confused_with:
    - email_open_rate
    - total_opens
    - contact_lifetime_opens
    user_phrases:
    - unique opens
    - how many opened
    dimension_notes: Email only.
    definition:
      numerator: COUNT delivered email with opened_at
      denominator: none
      includes: email
      excludes: repeat opens
  unique_clicks:
    label: Unique clicks
    family: engagement
    aggregation: count
    grain: delivered click-tracked recipients who clicked
    dimension_grain: recipient
    unit: recipients
    default_time_column: campaigns.launch_local_date
    time_kind: launch_date
    allowed_scope_levels:
    - org
    - mine
    - own
    - created_by_me
    allowed_dimensions: *id002
    when_to_use: Count unique clicks, not rate.
    when_not: Use click_rate for percent.
    not_confused_with:
    - click_rate
    - total_clicks
    - ctor
    user_phrases:
    - unique clicks
    - how many clicked
    dimension_notes: email/push/web.
    definition:
      numerator: COUNT delivered click-tracked with clicked_at
      denominator: none
      includes: email push web
      excludes: sms whatsapp
  total_opens:
    label: Total opens
    family: engagement
    aggregation: sum
    grain: sum of open_count on recipients
    dimension_grain: recipient
    unit: events
    default_time_column: campaigns.launch_local_date
    time_kind: launch_date
    allowed_scope_levels:
    - org
    - mine
    - own
    - created_by_me
    allowed_dimensions: *id002
    when_to_use: Repeat pixel opens SUM(open_count).
    when_not: Not unique open rate.
    not_confused_with:
    - unique_opens
    - email_open_rate
    user_phrases:
    - total opens
    - all opens
    - repeat opens
    dimension_notes: ''
    definition:
      numerator: SUM(open_count)
      denominator: none
      includes: all recipient rows in scope
      excludes: unique opened_at logic
  total_clicks:
    label: Total clicks
    family: engagement
    aggregation: sum
    grain: sum of click_count on recipients
    dimension_grain: recipient
    unit: events
    default_time_column: campaigns.launch_local_date
    time_kind: launch_date
    allowed_scope_levels:
    - org
    - mine
    - own
    - created_by_me
    allowed_dimensions: *id002
    when_to_use: Repeat tracked clicks SUM(click_count).
    when_not: Not unique click rate.
    not_confused_with:
    - unique_clicks
    - click_rate
    user_phrases:
    - total clicks
    - all clicks
    dimension_notes: ''
    definition:
      numerator: SUM(click_count)
      denominator: none
      includes: ''
      excludes: unique clicked_at
  ctor:
    label: Click to open rate
    family: engagement
    aggregation: ratio
    grain: email unique clicks over unique opens
    dimension_grain: recipient
    unit: rate
    default_time_column: campaigns.launch_local_date
    time_kind: launch_date
    allowed_scope_levels:
    - org
    - mine
    - own
    - created_by_me
    allowed_dimensions:
    - campaign
    - ab_variant
    - day
    - week
    - month
    when_to_use: CTOR = unique email clicks / unique email opens.
    when_not: Not click_rate (that uses delivered denominator).
    not_confused_with:
    - click_rate
    - email_open_rate
    user_phrases:
    - ctor
    - click to open
    - click-to-open
    dimension_notes: Email only. Null if opens=0.
    definition:
      numerator: unique email clicks
      denominator: unique email opens
      includes: email delivered
      excludes: click_rate denominator delivered
  ab_variant_performance:
    label: Email A/B variant performance
    family: engagement
    aggregation: ratio
    grain: delivered email recipients in an A/B variant
    dimension_grain: recipient
    unit: rate
    default_time_column: campaigns.launch_local_date
    time_kind: launch_date
    allowed_scope_levels:
    - org
    - mine
    - own
    - created_by_me
    allowed_dimensions:
    - ab_variant
    - campaign
    - day
    when_to_use: Open and click rates split by ab_variant.
    when_not: If A/B is off, variants are null.
    not_confused_with:
    - email_open_rate
    user_phrases:
    - a/b
    - variant performance
    - holdout
    dimension_notes: Must group by ab_variant.
    definition:
      numerator: unique opens/clicks per variant
      denominator: delivered per variant
      includes: ab_variant values
      excludes: non-email
  audience_missed:
    label: Audience missed
    family: volume
    aggregation: count
    grain: frozen audience people without a successful send
    dimension_grain: campaign
    unit: people
    default_time_column: campaigns.launch_local_date
    time_kind: launch_date
    allowed_scope_levels:
    - org
    - mine
    - own
    - created_by_me
    allowed_dimensions:
    - campaign
    when_to_use: People in frozen audience who did not get outcome sent.
    when_not: Not failed volume on recipients only.
    not_confused_with:
    - messages_failed
    - audience_selected
    user_phrases:
    - audience missed
    - not sent
    - did not receive
    dimension_notes: ''
    definition:
      numerator: audience contact_ids minus sent recipients
      denominator: none
      includes: campaign_audience
      excludes: CDP directory
  event_opens:
    label: Event form opens
    family: events
    aggregation: sum
    grain: one opportunity event
    dimension_grain: event
    unit: opens
    default_time_column: created_at
    time_kind: timestamptz
    allowed_scope_levels:
    - org
    - mine
    - own
    - created_by_me
    allowed_dimensions:
    - event
    - status
    when_to_use: Public form open_count. Org-wide for both roles.
    when_not: Not email opens.
    not_confused_with:
    - unique_opens
    - email_open_rate
    user_phrases:
    - form opens
    - event opens
    dimension_notes: Events are org-wide, not my-campaigns.
    definition:
      numerator: SUM(open_count)
      denominator: none
      includes: opportunity_events
      excludes: email opened_at
  event_submissions:
    label: Event form submissions
    family: events
    aggregation: count
    grain: one form reply or event submission_count
    dimension_grain: form_submission
    unit: submissions
    default_time_column: created_at
    time_kind: timestamptz
    allowed_scope_levels:
    - org
    - mine
    - own
    - created_by_me
    allowed_dimensions:
    - event
    when_to_use: How many form replies.
    when_not: Not email clicks.
    not_confused_with:
    - event_opens
    - event_conversion
    user_phrases:
    - form submissions
    - event replies
    dimension_notes: Org-wide.
    definition:
      numerator: COUNT submissions or SUM submission_count
      denominator: none
      includes: form_submissions
      excludes: ''
  event_conversion:
    label: Event conversion
    family: events
    aggregation: ratio
    grain: submissions over form opens
    dimension_grain: event
    unit: rate
    default_time_column: created_at
    time_kind: timestamptz
    allowed_scope_levels:
    - org
    - mine
    - own
    - created_by_me
    allowed_dimensions:
    - event
    when_to_use: submissions / opens when opens > 0.
    when_not: Not email CTOR.
    not_confused_with:
    - ctor
    - click_rate
    user_phrases:
    - form conversion
    - event conversion
    dimension_notes: Org-wide.
    definition:
      numerator: submissions
      denominator: opens
      includes: ''
      excludes: ''
  ppc_impressions:
    label: PPC impressions
    family: ads
    aggregation: sum
    grain: PPC JSON on campaigns.launch_plan, not recipient rows
    dimension_grain: campaign
    unit: ads
    default_time_column: campaigns.launch_local_date
    time_kind: launch_date
    allowed_scope_levels:
    - org
    - mine
    - own
    - created_by_me
    allowed_dimensions:
    - campaign
    - day
    when_to_use: Read launch_plan ads JSON for ad impressions. There is no ads fact table.
    when_not: Not messaging recipient clicks.
    not_confused_with:
    - unique_clicks
    - click_rate
    user_phrases:
    - ad impressions
    - ppc impressions
    dimension_notes: JSON channel_run.
    definition:
      numerator: ad impressions from launch_plan
      denominator: none
      includes: PPC channel_run
      excludes: send_recipients
  ppc_clicks:
    label: PPC clicks
    family: ads
    aggregation: sum
    grain: PPC JSON on campaigns.launch_plan, not recipient rows
    dimension_grain: campaign
    unit: ads
    default_time_column: campaigns.launch_local_date
    time_kind: launch_date
    allowed_scope_levels:
    - org
    - mine
    - own
    - created_by_me
    allowed_dimensions:
    - campaign
    - day
    when_to_use: Read launch_plan ads JSON for ad clicks. There is no ads fact table.
    when_not: Not messaging recipient clicks.
    not_confused_with:
    - unique_clicks
    - click_rate
    user_phrases:
    - ad clicks
    - ppc clicks
    dimension_notes: JSON channel_run.
    definition:
      numerator: ad clicks from launch_plan
      denominator: none
      includes: PPC channel_run
      excludes: send_recipients
  ppc_spend:
    label: PPC spend
    family: ads
    aggregation: sum
    grain: PPC JSON on campaigns.launch_plan, not recipient rows
    dimension_grain: campaign
    unit: ads
    default_time_column: campaigns.launch_local_date
    time_kind: launch_date
    allowed_scope_levels:
    - org
    - mine
    - own
    - created_by_me
    allowed_dimensions:
    - campaign
    - day
    when_to_use: Read launch_plan ads JSON for ad spend. There is no ads fact table.
    when_not: Not messaging recipient clicks.
    not_confused_with:
    - unique_clicks
    - click_rate
    user_phrases:
