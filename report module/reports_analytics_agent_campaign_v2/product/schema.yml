      FROM accounts.setup_users WHERE organization_id = {org_id}
    columns:
      id: { type: bigint, description: "User id.", groupable: false }
      organization_id: { type: bigint, description: "Tenant.", groupable: false }
      email: { type: text, description: "Login email.", groupable: false }
      name: { type: text, description: "Display name.", groupable: false }
      status: { type: text, description: "active/…", groupable: true }
      created_at: { type: timestamp, description: "Created.", groupable: false }

  setup_roles:
    grain: "one Accounts role"
    description: "Campaign only cares if name is admin."
    source: |
      SELECT id, organization_id, name FROM accounts.setup_roles WHERE organization_id = {org_id}
    columns:
      id: { type: bigint, description: "Role id.", groupable: false }
      organization_id: { type: bigint, description: "Tenant.", groupable: false }
      name: { type: text, description: "Role name.", groupable: true }

  setup_user_product_access:
    grain: "one user-product-role grant"
    description: "Campaign access is product_id=campaign."
    source: |
      SELECT id, user_id, product_id, role_id FROM accounts.setup_user_product_access u
      JOIN accounts.setup_users s ON s.id = u.user_id AND s.organization_id = {org_id}
    columns:
      id: { type: bigint, description: "Grant id.", groupable: false }
      user_id: { type: bigint, description: "User.", groupable: false }
      product_id: { type: text, description: "Product.", groupable: false }
      role_id: { type: bigint, description: "Role.", groupable: false }

  setup_channel_configs:
    grain: "one Accounts channel config"
    description: "Mailbox/channel setup. Admin."
    source: |
      SELECT id, organization_id, channel_type, name, status, created_at, updated_at
      FROM accounts.setup_channel_configs WHERE organization_id = {org_id}
    columns:
      id: { type: bigint, description: "Config id. Internal; do not treat as a send KPI.", groupable: false }
      organization_id: { type: bigint, description: "Tenant.", groupable: false }
      channel_type: { type: text, description: "Channel type.", groupable: true }
      name: { type: text, description: "Connection display name.", groupable: false }
      status: { type: text, description: "Connection state, not recipient status.", groupable: true }
      created_at: { type: timestamp, description: "Created.", groupable: false }
      updated_at: { type: timestamp, description: "Updated.", groupable: false }

  setup_email_configs:
    grain: "one mailbox SMTP/OAuth config (secrets stripped)"
    description: "Test-send mailbox, not bulk ESP. Org is on setup_channel_configs."
    source: |
      SELECT e.id, c.organization_id, e.provider_type, e.sender_email, e.sender_name, e.domain,
             e.domain_verification_status, e.created_at, e.updated_at
      FROM accounts.setup_email_configs e
      JOIN accounts.setup_channel_configs c ON c.id = e.channel_config_id
      WHERE c.organization_id = {org_id}
    columns:
      id: { type: bigint, description: "Row id.", groupable: false }
      organization_id: { type: bigint, description: "Tenant from parent channel config.", groupable: false }
      provider_type: { type: text, description: "Mailbox provider class.", groupable: true }
      sender_email: { type: text, description: "Connected-inbox From, not bulk ESP.", groupable: false }
      sender_name: { type: text, description: "Mailbox display name.", groupable: false }
      domain: { type: text, description: "Accounts mailbox domain.", groupable: false }
      domain_verification_status: { type: text, description: "Whether Accounts considers the domain verified.", groupable: true }
      created_at: { type: timestamp, description: "Created.", groupable: false }
      updated_at: { type: timestamp, description: "Updated.", groupable: false }

  mail_oauth_connections:
    grain: "one mailbox OAuth connection (tokens stripped)"
    description: "needs_reauth and expiry only. Org is via email config to channel config."
    source: |
      SELECT o.id, c.organization_id, o.needs_reauth, o.expires_at, o.created_at, o.updated_at
      FROM accounts.mail_oauth_connections o
      JOIN accounts.setup_email_configs e ON e.oauth_connection_id = o.id
      JOIN accounts.setup_channel_configs c ON c.id = e.channel_config_id
      WHERE c.organization_id = {org_id}
    columns:
      id: { type: bigint, description: "Row id.", groupable: false }
      organization_id: { type: bigint, description: "Tenant from parent channel config.", groupable: false }
      needs_reauth: { type: boolean, description: "Must reconnect.", groupable: true }
      expires_at: { type: timestamp, description: "Token expiry.", groupable: false }
      created_at: { type: timestamp, description: "Created.", groupable: false }
      updated_at: { type: timestamp, description: "Updated.", groupable: false }

  a2a_spoke_clients:
    grain: "one A2A client metadata (tokens stripped)"
    description: "Catalog only. No certified a2a_health KPI."
    source: |
      SELECT id, organization_id, a2a_server_name, client_id, access_expires_at, refresh_expires_at, skill_version, created_at, updated_at
      FROM accounts.a2a_spoke_clients WHERE organization_id = {org_id}
    columns:
      id: { type: bigint, description: "Client id.", groupable: false }
      organization_id: { type: bigint, description: "Tenant.", groupable: false }
      a2a_server_name: { type: text, description: "Spoke name.", groupable: false }
      client_id: { type: text, description: "Public A2A client id. No secrets.", groupable: false }
      access_expires_at: { type: timestamp, description: "When the access token expires.", groupable: false }
      refresh_expires_at: { type: timestamp, description: "When the refresh token expires.", groupable: false }
      skill_version: { type: text, description: "Optional skill catalog version.", groupable: false }
      created_at: { type: timestamp, description: "Created.", groupable: false }
      updated_at: { type: timestamp, description: "Updated.", groupable: false }

  auth_sessions:
    grain: "one login session for campaign product (secrets stripped)"
    description: "Ops count of sessions. No tokens."
    source: |
      SELECT id, organization_id, user_id, product_id, created_at, expires_at
      FROM accounts.auth_sessions WHERE organization_id = {org_id} AND product_id = 'campaign'
    columns:
      id: { type: bigint, description: "Session id.", groupable: false }
      organization_id: { type: bigint, description: "Tenant.", groupable: false }
      user_id: { type: bigint, description: "User.", groupable: false }
      product_id: { type: text, description: "Product.", groupable: false }
      created_at: { type: timestamp, description: "Created.", groupable: false }
      expires_at: { type: timestamp, description: "Expiry.", groupable: false }
