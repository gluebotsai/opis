version: 1
# Virtual reporting views. LLM writes rpt.<name> only.
# grain and user_phrases exist so executors group by meaning, not physical names.

views:

  branches:
    grain: "one Campaign workspace (not accounts.branches)"
    description: "Workspaces under a tenant. Campaigns are always org+branch scoped."
    source: |
      SELECT id, organization_id, name, is_default, created_at, updated_at
      FROM campaign.branches WHERE organization_id = {org_id}
    columns:
      id: { type: bigint, description: "Workspace id stored on campaigns as branch_id.", groupable: false }
      organization_id: { type: bigint, description: "Tenant.", groupable: false }
      name: { type: text, description: "Workspace label.", groupable: true, user_phrases: ['workspace', 'branch name'] }
      is_default: { type: boolean, description: "Login default workspace.", groupable: true }
      created_at: { type: timestamp, description: "Insert time.", groupable: false }
      updated_at: { type: timestamp, description: "Last rename.", groupable: false }

  organization_products:
    grain: "one product entitlement per branch"
    description: "Whether this branch may use Campaign. Login requires product_code=campaign and status=active."
    source: |
      SELECT id, organization_id, branch_id, product_code::text AS product_code, status::text AS status,
             starts_at, ends_at, created_at, updated_at
      FROM campaign.organization_products WHERE organization_id = {org_id}
    columns:
      id: { type: bigint, description: "Entitlement row id.", groupable: false }
      organization_id: { type: bigint, description: "Tenant.", groupable: false }
      branch_id: { type: bigint, description: "Workspace.", groupable: false }
      product_code: { type: text, description: "campaign or crm.", groupable: true, user_phrases: ['product'] }
      status: { type: text, description: "active or inactive.", groupable: true, user_phrases: ['status', 'entitlement'] }
      starts_at: { type: timestamp, description: "Optional start.", groupable: false }
      ends_at: { type: timestamp, description: "Optional end.", groupable: false }
      created_at: { type: timestamp, description: "Created.", groupable: false }
      updated_at: { type: timestamp, description: "Updated.", groupable: false }

  campaigns:
    grain: "one saved marketing campaign"
    description: "Saved program: lifecycle, frozen audience size, launch calendar date (UTC filter on launch_local_date text)."
    source: |
      SELECT id, organization_id, branch_id, name, description, status::text AS status,
             starts_at, ends_at, source_channel::text AS source_channel, created_by_user_id,
             created_at, updated_at, goal, objective, session_id, audience_summary, audience_count,
             launch_plan, launch_local_date, launch_local_time, timezone
      FROM campaign.campaigns WHERE organization_id = {org_id}
    columns:
      id: { type: bigint, description: "Campaign id. Joins batches and audience.", groupable: false }
      organization_id: { type: bigint, description: "Tenant.", groupable: false }
      branch_id: { type: bigint, description: "Workspace.", groupable: false }
      name: { type: text, description: "Display name.", groupable: true, user_phrases: ['campaign', 'name'] }
      description: { type: text, description: "Operator description.", groupable: false }
      status: { type: text, description: "draft/scheduled/live/completed/cancelled.", groupable: true, user_phrases: ['status', 'stage', 'lifecycle'] }
      starts_at: { type: timestamp, description: "Optional UTC window start. Not Dashboard period.", groupable: false }
      ends_at: { type: timestamp, description: "Optional UTC window end.", groupable: false }
      source_channel: { type: text, description: "standalone_campaign or crm_marketing.", groupable: true, user_phrases: ['source'] }
      created_by_user_id: { type: bigint, description: "Marketer who saved it.", groupable: true, user_phrases: ['created by', 'owner'] }
      created_at: { type: timestamp, description: "Row insert. Not launch.", groupable: false }
      updated_at: { type: timestamp, description: "Last column change.", groupable: false }
      goal: { type: text, description: "Marketing goal text.", groupable: true }
      objective: { type: text, description: "Finer objective.", groupable: false }
      session_id: { type: bigint, description: "Draft session if saved from chat.", groupable: false }
      audience_summary: { type: text, description: "Human audience summary.", groupable: false }
      audience_count: { type: integer, description: "Frozen selected people count.", groupable: false }
      launch_plan: { type: jsonb, description: "Schedule, channels, A/B, optional PPC JSON.", groupable: false }
      launch_local_date: { type: text, description: "Launch calendar date YYYY-MM-DD. Dashboard period.", groupable: true, user_phrases: ['launch date', 'day'] }
      launch_local_time: { type: text, description: "Launch clock HH:mm.", groupable: false }
      timezone: { type: text, description: "IANA zone stored on the row; reports still filter in UTC.", groupable: false }

  campaign_channels:
    grain: "one planned channel on a saved campaign"
    description: "Planned channel list, not send facts. Delivery uses batches."
    source: |
      SELECT id, campaign_id, organization_id, channel, template_id
      FROM campaign.campaign_channels WHERE organization_id = {org_id}
    columns:
      id: { type: bigint, description: "Planned channel row.", groupable: false }
      campaign_id: { type: bigint, description: "Parent campaign.", groupable: false }
      organization_id: { type: bigint, description: "Tenant.", groupable: false }
      channel: { type: text, description: "email/whatsapp/sms/push/web/ppc.", groupable: true, user_phrases: ['channel'] }
      template_id: { type: bigint, description: "Session creative id if bound.", groupable: false }

  campaign_audience:
    grain: "one frozen person on a saved campaign"
    description: "Selected people as campaign bigint contact_id. Use for counts of who was selected. Names and emails are on rpt.audience_people."
    source: |
      SELECT campaign_id, contact_id, created_at
      FROM campaign.campaign_audience a
      JOIN campaign.campaigns c ON c.id = a.campaign_id AND c.organization_id = {org_id}
    columns:
      campaign_id: { type: bigint, description: "Parent campaign.", groupable: true }
      contact_id: { type: bigint, description: "Campaign person id.", groupable: true, user_phrases: ['contact'] }
      created_at: { type: timestamp, description: "When frozen.", groupable: false }

  audience_people:
    grain: "one selected person with CDP name and email when the id maps"
    description: "List grain for who is on a campaign. Numeric cdp_id tails equal contact_id. Non-numeric people come from launch_plan.audience_cdp_ids. Do not use this join for send volume KPIs."
    source: |
      SELECT a.campaign_id, a.contact_id, a.created_at, c.name AS campaign_name,
             p.cdp_id, p.first_name, p.last_name, ik.key_value AS email
      FROM campaign.campaign_audience a
      JOIN campaign.campaigns c ON c.id = a.campaign_id AND c.organization_id = {org_id}
      JOIN cdp.customer_profile p
        ON p.organization_id = {org_id}
       AND regexp_replace(p.cdp_id, '^.*-', '') = a.contact_id::text
      LEFT JOIN LATERAL (
        SELECT k.key_value
        FROM cdp.identity_keys k
        WHERE k.organization_id = {org_id}
          AND k.cdp_id = p.cdp_id
          AND lower(k.key_type) IN ('email', 'primary_email')
        ORDER BY k.verified DESC NULLS LAST, k.created_at DESC
        LIMIT 1
      ) ik ON TRUE
      UNION ALL
      SELECT c.id AS campaign_id, NULL::bigint AS contact_id, c.created_at, c.name AS campaign_name,
             p.cdp_id, p.first_name, p.last_name, ik.key_value AS email
      FROM campaign.campaigns c
      CROSS JOIN LATERAL jsonb_array_elements_text(COALESCE(c.launch_plan->'audience_cdp_ids', '[]'::jsonb)) AS x(cdp_id)
      JOIN cdp.customer_profile p ON p.organization_id = {org_id} AND p.cdp_id = x.cdp_id
      LEFT JOIN LATERAL (
        SELECT k.key_value
        FROM cdp.identity_keys k
        WHERE k.organization_id = {org_id}
          AND k.cdp_id = p.cdp_id
          AND lower(k.key_type) IN ('email', 'primary_email')
        ORDER BY k.verified DESC NULLS LAST, k.created_at DESC
        LIMIT 1
      ) ik ON TRUE
      WHERE c.organization_id = {org_id}
        AND regexp_replace(x.cdp_id, '^.*-', '') !~ '^[0-9]+$'
    columns:
      campaign_id: { type: bigint, description: "Parent campaign.", groupable: true }
      contact_id: { type: bigint, description: "Campaign bigint when the CDP tail is numeric.", groupable: true, user_phrases: ['contact'] }
      created_at: { type: timestamp, description: "Audience freeze or campaign created_at for plan-only rows.", groupable: false }
      campaign_name: { type: text, description: "Campaign display name.", groupable: true, user_phrases: ['campaign'] }
      cdp_id: { type: text, description: "CDP text person id.", groupable: false }
      first_name: { type: text, description: "Given name from CDP.", groupable: false, user_phrases: ['name'] }
      last_name: { type: text, description: "Family name from CDP.", groupable: false }
      email: { type: text, description: "Latest verified email identity.", groupable: false, user_phrases: ['email'] }


  agent_sessions:
    grain: "one create-campaign or module chat draft"
    description: "Drafts are always owned by created_by_user_id, including admins."
    source: |
      SELECT id, organization_id, branch_id, created_by_user_id, module, stage, created_at, updated_at
      FROM campaign.campaign_agent_sessions WHERE organization_id = {org_id}
    columns:
      id: { type: bigint, description: "Session id.", groupable: false }
      organization_id: { type: bigint, description: "Tenant.", groupable: false }
      branch_id: { type: bigint, description: "Workspace.", groupable: false }
      created_by_user_id: { type: bigint, description: "Owner of the draft.", groupable: false }
      module: { type: text, description: "SPA module id.", groupable: true }
      stage: { type: text, description: "intake/drafting/idle.", groupable: true, user_phrases: ['stage', 'status'] }
      created_at: { type: timestamp, description: "Started.", groupable: false }
      updated_at: { type: timestamp, description: "Last write.", groupable: false }

  audience_refs:
    grain: "one draft-session contact id before save"
    description: "Becomes campaign_audience at freeze."
    source: |
      SELECT session_id, contact_id
      FROM campaign.campaign_audience_refs r
      JOIN campaign.campaign_agent_sessions s ON s.id = r.session_id AND s.organization_id = {org_id}
    columns:
      session_id: { type: bigint, description: "Draft session.", groupable: false }
      contact_id: { type: bigint, description: "Campaign bigint.", groupable: false }

  session_temp_contacts:
    grain: "one sheet-uploaded person on a draft"
    description: "Not CDP until promote. Not the launched audience."
    source: |
      SELECT id, session_id, organization_id, first_name, last_name, email, phone, company_name, city, created_at
      FROM campaign.campaign_session_temp_contacts WHERE organization_id = {org_id}
    columns:
      id: { type: bigint, description: "Sheet row id.", groupable: false }
      session_id: { type: bigint, description: "Draft.", groupable: false }
      organization_id: { type: bigint, description: "Tenant.", groupable: false }
      first_name: { type: text, description: "Given name.", groupable: false }
      last_name: { type: text, description: "Family name.", groupable: false }
      email: { type: text, description: "Sheet email.", groupable: false }
      phone: { type: text, description: "Sheet phone.", groupable: false }
      company_name: { type: text, description: "Sheet company.", groupable: true }
      city: { type: text, description: "Sheet city.", groupable: true }
      created_at: { type: timestamp, description: "Ingested.", groupable: false }

  channel_templates:
    grain: "one session creative"
    description: "Structured fields JSON for a channel in a draft."
    source: |
      SELECT id, session_id, organization_id, branch_id, channel, launch_at, generation_batch_id, created_at, updated_at
      FROM campaign.campaign_channel_templates WHERE organization_id = {org_id}
    columns:
      id: { type: bigint, description: "Template id.", groupable: false }
      session_id: { type: bigint, description: "Draft.", groupable: false }
      organization_id: { type: bigint, description: "Tenant.", groupable: false }
      branch_id: { type: bigint, description: "Workspace.", groupable: false }
      channel: { type: text, description: "Channel this creative is for.", groupable: true }
      launch_at: { type: text, description: "Suggested launch string.", groupable: false }
      generation_batch_id: { type: bigint, description: "AI generate batch.", groupable: false }
      created_at: { type: timestamp, description: "Inserted.", groupable: false }
      updated_at: { type: timestamp, description: "Updated.", groupable: false }

  template_messages:
    grain: "one edit-space message on a template"
    description: "Chat/edit messages hanging off a session template."
    source: |
      SELECT id, template_id, t.organization_id AS organization_id, role, seq, kind, created_at
      FROM campaign.campaign_template_messages m
      JOIN campaign.campaign_channel_templates t ON t.id = m.template_id AND t.organization_id = {org_id}
    columns:
      id: { type: bigint, description: "Message id.", groupable: false }
      template_id: { type: bigint, description: "Parent template.", groupable: false }
      organization_id: { type: bigint, description: "Tenant.", groupable: false }
      role: { type: text, description: "Speaker: user, assistant, or system.", groupable: true, user_phrases: ['speaker'] }
      seq: { type: integer, description: "Turn order within the template.", groupable: false }
      kind: { type: text, description: "text chat vs template payload update.", groupable: true }
      created_at: { type: timestamp, description: "Created.", groupable: false }

  channel_sending_profiles:
    grain: "one channel setup row for the org/branch"
    description: "Can this workspace send on a channel yet. Admin configuration."
    source: |
      SELECT id, organization_id, branch_id, channel, status::text AS status, created_at, updated_at
      FROM campaign.channel_sending_profiles WHERE organization_id = {org_id}
    columns:
      id: { type: bigint, description: "Profile id.", groupable: false }
      organization_id: { type: bigint, description: "Tenant.", groupable: false }
      branch_id: { type: bigint, description: "Workspace.", groupable: false }
      channel: { type: text, description: "Channel.", groupable: true }
      status: { type: text, description: "not_started/in_progress/ready/blocked.", groupable: true, user_phrases: ['readiness'] }
      created_at: { type: timestamp, description: "Created.", groupable: false }
      updated_at: { type: timestamp, description: "Updated.", groupable: false }

  organization_api_keys:
    grain: "one API key metadata row (secret stripped)"
    description: "Integration health listing only. No certified KPI. Never select secret material."
    source: |
      SELECT id, organization_id, purpose, key_prefix, active, last_used_at, created_at
      FROM campaign.organization_api_keys WHERE organization_id = {org_id}
    columns:
      id: { type: bigint, description: "Key id.", groupable: false }
      organization_id: { type: bigint, description: "Tenant.", groupable: false }
      purpose: { type: text, description: "Integration purpose, usually app_push.", groupable: true }
      key_prefix: { type: text, description: "Visible prefix only. Never the hash or secret.", groupable: false }
      active: { type: boolean, description: "Whether the key is active.", groupable: true }
      last_used_at: { type: timestamp, description: "Last use.", groupable: false }
      created_at: { type: timestamp, description: "Created.", groupable: false }

  push_channel_settings:
    grain: "one org push settings row"
    description: "App push configuration readiness."
    source: |
      SELECT id, organization_id, channel, status, created_at, updated_at
      FROM campaign.push_channel_settings WHERE organization_id = {org_id}
    columns:
      id: { type: bigint, description: "Row id.", groupable: false }
      organization_id: { type: bigint, description: "Tenant.", groupable: false }
      channel: { type: text, description: "web_push or app_push.", groupable: true, user_phrases: ['push product'] }
      status: { type: text, description: "Setup status.", groupable: true }
      created_at: { type: timestamp, description: "Created.", groupable: false }
      updated_at: { type: timestamp, description: "Updated.", groupable: false }

  email_org_profiles:
    grain: "one org email legal/profile row"
    description: "Sender org profile, not recipient opens."
    source: |
      SELECT id, organization_id, legal_name, city, country, created_at, updated_at
      FROM campaign.email_org_profiles WHERE organization_id = {org_id}
    columns:
      id: { type: bigint, description: "Row id.", groupable: false }
      organization_id: { type: bigint, description: "Tenant.", groupable: false }
      legal_name: { type: text, description: "Legal sender name in email footers.", groupable: false }
      city: { type: text, description: "Legal address city, not a recipient city.", groupable: true }
      country: { type: text, description: "Legal address country.", groupable: true }
      created_at: { type: timestamp, description: "Created.", groupable: false }
      updated_at: { type: timestamp, description: "Updated.", groupable: false }

  email_senders:
    grain: "one from-address"
    description: "ESP sender identity. Admin config."
    source: |
      SELECT id, organization_id, email, status, is_active, created_at, updated_at
      FROM campaign.email_senders WHERE organization_id = {org_id}
    columns:
      id: { type: bigint, description: "Sender id.", groupable: false }
      organization_id: { type: bigint, description: "Tenant.", groupable: false }
      email: { type: text, description: "From address.", groupable: false }
      status: { type: text, description: "Sender status.", groupable: true }
      is_active: { type: boolean, description: "Usable from-address.", groupable: true }
      created_at: { type: timestamp, description: "Created.", groupable: false }
      updated_at: { type: timestamp, description: "Updated.", groupable: false }

  email_domains:
    grain: "one sending domain"
    description: "SPF/DKIM/DMARC flags for admin health."
    source: |
      SELECT id, organization_id, domain, status, spf_ok, dkim_ok, dmarc_ok, created_at, updated_at
      FROM campaign.email_domains WHERE organization_id = {org_id}
    columns:
      id: { type: bigint, description: "Domain row.", groupable: false }
      organization_id: { type: bigint, description: "Tenant.", groupable: false }
      domain: { type: text, description: "Sending domain.", groupable: true }
      status: { type: text, description: "Domain status.", groupable: true }
      spf_ok: { type: boolean, description: "SPF ready.", groupable: true }
      dkim_ok: { type: boolean, description: "DKIM ready.", groupable: true }
      dmarc_ok: { type: boolean, description: "DMARC ready.", groupable: true }
      created_at: { type: timestamp, description: "Created.", groupable: false }
      updated_at: { type: timestamp, description: "Updated.", groupable: false }

  email_return_paths:
    grain: "one bounce return-path"
    description: "Return-path status for domain auth."
    source: |
      SELECT id, organization_id, status, created_at, updated_at
      FROM campaign.email_return_paths WHERE organization_id = {org_id}
    columns:
      id: { type: bigint, description: "Row id.", groupable: false }
      organization_id: { type: bigint, description: "Tenant.", groupable: false }
      status: { type: text, description: "Return-path status.", groupable: true }
      created_at: { type: timestamp, description: "Created.", groupable: false }
      updated_at: { type: timestamp, description: "Updated.", groupable: false }

  email_sending_caps:
    grain: "one org email cap/health row"
    description: "Hourly/daily caps, warmup, health_status JSON."
    source: |
      SELECT id, organization_id, hourly_cap, daily_cap, warmup_stage, health_status, created_at, updated_at
      FROM campaign.email_sending_caps WHERE organization_id = {org_id}
    columns:
      id: { type: bigint, description: "Row id.", groupable: false }
      organization_id: { type: bigint, description: "Tenant.", groupable: false }
      hourly_cap: { type: integer, description: "Hourly cap.", groupable: false }
      daily_cap: { type: integer, description: "Daily cap.", groupable: false }
      warmup_stage: { type: text, description: "Warmup ladder.", groupable: true }
      health_status: { type: text, description: "Auto-pause health.", groupable: true }
      created_at: { type: timestamp, description: "Created.", groupable: false }
      updated_at: { type: timestamp, description: "Updated.", groupable: false }

  email_suppressions:
    grain: "one do-not-email address"
    description: "Unsubscribe/hard bounce/complaint list. Not Dashboard Failed."
    source: |
      SELECT id, organization_id, email, reason, created_at
      FROM campaign.email_suppressions WHERE organization_id = {org_id}
    columns:
      id: { type: bigint, description: "Row id.", groupable: false }
      organization_id: { type: bigint, description: "Tenant.", groupable: false }
      email: { type: text, description: "Suppressed address.", groupable: false }
      reason: { type: text, description: "unsubscribe/hard_bounce/complaint.", groupable: true, user_phrases: ['reason'] }
      created_at: { type: timestamp, description: "When added.", groupable: false }

  send_batches:
    grain: "one timed channel send slice"
    description: "Workers pick queued batches. Channel for all KPI group-bys lives here."
    source: |
      SELECT b.id, b.organization_id, b.campaign_id, b.seq, b.scheduled_for, b.status, b.size,
             b.created_at, b.updated_at, b.channel, c.name AS campaign_name, c.launch_local_date,
             c.created_by_user_id, c.branch_id, c.status AS campaign_status
      FROM campaign.campaign_send_batches b
      JOIN campaign.campaigns c ON c.id = b.campaign_id AND c.organization_id = {org_id}
      WHERE b.organization_id = {org_id}
    columns:
      id: { type: bigint, description: "Batch id.", groupable: false }
      organization_id: { type: bigint, description: "Tenant.", groupable: false }
      campaign_id: { type: bigint, description: "Parent campaign.", groupable: true }
      seq: { type: integer, description: "Slice number.", groupable: false }
      scheduled_for: { type: timestamp, description: "UTC send-eligible time.", groupable: false }
      status: { type: text, description: "queued/sending/sent/failed/cancelled.", groupable: true, user_phrases: ['batch status'] }
      size: { type: integer, description: "Planned recipient count.", groupable: false }
      created_at: { type: timestamp, description: "Inserted.", groupable: false }
      updated_at: { type: timestamp, description: "Last worker change.", groupable: false }
      channel: { type: text, description: "Agent-canonical channel.", groupable: true, user_phrases: ['channel'] }
      campaign_name: { type: text, description: "Campaign display name.", groupable: true, user_phrases: ['campaign'] }
      launch_local_date: { type: text, description: "Campaign launch date.", groupable: true, user_phrases: ['day'] }
      created_by_user_id: { type: bigint, description: "Campaign creator.", groupable: false }
      branch_id: { type: bigint, description: "Workspace.", groupable: false }
      campaign_status: { type: text, description: "Campaign lifecycle.", groupable: true, user_phrases: ['status', 'stage'] }

  send_recipients:
    grain: "one intended delivery (messaging fact table)"
    description: "Sent/failed/open/click/bounce/A/B facts. outcome is the shared delivery mapping. Do not join CDP."
    source: |
      SELECT r.id, r.organization_id, r.batch_id, r.campaign_id, r.contact_id, r.email, r.status,
             r.skip_fail_reason, r.provider_message_id, r.created_at, r.updated_at, r.attempt_count,
             r.destination, r.platform, r.ab_variant, r.opened_at, r.clicked_at, r.open_count, r.click_count,
             (CASE WHEN lower(coalesce(r.status,'')) IN ('failed','cancelled') THEN 'failed' WHEN lower(coalesce(r.status,'')) = 'skipped' THEN 'skipped' WHEN lower(coalesce(r.status,'')) IN ('stub','stub_sent') THEN 'stub' WHEN lower(coalesce(r.provider_message_id,'')) LIKE 'stub-%' OR lower(coalesce(r.provider_message_id,'')) LIKE 'stub://%' THEN 'stub' WHEN lower(coalesce(r.status,'')) IN ('bounced','hard_bounce','soft_bounce') THEN 'bounce' WHEN lower(coalesce(r.skip_fail_reason,'')) LIKE '%bounce%' THEN 'bounce' WHEN lower(coalesce(r.status,'')) IN ('sent','delivered') THEN 'sent' ELSE 'pending' END) AS outcome,
             b.channel, c.name AS campaign_name, c.launch_local_date, c.created_by_user_id, c.branch_id,
             c.status::text AS campaign_status,
             ((CASE WHEN lower(coalesce(r.status,'')) IN ('failed','cancelled') THEN 'failed' WHEN lower(coalesce(r.status,'')) = 'skipped' THEN 'skipped' WHEN lower(coalesce(r.status,'')) IN ('stub','stub_sent') THEN 'stub' WHEN lower(coalesce(r.provider_message_id,'')) LIKE 'stub-%' OR lower(coalesce(r.provider_message_id,'')) LIKE 'stub://%' THEN 'stub' WHEN lower(coalesce(r.status,'')) IN ('bounced','hard_bounce','soft_bounce') THEN 'bounce' WHEN lower(coalesce(r.skip_fail_reason,'')) LIKE '%bounce%' THEN 'bounce' WHEN lower(coalesce(r.status,'')) IN ('sent','delivered') THEN 'sent' ELSE 'pending' END) = 'sent' AND (CASE WHEN lower(coalesce(r.status,'')) IN ('failed','cancelled') THEN 'failed' WHEN lower(coalesce(r.status,'')) = 'skipped' THEN 'skipped' WHEN lower(coalesce(r.status,'')) IN ('stub','stub_sent') THEN 'stub' WHEN lower(coalesce(r.provider_message_id,'')) LIKE 'stub-%' OR lower(coalesce(r.provider_message_id,'')) LIKE 'stub://%' THEN 'stub' WHEN lower(coalesce(r.status,'')) IN ('bounced','hard_bounce','soft_bounce') THEN 'bounce' WHEN lower(coalesce(r.skip_fail_reason,'')) LIKE '%bounce%' THEN 'bounce' WHEN lower(coalesce(r.status,'')) IN ('sent','delivered') THEN 'sent' ELSE 'pending' END) <> 'bounce' AND (CASE WHEN lower(coalesce(r.status,'')) IN ('failed','cancelled') THEN 'failed' WHEN lower(coalesce(r.status,'')) = 'skipped' THEN 'skipped' WHEN lower(coalesce(r.status,'')) IN ('stub','stub_sent') THEN 'stub' WHEN lower(coalesce(r.provider_message_id,'')) LIKE 'stub-%' OR lower(coalesce(r.provider_message_id,'')) LIKE 'stub://%' THEN 'stub' WHEN lower(coalesce(r.status,'')) IN ('bounced','hard_bounce','soft_bounce') THEN 'bounce' WHEN lower(coalesce(r.skip_fail_reason,'')) LIKE '%bounce%' THEN 'bounce' WHEN lower(coalesce(r.status,'')) IN ('sent','delivered') THEN 'sent' ELSE 'pending' END) <> 'stub') AS is_delivered,
             ((CASE WHEN lower(coalesce(r.status,'')) IN ('failed','cancelled') THEN 'failed' WHEN lower(coalesce(r.status,'')) = 'skipped' THEN 'skipped' WHEN lower(coalesce(r.status,'')) IN ('stub','stub_sent') THEN 'stub' WHEN lower(coalesce(r.provider_message_id,'')) LIKE 'stub-%' OR lower(coalesce(r.provider_message_id,'')) LIKE 'stub://%' THEN 'stub' WHEN lower(coalesce(r.status,'')) IN ('bounced','hard_bounce','soft_bounce') THEN 'bounce' WHEN lower(coalesce(r.skip_fail_reason,'')) LIKE '%bounce%' THEN 'bounce' WHEN lower(coalesce(r.status,'')) IN ('sent','delivered') THEN 'sent' ELSE 'pending' END) = 'stub') AS is_stub
      FROM campaign.campaign_send_recipients r
      JOIN campaign.campaign_send_batches b ON b.id = r.batch_id
      JOIN campaign.campaigns c ON c.id = r.campaign_id AND c.organization_id = {org_id}
      WHERE r.organization_id = {org_id}
    columns:
      id: { type: bigint, description: "Recipient row.", groupable: false }
      organization_id: { type: bigint, description: "Tenant.", groupable: false }
      batch_id: { type: bigint, description: "Parent batch.", groupable: false }
      campaign_id: { type: bigint, description: "Campaign.", groupable: true }
      contact_id: { type: bigint, description: "Campaign bigint person.", groupable: true, user_phrases: ['contact'] }
      email: { type: text, description: "Address for email sends.", groupable: false }
      status: { type: text, description: "Raw provider/lifecycle status.", groupable: true }
      skip_fail_reason: { type: text, description: "Skip/fail/bounce text.", groupable: false }
      provider_message_id: { type: text, description: "Provider id; stub- means demo.", groupable: false }
      created_at: { type: timestamp, description: "Queued time.", groupable: false }
      updated_at: { type: timestamp, description: "Last status/open/click write.", groupable: false }
      attempt_count: { type: integer, description: "Send attempts.", groupable: false }
      destination: { type: text, description: "Push destination.", groupable: false }
      platform: { type: text, description: "ios/android/web.", groupable: true, user_phrases: ['platform'] }
      ab_variant: { type: text, description: "a/b/holdout/winner.", groupable: true, user_phrases: ['variant', 'a/b'] }
      opened_at: { type: timestamp, description: "First unique open.", groupable: false }
      clicked_at: { type: timestamp, description: "First unique click.", groupable: false }
      open_count: { type: integer, description: "Repeat opens.", groupable: false }
