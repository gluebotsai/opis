  active:
    label: Active
    grain: one customer session
    unit: conversations
    family: volume
    aggregation: count
    when_to_use: How many conversations have a person and are not ended right now.
    when_not: Not waiting. Not handled period volume.
    not_confused_with:
    - waiting
    - handled
    user_phrases:
    - active now
    - live active
    definition:
      numerator: COUNT assigned/active and not ended
      denominator: none
      includes: With a person, not ended
      excludes: Queued; finished
    default_time_column: none
    time_kind: live
    allowed_scope_levels:
    - org
    - own
    allowed_dimensions:
    - team
    - channel
    - conversation_direction
    - disposition
    - end_actor
    - end_reason
