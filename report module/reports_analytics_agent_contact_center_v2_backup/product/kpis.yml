  asa:
    label: Average speed of answer
    grain: one customer session
    unit: minutes
    family: time
    aggregation: avg
    when_to_use: Mean minutes queued_at to assigned_at, weighted by conversations. Conversation table
      only.
    when_not: Not CDR wait. Not first-response time. Not queue_service_level. Not the average of channel
      averages. Not live waiting count.
    not_confused_with:
    - avg_first_response
    - queue_service_level
    - avg_hold_time
    - waiting
    user_phrases:
    - asa
    - average speed of answer
    - average wait
    - queue wait
    - wait time
    definition:
      numerator: AVG epoch(assigned_at - queued_at) / 60
      denominator: asa_n conversations with both stamps
      includes: Answered (assigned) with queued_at present
      excludes: CDR wait_duration; never queued; average of channel averages
    default_time_column: ccass.conversations.assigned_at
    time_kind: timestamptz
    allowed_scope_levels:
    - org
    - own
    allowed_dimensions:
    - team
    - channel
    - conversation_direction
    - disposition
    - end_actor
    - end_reason
    - priority
    - resolution_code
    - conversation_status
    - agent
    - queue
    - is_reopened
    - is_bot_only
    - handler
    - day
    - week
    - month
    - hour
    filters:
      team:
        column: setup_teams.name
        param: :team
