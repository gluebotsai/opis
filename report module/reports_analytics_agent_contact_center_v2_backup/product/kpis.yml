    grain: one customer session
    unit: conversations
    family: volume
    aggregation: count
    when_to_use: How many conversations completed a transfer in the window. One conversation, not each
      hop. A list of transferred conversations uses the same rule.
    when_not: Not resolution_code transferred (a close code; can be set with transferred_at null). Not
      hop count on transfers. Not transfer_rate.
    not_confused_with:
