    filters:
      team:
        column: setup_teams.name
        param: :team
      channel_config:
        column: setup_channel_configs.name
        param: :channel_config
      customer_blocked:
        column: customer_profile.blocked
        join: conversations.contact_id = customers.cdp_id
        param: :customer_blocked
      customer_company:
        column: customer_profile.company
        join: conversations.contact_id = customers.cdp_id
        param: :customer_company
      customer_name:
        column: customer_profile.first_name
        join: conversations.contact_id = customers.cdp_id
        param: :customer_name
      customer_language:
        column: customer_profile.language
        join: conversations.contact_id = customers.cdp_id
