  reopen_rate:
    label: Reopen rate
    grain: one customer session
    unit: percent
    family: rate
    aggregation: ratio
    when_to_use: Share of resolved conversations that are reopens (previous_conversation_id set). Denominator
      is resolved (audit H3).
    when_not: Not FCR. Not resolution_rate.
    not_confused_with:
    - fcr
    - resolution_rate
    user_phrases:
    - reopen rate
    - repeat contacts
    - reopened
