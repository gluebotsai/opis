  avg_daily_handled:
    label: Average daily handled
    grain: one customer session
    unit: conversations/day
    family: volume
    aggregation: ratio
    when_to_use: Handled divided by UTC days that had at least one handled.
    when_not: Not divide by empty calendar days. Not occupancy. Not an average of daily percentages. Not
      average handled per month (that is avg_monthly_handled). Not a day-by-day list of handled.
    not_confused_with:
    - handled
    - occupancy
    - avg_monthly_handled
    user_phrases:
    - average daily handled
    - handled per day
    definition:
      numerator: handled in window
      denominator: COUNT of distinct UTC dates with at least one handled
      includes: Days with ≥1 handled
      excludes: Empty calendar days
    default_time_column: ccass.conversations.ended_at
    time_kind: timestamptz
    allowed_scope_levels:
    - org
    - own
    allowed_dimensions:
    - team
    - channel
    - conversation_direction
    - disposition
    - end_actor
    - end_reason
    - priority
    - resolution_code
    - conversation_status
    - agent
    - queue
    - is_reopened
    - is_bot_only
    - handler
    filters:
      team:
        column: setup_teams.name
        param: :team
      channel_config:
        column: setup_channel_configs.name
        param: :channel_config
      customer_blocked:
        column: customer_profile.blocked
        join: conversations.contact_id = customers.cdp_id
        param: :customer_blocked
      customer_company:
        column: customer_profile.company
        join: conversations.contact_id = customers.cdp_id
        param: :customer_company
      customer_name:
        column: customer_profile.first_name
        join: conversations.contact_id = customers.cdp_id
        param: :customer_name
      customer_language:
        column: customer_profile.language
        join: conversations.contact_id = customers.cdp_id
        param: :customer_language
      channel:
        column: conversations.channel
        param: :channel
      conversation_direction:
        column: conversations.direction
        param: :conversation_direction
      disposition:
        column: conversations.disposition_label
        param: :disposition
      end_actor:
        column: conversations.end_actor
        param: :end_actor
      end_reason:
        column: conversations.end_reason
        param: :end_reason
      handoff_reason:
        column: conversations.handoff_reason
        param: :handoff_reason
      priority:
        column: conversations.priority
        param: :priority
      resolution_code:
        column: conversations.resolution_code
        param: :resolution_code
      conversation_status:
        column: conversations.status
        param: :conversation_status
      transferred_to_agent:
        column: conversation_transfers.accepted_agent_id
        join: EXISTS (SELECT 1 FROM rpt.transfers tr WHERE tr.conversation_id = conversations.id AND tr.completed_at
          IS NOT NULL)
        param: :transferred_to_agent
      transferred_to_queue:
        column: conversation_transfers.to_queue_id
        join: EXISTS (SELECT 1 FROM rpt.transfers tr WHERE tr.conversation_id = conversations.id AND tr.completed_at
          IS NOT NULL)
        param: :transferred_to_queue
      agent:
        column: agents.display_name
        param: :agent
      queue:
        column: queues.name
        param: :queue
      is_reopened:
        column: conversations.is_reopened
        param: :is_reopened
      is_bot_only:
        column: conversations.is_bot_only
        param: :is_bot_only
      handler:
        column: conversations.handler
        param: :handler
