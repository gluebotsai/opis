  avg_first_response:
    label: Average first response
    grain: one customer session
    unit: minutes
    family: time
    aggregation: avg
    when_to_use: Mean minutes from queued_at (or created_at if never queued) to first_response_at.
    when_not: Not ASA (queued to assigned). Not an average of channel averages. Not first_reply_sla.
    not_confused_with:
    - asa
    - first_reply_sla
    - avg_handle_time
    user_phrases:
    - average first response
    - avg first reply time
    definition:
      numerator: AVG epoch(first_response_at - COALESCE(queued_at, created_at)) / 60
      denominator: none
      includes: Rows with first_response_at and queued_at or created_at
      excludes: Missing first reply; average of averages
    default_time_column: ccass.conversations.first_response_at
    time_kind: timestamptz
    allowed_scope_levels:
    - org
    - own
    allowed_dimensions:
    - team
    - channel
    - conversation_direction
    - disposition
    - end_actor
    - end_reason
    - priority
    - resolution_code
    - conversation_status
    - agent
    - queue
    - is_reopened
    - is_bot_only
    - handler
    - day
    - week
    - month
    - hour
    filters:
      team:
        column: setup_teams.name
        param: :team
      channel_config:
        column: setup_channel_configs.name
        param: :channel_config
      customer_blocked:
        column: customer_profile.blocked
        join: conversations.contact_id = customers.cdp_id
        param: :customer_blocked
      customer_company:
        column: customer_profile.company
        join: conversations.contact_id = customers.cdp_id
        param: :customer_company
