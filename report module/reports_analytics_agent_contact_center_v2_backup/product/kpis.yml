  first_reply_sla:
    label: First-reply SLA
    grain: one customer session
    unit: percent
    family: rate
    aggregation: ratio
    when_to_use: Share of first replies where assigned_at to first_response_at is at most 60 seconds.
      Product 60s starts at assigned_at.
    when_not: Not average first response minutes. Not live due_at SLA. Not queue_service_level (that starts
      at queued_at). Not sla_status. Not email policy seconds.
    not_confused_with:
    - queue_service_level
    - first_replies
    - avg_first_response
    user_phrases:
    - first reply sla
    - first-reply sla
    - 60 second sla
    - response sla
    definition:
      numerator: first replies with epoch(first_response_at - assigned_at) <= 60
      denominator: first replies with both timestamps
