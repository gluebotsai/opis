version: 1
kpis:
  total:
    label: Total conversations
    grain: one customer session
    unit: conversations
    family: volume
    aggregation: count
    when_to_use: How many conversations started in the window, including still open.
    when_not: Not handled (finished). Not call_count. Not conversation count as finished. Not a list of
      conversations.
    not_confused_with:
    - handled
    - call_count
    - resolved
    user_phrases:
    - total conversations
    - how many conversations
    - conversations started
    - conversation count
    - conversations by channel
    definition:
      numerator: COUNT of conversations with created_at in [:start, :end)
      denominator: none
      includes: Started in the window, including open
      excludes: Nothing extra; open rows stay in
    default_time_column: ccass.conversations.created_at
    time_kind: timestamptz
    allowed_scope_levels:
    - org
    - own
    allowed_dimensions:
    - team
    - channel
    - conversation_direction
    - disposition
    - end_actor
    - end_reason
    - priority
    - resolution_code
    - conversation_status
    - agent
    - queue
    - is_reopened
    - is_bot_only
    - handler
    - day
    - week
    - month
    - hour
    filters:
      team:
        column: setup_teams.name
        param: :team
      channel_config:
        column: setup_channel_configs.name
        param: :channel_config
      customer_blocked:
        column: customer_profile.blocked
        join: conversations.contact_id = customers.cdp_id
        param: :customer_blocked
      customer_company:
        column: customer_profile.company
        join: conversations.contact_id = customers.cdp_id
        param: :customer_company
      customer_name:
        column: customer_profile.first_name
        join: conversations.contact_id = customers.cdp_id
        param: :customer_name
      customer_language:
        column: customer_profile.language
        join: conversations.contact_id = customers.cdp_id
        param: :customer_language
      channel:
        column: conversations.channel
        param: :channel
      conversation_direction:
        column: conversations.direction
        param: :conversation_direction
      disposition:
        column: conversations.disposition_label
        param: :disposition
      end_actor:
        column: conversations.end_actor
        param: :end_actor
      end_reason:
        column: conversations.end_reason
        param: :end_reason
      handoff_reason:
        column: conversations.handoff_reason
        param: :handoff_reason
      priority:
        column: conversations.priority
        param: :priority
      resolution_code:
        column: conversations.resolution_code
        param: :resolution_code
      conversation_status:
        column: conversations.status
        param: :conversation_status
      transferred_to_agent:
        column: conversation_transfers.accepted_agent_id
        join: EXISTS (SELECT 1 FROM rpt.transfers tr WHERE tr.conversation_id = conversations.id AND tr.completed_at
          IS NOT NULL)
        param: :transferred_to_agent
      transferred_to_queue:
        column: conversation_transfers.to_queue_id
        join: EXISTS (SELECT 1 FROM rpt.transfers tr WHERE tr.conversation_id = conversations.id AND tr.completed_at
          IS NOT NULL)
        param: :transferred_to_queue
      agent:
        column: agents.display_name
        param: :agent
      queue:
        column: queues.name
        param: :queue
      is_reopened:
        column: conversations.is_reopened
        param: :is_reopened
      is_bot_only:
        column: conversations.is_bot_only
        param: :is_bot_only
      handler:
        column: conversations.handler
        param: :handler
    unsupported_filters:
    - name: agents.status
      reason: Roster status is not ready and not a volume split. Ready is presence_state. Agent split
        is display_name.
    - name: queues.status
      reason: Published queue active/inactive is not a volume split. Queue split is ccass.queues.name.
    - name: business_hours_id
