# Contact Center SQL spoke intake. Filled from ccass + accounts + cdp and Phase 1/2 plans.
# Do not copy campaign/ticketing/CRM catalogs.

spoke: contact_center
pack: reports_analytics_agent_contact_center_v2

product:
  what_it_does: >-
    Omnichannel contact centre: customer conversations (webchat, email, call,
    WhatsApp, Instagram, Facebook), agents, queues, routing, SLA, bot/NLP,
    presence, missed contacts, callbacks, and voice CDR hold.
  dashboard_metrics:
    - total
    - handled
    - handled_change
    - avg_daily_handled
    - avg_monthly_handled
    - resolved
    - resolution_rate
    - transferred
    - first_replies
    - first_reply_sla
    - avg_first_response
    - avg_handle_time
    - waiting
    - active
    - bot_active
    - ready_agents
    - logged_in_agents
    - offers_ringing
    - sla_at_risk
    - sla_breached_live
    - ready_hours
    - busy_hours
    - not_ready_hours
    - break_hours
  industry_metrics_not_to_miss:
    - call_count
    - social_count
    - asa
    - queue_service_level
    - abandoned
    - abandonment_rate
    - missed_contacts
    - missed_rate
    - transfer_rate
    - bot_containment
    - fcr
    - reopen_rate
    - occupancy
    - present_days
    - avg_hold_time
    - avg_messages_per_conversation
    - negative_sentiment_rate
    - offer_accept_rate
    - failed_send_rate
    - bot_grounded_rate
    - copilot_acceptance_rate
    - callback_count
  neighbour_pairs:
    - "total vs handled vs resolved"
    - "call_count (conversations channel=call) vs CDR row count vs avg_hold_time"
    - "abandoned vs missed_contacts"
    - "asa (queued_at to assigned_at on conversations) vs CDR wait_duration vs avg_first_response"
    - "first_reply_sla (60s from assigned_at) vs queue_service_level (60s from queued_at) vs routing_policies email SLA seconds"
    - "occupancy vs avg_handle_time vs presence hours vs avg_hold_time"
    - "fcr vs reopen_rate vs resolution_rate"
    - "transferred vs transfer_rate vs hop count on rpt.transfers"
    - "bot_containment vs bot_grounded_rate vs handled split handler=AI"
    - "offer_accept_rate vs missed offer_timeout vs copilot_acceptance_rate"
    - "failed_send_rate vs missed_contacts vs abandoned"
    - "ready_agents (presence_state) vs agents.status (roster, not ready)"

schemas:
  in:
    - ccass
    - accounts
    - cdp
  out:
    - name: ccass_staging_aiccaas
      reason: dbt staging copy; not source of truth
    - name: ccass_marts_aiccaas
      reason: dbt marts copy; not source of truth
    - name: inventory
      reason: not contact centre operations
    - name: shared
      reason: not contact centre operations
    - name: routing
      reason: platform ingest, not queue routing
    - name: campaign
      reason: other product
    - name: crm
      reason: other product
    - name: ticketing
      reason: other product

