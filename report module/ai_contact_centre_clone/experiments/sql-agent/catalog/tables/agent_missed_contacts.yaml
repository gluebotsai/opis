name: ccass.agent_missed_contacts
alias: mc
schema: ccass
grain: missed_event
purpose: Missed conversations (no agent offered, or offered and not picked up).
aliases: [missed, no answer, offer timeout]
time_columns: [offered_at, missed_at]
pii: [customer_name, customer_email, customer_phone]
blocked_select: [customer_email, customer_phone]
columns:
  - { name: id, type: bigint, pk: true, description: Event id }
  - { name: organization_id, type: bigint, description: Tenant id }
  - { name: agent_id, type: bigint, fk: ccass.agents.id, description: Missed agent }
  - { name: assigned_user_id, type: bigint, description: Setup user }
  - { name: conversation_id, type: bigint, fk: ccass.conversations.id, description: Conversation }
  - { name: channel, type: text, description: Channel }
  - { name: reason, type: text, values: [no_agent_available, offer_timeout], description: Miss reason (FK to missed_contact_reasons) }
  - { name: customer_name, type: text, description: Customer display name }
  - { name: missed_at, type: timestamptz, description: When missed }
sample_rows:
  - { id: 1, agent_id: 12, conversation_id: 88, channel: voice, reason: offer_timeout, missed_at: "2026-09-07T10:04:00Z", customer_name: Alex R }
