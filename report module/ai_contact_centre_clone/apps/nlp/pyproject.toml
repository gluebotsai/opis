[project]
name = "ai-contact-center-nlp"
version = "0.1.0"
description = "Python FastAPI NLP service for AI Contact Center"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]

dependencies = [
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.43.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "email-validator>=2.3.0",
    "python-dotenv>=1.2.2",
    "openai>=2.47.0",
    "httpx>=0.28.1",
    "pyjwt>=2.13.0",
    "pyyaml>=6.0.2",
    "mcp>=1.29,<2",
    "pytz>=2024.1",
    "phonenumbers>=8.13.0",
    "geotext>=0.4.0",
    "pycountry>=24.6.0",
    "duckduckgo-search>=7.0.0",
    "pandas>=2.2.0",
    "python-dateutil>=2.9.0",
    "requests>=2.32.0",
    "psycopg[binary]>=3.2.0",
    "psycopg2-binary>=2.9",
    "sqlglot>=23.0",
    "neo4j>=5.0",
    "meilisearch>=0.31",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.9",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # FastAPI intentionally uses Depends() in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"migrations/env.py" = ["E402"]
"src/app/main.py" = ["I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"



[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
