[project]
name = "worktual-sql-agent-experiment"
version = "0.1.0"
description = "DQL-only SQL developer agent experiment: YAML semantic layer, vector-less catalog RAG, certified KPIs, iterative table fetch."
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0.2",
  "openai>=2.47.0",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sql_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
