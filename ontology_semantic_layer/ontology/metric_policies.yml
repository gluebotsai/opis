  tickets_created_by_me:
    label: Tickets Created By Me
    "on": "wt:Ticket"
    dims: [status, status_display_name, is_closed_by_status, priority, channel, category, skill, assignee_name, assignee_role, resolver_name, queue_name, queue_type, account_name, organization_name, organization_business_type, team_supports_ticketing, created_by_name, customer_name, has_assignee, has_resolver, has_first_response, has_csat_rating, is_overdue]
    when: Count of tickets the current user created (created_by_id = caller). Filter/group by queue, priority, status, channel, assignee.
    not_for: Tickets assigned to me — use assigned_tickets_metric or dataScope=mine. Ticket list — use spoke_query.
    via: ask_semantic
    scope: created_by
    scope_entity: ticket__created_by

  sla_at_risk_tickets_metric:
    label: SLA At-Risk Tickets
    "on": "wt:Ticket"
    dims: [status, status_display_name, is_closed_by_status, priority, channel, category, skill, assignee_name, assignee_role, resolver_name, queue_name, queue_type, account_name, organization_name, organization_business_type, team_supports_ticketing, created_by_name, customer_name, has_assignee, has_resolver, has_first_response, has_csat_rating, is_overdue]
