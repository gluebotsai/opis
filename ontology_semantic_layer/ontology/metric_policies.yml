# Agent-facing metric policy — compact prompt lines + semantic query validation.
# Formulas live in MetricFlow YAML under semantic/dbt/.

version: 2026.09.1

metrics:
  won_deal_rate:
    label: Win Rate
    "on": "wt:Deal"
    dims: [business_type, stage, deal_status_proxy, lost_reason, owner_name, owner_team_id]
    when: "Period or owner win rate — not this deal's stage."
    not_for: Single deal fields — use deal tools.
    via: ask_semantic
    scope: owner_or_team
    scope_entity: deal__owner

  open_pipeline_value:
    label: Open Pipeline
    "on": "wt:Deal"
    dims: [business_type, stage, deal_status_proxy, lost_reason, owner_name, owner_team_id]
    when: Aggregate open pipeline value for a period or owner.
    not_for: One deal amount — use deal record.
    via: ask_semantic
    scope: owner_or_team
    scope_entity: deal__owner

  deal_volume:
    label: Deal Volume
    "on": "wt:Deal"
    dims: [business_type, stage, deal_status_proxy, lost_reason, owner_name, owner_team_id]
    when: Count deals created or active in a period.
    not_for: Listing deals — use spoke_query.
    via: ask_semantic
    scope: owner_or_team
    scope_entity: deal__owner

  mql_rate:
    label: MQL Rate
    "on": "wt:Customer"
    dims: [business_type, lifecycle_stage, lead_source, lead_status, owner_name, lead_score, lead_band]
    when: Marketing-qualified rate over contacts in a period.
    not_for: "One contact's score — use contact tools."
    via: ask_semantic
    scope: org

  customer_conversion_rate:
    label: Customer Conversion Rate
    "on": "wt:Customer"
    dims: [business_type, lifecycle_stage, lead_source, lead_status, owner_name, lead_score, lead_band]
    when: Contact-to-customer conversion over a period.
    not_for: Single contact lifecycle — use contact record.
    via: ask_semantic
    scope: org

  delivery_rate:
    label: Delivery Rate
    "on": "wt:MessageDelivery"
    dims: [channel, campaign_name]
    when: Send proxy (sent ÷ touches) for a period — no delivered status in source.
    not_for: One message status — use delivery tools.
    via: ask_semantic
    scope: org

  open_rate:
    label: Open Rate
    "on": "wt:MessageDelivery"
    dims: [channel, campaign_name]
    when: Email/message open rate for a period.
    not_for: One recipient open event — use delivery record.
    via: ask_semantic
    scope: org

  click_rate:
    label: Click Rate
    "on": "wt:MessageDelivery"
    dims: [channel, campaign_name]
    when: Click-through rate for a period.
    not_for: One click event — use delivery record.
    via: ask_semantic
    scope: org

  campaign_attributed_session_rate:
    label: Attributed Session Rate
    "on": "wt:PerformanceReport"
    dims: [website_id, session_id, visitor_id, user_id, wt_campaign_id, wt_contact_id, device, browser, browser_version, platform, country, city, region, utm_source, utm_medium, utm_campaign, utm_term, utm_content, referrer, referrer_domain, entry_page, exit_page, is_bounce_flag, is_engaged_flag, is_online_flag, is_first_session_flag, has_rage_clicks, has_dead_clicks, has_deep_scroll, has_conversion, has_purchase, has_checkout_start, has_cart_add, has_product_view, has_form_start, has_form_submit, has_form_failure, has_form_abandon, has_search, has_error, is_campaign_attributed, is_identified]
    when: Web sessions attributed to campaigns in a period.
    not_for: One session — use webtracking spoke_query.
    via: ask_semantic
    scope: org

  missed_contact_rate:
    label: Missed Contact Rate
    "on": "wt:Interaction"
    dims: [channel, direction, queue_name, agent_name, state, reason, is_completed_leg]
    when: Missed-contact rate for assigned legs in a period (CCaaS assignment grain).
    not_for: One interaction outcome — use interaction record.
    via: ask_semantic
    scope: assignee_or_team
    scope_entity: assignment__agent

  sla_breach_rate:
    label: SLA Breach Rate
    "on": "wt:Ticket"
    dims: [status, status_display_name, is_closed_by_status, priority, channel, category, skill, assignee_name, assignee_role, resolver_name, queue_name, queue_type, account_name, organization_name, organization_business_type, team_supports_ticketing, created_by_name, customer_name, has_assignee, has_resolver, has_first_response, has_csat_rating, is_overdue]
    when: "TK: breached ÷ SLA-eligible tickets. CC: conversation SLA breach ÷ tracked conversations."
    not_for: One ticket SLA timer — use ticket record.
    via: ask_semantic
    scope: assignee_or_team
    scope_entity: ticket__assignee
    products:
      ccaas:
        "on": "wt:Interaction"
        dims: [channel, direction, queue_name, priority]
        scope: org

  open_tickets_metric:
    label: Open Tickets
    "on": "wt:Ticket"
    dims: [status, status_display_name, is_closed_by_status, priority, channel, category, skill, assignee_name, assignee_role, resolver_name, queue_name, queue_type, account_name, organization_name, organization_business_type, team_supports_ticketing, created_by_name, customer_name, has_assignee, has_resolver, has_first_response, has_csat_rating, is_overdue]
    when: Count open tickets (status=open only) at a point in time or period end.
    not_for: Ticket list — use spoke_query.
    via: ask_semantic
    scope: assignee_or_team
    scope_entity: ticket__assignee

  high_priority_ticket_volume:
    label: High-Priority Ticket Volume
    "on": "wt:Ticket"
    dims: [status, status_display_name, is_closed_by_status, priority, channel, category, skill, assignee_name, assignee_role, resolver_name, queue_name, queue_type, account_name, organization_name, organization_business_type, team_supports_ticketing, created_by_name, customer_name, has_assignee, has_resolver, has_first_response, has_csat_rating, is_overdue]
    when: "Count high/urgent priority tickets; filter by status (open, resolved, etc.) via dims."
    not_for: One ticket record — use spoke_query.
    via: ask_semantic
    scope: assignee_or_team
    scope_entity: ticket__assignee

  open_conversations:
    label: Open Conversations
    "on": "wt:Interaction"
    dims: [channel, direction, queue_name, assigned_agent_name, status, lifecycle_state, sla_status, disposition_code, resolution_code, priority, had_handoff, is_ai_only_completed, is_handled, is_resolved, is_open]
    when: Queue depth / open conversation snapshot (includes unassigned queued work).
    not_for: One conversation transcript — use spoke_query.
    via: ask_semantic
    scope: org

  average_handle_time:
    label: Average Handle Time
    "on": "wt:Interaction"
    dims: [channel, direction, queue_name, agent_name, state, reason, is_completed_leg]
    when: Period AHT on completed assignment legs — not one call duration field.
    not_for: Single interaction duration — use interaction record.
    via: ask_semantic
    scope: assignee_or_team
    scope_entity: assignment__agent

  average_resolution_time_hours:
    label: Average Resolution Time
    "on": "wt:Ticket"
    dims: [status, status_display_name, is_closed_by_status, priority, channel, category, skill, assignee_name, assignee_role, resolver_name, queue_name, queue_type, account_name, organization_name, organization_business_type, team_supports_ticketing, created_by_name, customer_name, has_assignee, has_resolver, has_first_response, has_csat_rating, is_overdue]
    when: Mean hours to resolve over a period.
    not_for: One ticket resolution timestamp — use ticket record.
    via: ask_semantic
    scope: assignee_or_team
    scope_entity: ticket__assignee

  average_csat_score:
    label: Average CSAT
    "on": "wt:Ticket"
    dims: [status, status_display_name, is_closed_by_status, priority, channel, category, skill, assignee_name, assignee_role, resolver_name, queue_name, queue_type, account_name, organization_name, organization_business_type, team_supports_ticketing, created_by_name, customer_name, has_assignee, has_resolver, has_first_response, has_csat_rating, is_overdue]
    when: Mean satisfaction score over a period.
    not_for: One survey response — use ticket record.
    via: ask_semantic
    scope: assignee_or_team
    scope_entity: ticket__assignee

  reopen_rate:
    label: Reopen Rate
    "on": "wt:Ticket"
    dims: [status, status_display_name, is_closed_by_status, priority, channel, category, skill, assignee_name, assignee_role, resolver_name, queue_name, queue_type, account_name, organization_name, organization_business_type, team_supports_ticketing, created_by_name, customer_name, has_assignee, has_resolver, has_first_response, has_csat_rating, is_overdue]
    when: Share of tickets reopened in a period.
    not_for: One ticket reopen flag — use ticket record.
    via: ask_semantic
    scope: assignee_or_team
    scope_entity: ticket__assignee

  total_conversations:
    label: Total Conversations
    "on": "wt:Interaction"
    dims: [channel, direction, queue_name, assigned_agent_name, status, lifecycle_state, sla_status, disposition_code, resolution_code, priority, had_handoff, is_ai_only_completed, is_handled, is_resolved, is_open]
    when: Conversation volume for a period; use group_by channel or direction instead of channel clones.
    not_for: One conversation — use spoke_query.
    via: ask_semantic
    scope: assignee_or_team
    scope_entity: conversation__agent

  resolution_rate:
    label: Resolution Rate
    "on": "wt:Ticket"
    dims: [status, status_display_name, is_closed_by_status, priority, channel, category, skill, assignee_name, assignee_role, resolver_name, queue_name, queue_type, account_name, organization_name, organization_business_type, team_supports_ticketing, created_by_name, customer_name, has_assignee, has_resolver, has_first_response, has_csat_rating, is_overdue]
    when: Resolved share over tickets in a period.
    not_for: One ticket status — use ticket record.
    via: ask_semantic
    scope: assignee_or_team
    scope_entity: ticket__assignee
    products:
      ccaas:
        "on": "wt:Interaction"
        dims: [channel, direction, queue_name, assigned_agent_name, status, lifecycle_state, sla_status, disposition_code, resolution_code, priority, had_handoff, is_ai_only_completed, is_handled, is_resolved, is_open]
        scope: org

  handled_volume:
    label: Handled Conversations
    "on": "wt:Interaction"
    dims: [channel, direction, queue_name, assigned_agent_name, status, lifecycle_state, sla_status, disposition_code, resolution_code, priority, had_handoff, is_ai_only_completed, is_handled, is_resolved, is_open]
    when: Conversations handled by human or AI in a period.
    not_for: One conversation — use spoke_query.
    via: ask_semantic
    scope: assignee_or_team
    scope_entity: conversation__agent

  ai_containment_rate:
    label: AI Containment Rate
    "on": "wt:Interaction"
    dims: [channel, direction, queue_name, assigned_agent_name, status, lifecycle_state, sla_status, disposition_code, resolution_code, priority, had_handoff, is_ai_only_completed, is_handled, is_resolved, is_open]
    when: AI-only completion share over all conversations in a period.
    not_for: One conversation containment — use interaction record.
    via: ask_semantic
    scope: org

  average_speed_of_answer:
    label: Average Speed of Answer
    "on": "wt:Interaction"
    dims: [channel, direction, queue_name, assigned_agent_name, status, lifecycle_state, sla_status, disposition_code, resolution_code, priority, had_handoff, is_ai_only_completed, is_handled, is_resolved, is_open]
    when: Mean queue-to-assign seconds over conversations in a period.
    not_for: One conversation wait time — use interaction record.
    via: ask_semantic
    scope: org

  average_first_response_time:
    label: Average First Response Time
    "on": "wt:Interaction"
    dims: [channel, direction, queue_name, assigned_agent_name, status, lifecycle_state, sla_status, disposition_code, resolution_code, priority, had_handoff, is_ai_only_completed, is_handled, is_resolved, is_open]
    when: Mean create-to-first-response seconds in a period.
    not_for: One conversation response time — use interaction record.
    via: ask_semantic
    scope: org

  callback_tasks:
    label: Callback Tasks
    "on": "wt:Task"
    dims: [task_type, status, priority, channel]
    when: Open callback task count or backlog for a period.
    not_for: One task record — use spoke_query.
    via: ask_semantic
    scope: assignee_or_team
    scope_entity: task__assigned_user

  open_agent_tasks:
    label: Open Agent Tasks
    "on": "wt:Task"
    dims: [task_type, status, priority, channel]
    when: Open agent task count at period end or over window.
    not_for: One task — use spoke_query.
    via: ask_semantic
    scope: assignee_or_team
    scope_entity: task__assigned_user

  human_agent_occupancy_rate_presence:
    label: Human Agent Occupancy Rate (presence)
    "on": "wt:WorkforceAgent"
    dims: [new_state, is_handling_or_wrap, is_logged_in_eligible]
    when: Time-based occupancy from presence history in a period.
    not_for: Real-time agent state — use presence tools.
    via: ask_semantic
    scope: org

  total_queues_configured:
    label: Total Configured Queues
    "on": "wt:Queue"
    dims: [status, queue_name]
    when: Count of configured queues for org setup reporting.
    not_for: Live queue depth — use open_conversations.
    via: ask_semantic
    scope: org

  resolved_dispositions:
    label: Resolved Dispositions
    "on": "wt:Disposition"
    dims: [resolution_code, is_final]
    when: Count of resolved disposition entries in a period.
    not_for: One disposition — use interaction record.
    via: ask_semantic
    scope: org

  agent_assist_adoption_rate:
    label: Agent Assist Adoption Rate
    "on": "wt:Interaction"
    dims: [suggestion_disposition, skill_key]
    when: Share of suggestions accepted or modified in a period.
    not_for: One suggestion — use conversation context.
    via: ask_semantic
    scope: assignee_or_team
    scope_entity: suggestion__agent

  agent_assist_modification_rate:
    label: Agent Assist Modification Rate
    "on": "wt:Interaction"
    dims: [suggestion_disposition, skill_key]
    when: Share of accepted suggestions that were modified before send.
    not_for: One suggestion — use conversation context.
