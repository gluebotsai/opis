  ticket_volume:
    label: Ticket Volume
    "on": "wt:Ticket"
    dims: [status, status_display_name, is_closed_by_status, priority, channel, category, skill, assignee_name, assignee_role, resolver_name, queue_name, queue_type, account_name, organization_name, organization_business_type, team_supports_ticketing, created_by_name, customer_name, has_assignee, has_resolver, has_first_response, has_csat_rating, is_overdue]
