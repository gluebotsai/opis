definitions:
  Contact: A person the tenant interacts with; tickets and conversations resolve here
    via cdp_id.
  Tenant: Company or tenant org (Worktual customer business).
  User: Staff login record in accounts (admin, supervisor, live agent). One person,
    one User node.
  Agent: Product staff row (ticketing.agents / ccass.agents). Tickets assign to Agent,
    not User.
  Team: Named group of agents assigned by skill or queue.
  Ticket: A service request or issue raised by a customer that must be resolved.
  ContactAccount: B2B account details for a contact in ticketing.
  Note: Something an admin, agent, or resolver writes on a ticket.
  Queue: A queue specified by skill; tickets and agents are assigned accordingly.
  SLA: Service level agreement — time commitment by priority.
  Macro: Canned reply / resolution steps for similar tickets.
  KnowledgeArticle: Organization knowledge base article for agents and resolvers.
  InboundEmail: Inbound email thread reference linked to a ticket.
  OutboundEmail: Outbound email dispatch record for a ticket.
  AutomationRule: Workflow automation rule for ticketing events.
  AuditLog: Audit trail of actions on tickets or org settings.
  Suggestion: Proactive AI suggestion for a ticket.
  Approval: High-risk proactive action awaiting human approval.
  Notification: User notification, often about a ticket.
  ChatSession: Ticketing workspace assistant's chat session with the user.
  TicketStatus: Whether a ticket is open, pending, in progress, resolved, or closed.
  Priority: How urgent a ticket is.
  Channel: Platform customers use to contact support (email, chat, phone, etc.).
  ContactProfileBridge: Ticketing portal bridge from tickets.customer_id to CDP cdp_id;
    not a graph node.
  Conversation: A bounded exchange between customer and agent across channels.
  Task: Assigned work item for an agent in the contact center.
  Deal: Sales opportunity / deal in the pipeline.
  Account: B2B company account in CRM.
  Quote: Sales quote for a deal.
  Campaign: Planned outreach effort to a segment.
  Segment: Audience segment for campaigns or analytics.
  Visitor: Anonymous or identified web visitor before CDP resolution.
  Website: Tracked website for web analytics.
  Event: Observed customer behaviour event (page view, click, etc.).
  Message: Outbound message delivery record (email, SMS, push).
  Offering: Product or service the organization sells.
  PresenceReason: PresenceReason entity in the knowledge graph.
  AutomationPolicy: AutomationPolicy entity in the knowledge graph.
