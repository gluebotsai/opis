# Industry overlay — extracted from core, does not fork Contact.
# Tenant semantic labels win over these defaults.

pack: generic
extends_ontology: cc

labels:
  Contact: Customer
  Contact: Contact
  Ticket: Ticket
  Appointment: Appointment

