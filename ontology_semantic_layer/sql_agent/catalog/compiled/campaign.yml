version: 1
product: campaign
engine: postgres
default_schema: campaign_marts
tenant_column: organization_id
tables:
- name: mart_campaign_batch_health
  schema: campaign_marts
  grain: null
  preferred_source: mart
  sql_agent_read: true
  row_scope_column: null
  tenant_column: organization_id
  columns:
  - avg_batch_processing_seconds
  - batch_count
  - batch_failure_rate
  - campaign_id
  - channel_name
  - completed_batch_count
  - failed_batch_count
  - first_batch_created_at
  - organization_id
  - total_expected_recipients
  primary_key: null
  foreign_keys: null
  semantic_dimensions:
  - channel_name
  - first_batch_created_at
  - organization_id
  description: "Campaign x channel grain. Batch-level send infrastructure health (failure\
    \ rate, processing time) \u2014 distinct from per-recipient outcomes in mart_campaign_touch_performance.\n"
- name: mart_campaign_overview
  schema: campaign_marts
  grain: null
  preferred_source: mart
  sql_agent_read: true
  row_scope_column: null
  tenant_column: organization_id
  columns:
  - audience_reached
  - branch_id
  - campaign_id
  - campaign_name
  - campaign_status
  - created_at
  - ends_at
  - is_completed_flag
  - is_live_flag
  - is_scheduled_flag
  - organization_id
  - planned_duration_seconds
  - snapshot_audience_count
  - source_channel
  - starts_at
  primary_key: null
  foreign_keys: null
  semantic_dimensions:
  - created_at
  - organization_id
  - campaign_status
  - source_channel
  - campaign_name
  - is_live_flag
  - is_scheduled_flag
  description: 'Campaign-grain overview. Answers: how many campaigns, how many live/scheduled,
    how big is each campaign''s audience. NOT built: campaign_touch_volume-style time_dimension
    slicing beyond starts/ends (no campaign_schedule table exists).

    '
- name: mart_campaign_touch_performance
  schema: campaign_marts
  grain: null
  preferred_source: mart
  sql_agent_read: true
  row_scope_column: null
  tenant_column: organization_id
  columns:
  - avg_attempt_count
  - avg_seconds_open_to_click
  - avg_seconds_to_open
  - campaign_created_at
  - campaign_id
  - click_rate
  - clicked_touch_count
  - delivery_rate
  - failed_touch_count
  - failure_rate
  - frequency_per_contact
  - open_rate
  - opened_touch_count
  - organization_id
  - sent_touch_count
  - skipped_touch_count
  - touch_count
  - unique_contacts_touched
  primary_key: null
  foreign_keys: null
  semantic_dimensions:
  - campaign_created_at
  description: "Campaign-grain send/engagement performance built from campaign_send_recipients,\
    \ the closest real analog to the metrics doc's \"campaign_touch\" entity (which\
    \ does not exist in this schema). delivery_rate is a proxy using status='sent',\
    \ since no literal 'delivered' status exists. conversion_rate, converted_touch_count\
    \ are NOT built \u2014 no conversion/response field exists anywhere in the source\
    \ schema.\n"
- name: mart_campaign_variant_performance
  schema: campaign_marts
  grain: null
  preferred_source: mart
  sql_agent_read: true
  row_scope_column: null
  tenant_column: organization_id
  columns:
  - ab_variant
  - campaign_created_at
  - campaign_id
  - click_rate
  - clicked_touch_count
  - failed_touch_count
  - open_rate
  - opened_touch_count
  - organization_id
  - recipient_platform
  - sent_touch_count
  - touch_count
  primary_key: null
  foreign_keys: null
  semantic_dimensions:
  - campaign_created_at
  - organization_id
  - ab_variant
  - recipient_platform
  description: 'Campaign x ab_variant x recipient_platform grain. Lets you compare
    open/click performance across A/B variants and delivery platforms. Same delivery_rate
    proxy caveat as mart_campaign_touch_performance applies to sent_touch_count.

    '
- name: mart_contact_engagement_org
  schema: campaign_marts
  grain: null
  preferred_source: mart
  sql_agent_read: true
  row_scope_column: null
  tenant_column: organization_id
  columns:
  - bounce_share_of_suppressions
  - bounce_suppressed_count
  - complaint_share_of_suppressions
  - complaint_suppressed_count
  - engaged_contact_count
  - first_engagement_at
  - organization_id
  - suppressed_email_count
  - suppression_rate
  - unsub_suppressed_count
  - unsubscribe_rate
  - unsubscribed_contact_count
  primary_key: null
  foreign_keys: null
  semantic_dimensions:
  - organization_id
  - first_engagement_at
  description: "Org grain. unsubscribe_rate and suppression rates are proxies \u2014\
    \ both source tables are org-level, not per-campaign, so this cannot answer \"\
    unsubscribe rate for campaign X\", only \"unsubscribe rate across an org's known\
    \ contacts.\" suppression_rate and bounce/complaint shares are similarly weak\
    \ proxies: no per-send bounce/complaint field exists anywhere in the schema, so\
    \ these are measured against engaged_contact_count, not total sends.\n"
- name: mart_template_approval
  schema: campaign_marts
  grain: null
  preferred_source: mart
  sql_agent_read: true
  row_scope_column: null
  tenant_column: organization_id
  columns:
  - approved_template_count
  - channel_name
  - first_submitted_at
  - last_checked_at
  - organization_id
  - rejected_template_count
  - template_approval_rate
  - template_count
  primary_key: null
  foreign_keys: null
  semantic_dimensions:
  - channel_name
  - first_submitted_at
  - organization_id
  description: "Org+channel grain. template_count and template_approval_rate from\
    \ regulated_channel_templates (sms/whatsapp only \u2014 the only templates with\
    \ a real approval lifecycle). compliance_denial_rate is NOT built \u2014 no compliance_evaluation\
    \ table exists.\n"
- name: mart_template_rejection_reasons
  schema: campaign_marts
  grain: null
  preferred_source: mart
  sql_agent_read: true
  row_scope_column: null
  tenant_column: organization_id
  columns:
  - channel_name
  - first_rejected_template_submitted_at
  - organization_id
  - rejected_reason
  - rejected_template_count
  primary_key: null
  foreign_keys: null
  semantic_dimensions:
  - channel_name
  - rejected_reason
  - first_rejected_template_submitted_at
  - organization_id
  description: "Org x channel x rejected_reason grain. Breakdown of why regulated_channel_templates\
    \ were rejected. Kept as a separate mart because rejected_reason is free-form\
    \ text, not a fixed enum \u2014 pivoting it into mart_template_approval would\
    \ break grain additivity."
joins:
- from: mart_campaign_touch_performance
  to: mart_campaign_overview
  keys:
  - left: campaign_id
    right: campaign_id
  cardinality: many_to_one
  purpose: Touch metrics to campaign overview; filter org via campaign__organization_id
synonyms:
  team: queue_name
