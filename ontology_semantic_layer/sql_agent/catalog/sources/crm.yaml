  - deal_amount_sum
  - won_deal_count
  - lost_deal_count
  - closed_deal_count
  - sales_cycle_days_sum
  - won_deal_count_for_avg
  - won_deal_amount_sum
  - lost_deal_amount_sum
- name: mart_invoice_lines
  schema: crm_marts
  engine: postgres
