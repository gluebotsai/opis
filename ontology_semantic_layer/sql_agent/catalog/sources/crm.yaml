product: crm
engine: postgres
default_schema: crm_marts
tenant_column: organization_id
tables:
- name: mart_companies
  schema: crm_marts
  engine: postgres
  description: B2B client companies, franchises, and total location rollups.
  tenant_column: organization_id
  sql_agent_only: false
  columns:
  - name: company_id
  - name: organization_id
  semantic_model: company
  semantic_dimensions:
  - organization_id
  - created_at
  - business_type
  - company_industry
  - channel_role
  - owner_name
  - parent_company_name
  semantic_measures:
  - company_count
  - franchise_node_count
  - total_location_count
- name: mart_contact_activities
  schema: crm_marts
  engine: postgres
  description: Contact-level sales activities, outreach, and tasks.
  tenant_column: organization_id
  sql_agent_only: false
  columns:
  - name: contact_activity_id
  - name: organization_id
  semantic_model: contact_activity
  semantic_dimensions:
  - organization_id
  - created_at
  - business_type
  - activity_type
  - folder
  - contact_lifecycle_stage
  semantic_measures:
  - contact_activity_count
  - completed_task_count
  - open_task_count
- name: mart_contact_campaign_engagement
  schema: crm_marts
  engine: postgres
  description: CRM contact profile joined to campaign engagement signals.
  grain: contact
  purpose: Cross-spoke contact × campaign engagement for ad hoc SQL only.
  tenant_column: organization_id
  sql_agent_only: true
  columns:
  - name: contact_id
  - name: organization_id
  semantic_model: null
  semantic_dimensions: null
  semantic_measures: null
- name: mart_contacts
  schema: crm_marts
  engine: postgres
  description: Core marts model for CRM contact profiles overlaid on CDP records with lead scoring.
  tenant_column: organization_id
  sql_agent_only: false
  columns:
  - name: contact_id
  - name: organization_id
  semantic_model: contact
  semantic_dimensions:
  - organization_id
  - business_type
  - created_at
  - lifecycle_stage
  - lead_source
  - lead_status
  - owner_name
  - lead_score
  - lead_band
  semantic_measures:
  - contact_count
  - new_lead_count
  - mql_proxy_count
  - eligible_lead_count
  - customer_count
  - funnel_eligible_count
- name: mart_contracts
  schema: crm_marts
  engine: postgres
  description: Contract mart with ARR, expiry, and 90-day renewal status.
  tenant_column: organization_id
  sql_agent_only: false
  columns:
  - name: contract_id
  - name: organization_id
  semantic_model: contract
  semantic_dimensions:
  - organization_id
  - starts_at
  - business_type
  - channel_role
  semantic_measures:
  - contract_count
  - arr_sum
  - expired_contract_count
  - renewal_due_90d_count
  - renewed_contract_count
- name: mart_deal_activities
  schema: crm_marts
  engine: postgres
  description: Deal-related sales activities, tasks, and completion tracking.
  tenant_column: organization_id
  sql_agent_only: false
  columns:
  - name: deal_activity_id
  - name: organization_id
  semantic_model: deal_activity
  semantic_dimensions:
  - organization_id
  - created_at
  - business_type
  - activity_type
  - owner_name
  - deal_stage
  semantic_measures:
  - deal_activity_count
  - completed_deal_activity_count
- name: mart_deals
  schema: crm_marts
  engine: postgres
  description: Core marts model for CRM deals, pipeline amounts, stages, and sales cycle performance.
  tenant_column: organization_id
  sql_agent_only: false
  columns:
  - name: deal_id
  - name: organization_id
  semantic_model: deal
  semantic_dimensions:
  - organization_id
  - business_type
  - created_at
  - closed_at
  - stage
  - deal_status_proxy
  - lost_reason
  - owner_name
  - owner_team_id
