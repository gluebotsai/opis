- name: mart_tickets
  schema: ticketing_marts
  engine: postgres
  description: One row per support ticket; queue, assignee, SLA flags denormalized.
  grain: ticket
  purpose: Primary ticketing fact for open count, SLA, CSAT, resolution metrics.
  tenant_column: organization_id
  row_scope_column: assignee_id
  sql_agent_only: false
  columns:
  - name: ticket_id
  - name: organization_id
  - name: status
    description: Open tickets metric uses lower(status) = 'open' only.
  - name: priority
    description: High-priority open uses high, urgent, p1.
  semantic_model: ticket
  semantic_dimensions:
  - organization_id
  - created_at
  - resolved_at
  - due_at
  - status
  - status_display_name
  - is_closed_by_status
  - priority
  - channel
  - category
  - skill
  - assignee_name
  - assignee_role
  - resolver_name
  - queue_name
  - queue_type
  - account_name
  - organization_name
  - organization_business_type
  - team_supports_ticketing
  - created_by_name
  - customer_name
  - has_assignee
  - has_resolver
  - has_first_response
  - has_csat_rating
  - is_overdue
  semantic_measures:
  - ticket_count
  - resolved_ticket_count
  - open_ticket_count
  - active_ticket_count
  - closed_ticket_count
  - pending_ticket_count
  - reopened_ticket_count
  - high_priority_ticket_count
  - assigned_ticket_count
  - unassigned_ticket_count
  - tickets_with_resolver_count
  - tickets_without_resolver_count
  - due_today_ticket_count
  - current_overdue_ticket_count
  - sla_at_risk_ticket_count
  - unanswered_ticket_count
  - tickets_created_today_count
  - tickets_last_7_days_count
  - tickets_last_30_days_count
  - days_since_last_ticket_val
  - breached_ticket_count
  - resolution_hours_sum
  - resolved_ticket_count_for_avg
  - first_response_hours_sum
  - first_response_minutes_sum
  - tickets_with_first_response_count
  - first_response_met_count
  - tickets_with_first_response_sla_target_count
  - resolution_sla_met_count
  - tickets_with_resolution_sla_target_count
  - resolution_hours_variance_sum
  - tickets_with_sla_target_count
  - overdue_hours_sum
  - open_ticket_age_days_sum
  - distinct_customers_served
  - distinct_accounts_served
  - csat_score_sum
  - csat_rated_count
  - csat_promoter_count
  - csat_neutral_count
  - csat_detractor_count
