      \ IS NOT NULL AND t.created_at IS NOT NULL\n         THEN EXTRACT(EPOCH FROM (t.first_response_at - t.created_at)) /\
      \ 3600.0 END AS first_response_hours,\n    CASE WHEN t.first_response_at IS NOT NULL AND t.created_at IS NOT NULL\n\
      \         THEN EXTRACT(EPOCH FROM (t.first_response_at - t.created_at)) / 60.0 END AS first_response_minutes,\n    (t.first_response_at\
      \ IS NOT NULL) AS has_first_response,\n    (t.csat_score IS NOT NULL) AS has_csat_score,\n    (t.csat_score IS NOT NULL)\
      \ AS has_csat_rating,\n    (t.assignee_id IS NOT NULL AND t.assignee_name IS NOT NULL AND t.assignee_name <> 'Unassigned')\
      \ AS has_assignee,\n    (t.resolver_id IS NOT NULL OR (t.resolver_name IS NOT NULL AND t.resolver_name <> '')) AS has_resolver,\n\
      \    ((LOWER(t.status) NOT IN ('closed', 'resolved'))\n        AND t.due_at IS NOT NULL AND t.due_at < NOW()) AS is_overdue,\n\
      \    (LOWER(t.status) = 'reopened') AS is_reopened,\n    ((LOWER(t.status) = 'open') AND LOWER(t.priority) = 'high')\
      \ AS is_high_priority_open,\n    ((LOWER(t.status) NOT IN ('closed', 'resolved'))\n        AND t.due_at IS NOT NULL\
      \ AND DATE(t.due_at) = CURRENT_DATE) AS is_due_today,\n    ((LOWER(t.status) NOT IN ('closed', 'resolved'))\n      \
      \  AND t.due_at IS NOT NULL AND DATE(t.due_at) = CURRENT_DATE) AS is_sla_at_risk,\n    CASE WHEN t.resolved_at IS NOT\
      \ NULL AND t.due_at IS NOT NULL AND t.resolved_at > t.due_at\n         THEN EXTRACT(EPOCH FROM (t.resolved_at - t.due_at))\
      \ / 3600.0 END AS overdue_hours,\n    CASE\n        WHEN t.resolved_at IS NOT NULL AND t.due_at IS NOT NULL AND t.resolved_at\
      \ <= t.due_at THEN true\n        WHEN (LOWER(t.status) = 'resolved')\n             AND sp.resolution_hours IS NOT NULL\n\
      \             AND t.resolved_at IS NOT NULL AND t.created_at IS NOT NULL\n             AND EXTRACT(EPOCH FROM (t.resolved_at\
      \ - t.created_at)) / 3600.0 <= sp.resolution_hours THEN true\n        ELSE false\n    END AS is_resolution_sla_met,\n\
      \    (t.resolved_at IS NOT NULL AND (t.due_at IS NOT NULL OR sp.resolution_hours IS NOT NULL)) AS has_resolution_sla_target,\n\
      \    sp.resolution_hours AS sla_resolution_hours,\n    sp.first_response_hours AS sla_first_response_hours,\n    CASE\
      \ WHEN (LOWER(t.status) = 'resolved')\n              AND sp.resolution_hours IS NOT NULL\n              AND t.resolved_at\
      \ IS NOT NULL AND t.created_at IS NOT NULL\n         THEN EXTRACT(EPOCH FROM (t.resolved_at - t.created_at)) / 3600.0\
      \ - sp.resolution_hours END AS resolution_hours_variance,\n    CASE WHEN t.first_response_at IS NOT NULL AND sp.first_response_hours\
      \ IS NOT NULL\n              AND EXTRACT(EPOCH FROM (t.first_response_at - t.created_at)) / 3600.0 <= sp.first_response_hours\n\
      \         THEN true ELSE false END AS is_first_response_sla_met,\n    (t.first_response_at IS NOT NULL AND sp.first_response_hours\
      \ IS NOT NULL) AS has_first_response_sla_target,\n    t.created_at,\n    t.updated_at\nFROM ticketing.tickets t\nLEFT\
      \ JOIN ticketing.ticket_statuses ts\n    ON t.status = ts.status AND t.organization_id = ts.organization_id\nLEFT JOIN\
      \ ticketing.sla_policies sp\n    ON t.priority = sp.priority AND t.organization_id = sp.organization_id AND sp.active\
