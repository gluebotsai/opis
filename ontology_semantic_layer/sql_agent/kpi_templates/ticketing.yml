metrics:
  accepted_recommendations_metric:
    product: ticketing
    result_column: accepted_recommendations_metric
    time_column: created_at
    table: proactive_recommendations
    sql: "SELECT COUNT(*) FILTER (WHERE is_accepted)::bigint AS accepted_recommendations_metric\nFROM \n(\nSELECT\n    id::text\
      \ AS recommendation_id,\n    organization_id::text AS organization_id,\n    ticket_id::text AS ticket_id,\n    agent_id::text\
      \ AS agent_id,\n    status,\n    (LOWER(status) = 'accepted') AS is_accepted,\n    (LOWER(status) = 'dismissed') AS\
      \ is_dismissed,\n    (LOWER(status) = 'open') AS is_open,\n    created_at\n FROM ticketing.proactive_recommendations\n\
      ) AS op_proactive_recommendations\n\nWHERE organization_id = %s{{extra_where}}"
    default_zero: true
  accounts_served:
    product: ticketing
    result_column: accounts_served
    time_column: created_at
    table: tickets
    sql: "WITH enriched AS (\nSELECT\n    t.id::text AS ticket_id,\n    t.organization_id::text AS organization_id,\n    t.ticket_number,\n\
      \    t.subject,\n    t.status,\n    ts.display_name AS status_display_name,\n    COALESCE(ts.is_terminal, false) AS\
      \ is_closed_by_status,\n    t.priority,\n    t.channel,\n    t.customer_id::text AS customer_id,\n    t.customer_name,\n\
      \    t.customer_email,\n    cp.account_id::text AS account_id,\n    ta.name AS account_name,\n    t.assignee_id::text\
      \ AS assignee_id,\n    t.assignee_name,\n    ag.role AS assignee_role,\n    t.resolver_id::text AS resolver_id,\n  \
      \  t.resolver_name,\n    t.queue_id::text AS queue_id,\n    t.queue_name,\n    aq.type AS queue_type,\n    aq.sla_status\
      \ AS queue_sla_status,\n    true AS team_supports_ticketing,\n    t.category,\n    t.skill,\n    t.due_at,\n    t.first_response_at,\n\
      \    t.resolved_at,\n    t.csat_score,\n    t.csat_rated_at,\n    t.created_by_id::text AS created_by_id,\n    t.created_by_name,\n\
      \    (LOWER(t.status) = 'resolved') AS is_resolved,\n    (LOWER(t.status) = 'open') AS is_open,\n    (LOWER(t.status)\
      \ = 'closed') AS is_closed,\n    (LOWER(t.status) NOT IN ('closed', 'resolved')) AS is_pending,\n    (LOWER(t.status)\
      \ = 'overdue') AS is_breached_proxy,\n    CASE WHEN t.resolved_at IS NOT NULL AND t.created_at IS NOT NULL\n       \
      \  THEN EXTRACT(EPOCH FROM (t.resolved_at - t.created_at)) / 3600.0 END AS resolution_hours,\n    CASE WHEN t.first_response_at\
      \ IS NOT NULL AND t.created_at IS NOT NULL\n         THEN EXTRACT(EPOCH FROM (t.first_response_at - t.created_at)) /\
      \ 3600.0 END AS first_response_hours,\n    CASE WHEN t.first_response_at IS NOT NULL AND t.created_at IS NOT NULL\n\
      \         THEN EXTRACT(EPOCH FROM (t.first_response_at - t.created_at)) / 60.0 END AS first_response_minutes,\n    (t.first_response_at\
      \ IS NOT NULL) AS has_first_response,\n    (t.csat_score IS NOT NULL) AS has_csat_score,\n    (t.csat_score IS NOT NULL)\
      \ AS has_csat_rating,\n    (t.assignee_id IS NOT NULL AND t.assignee_name IS NOT NULL AND t.assignee_name <> 'Unassigned')\
      \ AS has_assignee,\n    (t.resolver_id IS NOT NULL OR (t.resolver_name IS NOT NULL AND t.resolver_name <> '')) AS has_resolver,\n\
      \    ((LOWER(t.status) NOT IN ('closed', 'resolved'))\n        AND t.due_at IS NOT NULL AND t.due_at < NOW()) AS is_overdue,\n\
      \    (LOWER(t.status) = 'reopened') AS is_reopened,\n    ((LOWER(t.status) = 'open') AND LOWER(t.priority) = 'high')\
      \ AS is_high_priority_open,\n    ((LOWER(t.status) NOT IN ('closed', 'resolved'))\n        AND t.due_at IS NOT NULL\
      \ AND DATE(t.due_at) = CURRENT_DATE) AS is_due_today,\n    ((LOWER(t.status) NOT IN ('closed', 'resolved'))\n      \
      \  AND t.due_at IS NOT NULL AND DATE(t.due_at) = CURRENT_DATE) AS is_sla_at_risk,\n    CASE WHEN t.resolved_at IS NOT\
      \ NULL AND t.due_at IS NOT NULL AND t.resolved_at > t.due_at\n         THEN EXTRACT(EPOCH FROM (t.resolved_at - t.due_at))\
      \ / 3600.0 END AS overdue_hours,\n    CASE\n        WHEN t.resolved_at IS NOT NULL AND t.due_at IS NOT NULL AND t.resolved_at\
      \ <= t.due_at THEN true\n        WHEN (LOWER(t.status) = 'resolved')\n             AND sp.resolution_hours IS NOT NULL\n\
      \             AND t.resolved_at IS NOT NULL AND t.created_at IS NOT NULL\n             AND EXTRACT(EPOCH FROM (t.resolved_at\
      \ - t.created_at)) / 3600.0 <= sp.resolution_hours THEN true\n        ELSE false\n    END AS is_resolution_sla_met,\n\
      \    (t.resolved_at IS NOT NULL AND (t.due_at IS NOT NULL OR sp.resolution_hours IS NOT NULL)) AS has_resolution_sla_target,\n\
      \    sp.resolution_hours AS sla_resolution_hours,\n    sp.first_response_hours AS sla_first_response_hours,\n    CASE\
      \ WHEN (LOWER(t.status) = 'resolved')\n              AND sp.resolution_hours IS NOT NULL\n              AND t.resolved_at\
      \ IS NOT NULL AND t.created_at IS NOT NULL\n         THEN EXTRACT(EPOCH FROM (t.resolved_at - t.created_at)) / 3600.0\
      \ - sp.resolution_hours END AS resolution_hours_variance,\n    CASE WHEN t.first_response_at IS NOT NULL AND sp.first_response_hours\
      \ IS NOT NULL\n              AND EXTRACT(EPOCH FROM (t.first_response_at - t.created_at)) / 3600.0 <= sp.first_response_hours\n\
      \         THEN true ELSE false END AS is_first_response_sla_met,\n    (t.first_response_at IS NOT NULL AND sp.first_response_hours\
      \ IS NOT NULL) AS has_first_response_sla_target,\n    t.created_at,\n    t.updated_at\nFROM ticketing.tickets t\nLEFT\
      \ JOIN ticketing.ticket_statuses ts\n    ON t.status = ts.status AND t.organization_id = ts.organization_id\nLEFT JOIN\
      \ ticketing.sla_policies sp\n    ON t.priority = sp.priority AND t.organization_id = sp.organization_id AND sp.active\
      \ = true\nLEFT JOIN ticketing.contact_profile cp\n    ON t.customer_id = cp.id AND t.organization_id = cp.organization_id\n\
      LEFT JOIN ticketing.ticketing_accounts ta\n    ON cp.account_id = ta.id AND t.organization_id = ta.organization_id\n\
      LEFT JOIN ticketing.agent_queues aq\n    ON t.queue_id = aq.id AND t.organization_id = aq.organization_id\nLEFT JOIN\
      \ ticketing.agents ag\n    ON t.assignee_id = ag.id AND t.organization_id = ag.organization_id\n) SELECT COUNT(DISTINCT\
      \ account_id)::bigint AS accounts_served\nFROM enriched\nWHERE organization_id = %s{{extra_where}}"
    enriched_base: tickets
  active_agents_metric:
    product: ticketing
    result_column: active_agents_metric
    time_column: created_at
    table: agents
    sql: "SELECT COUNT(*) FILTER (WHERE is_active and role = 'agent')::bigint AS active_agents_metric\nFROM \n(\nSELECT\n\
      \    id::text AS user_id,\n    organization_id::text AS organization_id,\n    support_email AS email,\n    role,\n \
      \   status,\n    (LOWER(status) = 'active') AS is_active,\n    created_at,\n    updated_at\n FROM ticketing.agents\n\
      ) AS op_users\n\nWHERE organization_id = %s{{extra_where}}"
    default_zero: true
  active_customers_metric:
    product: ticketing
    result_column: active_customers_metric
    time_column: created_at
    table: contact_profile
    sql: "SELECT COUNT(*) FILTER (WHERE is_active)::bigint AS active_customers_metric\nFROM \n(\nSELECT\n    id::text AS customer_id,\n\
      \    organization_id::text AS organization_id,\n    account_id::text AS account_id,\n    status,\n    (LOWER(status)\
      \ = 'active') AS is_active,\n    total_tickets,\n    created_at,\n    updated_at\n FROM ticketing.contact_profile\n\
      ) AS op_customers\n\nWHERE organization_id = %s{{extra_where}}"
    default_zero: true
  total_customers_metric:
    product: ticketing
    result_column: total_customers_metric
    time_column: created_at
    table: contact_profile
    sql: "SELECT COUNT(*)::bigint AS total_customers_metric\nFROM \n(\nSELECT\n    id::text AS customer_id,\n    organization_id::text AS organization_id,\n    created_at\n FROM ticketing.contact_profile\n) AS op_customers\n\nWHERE organization_id = %s{{extra_where}}"
    default_zero: true
