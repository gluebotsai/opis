      \ ticketing.agents ag\n    ON t.assignee_id = ag.id AND t.organization_id = ag.organization_id\n) SELECT\n  (COUNT(*)\
      \ FILTER (WHERE not has_assignee and lower(status) NOT IN ('closed', 'resolved'))::bigint)::float\n  / NULLIF((COUNT(DISTINCT\
      \ ticket_id)::bigint), 0) AS unassignment_rate\nFROM enriched\nWHERE organization_id = %s{{extra_where}}"
    default_zero: true
    enriched_base: tickets
  unread_notifications_metric:
    product: ticketing
    result_column: unread_notifications_metric
    time_column: created_at
    table: notifications
    sql: "SELECT COUNT(*) FILTER (WHERE not is_read)::bigint AS unread_notifications_metric\nFROM \n(\nSELECT\n    id::text\
      \ AS notification_id,\n    organization_id::text AS organization_id,\n    user_id::text AS user_id,\n    kind,\n   \
      \ COALESCE(is_read, false) AS is_read,\n    created_at\n FROM ticketing.notifications\n) AS op_notifications\n\nWHERE\
      \ organization_id = %s{{extra_where}}"
    default_zero: true
