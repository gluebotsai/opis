      \ ticketing.agents ag\n    ON t.assignee_id = ag.id AND t.organization_id = ag.organization_id\n) SELECT COUNT(*) FILTER\
      \ (WHERE not has_resolver)::bigint AS tickets_without_resolver_metric\nFROM enriched\nWHERE organization_id = %s{{extra_where}}"
