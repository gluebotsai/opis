  average_decision_hours:
    product: ticketing
    result_column: average_decision_hours
    time_column: created_at
    table: proactive_approvals
    sql: "SELECT ((SELECT SUM(decision_hours) FROM \n(\nSELECT\n    id::text AS approval_id,\n    organization_id::text AS\
      \ organization_id,\n    ticket_id::text AS ticket_id,\n    agent_id::text AS agent_id,\n    status,\n    (LOWER(status)\
      \ = 'approved') AS is_approved,\n    (LOWER(status) = 'rejected') AS is_rejected,\n    (LOWER(status) = 'pending') AS\
      \ is_pending,\n    (LOWER(status) IN ('approved', 'rejected')) AS is_decided,\n    0.0::float AS decision_hours,\n \
      \   created_at\n FROM ticketing.proactive_approvals\n) AS op_proactive_approvals\n WHERE organization_id = %s{{extra_where}})\
      \ / (SELECT COUNT(*) FILTER (WHERE decision_hours is not null)::bigint FROM \n(\nSELECT\n    id::text AS approval_id,\n\
      \    organization_id::text AS organization_id,\n    ticket_id::text AS ticket_id,\n    agent_id::text AS agent_id,\n\
      \    status,\n    (LOWER(status) = 'approved') AS is_approved,\n    (LOWER(status) = 'rejected') AS is_rejected,\n \
      \   (LOWER(status) = 'pending') AS is_pending,\n    (LOWER(status) IN ('approved', 'rejected')) AS is_decided,\n   \
      \ 0.0::float AS decision_hours,\n    created_at\n FROM ticketing.proactive_approvals\n) AS op_proactive_approvals\n\
      \ WHERE organization_id = %s{{extra_where}}))::float AS average_decision_hours"
    default_zero: true
