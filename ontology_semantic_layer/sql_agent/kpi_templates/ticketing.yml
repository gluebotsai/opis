      \ IS NOT NULL) AS has_first_response_sla_target,\n    t.created_at,\n    t.updated_at\nFROM ticketing.tickets t\nLEFT\
      \ JOIN ticketing.ticket_statuses ts\n    ON t.status = ts.status AND t.organization_id = ts.organization_id\nLEFT JOIN\
      \ ticketing.sla_policies sp\n    ON t.priority = sp.priority AND t.organization_id = sp.organization_id AND sp.active\
      \ = true\nLEFT JOIN ticketing.contact_profile cp\n    ON t.customer_id = cp.id AND t.organization_id = cp.organization_id\n\
      LEFT JOIN ticketing.ticketing_accounts ta\n    ON cp.account_id = ta.id AND t.organization_id = ta.organization_id\n\
      LEFT JOIN ticketing.agent_queues aq\n    ON t.queue_id = aq.id AND t.organization_id = aq.organization_id\nLEFT JOIN\
      \ ticketing.agents ag\n    ON t.assignee_id = ag.id AND t.organization_id = ag.organization_id\n), enriched_audit AS\
      \ (\nSELECT\n    ae.id::text AS audit_event_id,\n    ae.organization_id::text AS organization_id,\n    ae.ticket_id::text\
      \ AS ticket_id,\n    t.ticket_number,\n    t.priority AS ticket_priority,\n    t.status AS ticket_status,\n    t.channel\
      \ AS ticket_channel,\n    t.queue_id::text AS queue_id,\n    t.queue_name,\n    t.assignee_id::text AS assignee_id,\n\
      \    t.assignee_name,\n    ae.action,\n    ae.actor_id::text AS actor_id,\n    ae.actor_name,\n    (LOWER(ae.action)\
      \ IN ('escalate', 'escalated', 'ticket.escalated')) AS is_escalation_event,\n    (LOWER(ae.action) IN ('reassign', 'reassigned',\
      \ 'assign', 'assigned', 'ticket.assigned', 'ticket.reassigned')) AS is_assignment_event,\n    ae.created_at\nFROM ticketing.audit_events\
      \ ae\nLEFT JOIN ticketing.tickets t\n    ON ae.ticket_id = t.id AND ae.organization_id = t.organization_id\n) SELECT\
      \ COUNT(*) FILTER (WHERE is_escalation_event)::bigint AS escalation_volume\nFROM enriched_audit\nWHERE organization_id\
      \ = %s{{extra_where}}"
