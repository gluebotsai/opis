<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>core.yaml — graph map</title>
<style>
:root{
  --paper:#E4E9ED; --panel:#F5F7F9; --ink:#14202A; --ink2:#5C6B77; --ink3:#8896A2;
  --rule:#C2CCD4; --rule2:#D8E0E6;
  --common:#2F5D8C; --ccaas:#17786A; --cdp:#6A4B9B; --crm:#A6522B;
  --ticketing:#7A6512; --campaign:#9C2F52; --shared:#55636E;
  --mark:#E0B21F;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- header ---------- */
header{
  flex:0 0 auto;display:flex;align-items:baseline;gap:24px;flex-wrap:wrap;
  padding:14px 20px 12px;border-bottom:1px solid var(--rule);background:var(--panel);
}
h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
h1 span{font-family:var(--mono);font-weight:500}
.stats{color:var(--ink2);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap}
.stats b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
nav{margin-left:auto;display:flex;gap:2px}
nav button{
  padding:5px 13px;border:1px solid transparent;border-radius:2px;
  color:var(--ink2);font-size:13px;
}
nav button:hover{color:var(--ink);background:#E9EEF1}
nav button[aria-current="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}

/* ---------- shell ---------- */
main{flex:1 1 auto;display:grid;grid-template-columns:236px 1fr 0;min-height:0;transition:grid-template-columns .18s ease}
main.open{grid-template-columns:236px 1fr 336px}
aside{overflow-y:auto;background:var(--panel)}
#rail{border-right:1px solid var(--rule);padding:16px 16px 40px}
#drawer{border-left:1px solid var(--rule);min-width:0;position:relative}
#stage{position:relative;min-width:0;overflow:hidden}

/* ---------- rail ---------- */
.rail-h{font-size:11.5px;font-weight:600;color:var(--ink2);margin:20px 0 7px;letter-spacing:.02em}
.rail-h:first-child{margin-top:0}
#q{
  width:100%;padding:7px 9px;border:1px solid var(--rule);border-radius:2px;
  background:#fff;font:inherit;font-size:13px;color:var(--ink);
}
#q::placeholder{color:var(--ink3)}
.opt{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;font-size:13px}
.opt input{margin:0;accent-color:var(--ink)}
.swatch{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.opt .n{margin-left:auto;color:var(--ink3);font-size:11.5px;font-variant-numeric:tabular-nums}
.opt.muted{color:var(--ink2)}
.chip{
  display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:4px 8px;
  border:1px solid var(--rule);border-radius:2px;background:#fff;font-size:12px;
}
.chip button{color:var(--ink3);font-size:14px;line-height:1;padding:0 2px}
.chip button:hover{color:var(--ink)}
.hint{font-size:11.5px;color:var(--ink3);margin-top:14px;line-height:1.55}

/* ---------- map ---------- */
#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#map.grabbing{cursor:grabbing}
.edge{fill:none;stroke:#9DAAB5;stroke-width:1;opacity:.55}
.edge.hot{stroke:var(--ink);stroke-width:1.6;opacity:1}
.edge.cold{opacity:.10}
.node{cursor:pointer}
.node .hit{fill:transparent}
.node .glyph{stroke:var(--panel);stroke-width:1.5}
.node.hollow .glyph{fill:var(--panel);stroke-width:1.6}
.node.stub .glyph{stroke-dasharray:2.5 2}
.node text{
  font-family:var(--mono);font-size:9.5px;fill:var(--ink);
  paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round;
  pointer-events:none;
}
.node.cold{opacity:.16}
.node.cold text{display:none}
.node.sel .glyph{stroke:var(--ink);stroke-width:2.2}
.node.hit-search .glyph{stroke:var(--mark);stroke-width:2.6}
.node text.off{display:none}
#legend{
  position:absolute;left:14px;bottom:14px;background:rgba(245,247,249,.92);
  border:1px solid var(--rule);border-radius:2px;padding:9px 11px;font-size:11.5px;
  color:var(--ink2);display:flex;gap:16px;
}
#legend div{display:flex;align-items:center;gap:6px}
#zoomctl{position:absolute;right:14px;bottom:14px;display:flex;gap:4px}
#zoomctl button{
  width:28px;height:28px;border:1px solid var(--rule);border-radius:2px;
  background:rgba(245,247,249,.92);color:var(--ink2);font-size:14px;line-height:1;
}
#zoomctl button:hover{color:var(--ink);border-color:var(--ink3)}
#count{
  position:absolute;left:14px;top:12px;font-size:11.5px;color:var(--ink2);
  font-variant-numeric:tabular-nums;
}

/* ---------- panes ---------- */
.pane{position:absolute;inset:0;overflow-y:auto;padding:22px 28px 60px;background:var(--paper)}
.pane[hidden]{display:none}
.pane h2{font-size:14px;font-weight:600;margin:0 0 4px}
.pane .lede{color:var(--ink2);font-size:13px;margin:0 0 22px;max-width:64ch}

/* spine */
.spine{display:flex;flex-direction:column;gap:34px}
.limb{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:start}
.limb-hd{
  border-left:3px solid var(--rule);padding:2px 0 2px 12px;
}
.limb-hd .nm{font-family:var(--mono);font-size:13px;font-weight:600}
.limb-hd .ct{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.kids{display:flex;flex-wrap:wrap;gap:5px}
.kid{
  font-family:var(--mono);font-size:11.5px;padding:2.5px 7px;background:var(--panel);
  border:1px solid var(--rule2);border-radius:2px;cursor:pointer;color:var(--ink);
}
.kid:hover{border-color:var(--ink3);background:#fff}
.kid i{font-style:normal;color:var(--ink3)}
.hub-title{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
.hub-title .nm{font-family:var(--mono);font-size:15px;font-weight:600}
.hub-title .sub{font-size:12.5px;color:var(--ink2)}

/* tables */
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{
  text-align:left;font-weight:600;font-size:11.5px;color:var(--ink2);
  border-bottom:1px solid var(--rule);padding:6px 10px 6px 0;position:sticky;top:0;
  background:var(--paper);cursor:pointer;white-space:nowrap;
}
th:hover{color:var(--ink)}
td{padding:5px 10px 5px 0;border-bottom:1px solid var(--rule2);vertical-align:top}
td.m{font-family:var(--mono);font-size:11.5px}
td.num{text-align:right;font-variant-numeric:tabular-nums;padding-right:18px;color:var(--ink2)}
tbody tr:hover{background:var(--panel)}
.lbl-link{font-family:var(--mono);font-size:11.5px;cursor:pointer;border-bottom:1px dotted var(--ink3)}
.lbl-link:hover{border-bottom-color:var(--ink)}
.tag{
  display:inline-block;padding:1px 6px;border-radius:2px;font-size:11px;
  border:1px solid var(--rule);color:var(--ink2);background:var(--panel);
}
#tfilter{margin-bottom:14px;width:280px;padding:6px 9px;border:1px solid var(--rule);border-radius:2px;background:#fff;font:inherit;font-size:13px}

/* checks */
.check{margin-bottom:30px;max-width:820px}
.check h3{font-size:13px;margin:0 0 3px;font-weight:600}
.check p{margin:0 0 12px;color:var(--ink2);font-size:12.5px;max-width:64ch}
.bar-row{display:grid;grid-template-columns:190px 1fr 44px;gap:10px;align-items:center;margin-bottom:3px}
.bar-row .nm{font-family:var(--mono);font-size:11.5px;cursor:pointer}
.bar-row .nm:hover{text-decoration:underline}
.bar{height:9px;background:var(--rule2)}
.bar i{display:block;height:100%;background:var(--common)}
.bar-row .v{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums;text-align:right}
.plain{font-family:var(--mono);font-size:11.5px;line-height:1.9}

/* drawer */
#drawer .in{padding:18px 18px 60px}
#drawer .close{position:absolute;right:10px;top:10px;color:var(--ink3);font-size:18px;line-height:1}
#drawer .close:hover{color:var(--ink)}
#drawer h2{font-family:var(--mono);font-size:15px;font-weight:600;margin:0 0 8px;word-break:break-word;padding-right:20px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:16px}
.badge{font-size:11px;padding:2px 7px;border-radius:2px;border:1px solid var(--rule);color:var(--ink2)}
.badge.dom{color:#fff;border:0}
.kv{display:grid;grid-template-columns:74px 1fr;gap:4px 10px;font-size:12.5px;margin-bottom:18px}
.kv dt{color:var(--ink2)}
.kv dd{margin:0;font-family:var(--mono);font-size:11.5px;word-break:break-word}
.sec{font-size:11.5px;font-weight:600;color:var(--ink2);margin:0 0 7px;padding-top:14px;border-top:1px solid var(--rule2)}
.rel{font-size:12px;padding:3px 0;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.rel .t{font-family:var(--mono);font-size:11px;color:var(--ink)}
.rel .o{font-family:var(--mono);font-size:11.5px;cursor:pointer;border-bottom:1px dotted var(--ink3)}
.rel .o:hover{border-bottom-color:var(--ink)}
.rel .via{font-family:var(--mono);font-size:10.5px;color:var(--ink3);width:100%}
.props{display:flex;flex-wrap:wrap;gap:4px}
.props span{
  font-family:var(--mono);font-size:10.5px;padding:2px 6px;background:#fff;
  border:1px solid var(--rule2);border-radius:2px;color:var(--ink2);
}
.more{font-size:12px;color:var(--ink2);border-bottom:1px dotted var(--ink3);margin-top:8px}

@media (max-width:900px){
  main,main.open{grid-template-columns:1fr}
  #rail{display:none}
  #drawer{position:absolute;right:0;top:0;bottom:0;width:min(340px,86vw);z-index:5;box-shadow:-8px 0 24px rgba(20,32,42,.13)}
  nav button{padding:5px 9px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){main{transition:none}}
</style>
</head>

<header>

      <button id="zout" title="Zoom out">−</button>

    <div class="pane" id="pane-spine" hidden></div>
    <div class="pane" id="pane-tables" hidden></div>

  <aside id="drawer" hidden></aside>
</main>

for (const e of DATA.edges){
  (outOf.get(e.s) || outOf.set(e.s,[]).get(e.s)).push(e);
  (inTo.get(e.t) || inTo.set(e.t,[]).get(e.t)).push(e);
}
const nbrOf = new Map(DATA.nodes.map(n=>[n.id,new Set()]));

                                 : document.createElement(t);
  for (const k in a){ if(k==='class') n.setAttribute('class',a[k]); else if(k.startsWith('on')) n.addEventListener(k.slice(2),a[k]); else n.setAttribute(k,a[k]); }
  for (const k of kids) n.append(k?.nodeType?k:document.createTextNode(k));
  return n;
};

/* ============================ filtering ============================ */
function visibleNodes(){
  let ns = DATA.nodes.filter(n=>{
    if (!S.doms.has(n.dom)) return false;
    if (n.kind==='collection' && !S.collections) return false;
    if (n.kind==='catalog' && !S.catalogs) return false;
    if (n.kind==='stub' && !S.stubs) return false;
    if (S.hideShared && (n.id==='User'||n.id==='Channel')) return false;
    return true;
  });
  if (S.focus){
    const keep = new Set([S.focus,...nbrOf.get(S.focus)]);
    ns = ns.filter(n=>keep.has(n.id));
    if (!ns.some(n=>n.id===S.focus)) ns.push(byId.get(S.focus));
  }
  return ns;
}
function matches(n){
  if (!S.q) return false;
  const q = S.q.toLowerCase();
  return n.id.toLowerCase().includes(q)
      || n.tables.some(t=>t.toLowerCase().includes(q))
      || n.props.some(p=>p.toLowerCase().includes(q));
}

/* ============================ force layout ============================ */
const svg = $('#map');
const gRoot = el('svg:g'), gEdge = el('svg:g'), gNode = el('svg:g');
gRoot.append(gEdge,gNode); svg.append(gRoot);
let T = {k:1,x:0,y:0};
let sim = null, W = 900, H = 600;

function anchor(dom){
  const i = DOMS.indexOf(dom), a = (i/DOMS.length)*Math.PI*2 - Math.PI/2;
  return {x:Math.cos(a)*260, y:Math.sin(a)*260};
}

function build(){
  const ns = visibleNodes();
  const ids = new Set(ns.map(n=>n.id));
  const es = DATA.edges.filter(e=>ids.has(e.s)&&ids.has(e.t));
  const P = new Map();
  ns.forEach((n,i)=>{
    const a = anchor(n.dom), jitter = (i%17)/17*Math.PI*2;
    P.set(n.id,{n, x:a.x+Math.cos(jitter)*90, y:a.y+Math.sin(jitter)*90, vx:0, vy:0, fixed:false,
                r: 3.2 + Math.min(9, Math.sqrt(n.deg)*1.9)});
  });
  return {ns,es,P,alpha:1};
}

function tick(){
  const arr=[...sim.P.values()], n=arr.length;
  for (let i=0;i<n;i++){
    const a=arr[i];
    for (let j=i+1;j<n;j++){
      const b=arr[j];
      let dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy;
      if (d2<0.01){ dx=(Math.random()-.5); dy=(Math.random()-.5); d2=0.01; }
      const f = Math.min(900/d2, 0.8), d=Math.sqrt(d2);
      const fx=dx/d*f, fy=dy/d*f;
      a.vx-=fx; a.vy-=fy; b.vx+=fx; b.vy+=fy;
    }
  }
  for (const e of sim.es){
    const a=sim.P.get(e.s), b=sim.P.get(e.t);
    if (a===b) continue;
    const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||0.01;
    const L = 66 + (a.r+b.r);
    const f = (d-L)*0.035;
    const fx=dx/d*f, fy=dy/d*f;
    a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy;
  }
  for (const p of arr){
    const a = anchor(p.n.dom);
    p.vx += (a.x-p.x)*0.012; p.vy += (a.y-p.y)*0.012;
    p.vx += (0-p.x)*0.004;   p.vy += (0-p.y)*0.004;
    if (p.fixed){ p.vx=p.vy=0; continue; }
    p.vx*=0.82; p.vy*=0.82;
    p.x += p.vx*sim.alpha*2.4; p.y += p.vy*sim.alpha*2.4;
  }
  sim.alpha *= 0.986;
}

let raf=null;
function run(){
  cancelAnimationFrame(raf);
  if (REDUCED){ for(let i=0;i<420;i++) tick(); draw(); return; }
  const step=()=>{
    for (let i=0;i<2;i++) tick();
    draw();
    if (sim.alpha>0.02) raf=requestAnimationFrame(step);
  };
  raf=requestAnimationFrame(step);
}

/* ---------- render ---------- */
let edgeEls=new Map(), nodeEls=new Map();
function rebuild(){
  sim = build();
  gEdge.textContent=''; gNode.textContent='';
  edgeEls=new Map(); nodeEls=new Map();

  for (const e of sim.es){
    const p = el('svg:path',{class:'edge'});
    gEdge.append(p); edgeEls.set(e.i,p);
  }
  for (const p of sim.P.values()){
    const n=p.n, c=COLOR[n.dom]||COLOR.shared;
    const g = el('svg:g',{class:'node'+(n.kind==='collection'||n.kind==='stub'?' hollow':'')+(n.kind==='stub'?' stub':'')});
    let glyph;
    if (n.kind==='catalog'||n.kind==='collection'){
      const s=p.r*1.55;
      glyph = el('svg:rect',{class:'glyph',x:-s/2,y:-s/2,width:s,height:s,transform:'rotate(45)'});
    } else {
      glyph = el('svg:circle',{class:'glyph',r:p.r});
    }
    glyph.setAttribute('fill', n.kind==='collection'||n.kind==='stub' ? 'var(--panel)' : c);
    glyph.setAttribute('stroke', n.kind==='collection'||n.kind==='stub' ? c : 'var(--panel)');
    const hit = el('svg:circle',{class:'hit',r:Math.max(p.r+5,10)});
    const tx = el('svg:text',{x:p.r+4,y:3.2},n.id);
    g.append(hit,glyph,tx);
    g.addEventListener('pointerdown',ev=>startDrag(ev,p));
    g.addEventListener('click',ev=>{ev.stopPropagation(); select(n.id);});
    g.addEventListener('dblclick',ev=>{ev.stopPropagation(); S.focus=(S.focus===n.id?null:n.id); renderFocusChip(); rebuild();});
    g.addEventListener('pointerenter',()=>{S.hover=n.id; paint();});
    g.addEventListener('pointerleave',()=>{S.hover=null; paint();});
    gNode.append(g); nodeEls.set(n.id,{g,tx,glyph,p});
  }
  $('#count').textContent = `${sim.ns.length} labels · ${sim.es.length} relationships shown`;
  userMoved=false; run(); paint(); setTimeout(()=>{ if(!userMoved) fit(); },REDUCED?0:900);
}

function draw(){
  for (const e of sim.es){
    const a=sim.P.get(e.s), b=sim.P.get(e.t), p=edgeEls.get(e.i);
    if (a===b){
      p.setAttribute('d',`M${a.x} ${a.y-a.r} a 11 11 0 1 1 -2 0`);
    } else {
      p.setAttribute('d',`M${a.x} ${a.y} L${b.x} ${b.y}`);
    }
  }
  for (const [id,o] of nodeEls) o.g.setAttribute('transform',`translate(${o.p.x},${o.p.y})`);
}

function paint(){
  const hot = S.hover||S.sel;
  const hotSet = hot ? new Set([hot,...nbrOf.get(hot)]) : null;
  for (const [id,o] of nodeEls){
    const n=o.p.n;
    const isHit = matches(n);
    o.g.classList.toggle('cold', !!hotSet && !hotSet.has(id));
    o.g.classList.toggle('sel', S.sel===id);
    o.g.classList.toggle('hit-search', isHit);
    const showLabel = S.allLabels || isHit || (hotSet&&hotSet.has(id)) || (!hotSet && n.deg>=5) || S.focus;
    o.tx.classList.toggle('off', !showLabel);
  }
  for (const e of sim.es){
    const p=edgeEls.get(e.i);
    const on = hot && (e.s===hot||e.t===hot);
    p.classList.toggle('hot', !!on);
    p.classList.toggle('cold', !!hotSet && !on);
  }
}

/* ---------- transform ---------- */
function apply(){ gRoot.setAttribute('transform',`translate(${T.x},${T.y}) scale(${T.k})`); }
function fit(){
  const xs=[...sim.P.values()];
  if(!xs.length) return;
  const x0=Math.min(...xs.map(p=>p.x)), x1=Math.max(...xs.map(p=>p.x));
  const y0=Math.min(...xs.map(p=>p.y)), y1=Math.max(...xs.map(p=>p.y));
  const pad=70, w=x1-x0+pad*2, h=y1-y0+pad*2;
  T.k=Math.min(W/w,H/h,1.7);
  T.x=W/2-((x0+x1)/2)*T.k; T.y=H/2-((y0+y1)/2)*T.k;
  apply();
}
function resize(){
  const r=$('#stage').getBoundingClientRect(); W=r.width; H=r.height;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
}
addEventListener('resize',()=>{resize();});

svg.addEventListener('wheel',ev=>{
  ev.preventDefault();
  const r=svg.getBoundingClientRect(), mx=ev.clientX-r.left, my=ev.clientY-r.top;
  const k=Math.max(.15,Math.min(4,T.k*(ev.deltaY<0?1.12:1/1.12)));
  T.x=mx-(mx-T.x)*(k/T.k); T.y=my-(my-T.y)*(k/T.k); T.k=k; userMoved=true; apply();
},{passive:false});
$('#zin').onclick=()=>{T.k=Math.min(4,T.k*1.25);apply()};
$('#zout').onclick=()=>{T.k=Math.max(.15,T.k/1.25);apply()};
$('#zfit').onclick=fit;

let pan=null, userMoved=false;
svg.addEventListener('pointerdown',ev=>{
  if (ev.target.closest('.node')) return;
  pan={x:ev.clientX-T.x,y:ev.clientY-T.y}; userMoved=true; svg.classList.add('grabbing');
  svg.setPointerCapture(ev.pointerId);
});
svg.addEventListener('pointermove',ev=>{
  if (drag){
    const r=svg.getBoundingClientRect();
    drag.p.x=(ev.clientX-r.left-T.x)/T.k; drag.p.y=(ev.clientY-r.top-T.y)/T.k;
    drag.p.fixed=true; sim.alpha=Math.max(sim.alpha,.28); if(!REDUCED) run(); else draw();
  } else if (pan){ T.x=ev.clientX-pan.x; T.y=ev.clientY-pan.y; apply(); }
});
addEventListener('pointerup',()=>{ pan=null; drag=null; svg.classList.remove('grabbing'); });
svg.addEventListener('click',ev=>{ if(!ev.target.closest('.node')) select(null); });

let drag=null;
function startDrag(ev,p){ ev.stopPropagation(); drag={p}; svg.setPointerCapture(ev.pointerId); }

/* ============================ drawer ============================ */
function select(id){
  S.sel=id;
  const dr=$('#drawer'), shell=$('#shell');
  if(!id){ dr.hidden=true; shell.classList.remove('open'); paint(); return; }
  const n=byId.get(id);
  dr.hidden=false; shell.classList.add('open');
  dr.textContent='';
  const inn=el('div',{class:'in'});
  inn.append(el('button',{class:'close',title:'Close',onclick:()=>select(null)},'×'));
  inn.append(el('h2',{},n.id));

  const badges=el('div',{class:'badges'});
  badges.append(el('span',{class:'badge dom',style:`background:${COLOR[n.dom]}`},n.dom));
  badges.append(el('span',{class:'badge'},n.kind));
  if(n.sens) badges.append(el('span',{class:'badge'},n.sens));
  if(n.mod) badges.append(el('span',{class:'badge'},n.mod));
  inn.append(badges);

  const kv=el('dl',{class:'kv'});
  const row=(k,v)=>{kv.append(el('dt',{},k),el('dd',{},v))};
  row('key', n.key||'—');
  row('source', n.tables.length?n.tables.join('\n'):'declared in stub_labels');
  if(n.custom) row('json', n.custom);
  if(n.sublabels?.length) row('sublabels', n.sublabels.map(s=>`${s.label} (${s.when})`).join(', '));
  row('degree', `${n.out} out · ${n.in} in · ${n.nbr} neighbours`);
  inn.append(kv);

  const outs=(outOf.get(id)||[]), ins=(inTo.get(id)||[]);
  if(outs.length){
    inn.append(el('div',{class:'sec'},`Outgoing (${outs.length})`));
    for(const e of outs) inn.append(relRow(e.type,e.t,e.via,'→'));
  }
  if(ins.length){
    inn.append(el('div',{class:'sec'},`Incoming (${ins.length})`));
    for(const e of ins) inn.append(relRow(e.type,e.s,e.via,'←'));
  }
  if(n.props.length){
    inn.append(el('div',{class:'sec'},`Properties (${n.props.length})`));
    const box=el('div',{class:'props'});
    const show=n.props.slice(0,24);
    show.forEach(p=>box.append(el('span',{},p)));
    inn.append(box);
    if(n.props.length>24){
      const more=el('button',{class:'more'},`show ${n.props.length-24} more`);
      more.onclick=()=>{n.props.slice(24).forEach(p=>box.append(el('span',{},p))); more.remove();};
      inn.append(more);
    }
  }
  dr.append(inn); dr.scrollTop=0; paint();
}
function relRow(type,other,via,arrow){
  const r=el('div',{class:'rel'});
  r.append(el('span',{class:'t'},`${arrow} ${type}`));
  const o=el('span',{class:'o'},other);
  o.onclick=()=>{ if(S.view!=='map') setView('map'); if(!nodeEls.has(other)){S.focus=null;renderFocusChip();rebuild();} select(other); centre(other); };
  r.append(o);
  r.append(el('span',{class:'via'},via));
  return r;
}
function centre(id){
  const o=nodeEls.get(id); if(!o) return;
  T.x=W/2-o.p.x*T.k; T.y=H/2-o.p.y*T.k; apply();
}

  $('#zoomctl').style.display = v==='map'?'flex':'none';
  $('#count').style.display = v==='map'?'block':'none';
  if(v==='spine'&&!$('#pane-spine').dataset.done) renderSpine();
  if(v==='tables') renderTables();
  if(v==='checks'&&!$('#pane-checks').dataset.done) renderChecks();
}
document.querySelectorAll('#views button').forEach(b=>b.onclick=()=>setView(b.dataset.v));

function goto(id){ setView('map'); if(!nodeEls.has(id)){S.focus=null;renderFocusChip();rebuild();} select(id); centre(id); }

const OWNERS=new Set(['Tenant','Contact']);
function childrenOf(hub){
  const kids=new Set();
  for(const e of DATA.edges){
    if(e.t===hub && !OWNERS.has(e.s)) kids.add(e.s);
    if(e.s===hub && byId.get(e.t)?.kind==='entity' && !OWNERS.has(e.t)) kids.add(e.t);
  }
  kids.delete(hub);
  return [...kids].sort();
}
function renderSpine(){
  const p=$('#pane-spine'); p.dataset.done='1'; p.textContent='';
  p.append(el('h2',{},'The spine'),
    el('p',{class:'lede'},'Two nodes carry the tenant graph. Tenant fans out into six domain catalogs so per-tenant configuration does not attach directly to the tenant node, and Contact fans out into per-customer collection hubs so unbounded history does not attach directly to the person.'));

  const limb=(hub,kids)=>{
    const d=el('div',{class:'limb'});
    const hd=el('div',{class:'limb-hd',style:`border-left-color:${COLOR[byId.get(hub)?.dom]||'#C2CCD4'}`});
    const nm=el('button',{class:'nm'},hub); nm.onclick=()=>goto(hub);
    hd.append(nm, el('div',{class:'ct'},`${kids.length} attached`));
    const k=el('div',{class:'kids'});
    kids.forEach(id=>{
      const b=el('button',{class:'kid'},id);
      const nd=byId.get(id);
      if(nd) b.style.borderLeft=`2px solid ${COLOR[nd.dom]}`;
      b.onclick=()=>goto(id);
      k.append(b);
    });
    d.append(hd,k); return d;
  };

  const sec=(title,sub,hubs)=>{
    const wrap=el('div',{});
    wrap.append(el('div',{class:'hub-title'},el('span',{class:'nm'},title),el('span',{class:'sub'},sub)));
    const body=el('div',{class:'spine'});
    hubs.forEach(h=>body.append(limb(h,childrenOf(h))));
    wrap.append(body); wrap.style.marginBottom='42px'; return wrap;
  };

  const catalogs=DATA.nodes.filter(n=>n.kind==='catalog').map(n=>n.id).sort();
  const colls=DATA.nodes.filter(n=>n.kind==='collection').map(n=>n.id).sort();
  p.append(sec('Tenant','one per organization → six domain catalogs + shared catalogs',catalogs));
  p.append(sec('Contact','one per customer → per-person collection hubs',colls));
}

let tsort={k:'table',dir:1};
function renderTables(){
  const p=$('#pane-tables'); p.textContent='';
  p.append(el('h2',{},'Table mappings'),
    el('p',{class:'lede'},`${DATA.stats.nodeTables} tables map to a node label, ${DATA.stats.relTables} map to a relationship only. Filter by table, label, domain or module.`));
  const f=el('input',{id:'tfilter',type:'search',placeholder:'Filter mappings',value:S.q});
  f.addEventListener('input',e=>{S.q=e.target.value.trim(); renderTables(); paint();});
  p.append(f);

  const cols=[['table','Table'],['mode','Mode'],['label','Label'],['key','Key'],
              ['props','Props'],['rels','Rels'],['dom','Domain'],['mod','Module'],['sens','Sens']];
  const q=S.q.toLowerCase();
  let rows=DATA.tables.filter(r=>!q||[r.table,r.label,r.dom,r.mod,r.key].join(' ').toLowerCase().includes(q));
  rows=[...rows].sort((a,b)=>{
    const x=a[tsort.k]??'', y=b[tsort.k]??'';
    return (typeof x==='number'? x-y : String(x).localeCompare(String(y)))*tsort.dir;
  });
  const t=el('table');
  const hr=el('tr');
  cols.forEach(([k,lbl])=>{
    const th=el('th',{},lbl+(tsort.k===k?(tsort.dir>0?' ↑':' ↓'):''));
    th.onclick=()=>{ tsort = tsort.k===k?{k,dir:-tsort.dir}:{k,dir:1}; renderTables(); };
    hr.append(th);
  });
  t.append(el('thead',{},hr));
  const tb=el('tbody');
  rows.forEach(r=>{
    const tr=el('tr');
    tr.append(el('td',{class:'m'},r.table));
    tr.append(el('td',{},el('span',{class:'tag'},r.mode)));
    const lc=el('td',{class:'m'});
    if(r.mode==='node'){ const a=el('span',{class:'lbl-link'},r.label); a.onclick=()=>goto(r.label); lc.append(a); }
    else lc.append(r.label);
    tr.append(lc);
    tr.append(el('td',{class:'m'},r.key||'—'));
    tr.append(el('td',{class:'num'},String(r.props||'')));
    tr.append(el('td',{class:'num'},String(r.rels||'')));
    tr.append(el('td',{},r.dom||''));
    tr.append(el('td',{},r.mod||''));
    tr.append(el('td',{},r.sens||''));
    tb.append(tr);
  });
  t.append(tb);
  p.append(t);
  p.append(el('p',{class:'lede',style:'margin-top:14px'},`${rows.length} of ${DATA.tables.length} mappings`));
}

function renderChecks(){
  const p=$('#pane-checks'); p.dataset.done='1'; p.textContent='';
  p.append(el('h2',{},'Structural checks'),
    el('p',{class:'lede'},'Read from the mapping itself, not from live data. These are the shapes worth reviewing before a schema change lands in a tenant database.'));

  const c=DATA.checks;
  const sec=(title,desc,body)=>{
    const d=el('div',{class:'check'});
    d.append(el('h3',{},title), el('p',{},desc), body); p.append(d);
  };

  const max=c.fanin[0]?.n||1;
  const bars=el('div',{});
  c.fanin.forEach(r=>{
    const nd=byId.get(r.id);
    const nm=el('button',{class:'nm'},r.id); nm.onclick=()=>goto(r.id);
    bars.append(el('div',{class:'bar-row'},nm,
      el('div',{class:'bar'},el('i',{style:`width:${r.n/max*100}%;background:${COLOR[nd?.dom]||'#55636E'}`})),
      el('div',{class:'v'},String(r.n))));
  });
  sec('Highest fan-in','Labels most relationship types point at. Every one of these is a merge target on many CDC events, so an index or a hub node in front of it matters more than anywhere else in the graph.',bars);

  const iso=el('div',{class:'plain'});
  c.isolated.forEach(id=>{const a=el('button',{class:'lbl-link'},id);a.onclick=()=>goto(id);iso.append(a,document.createTextNode(' '));});
  sec('Islands',"Mapped labels with no relationship in either direction — they land in the graph but nothing traverses to them.",
      c.isolated.length?iso:el('p',{class:'plain'},'none'));

  const st=el('div',{class:'plain'});
  c.stubs_unmapped.forEach(id=>{const a=el('button',{class:'lbl-link'},id);a.onclick=()=>goto(id);st.append(a,document.createTextNode(' '));});
  sec('Labels with no table behind them',`${c.stubs_unmapped.length} labels exist only as MERGE targets — catalogs, collection hubs and shared lookups created by create_target. Their key must be declared in stub_labels or every merge is a label scan.`,st);

  if(c.stubs_unused?.length){
    const su=el('div',{class:'plain'},c.stubs_unused.join('  '));
    sec('Declared but unreferenced','Keys declared in stub_labels that no mapping points at. Dead config, or a mapping that got commented out.',su);
  }

  const rt=el('div',{});
  c.shared_reltypes.forEach(r=>{
    const doms=el('div',{class:'badges',style:'margin:0'});
    r.domains.forEach(dm=>doms.append(el('span',{class:'badge dom',style:`background:${COLOR[dm]}`},dm)));
    rt.append(el('div',{class:'bar-row'},el('span',{class:'nm'},r.type),doms,el('div',{class:'v'},String(r.n))));
  });
  sec('Relationship types reused across domains','The same type name is emitted from more than one domain. Fine when the semantics match, a problem when a query says MATCH ()-[:CONTAINS]->() and gets four unrelated things.',rt);

  const mt=el('div',{class:'plain'});
  c.multi_table_labels.forEach(r=>{
    const a=el('button',{class:'lbl-link'},r.id); a.onclick=()=>goto(r.id);
    mt.append(el('div',{},a,document.createTextNode('  ← '+r.tables.join(', '))));
  });
  sec('Labels written by more than one table','Two CDC streams merge into the same node. Property ownership needs to be disjoint or the last writer wins.',
      c.multi_table_labels.length?mt:el('p',{class:'plain'},'none'));
}

/* ============================ boot ============================ */
resize(); rebuild(); setView('map');
addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(S.sel) select(null); else if(S.focus){S.focus=null;renderFocusChip();rebuild();} }
  if(e.key==='/'&&document.activeElement!==$('#q')){ e.preventDefault(); $('#q').focus(); }
});
</script>
</body>
