# =============================================================================
# domains/saas.yaml   —   v2
#   effective(org) = core.yaml + domains/saas.yaml [+ org<id>.yaml]
#
# CHANGES FROM v1 (2026.09.02):
#   * BUG FIX (scope, silent): campaign.organization_products was mapped as
#     Entitlement / ActiveEntitlement / ExpiredEntitlement. That table is
#     PlatformProduct licensing — WORKTUAL's own modules (AI CCaaS / CRM /
#     Ticketing / Campaign) granted to the tenant org, per core's own
#     stub_labels comment ("distinct from inventory catalog Offering nodes").
#     It has nothing to do with a SaaS tenant's END CUSTOMERS' feature
#     entitlements. An agent querying Entitlement for a tenant's customer
#     would get Worktual's own licensing data back with full confidence.
#     Re-filed to not_modelled.no_source with the scope distinction stated
#     explicitly, so nobody re-introduces this mapping without reading why.
#   * SupportCase -> Subscription/Account link re-filed from blocked_on_core to
#     no_source and ranked #1 — same correction ecommerce v4 made to its
#     SupportCase -> Purchase gap, same reasoning: blocked_on_core implies a one-line
#     fix (column exists in Postgres, core just doesn't map it); this column
#     doesn't exist anywhere, and it's the highest-frequency CX question.
#   * never_grant_enforcement + never_grant_note added — ecommerce v4's fix
#     for the same unenforceable-at-FGAC problem, ported here unapplied in v1.
#   * PII/PCI blocklist UNIONED with the credential blocklist rather than
#     replacing it. v1 dropped religion/caste/ethnicity/health/pregnancy_
#     status when it added password/api_key/token — compliance obligations
#     don't relax because the vertical changed.
#   * "workspace" de-duplicated as an alias — it appeared on Account,
#     ClientAccount, AND as a customer_profile custom field, which is real
#     ambiguity for whatever layer resolves user language to a label.
#   * routing_precedence + segments (crm_fit tiers) ported in from
#     domains/ecommerce.yaml — same value there (emphasis tuning without a
#     data gate), not present in SaaS v1.
#   * no_source severity=critical entries now carry rank, matching
#     ecommerce v4's top-three pattern.
#
# CONFORMANCE (identical across all packs):
#   R1 table must exist in core `tables:`
#   R2 every column named in when: / from_column: / name_from: must be in that
#      table's core `properties:` list
#   R3 custom_fields only where core sets custom_dynamic: true
#   R4 additive only - never rename, re-key or remove a core construct
#   R5 anything failing R1-R4 lives in not_modelled: and EMITS NOTHING
#   R6 access may only TIGHTEN core; sensitivity uses core's L1/L2/L3 scale
#   Provenance annotated inline as [core: table.column].
#
# ONTOLOGIST'S NOTE
#   This is the vertical core fits BEST, which is unsurprising - Worktual is
#   itself a SaaS business and the schema was built from the inside out.
#   crm.product_offers already carries billing_type / billing_frequency /
#   included_qty / meter_key. crm.product_addons carries pricing_model,
#   is_overage, unit_price and step pricing, with crm.product_addon_tiers for
#   volume bands. crm.contracts carries arr, auto_renew, ends_at and
#   renew_deal_id. crm.companies carries channel_role, parent_company_id and
#   expansion_signal. inventory.products.unit_of_measure IS the pricing model
#   this vertical needs (per_seat / per_agent / per_ticket / flat). That is a
#   subscription business modelled properly.
#
#   Three things are defined but never measured or are conflated with a
#   different concept, and they are the headline gaps:
#   (1) meter_key exists on both OfferingPlan and Addon, but NO usage or
#       metering table exists anywhere in core - usage-based billing is
#       priced and never counted;
#   (2) contracts.arr is a single current value with no history, so NRR, GRR
#       and any ARR waterfall are uncomputable;
#   (3) there is no per-end-customer feature entitlement record at all -
#       campaign.organization_products looks like one but is Worktual's own
#       platform licensing, a different relationship entirely.
#   All three are in not_modelled. Nothing is synthesised for any of them.
# =============================================================================

industry: saas
pack_version: "2026.09.05"
requires_core: ">=3"          # updated core: catalog hubs + conversation join cols
layer: domain

applies_when:
  accounts.organizations.industry_type:
    [saas, software, b2b saas, software as a service, technology, tech,
     it services, cloud, platform, devtools, martech, adtech, hrtech,
     fintech saas, api, plg, enterprise software, isv]

# =============================================================================
# ROUTING PRECEDENCE — resolve applies_when collisions BEFORE segment logic
# =============================================================================
routing_precedence:
  defer_to:
    - {segment: ecommerce_platform_tooling, pack: ecommerce,
       reason: "a tool that helps merchants sell physical goods (storefront
                builders, inventory apps, POS software) is commerce
                infrastructure — inventory.products / cdp.orders carry the
                real business. Route here only if the VENDOR's own revenue is
                subscription access to the tool, not a cut of merchant GMV."}
    - {segment: vertical_clinical_saas, pack: healthcare,
       reason: "practice management / EHR software needs a clinical
                blocklist this pack does not define. Defer."}
    - {segment: vertical_property_saas, pack: real-estate,
       reason: "leasing / tenancy software is anchored on crm.contracts +
                crm.appointments the same way this pack is, but the real-
                estate pack's naming and compliance notes are correct for
                landlords/tenants; this pack's are not."}
    - {segment: vertical_education_saas, pack: education,
       reason: "LMS / course-delivery software with seats-per-cohort belongs
                to education.yaml, which understands enrollment and
                academic-term semantics this pack does not attempt."}
  resolution_rule: >-
    A tenant matches at most ONE pack. If industry_type matches both this
    pack and a deferred pack, the deferred pack wins. org<id>.yaml is the
    only override and must state a reason.
  unclaimed:
    - {segment: dev_infra_api_platforms, note: "no infra/devtools pack
       exists. Routes here on usage_based_infra_saas. Metering is the
       differentiator and this pack's metering support is partial — see
       not_modelled.usage_metering."}

# =============================================================================
# SEGMENTS — third axis, below industry and business_type. crm_fit is an
# EMPHASIS TIER, never a data gate — same principle as ecommerce.yaml. A
# freemium tenant that lands an enterprise logo must not have silently lost
# the ability to run a Opportunity.
# =============================================================================
segment_key: accounts.organizations.industry_type
segment_scale_key: accounts.organizations.company_size

crm_fit_profiles:
  high:
    emphasise: [Account, AccountContact, Opportunity, Quote, Contract, BillingSchedule,
                EngagementActivity, Meeting, SupportCase, CoachingNote]
    agent_defaults: {volunteer_relationship_context: true, surface_next_best_action: true}
    note: sales-led motion — pipeline, negotiated contracts, dedicated CS
  moderate:
    emphasise: [Customer, Contract, DailyEngagementMetric, SupportCase, Campaign]
    agent_defaults: {volunteer_relationship_context: true, surface_next_best_action: false}
    note: hybrid motion — some sales assist, but usage and lifecycle drive most outcomes
  situational:
    emphasise: [Customer, Contract, Campaign, BehaviourEvent]
    agent_defaults: {volunteer_relationship_context: false, surface_next_best_action: false}
    note: self-serve; CRM value is expansion/retention campaigns, not pipeline
  low:
    emphasise: [Contract, BehaviourEvent, Campaign]
    de_emphasise: [Opportunity, Quote, Meeting, EngagementActivity]
    agent_defaults: {volunteer_relationship_context: false, surface_next_best_action: false}
    note: near-zero human touch. De-emphasised, never disabled.

segments:
  enterprise_saas:
    crm_fit: high
    matches: [enterprise software, named-account software]
    default_variant: b2b
    anchor_entities: [Account, Customer, Opportunity, Quote, Contract, BillingSchedule, SupportCase]
    core_strengths: [crm.deals, crm.quotes, crm.contracts, crm.contract_billing_schedules,
                     crm.contact_profiles.bant_*]
    note: ARR and renewal pipeline are native — Contract.renew_deal_id, not simulated.

  mid_market_plg_hybrid_saas:
    crm_fit: high
    matches: [mid-market saas, b2b saas, workflow software, plg with sales assist]
    default_variant: b2b
    anchor_entities: [Account, Customer, Opportunity, Contract, SupportCase, DailyEngagementMetric]
    core_strengths: [crm.companies.expansion_signal]
    note: expansion_signal is real, AI-populated, not invented by this pack.

  usage_based_infra_saas:
    crm_fit: moderate
    matches: [usage-based, consumption pricing, api platform, devtools, pay-as-you-go]
    default_variant: b2b
    anchor_entities: [Account, Contract, DailyEngagementMetric, SupportCase]
    core_strengths: [crm.product_addons.meter_key, inventory.products.unit_of_measure]
    gaps: [usage_metering]
    note: the meter's PRICE is fully modelled; the meter's READING is not.

  smb_plg_self_serve_saas:
    crm_fit: moderate
    matches: [smb saas, self-serve saas, product-led growth, plg]
    default_variant: b2b
    anchor_entities: [Customer, Contract, DailyEngagementMetric, Campaign, SupportCase]
    gaps: [usage_metering, seat_licence_assignment]

  b2c_subscription_apps:
    crm_fit: moderate
    matches: [consumer subscription app, b2c saas, prosumer software]
    default_variant: b2c
    anchor_entities: [Customer, Contract, Purchase, DailyEngagementMetric, Campaign, SupportCase]
    note: dual anchor (Purchase + Contract) — the checkout moment and the ongoing subscription are two different nodes, not one.

  embedded_platform_saas:
    crm_fit: high
    matches: [embedded saas, white-label platform, reseller/oem/msp-sold platform]
    default_variant: b2b2c
    anchor_entities: [Account, Customer, Contract, Opportunity, SupportCase]
    core_strengths: [crm.companies.channel_role, crm.companies.parent_company_id]
    gaps: [partner_commercial_objects, sub_tenant_provisioning]
    note: hierarchy is expressible; commission/settlement and sub-tenant provisioning are not — same class of gap as ecommerce's b2b2c segment.

  freemium_saas:
    crm_fit: low
    matches: [freemium, free tier saas, viral saas]
    default_variant: b2b
    anchor_entities: [Contract, BehaviourEvent, Campaign]
    de_emphasise: [Opportunity, Quote, Meeting, EngagementActivity]
    note: honest recommendation is conversion campaigns off usage triggers, not pipeline — de-emphasised, never disabled.

# =============================================================================
# VARIANTS
# =============================================================================
variant_key: accounts.organizations.business_type
variants:
  b2b:
    # Primary motion. Named accounts, seats, renewals, expansion.
    anchor_entities: [Account, Customer, Opportunity, Contract, OfferingPlan, Invoice, SupportCase]
    naming_overrides:
      Account:  {primary: Account,  aliases: [customer, logo, tenant, org, workspace]}
      Customer:  {primary: Employee Customer, aliases: [champion, admin, decision maker, end user]}
      Opportunity:     {primary: Opportunity, aliases: [new business, expansion, renewal, upsell]}
      Contract: {primary: Subscription, aliases: [subscription, agreement, order form]}
    de_emphasise: [CommerceOrder, LoyaltyTier]
  b2c:
    # Self-serve / prosumer. Individual subscribes directly, no Account.
    anchor_entities: [Customer, Contract, OfferingPlan, Purchase, SupportCase]
    naming_overrides:
      Customer:  {primary: Subscriber, aliases: [user, member, account holder]}
      Contract: {primary: Plan, aliases: [subscription, membership]}
    de_emphasise: [Account, Opportunity, Quote, Proposal, SalesOrder]
  b2b2c:
    # Reseller / OEM / marketplace partner sells the product onward.
    # channel_role and parent_company_id are REAL core columns - the partner
    # hierarchy is enforceable, not aspirational.
    # [core: crm.companies.channel_role, crm.companies.parent_company_id]
    anchor_entities: [Account, Customer, Opportunity, Contract, ProductEntitlement]
    naming_overrides:
      Account: {primary: Partner, aliases: [reseller, oem, msp, distributor, marketplace partner]}
    partner_hierarchy:
      role_column: channel_role          # standard | franchise | owned_store | brand_hq
      parent_column: parent_company_id   # (Account)-[:PARENT_COMPANY]->(Account)
    de_emphasise: []

# =============================================================================
# 1. NAMING - meta-graph only
# =============================================================================
naming:
  Account:          {primary: Account, aliases: [customer, logo, org, tenant account]}
  CompanySite:      {primary: Business Unit, aliases: [division, region, subsidiary]}
  Customer:          {primary: Employee, aliases: [champion, admin, end user, seat holder, contact]}
  Lead:             {primary: Signup, aliases: [trial signup, free user, prospect, lead]}
  Customer:         {primary: Paying Customer, aliases: [subscriber, paid account]}
  Offering:          {primary: Offering, aliases: [module, app, edition, sku]}
  OfferingPlan:     {primary: Plan, aliases: [tier, package, edition, pricing plan, subscription plan]}
  Addon:            {primary: Add-on, aliases: [usage item, overage, metered item, extra seat]}
  AddonTier:        {primary: Volume Tier, aliases: [pricing band, usage tier]}
  PriceList:        {primary: Price List, aliases: [rate card, regional pricing]}
  Contract:         {primary: Subscription, aliases: [subscription, order form, agreement, term]}
  BillingSchedule:  {primary: Billing Schedule, aliases: [invoice schedule, billing plan]}
  Opportunity:             {primary: Opportunity, aliases: [new business, expansion, upsell, renewal, land, expand]}
  Quote:            {primary: Quote, aliases: [order form, pricing proposal]}
  SalesOrder:       {primary: Purchase Form, aliases: [signed order, booking]}
  Invoice:          {primary: Invoice, aliases: [bill, statement]}
  SupportCase:           {primary: Support SupportCase, aliases: [case, issue, bug report, request]}
  ClientAccount:    {primary: Support Account, aliases: [customer account]}
  Conversation:     {primary: Conversation, aliases: [chat, in-app chat, support chat]}
  KnowledgeArticle: {primary: Help Doc, aliases: [documentation, kb article, guide]}
  Campaign:         {primary: Campaign, aliases: [lifecycle campaign, nurture, product announcement]}
  AudienceSegment:          {primary: AudienceSegment, aliases: [cohort, audience, account list]}
  BehaviourEvent:    {primary: Offering Event, aliases: [feature usage, in-app event, telemetry]}
  Visit:  {primary: App Session, aliases: [login session, usage session]}
  JourneyState:     {primary: Lifecycle Stage, aliases: [funnel stage, adoption stage]}
  DailyEngagementMetric:   {primary: Account Health, aliases: [usage summary, health metrics]}
  CustomerScorecard:    {primary: Health Score, aliases: [churn score, risk score, engagement score]}
  ProductEntitlement: {primary: Platform Licence, aliases: [worktual module access, provisioned platform product]}
  Employee:             {primary: Employee, aliases: [staff, team member, csm, ae]}
  StaffRole:            {primary: Support Engineer, aliases: [support agent, advisor]}
  TicketAgent:      {primary: Support Engineer, aliases: [support rep, helpdesk agent]}
  Team:             {primary: Team, aliases: [pod, squad, department]}
  note: >-
    "workspace" appears exactly once (Account alias) — v1 also carried it on
    ClientAccount and as a customer_profile.workspace_id custom field. Kept
    the Account alias only; workspace_id remains a plain identity key, not a
    naming term, to avoid three overlapping resolutions of the same word.

role_naming:
  match_on: [AccessRole.name, AccessRole.product_id]           # [core: accounts.setup_roles]
  aliases:
    sales_rep:     [Account Executive, AE, sales rep]
    sales_manager: [Sales Manager, VP Sales]
    agent:         [Support Engineer, tier 1]
    resolver:      [Escalation Engineer, tier 2]
    marketing:     [Growth / Marketing]
    finance:       [Billing / RevOps]
    admin:         [Administrator]
    viewer:        [Read-only]
  unmapped_note: >-
    "Customer Success Manager" and "Solutions Engineer" are the two roles a
    SaaS org will ask for that accounts.setup_roles has no value for today.
    Vocabulary only - nothing is emitted.

# =============================================================================
# 2. EXTRA LABELS - every condition verified against core properties
# =============================================================================
extends:

  # --- product catalogue -----------------------------------------------------
  inventory.products:
    extra_labels:
      - {label: SoftwareProduct}
      - {label: SubscriptionProduct, when: {billing_type: [recurring]}}      # [core: billing_type]
      - {label: PerpetualProduct,    when: {billing_type: [one_time]}}
      - {label: SeatBasedProduct,    when: {unit_of_measure: [per_seat]}}    # [core: unit_of_measure]
      - {label: AgentBasedProduct,   when: {unit_of_measure: [per_agent]}}
      - {label: UsageBasedProduct,   when: {unit_of_measure: [per_ticket]}}
      - {label: FlatRateProduct,     when: {unit_of_measure: [flat]}}
      - {label: GenerallyAvailable,  when: {status: [active]}}               # [core: status]
      - {label: SunsetProduct,       when: {status: [archived]}}
      - {label: ConfigurableProduct, when: {product_type: [customizable]}}   # [core: product_type]
    promote_property_to_node:
      category:    {label: ProductLine,   key: slug, name_from: category,    edge: IN_PRODUCT_LINE}
      subcategory: {label: ProductModule, key: slug, name_from: subcategory, edge: IN_MODULE}
    derive_hierarchy:
      - {from: ProductModule, to: ProductLine, edge: PARENT_PRODUCT_LINE}
    note: >-
      unit_of_measure is the pricing model in this vertical and core already
      carries the exact enum a SaaS business needs. Cleanest single mapping
      in the pack.

  crm.product_offers:
    extra_labels:
      - {label: Plan}
      - {label: RecurringPlan,  when: {billing_type: [recurring]}}           # [core: billing_type]
      - {label: MonthlyPlan,    when: {billing_frequency: [monthly]}}        # [core: billing_frequency]
      - {label: AnnualPlan,     when: {billing_frequency: [annual]}}
      - {label: MeteredPlan,    when: {meter_key: not_null}}                 # [core: meter_key]
      - {label: ActivePlan,     when: {status: [active]}}                    # [core: status]
    note: >-
      included_qty is the seat or unit allowance on the plan. meter_key names
      the meter that overage is billed against - the meter itself does not
      exist in core (see not_modelled.usage_metering).

  crm.product_addons:
    extra_labels:
      - {label: AddOn}
      - {label: OverageItem,   when: {is_overage: [true]}}                   # [core: is_overage]
      - {label: MeteredAddOn,  when: {meter_key: not_null}}                  # [core: meter_key]
      - {label: TieredAddOn,   when: {pricing_model: [tiered, volume, graduated]}}  # [core: pricing_model]
      - {label: FlatAddOn,     when: {pricing_model: [flat]}}

  crm.product_addon_tiers:
    extra_labels: [{label: VolumeTier}]

  # --- subscription lifecycle -----------------------------------------------
  crm.contracts:
    extra_labels:
      - {label: Subscription}
      - {label: ActiveSubscription,    when: {status: [active]}}             # [core: status]
      - {label: ChurnedSubscription,   when: {status: [cancelled, canceled, churned, expired]}}
      - {label: AutoRenewing,          when: {auto_renew: [true]}}           # [core: auto_renew]
      - {label: ManualRenewal,         when: {auto_renew: [false]}}
      - {label: AnnualSubscription,    when: {billing_frequency: [annual]}}  # [core: billing_frequency]
      - {label: MonthlySubscription,   when: {billing_frequency: [monthly]}}
    note: >-
      ends_at drives the renewal book - the single most asked SaaS question
      ("what is up for renewal this quarter"). renew_deal_id already links the
      renewal opportunity, and cancelled_at gives the churn date. arr is a
      CURRENT snapshot only, which is why NRR is in not_modelled.

  crm.contract_billing_schedules:
    extra_labels:
      - {label: BillingPlan}
      - {label: ActiveSchedule, when: {status: [active]}}                    # [core: status]

  crm.deals:
    extra_labels:
      - {label: Opportunity}
      - {label: ClosedWonDeal,  when: {stage: [closed_won]}}                 # [core: stage]
      - {label: ClosedLostDeal, when: {stage: [closed_lost]}}
      - {label: OpenPipeline,   when: {stage: [qualification, discover, propose, negotiate]}}
      - {label: CommitDeal,     when: {forecast_category: [commit]}}         # [core: forecast_category]
      - {label: BestCaseDeal,   when: {forecast_category: [best_case, upside]}}
      - {label: FlaggedForecast,when: {forecast_flagged: [true]}}            # [core: forecast_flagged]
    note: >-
      Land / expand / renew is a property of the deal in a SaaS business but
      core has no deal_type column. Renewals ARE identifiable via
      Contract.renew_deal_id (a direct FK); expansion is only identifiable via
      Account.expansion_signal (a separate table, no direct link back to a
      specific Opportunity). New-business vs upsell is not distinguishable without a
      batch semi-join against crm.contracts.renew_deal_id — see
      not_modelled.deal_type.

  crm.companies:
    extra_labels:
      - {label: Account}
      - {label: ExpansionCandidate, when: {expansion_signal: not_null}}      # [core: expansion_signal]
      - {label: PartnerAccount,     when: {channel_role: [franchise, brand_hq, owned_store]}}  # [core: channel_role]
      - {label: SubsidiaryAccount,  when: {parent_company_id: not_null}}     # [core: parent_company_id]
    promote_property_to_node:
      industry: {label: AccountIndustry, key: slug, name_from: industry, edge: IN_INDUSTRY}
    note: >-
      expansion_signal / expansion_reason / expansion_draft are already in core
      and are the closest thing to a PLG expansion trigger the platform has.

  crm.invoices:
    extra_labels:
      - {label: SubscriptionInvoice}
      - {label: OverdueInvoice, when: {status: [overdue]}}                   # [core: status]
      - {label: PaidInvoice,    when: {status: [paid]}}
      - {label: EscalatedCollection, when: {escalation_severity: [high, critical]}}  # [core: escalation_severity]

  # --- product usage (telemetry) --------------------------------------------
  cdp.customer_events:
    extra_labels:
      - {label: ProductEvent}
      - {label: ActivationEvent, when: {event_name: [signup_completed, first_login,
                                                     workspace_created, invite_sent,
                                                     integration_connected, onboarding_completed]}}  # [core: event_name]
      - {label: FeatureUsageEvent, when: {event_name: [feature_used, report_run,
                                                       api_call, export_created,
                                                       automation_triggered]}}
      - {label: ExpansionSignalEvent, when: {event_name: [seat_limit_reached,
                                                          usage_limit_reached,
                                                          upgrade_viewed, pricing_viewed]}}
      - {label: RiskSignalEvent, when: {event_name: [seat_removed, integration_disconnected,
                                                     export_all_data, cancel_viewed,
                                                     downgrade_requested]}}
    note: >-
      event_name is a free-text core column; these are the canonical values a
      SaaS tenant should emit (see vocabularies). Nothing is emitted for a
      tenant that does not use them.

  cdp.customer_sessions:
    extra_labels:
      - {label: AppSession}
      - {label: ShortSession, when: {is_bounce: [true]}}                     # [core: is_bounce]

  cdp.customer_profile:
    extra_labels: [{label: ProductUser}]
    custom_fields:                       # allowed: core sets custom_dynamic: true
      whitelist: [workspace_id, external_user_id, seat_role, plan_code,
                  signup_source, trial_ends_at, onboarding_stage, last_active_at]
      identity: [external_user_id, workspace_id]   # -> ContactPoint key_type
      promote_to_node:
        plan_code: {label: Plan, key: code, edge: ON_PLAN}
        seat_role: {label: SeatRole, key: name, edge: HAS_SEAT_ROLE}
      conditional_labels:
        - {label: TrialUser, when: {trial_ends_at: not_null}}
      blocklist:
        # UNIONED, not swapped: universal PII/PCI (same set every other pack
        # in this ontology carries) PLUS the credentials that are specific to
        # a product-usage/identity graph and don't appear elsewhere.
        [card_number, cvv, bank_account, income, credit_score, religion, caste,
         ethnicity, health, pregnancy_status,
         password, api_key, api_token, secret, access_token, refresh_token,
         ssn, tax_id, ip_address_history, session_token]
      blocklist_action: drop_silently_and_log

  crm.contact_profiles:
    extra_labels:
      - {label: AccountContact}
      - {label: MarketingSuppressed, when: {marketing_opt_out: [true]}}      # [core: marketing_opt_out]
      - {label: QualifiedLead,       when: {lead_status: [qualified, mql, sql]}}  # [core: lead_status]

  # --- support ---------------------------------------------------------------
  ticketing.tickets:
    extra_labels:
      - {label: SupportTicket}
      - {label: BugReport,     when: {category: [bug, defect, incident, outage]}}   # [core: category]
      - {label: HowToRequest,  when: {category: [how_to, question, documentation]}}
      - {label: BillingRequest,when: {category: [billing, invoice, subscription, payment]}}
      - {label: FeatureRequest,when: {category: [feature_request, enhancement]}}
      - {label: AccessRequest, when: {category: [access, permissions, sso, provisioning]}}
      - {label: EscalatedTicket, when: {priority: [urgent]}}                 # [core: priority]

  ticketing.ticketing_accounts:
    extra_labels: [{label: SupportAccount}]
    note: >-
      B2B SaaS support is account-scoped, and core already provides
      (SupportCase)-[:REPORTED_VIA]->(SupportProfile)-[:OF_ACCOUNT]->(ClientAccount).
      That path works today - no pack extension needed for it. It gives WHICH
      ACCOUNT a ticket belongs to; it does not give WHICH SUBSCRIPTION — see
      not_modelled, rank 1.

  ccass.conversations:
    extra_labels: [{label: ProductConversation}]

# =============================================================================
# 3. VOCABULARIES
# =============================================================================
vocabularies:
  product.unit_of_measure:                                       # [core: inventory.products.unit_of_measure]
    labels: {per_seat: "Per seat / per user", per_agent: "Per agent",
             per_ticket: "Per ticket (usage)", flat: "Flat platform fee"}

  customer_event.event_name:                                     # [core: cdp.customer_events.event_name]
    canonical: [signup_completed, first_login, workspace_created, invite_sent,
                integration_connected, onboarding_completed, feature_used,
                report_run, api_call, export_created, automation_triggered,
                seat_limit_reached, usage_limit_reached, upgrade_viewed,
                pricing_viewed, seat_removed, integration_disconnected,
                cancel_viewed, downgrade_requested, trial_started, trial_expired,
                subscription_started, subscription_cancelled]
    aliases: {activation: onboarding_completed, aha_moment: feature_used}

  ticket.category:                                               # [core: ticketing.tickets.category]
    canonical: [bug, defect, incident, outage, how_to, question, documentation,
                billing, invoice, subscription, payment, feature_request,
                enhancement, access, permissions, sso, provisioning,
                integration, performance, data_export, other]

  ticket.skill:                                                  # [core: ticketing.tickets.skill]
    canonical: [tier1, tier2, billing_ops, integrations, security, data]

  conversation.intent:                                           # [core: queue_routing_profiles.supported_intents]
    canonical: [how_do_i, bug_report, billing_question, upgrade_plan,
                add_seats, cancel_subscription, sso_setup, api_help,
                integration_issue, data_export, security_question]

  deal.stage:                                                    # [core: crm.deals.stage]
    labels: {qualification: "Discovery / qualification",
             discover: "Technical evaluation / POC",
             propose: "Proposal & order form",
             negotiate: "Procurement, security review & redlines",
             closed_won: "Closed won", closed_lost: "Closed lost"}

  deal.forecast_category:                                        # [core: crm.deals.forecast_category]
    canonical: [pipeline, best_case, upside, commit, closed]

  journey_state.current_stage:                                   # [core: journey_states.current_stage]
    canonical: [visitor, signup, trial, activated, paying, expanded,
                at_risk, churned, winback]

  journey_state.journey_name:
    canonical: [plg_funnel, onboarding, adoption, renewal, expansion, winback]

  campaign.goal:                                                 # [core: campaign.campaigns.goal]
    canonical: [trial_activation, onboarding_nurture, feature_adoption,
                upgrade_prompt, seat_expansion, renewal_reminder,
                winback, product_announcement, webinar, usage_milestone,
