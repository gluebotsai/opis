                review_site, community]

  contract.billing_frequency:                                    # [core: crm.contracts.billing_frequency]
    labels: {monthly: "Monthly subscription", quarterly: "Quarterly",
             annual: "Annual contract"}

# =============================================================================
# 4. DERIVED LABELS - batch lane, recompute-only
# =============================================================================
derived_labels:
  lane: batch
  Customer:
    source: cdp.gold_customer_metrics                            # [core: DailyEngagementMetric]
    rules:
      - {label: ActiveUser,    when: "last_event_at >= now() - 30d"}         # [core: last_event_at]
      - {label: DormantUser,   when: "last_event_at < now() - 60d"}
      - {label: PowerUser,     when: "total_events >= p90(total_events)"}    # [core: total_events]
      - {label: AtRiskUser,    when: "churn_score >= 0.7"}                   # [core: churn_score]
    exclusive_groups: [[ActiveUser, DormantUser]]
    note: >-
      These are ACCOUNT-ENGAGEMENT labels derived from product telemetry. They
      are not a commercial health score and must never be presented as one -
      account-level health needs the usage ledger that does not exist.
  Opportunity:
    source: crm.deals + crm.contracts    # requires a semi-join, not a row-level filter
    rules:
      - {label: RenewalDeal, when: "Opportunity.id appears as crm.contracts.renew_deal_id for any Contract"}
    note: >-
      Not a single-table predicate — needs a batch job that joins against
      crm.contracts, same constraint as ecommerce.yaml's engine op E8.
      ExpansionDeal is intentionally NOT derived here: Account.expansion_
      signal marks the ACCOUNT as expansion-ready, but nothing links that
      signal to a specific Opportunity row, so an ExpansionDeal label would be a
      guess dressed as a derivation. Leave it to the agent to join
      ExpansionCandidate (Account) and OpenPipeline (Opportunity) at query time
      instead of pretending the label is certain.

# =============================================================================
# 5. METRICS
# =============================================================================
metrics:
  extend_synonyms:
    active_arr:                [arr, annual recurring revenue, run rate, book of business]
    contracts_due_for_renewal: [renewals due, up for renewal, renewal book, expiring subscriptions]
    contract_renewal_rate:     [renewal rate, retention rate, gross retention]
    win_rate:                  [close rate, conversion rate]
    days_sales_outstanding:    [dso, collection days]
  add:
    - metric_id: renewal_book_next_90d
      canonical_name: Renewal Book (next 90 days)
      synonyms: [what is up for renewal, expiring contracts, renewals this quarter]
      unit: currency
      route: graph
      computed_from: [Contract]
      direction: neutral
      note: sums Contract.arr where ends_at falls in the window
    - metric_id: logo_churn_count
      canonical_name: Logo Churn
      synonyms: [customers lost, churned accounts, cancellations, logos lost]
      unit: count
      route: graph
      computed_from: [Contract, Account]
      direction: lower_is_better
      note: counts Contract.cancelled_at in the period
    - metric_id: expansion_candidate_count
      canonical_name: Expansion Candidates
      synonyms: [upsell opportunities, accounts ready to expand, expansion signals]
      unit: count
      route: graph
      computed_from: [Account]
      direction: higher_is_better
      note: Account.expansion_signal is set by the existing expansion agent
    - metric_id: trial_conversion_rate
      canonical_name: Trial-to-Paid Rate
      synonyms: [trial conversion, signup to paid, free to paid]
      unit: ratio
      route: graph
      computed_from: [Customer, Contract]
      direction: higher_is_better
      caveat: >-
        proxy - core has no Trial object; derived from JourneyState transitions
        and trial_ends_at in custom_fields, so it only works for tenants that
        populate that key.
    - metric_id: support_tickets_per_account
      canonical_name: Tickets per Account
      synonyms: [support load per customer, ticket density]
      unit: ratio
      route: graph
      computed_from: [SupportCase, ClientAccount]
      direction: lower_is_better
  cannot_compute:
    - {metric: net_revenue_retention, reason: "contracts.arr is a current snapshot with no history; NRR needs beginning-of-period ARR per cohort"}
    - {metric: gross_revenue_retention, reason: "same - no ARR history table"}
    - {metric: arr_waterfall, reason: "new / expansion / contraction / churn split needs ARR movement records; core stores only the latest value"}
    - {metric: seat_utilisation, reason: "OfferingPlan.included_qty gives entitlement; there is no record of seats actually consumed"}
    - {metric: usage_vs_entitlement, reason: "meter_key names a meter with no readings - see not_modelled.usage_metering"}
    - {metric: feature_adoption_rate, reason: "no per-end-customer entitlement record exists at all - see not_modelled.feature_entitlement; do not substitute campaign.organization_products, which is Worktual's own licensing to the tenant, not the tenant's to its customers"}
    # Note: These are the metrics a SaaS exec asks for first. Listed so the agent can
    # explain why it cannot answer rather than proxying with a wrong number.

# =============================================================================
# 6. ACCESS - tighten only; sensitivity uses core's L1/L2/L3 scale
# =============================================================================
access:
  ProductLine:     {domain: common,   module: core,      sensitivity: L1}
  ProductModule:   {domain: common,   module: core,      sensitivity: L1}
  AccountIndustry: {domain: crm,      module: sales,     sensitivity: L1}
  Plan:            {domain: crm,      module: sales,     sensitivity: L1}
  SeatRole:        {domain: common,   module: analytics, sensitivity: L1}
  tighten:
    EngagementActivity: {sensitivity: L3, deny_properties: [transcript_text, body]}
    TranscriptSegment: {sensitivity: L3, deny_properties: [text]}
    Invoice:         {sensitivity: L3, deny_properties: [tax_id, billing_address]}
  never_grant: [SoftwareProduct, Subscription, ProductUser, SupportTicket]
  never_grant_enforcement: query_layer_only
  never_grant_note: >-
    ENFORCEABLE in the Cypher guard, which parses every label in a query and
    denies any outside the session allowlist. NOT enforceable at Neo4j FGAC:
    a node carrying both :Contract and :Subscription is visible to anyone
    granted :Contract, because FGAC grants are per-label and a node has many.
    Treat this list as a query-layer convention. Grant concrete core labels,
    never these.

compliance:
  regimes: [SOC2, GDPR, DPDP, ISO27001]
  notes:
    - Credentials and tokens are blocklisted at ingest, not masked downstream.
    - Contract and pricing terms are commercially sensitive; §6 restricts
      invoice identifiers by default.

governance:
  data_owner: RevOps
  data_steward: Platform Engineering
  retention:
    Contract: contractual + 7 years
    Invoice: 7 years (statutory)
    BehaviourEvent: 24 months rolling
    SupportCase: 3 years
  pii_flag: [Customer, ContactPoint, ContactProfile, EngagementActivity]

# =============================================================================
# 7. NOT MODELLED - emits nothing
# =============================================================================
not_modelled:
  blocked_on_core:
    - {concept: Consent, blocker: "cdp.customer_profile.consent_json not in core `properties:`. Gates every lifecycle campaign send."}
    - {concept: Preference, blocker: "cdp.customer_profile.preferences_json / traits_json not in core `properties:`."}
    - {concept: Business unit / Office, blocker: "accounts.organization_locations mapping is still commented out in core."}
  no_source:
    - concept: "SupportCase -> Subscription link (SupportCase -> Contract, Conversation -> Contract)"
      severity: critical
      rank: 1
      note: >-
        Re-filed from blocked_on_core in v2 — same correction ecommerce v4
        made to SupportCase -> Purchase. ticketing.tickets and ccass.conversations
        have NO contract reference at all, so this is no_source, not a
        one-line core fix. Ranked first: "what plan is this account on,"
        "is this billing issue tied to an active or past-due subscription"
        is the bulk of SaaS support CX. SupportProfile -> ClientAccount
        gives the ACCOUNT; it does not give the SUBSCRIPTION.
        Fix: add contract_ref to ticketing.tickets AND ccass.conversations.
    - concept: Usage metering ledger
      severity: critical
      rank: 2
      note: >-
        meter_key exists on BOTH crm.product_offers and crm.product_addons, and
        crm.product_addon_tiers prices volume bands - but no table anywhere in
        core records a meter reading. Usage-based billing is fully priced and
        never counted.
    - concept: ARR history / revenue movement
      severity: critical
      rank: 3
      note: >-
        crm.contracts.arr is one current number. Without a period-over-period
        ARR record there is no NRR, no GRR, no expansion/contraction split.
    - concept: Feature / entitlement flag per end customer
      severity: critical
      rank: 4
      note: >-
        No table anywhere records which FEATURES a specific tenant's specific
        end customer is entitled to. campaign.organization_products was
        mapped to this in v1 and has been removed — it grants WORKTUAL's own
        platform modules to the tenant org, a completely different
        relationship (Worktual -> tenant, not tenant -> tenant's customer).
        Do not re-introduce that mapping without re-reading this note.
    - concept: Trial
      severity: high
      note: >-
        No trial object, no trial start/end, no conversion event. Only a
        custom_fields key. For a PLG business this is a first-class entity.
    - concept: Seat / Licence assignment
      severity: high
      note: >-
        included_qty is the allowance. Which named users hold a seat, and how
        many are active, has no source. "Are they using what they pay for" is
        the most common CSM question and it is unanswerable.
    - concept: Opportunity type (new / expansion / renewal)
      severity: medium
      note: >-
        Renewals are inferable from Contract.renew_deal_id (a real FK,
        recovered via derived_labels.Opportunity.RenewalDeal above). Expansion is
        only inferable at the ACCOUNT level via Account.expansion_signal,
        with no link back to a specific Opportunity — so ExpansionDeal is
        deliberately NOT derived (see derived_labels.Opportunity note). New-business
        vs upsell cannot be separated at the Opportunity level. One deal_type column
        would fix all three at once.
    - concept: Account health score
      severity: medium
      note: >-
        CustomerScorecard.churn_score is per CONTACT, not per ACCOUNT. A SaaS
        health score is account-level and needs usage + support + billing
        rolled up to Account. No such rollup exists.
    - concept: Plan -> SLA linkage
      severity: medium
      note: "no link from a Contract or OfferingPlan to which SLA tier (ticketing.sla_policies / ccass.sla_policies) that plan is entitled to."
    - concept: Offering roadmap / release
      severity: low
      note: feature requests land as tickets; there is no release or roadmap object.
    - concept: Partner commission / MDF / deal registration
      severity: medium
      note: >-
        b2b2c partner hierarchy is expressible via channel_role and
        parent_company_id, but the commercial partner objects the BA B2B2C
        workbook lists (deal registration, MDF, commission, settlement) have
        no source. Same class of gap as ecommerce's b2b2c segment.
    - concept: Sub-tenant / customer-of-customer provisioning
      severity: medium
      note: "Tenant is Worktual's own multi-tenancy boundary, not reusable for a b2b2c partner's own end customers."
    - concept: NPS / product survey
      severity: low
      note: SupportCase.csat_score is the only satisfaction signal and it is support-only.

