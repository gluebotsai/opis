# 8. ASSUMES
#   CORE PATCHES still outstanding (all tenants):
#     C1 cdp.order_items -> carry quantity + unit_price
#     C2 supertypes: Purchase (Purchase, SalesOrder), Case (SupportCase, Conversation),
#        Person/Staff over Employee + StaffRole + TicketAgent. Never granted in RBAC.
#     C4 conditional-label removal on update (an ActiveSubscription that
#        becomes ChurnedSubscription must lose the first label). §2 depends on it.
#     C5 node counts under the catalog hubs. Core routes tenant-scoped
#        nodes through SetupCatalog / ContactCenterCatalog / DataPlatformCatalog /
#        CampaignCatalog / TicketCatalog / WebTrackingCatalog instead of Tenant.
#        Any tenant-scoped node a pack adds must attach to the right catalog,
#        never directly to Tenant, or the supernode fan-out returns.
#     (C3 - ccass.conversations missing join columns - RESOLVED: queue_id,
#      assigned_agent_id and assigned_user_id are in `properties:`.)
#   SAAS-SPECIFIC PATCHES (numbered independently, new in v2):
#     S1 ticketing.tickets + ccass.conversations -> contract_ref
#     S2 usage_records table (contract_id or addon_id, meter_key, quantity, recorded_at)
#     S3 arr_snapshots (contract_id, period, arr) for retention/cohort metrics
#     S4 feature_entitlements table (contract_id or company_id, feature_key,
#        enabled) — a NEW table, do not reuse campaign.organization_products
#     S5 seat/license table (contract_id, contact_id, seat_status, assigned_at)
#     S6 deal_type column on crm.deals (new_business | expansion | renewal)
#
#   ENGINE OPS: E1 extra_labels with when: (IN / is_null / not_null), removable ·
#     E2 promote_property_to_node + derive_hierarchy · E3 custom_fields
#     whitelist / identity / promote_to_node / conditional_labels / blocklist ·
#     E5 naming + vocabularies -> meta-graph only · E6 derived_labels batch lane ·
#     E7 variants incl. partner_hierarchy ·
#     E8 derived_labels evaluator must support a semi-join against a second
#        table (see derived_labels.Opportunity.RenewalDeal) — not just single-table
#        row filters.
#
#   VALIDATOR: R1-R6 · one access domain per label · pairwise connectivity per
#     domain union common · not_modelled emits nothing · blocklist enforced ·
#     no tenant-scoped node attached directly to Tenant (C5) · scope check on
#     any table reused across packs, not just column-existence (the
#     campaign.organization_products bug) — the validator must confirm the
#     TABLE's relationship (who-to-whom), not only that the columns exist.
