    properties: [id, organization_id, skill_version_id, role, surface, channel,
                 priority, effective_from, effective_to, enabled, created_at]
    relationships:
      - {type: deployed_as, from: BotSkillVersion, from_key: id, from_column: skill_version_id}

  ccass.nlp_skill_tools:
    product: ccaas
    label: BotTool
    key: id
    access: {domain: ccaas, module: automation, sensitivity: L1}
    edge_budget: 1
    properties: [id, organization_id, skill_version_id, tool_key, permission_class,
