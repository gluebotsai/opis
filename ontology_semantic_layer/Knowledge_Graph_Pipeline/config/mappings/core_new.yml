
version: 3
layer: core
generated: 2026-09-04

products:
  platform:    {code: platform,       sellable: false}
  crm:         {code: crm,            sellable: true}
  cdp:         {code: cdp,            sellable: true}
  webtracking: {code: web-tracking,   sellable: true, requires: [cdp]}
  campaign:    {code: campaign,       sellable: true}
  ccaas:       {code: contact-center, sellable: true}
  ticketing:   {code: ticketing,      sellable: true}

entitlement_sources:
  tenant_products:
    table: accounts.active_products
    code_column: product_id
    status_column: status
    active_values: [active]
  role_products:
    table: accounts.setup_roles
    code_column: product_id
    list_column: accessible_products
  user_roles:
    table: accounts.setup_user_product_access
  verify: "product_id uses standard slugs (crm | contact-center | web-tracking | cdp | ticketing | campaign). Reconciled to the `code` values in `products:` above."

projection:
  signature: "hash(entitled_products, industry_pack, business_type, role_access_domains)"
  visible_label: "product == platform OR product IN entitled OR readable_by INTERSECTS entitled"
  visible_to_role: "access.domain IN role_access_domains AND access.sensitivity <= role_max_sensitivity"
  visible_edge: "both endpoint labels visible"
  hub_created: "hub.product == platform OR hub.product IN entitled"
  collection_created: "collection.product == platform OR collection.product IN entitled"
  cache_key_must_include: [tenant, entitled_products, role_access_domains]
  serving: "in-memory per signature; Meilisearch for concept lookup; never read the schema from Neo4j"

bundles:
  crm_only:        [crm]
  cdp_only:        [cdp]
  ticketing_only:  [ticketing]
  ccaas_only:      [ccaas]
  service_desk:    [ccaas, ticketing]
  marketing_stack: [cdp, campaign, webtracking]
  revenue_stack:   [crm, cdp]
  crm_service:     [crm, ticketing]
  suite:           [crm, cdp, webtracking, campaign, ccaas, ticketing]

upper_ontology:

  Party:            # any legal or natural person the tenant deals with
    members: [Tenant, Contact, Account, AccountSite, ContactAccount, Visitor,
              SalesProfile]

  Actor:            # anything that can act and be held accountable
    members: [User, Agent, BotSkillVersion, PredictiveModel]

  Identity:         # a way to recognise or reach a Party
    members: [ContactIdentity, PushSubscription, SenderAddress, SuppressedAddress,
              InboundEmail]

  Interaction:      # a bounded two-way exchange with a Party
    members: [Conversation, Ticket, Meeting, EngagementActivity, Touchpoint,
              InteractionSummary, BotSession, DealActivity, ParticipantRecord]

  Event:            # something observed at a point in time, one-way
    members: [Event, JourneyStep, ActivationSignal, ProactiveEvent,
              AnomalySignal, AuditLog, ChatWorkflowEvent, OutcomeRecord,
              Notification, Message, OutboundEmail]

  Session:          # a bounded window of continuous presence
    members: [Visit, ChatSession, LiveMeetingSession, ChatSession, CampaignDraft]

  WorkItem:         # assigned to an Actor, has a lifecycle
    members: [Task, Ticket, Deal, WorkAssignment, ApprovalRequest,
              PrivacyRequest, AgentJob, Suggestion, Approval,
              WorkTransfer, DistributionAttempt, MissedEngagement]

  Offering:         # anything the tenant sells or provisions
    members: [Offering, OfferingPlan, OfferingAddOn, PlatformModule, ModuleEntitlement,
              PricingTier, PriceList, PriceListEntry]

  Agreement:        # a binding commitment between parties
    members: [Contract, BillingSchedule, ModuleEntitlement]

  FinancialDocument:
    members: [Proposal, Quote, SalesOrder, Invoice, Purchase, LineItem]

  Policy:           # a rule the platform enforces at runtime
    members: [SLA, DistributionPolicy, AutomationPolicy,
              AssignmentPolicy, AutomationRule, EngagementRule, AnomalyDetector,
              SendingLimit, AccessRole, RoutingWeightModel]

  Configuration:    # tenant setup, slow-changing, human-authored
    members: [ChannelAccount, QueueDefinition, OperatingSchedule, ScheduleShift,
              HolidaySchedule, NonWorkingDay, VoiceNumber, VoicePromptProfile,
              SupportPortalSettings, SendingReadiness, ChannelSendingConfig,
              SenderComplianceProfile, SendingDomain, BounceDomain,
              IntentRoutingProfile, VerticalProfile, ExtractedBusinessProfile,
              IndustryPack, Website,
              OutcomeCode, TicketStatusConfig, PresenceReason, Skill, DataSource,
              Queue, Queue, BotSkill, BotSkillBinding, BotTool,
              RepCapacityProfile]

  Insight:          # a derived judgement about a Party or the business
    members: [ContactInsight, NextBestAction, ContactScorecard,
              ContactValueSummary, LeadBrief, EnrichmentSnapshot, MeetingOutcome,
              CoachingNote, PersonaEvidence, CampaignIdea, ProactiveDecision,
              JourneyPosition]

  Memory:           # durable context an AI agent may reuse
    members: [ExperienceMemory, KnownFact, ConversationDigest, AgentMemorySlot]

  Metric:           # a measured quantity, always time-scoped
    members: [DailyEngagementMetric, PerformanceMetric, SupportSnapshot,
              ChannelCapacity, AdaptiveThreshold, AgentAvailability,
              ServiceLevelClock, OutreachEngagement]

  Content:          # authored material that gets shown or sent
    members: [MessageTemplate, TemplateRevision, ApprovedTemplate, DocumentTemplate,
              Macro, KnowledgeArticle, KnowledgeDocument, MediaAttachment,
              InternalNote, Note, TranscriptSegment]

  Grouping:         # a named set of Parties or Actors
    members: [Segment, Persona, Team, BusinessUnit]

  Program:          # a planned, bounded outreach effort
    members: [Campaign, CampaignChannelPlan, SendBatch]

  Collection:       # fan-out container. Never queried for its own sake.
    members: [BehaviourLog, VisitLog, TouchpointLog, ConversationLog, JourneyLog,
              MetricSeries, KnowledgeStore, InsightSet, RecommendationSet,
              EngagementTimeline, OutreachLog, ProactiveEventLog, RoutingHistory,
              WorkloadInbox, CaseAuditLog, DraftAudienceSet, ContentBatch, LogPeriod]

  Hub:              # per-tenant domain root. Bounded fan-out by construction.
    members: [ConfigurationHub, ServiceOperationsHub, CustomerIntelligenceHub,
              MarketingHub, SupportHub, DigitalPresenceHub, OfferingCatalog,
              PerformanceMetricSet, AnomalySignalSet]

properties_not_nodes:
  - {was: Channel,            now: "channel property on every fact; Channel node kept ONLY at Tenant + ChannelAccount level"}
  - {was: GlobalTicketStatus, now: "status property; TicketStatusConfig config node carries status semantics, unlinked per row"}
  - {was: Disposition,        now: "outcome_code property on OutcomeRecord; OutcomeCode config node unlinked per row"}
  - {was: PresenceReasonCode, now: "reason_code property on AgentAvailability"}
  - {was: SourceSystem,       now: "source_name property on Event; DataSource node kept at hub level only"}
  - {was: ProactiveHistory,   now: "ProactiveEventLog collection, owned by Ticket only — never by Conversation"}

hubs:
  ConfigurationHub:        {key: organization_id, owner_edge: HAS_CONFIGURATION}
  ServiceOperationsHub:    {key: organization_id, owner_edge: HAS_SERVICE_OPERATIONS}
  CustomerIntelligenceHub: {key: organization_id, owner_edge: HAS_CUSTOMER_INTELLIGENCE}
  MarketingHub:            {key: organization_id, owner_edge: HAS_MARKETING}
  SupportHub:              {key: organization_id, owner_edge: HAS_SUPPORT}
  DigitalPresenceHub:      {key: organization_id, owner_edge: HAS_DIGITAL_PRESENCE}
  OfferingCatalog:         {key: organization_id, owner_edge: HAS_OFFERING_CATALOG}
  PerformanceMetricSet:    {key: organization_id, parent: CustomerIntelligenceHub, parent_edge: HAS_PERFORMANCE_METRICS}
  AnomalySignalSet:        {key: organization_id, parent: CustomerIntelligenceHub, parent_edge: HAS_ANOMALY_SIGNALS}

collections:
  # --- owned by Contact -----------------------------------------------------
  BehaviourLog:
    owner: {label: Contact, key: cdp_id}
    owner_edge: HAS_BEHAVIOUR_LOG
    bucket: {granularity: month, label: LogPeriod, edge: HAS_PERIOD}
  VisitLog:
    owner: {label: Contact, key: cdp_id}
    owner_edge: HAS_VISIT_LOG
    bucket: {granularity: month, label: LogPeriod, edge: HAS_PERIOD}
  TouchpointLog:
    owner: {label: Contact, key: cdp_id}
    owner_edge: HAS_TOUCHPOINT_LOG
    bucket: {granularity: month, label: LogPeriod, edge: HAS_PERIOD}
  ConversationLog:
    owner: {label: Contact, key: cdp_id}
    owner_edge: HAS_CONVERSATION_LOG
    bucket: {granularity: month, label: LogPeriod, edge: HAS_PERIOD}
  JourneyLog:
    owner: {label: Contact, key: cdp_id}
    owner_edge: HAS_JOURNEY_LOG
    bucket: {granularity: month, label: LogPeriod, edge: HAS_PERIOD}
  MetricSeries:
    owner: {label: Contact, key: cdp_id}
    owner_edge: HAS_METRIC_SERIES
    bucket: {granularity: month, label: LogPeriod, edge: HAS_PERIOD}
  EngagementTimeline:
    owner: {label: Contact, key: cdp_id}
    owner_edge: HAS_ENGAGEMENT_TIMELINE
    bucket: {granularity: month, label: LogPeriod, edge: HAS_PERIOD}
  OutreachLog:
    owner: {label: Contact, key: cdp_id}
    owner_edge: HAS_OUTREACH_LOG
    bucket: {granularity: month, label: LogPeriod, edge: HAS_PERIOD}
  KnowledgeStore:                       # bounded — hundreds, not bucketed
    owner: {label: Contact, key: cdp_id}
    owner_edge: HAS_KNOWLEDGE_STORE
  InsightSet:
    owner: {label: Contact, key: cdp_id}
    owner_edge: HAS_INSIGHT_SET
  RecommendationSet:
    owner: {label: Contact, key: cdp_id}
    owner_edge: HAS_RECOMMENDATION_SET

  # --- owned by operational entities ----------------------------------------
  RoutingHistory:                       # was: direct edges onto Queue
    owner: {label: Queue, key: id}
    owner_edge: HAS_ROUTING_HISTORY
    bucket: {granularity: month, label: LogPeriod, edge: HAS_PERIOD}
  WorkloadInbox:                        # was: direct edges onto User
    owner: {label: User, key: id}
    owner_edge: HAS_WORKLOAD
    bucket: {granularity: month, label: LogPeriod, edge: HAS_PERIOD}
  CaseAuditLog:
    owner: {label: Ticket, key: id}
    owner_edge: has_audit_log
  ProactiveEventLog:                     # ticket-scoped ONLY. Never conversations.
    owner: {label: Ticket, key: id}
    owner_edge: HAS_SIGNAL_LOG

  # --- owned by campaign drafting -------------------------------------------
  DraftAudienceSet:
    owner: {label: CampaignDraft, key: id}
    owner_edge: HAS_DRAFT_AUDIENCE
  ContentBatch:
    owner: {label: CampaignDraft, key: id}
    owner_edge: HAS_CONTENT_BATCH
    product: campaign


# -----------------------------------------------------------------------------
# STUB LABELS — MERGE targets with no owning table. Keys MUST be declared or
# every merge is a label scan. Hubs, collections and LogPeriod are declared
# above and are not repeated here.
# -----------------------------------------------------------------------------
stub_labels:
  Channel:        {key: name}           # tenant-level dimension only
  PlatformModule: {key: code}           # crm | contact-center | campaign | ticketing | cdp
  Website:    {key: site_id}
  LogPeriod:      {key: uid}


# -----------------------------------------------------------------------------
# DERIVED COLUMNS — computed at ingest. Declared, not commented. A missing
# derivation is a load error, not a silently missing edge (v1 defect).
# -----------------------------------------------------------------------------
derived:
  ticketing.tickets.customer_cdp_id:
    lookup:
      table: ticketing.contact_profile
      match_local: customer_id
      match_remote: id
      select: cdp_id
  campaign.campaign_send_recipients.delivery_channel:
    from: "parent campaign_send_batches.channel"
  campaign.website_contacts.visitor_state:
    expr: "contact_id IS NULL ? 'anonymous' : 'identified'"
  campaign.app_notifications.subject_kind:
    expr: "split_part(source_key, ':', 1)"       # campaign | template | whatsapp
  campaign.app_notifications.subject_id:
    expr: "trailing numeric segment of source_key"
  campaign.sms_channel_settings.channel:
    expr: "'sms'"
  campaign.push_channel_settings.channel:
    expr: "settings->>'kind'"                    # web_push | app_push


# -----------------------------------------------------------------------------
# MERGED LABELS — one purpose, several source tables. Disjoint property sets,
# uid keys so id spaces cannot collide. This is the ontology normalisation:
# a query asks for the concept, not for the product that happened to store it.
# -----------------------------------------------------------------------------
graph_integrity:
  enabled: true
  default_on_missing: defer          # defer | skip | fail | create

  # ---------------------------------------------------------------------------
  # A. NODE OWNERSHIP — exactly one table may CREATE each label.
  # ---------------------------------------------------------------------------
  node_ownership:
    Contact:        {owner: cdp.customer_profile,  key: cdp_id, lifecycle: contact_lifecycle}
    User:       {owner: accounts.setup_users,  key: id}
    Team:           {owner: accounts.setup_teams,  key: id}
    Account:        {owner: crm.companies,         key: id}
    AccountSite:    {owner: crm.company_locations, key: id}
    Deal:    {owner: crm.deals,             key: id}
    Contract:       {owner: crm.contracts,         key: id}
    Offering:       {owner: inventory.products,    key: id}
    Quote:          {owner: crm.quotes,            key: id}
    Proposal:       {owner: crm.proposals,         key: id}
    SalesOrder:     {owner: crm.sales_orders,      key: id}
    Invoice:        {owner: crm.invoices,          key: id}
    Purchase:       {owner: cdp.orders,            key: order_id}
    Conversation:   {owner: ccass.conversations,   key: id}
    Queue:          {owner: [ccass.queues, ticketing.agent_queues], key: id, merged: true}
    QueueDefinition: {owner: accounts.setup_ccaas_queues, key: id}
    Ticket:         {owner: ticketing.tickets, key: id}
    ContactAccount: {owner: ticketing.ticketing_accounts, key: id}
    SalesProfile:   {owner: crm.contact_profiles,  key: id}
    Campaign:       {owner: campaign.campaigns,    key: id}
    CampaignDraft:  {owner: campaign.campaign_agent_sessions, key: id}
    SendBatch:      {owner: campaign.campaign_send_batches, key: id}
    BusinessUnit:   {owner: campaign.branches,     key: id}
    MessageTemplate: {owner: campaign.campaign_channel_templates, key: id}
    ApprovedTemplate: {owner: campaign.regulated_channel_templates, key: id}
    Visitor:     {owner: campaign.website_contacts, key: id, lifecycle: visitor_lifecycle}
    Persona:        {owner: cdp.persona_definitions, key: persona_id}
    Segment: {owner: cdp.segments,         key: segment_id}
    Visit:          {owner: cdp.customer_sessions, key: session_id}
    Skill:          {owner: ccass.skills,          key: id}
    AnomalyDetector: {owner: cdp.anomaly_rules,    key: rule_id}
    EngagementActivity: {owner: crm.contact_activities, key: id}
    LiveMeetingSession: {owner: crm.meeting_assist_sessions, key: id}
    BotSkillVersion: {owner: ccass.nlp_skill_versions, key: id}
    ChannelAccount: {owner: accounts.setup_channel_configs, key: id}
    HolidaySchedule: {owner: accounts.setup_holiday_calendars, key: id}
    OperatingSchedule: {owner: accounts.setup_business_hours, key: id}
    SendingLimit:   {owner: campaign.email_sending_caps, key: organization_id}
    SendingDomain:  {owner: campaign.email_domains, key: id}
    SenderComplianceProfile: {owner: campaign.email_org_profiles, key: organization_id}
    Agent:          {owner: [ccass.agents, ticketing.agents], key: uid, merged: true}
    SLA: {owner: [ccass.sla_policies, ticketing.sla_policies], key: uid, merged: true}

  # The ONLY labels create_target is permitted on: bounded dimension stubs with
  # no owning table.
  create_target_allowed:
    Channel:        {from_columns: [channel_type, channel]}
    PlatformModule: {from_columns: [product_id, product_code]}
    Website:    {from_columns: [site_id]}
    LogPeriod:      {minted_by: collection_builder}

  # Every edge that MERGEs a label it does not own.
  edge_policy:
    campaign.campaign_audience:           {target: Contact, edge: TARGETED_BY, mode: relationship_only, on_missing: defer}
    campaign.campaign_audience_refs:      {target: Contact, edge: CONTAINS, mode: relationship_only, on_missing: defer}
    campaign.push_endpoints:              {target: Contact, edge: HAS_PUSH_SUBSCRIPTION, on_missing: defer}
    campaign.website_contacts:            {target: Contact, edge: RESOLVED_TO, on_missing: defer}
    campaign.campaign_contact_engagement: {target: Contact, edge: HAS_OUTREACH_ENGAGEMENT, on_missing: defer}
    campaign.campaign_send_recipients:    {target: Contact, collection_owner: true, on_missing: defer}
    crm.contact_profiles:      {target: Contact, edge: sales_view_of, on_missing: defer}
    crm.deals:                 {target: Contact, edge: primary_contact, on_missing: defer}
    crm.sales_orders:          {target: Contact, edge: PLACED_BY, on_missing: defer}
    crm.privacy_requests:      {target: Contact, edge: ABOUT_CUSTOMER, on_missing: defer}
    crm.lead_scoring_jobs:     {target: Contact, edge: ABOUT_CUSTOMER, on_missing: defer}
    crm.lead_nurture_jobs:     {target: Contact, edge: ABOUT_CUSTOMER, on_missing: defer}
    crm.lead_lifecycle_jobs:   {target: Contact, edge: ABOUT_CUSTOMER, on_missing: defer}
    crm.lead_enrichment_jobs:  {target: Contact, edge: ABOUT_CUSTOMER, on_missing: defer}
    crm.contact_activities:        {target: Contact, collection_owner: true, on_missing: defer}
    crm.lead_enrichment_snapshots: {target: Contact, collection_owner: true, on_missing: defer}
    crm.lead_summaries:            {target: Contact, collection_owner: true, on_missing: defer}
    ticketing.contact_profile: {target: Contact, edge: SUPPORT_VIEW_OF, on_missing: defer}
    cdp.interactions:          {target: Contact, collection_owner: true, on_missing: defer}
    ccass.conversations:       {target: Contact, collection_owner: true, on_missing: skip, blocked_by: V1}
    cdp.order_items:           {target: Offering, edge: purchased, mode: relationship_only, on_missing: skip, blocked_by: V2}
    ccass.agent_tasks:           {target: User, collection_owner: true, on_missing: defer}
    ccass.agent_missed_contacts: {target: User, collection_owner: true, on_missing: defer, blocked_by: V7}
    crm.notifications:           {target: User, collection_owner: true, on_missing: defer}
    ticketing.audit_events:              {target: Ticket, collection_owner: true, on_missing: defer}
    ticketing.outbound_email_log:        {target: Ticket, collection_owner: true, on_missing: defer}
    ticketing.proactive_recommendations: {target: Ticket, collection_owner: true, on_missing: defer, coerce_owner_to_int: true}
    ticketing.proactive_approvals:       {target: Ticket, collection_owner: true, on_missing: defer, coerce_owner_to_int: true}
    ticketing.proactive_audit:           {target: Ticket, collection_owner: true, on_missing: defer, coerce_owner_to_int: true}

  defer:
    node_bearing:
      marker_label:  "Pending{Target}Ref"
      key_property:  "_pending_{target_lower}_key"
      edge_property: "_pending_{target_lower}_edges"
    relationship_only:
      quarantine_label: PendingLink
    max_age_days: 30
    on_expiry: alert

  reconcile:
    trigger: on_owner_upsert
    also_run: {schedule: "*/5 * * * *", batch_size: 5000}
    idempotent: true

  # ---------------------------------------------------------------------------
  # B. LIFECYCLES — ordered, exclusive, forward-only label groups.
  # ---------------------------------------------------------------------------
  lifecycles:
    contact_lifecycle:
      base_label: Contact
      column: contact_type
      exclusive: true
      monotonic: true
      stages:
        - {value: lead,     label: Lead,     rank: 1}
        - {value: prospect, label: Prospect, rank: 2}
        - {value: customer, label: Contact, rank: 3}
      unclassified: {when: [null, "", unknown], label: null}
      properties:
        stage: _lifecycle_stage
        rank:  _lifecycle_rank
        reached_at: _lifecycle_reached_at
      on_downgrade: hold_and_flag
      downgrade_flag: _lifecycle_downgrade_attempted_at

    visitor_lifecycle:
      base_label: Visitor
      column: visitor_state
      exclusive: true
      monotonic: true
      stages:
        - {value: anonymous,  label: AnonymousVisitor,  rank: 1}
        - {value: identified, label: IdentifiedVisitor, rank: 2}
      unclassified: {when: [null], label: null}
      on_downgrade: hold_and_flag

  # Exclusive but NOT ordered: clear-then-set, no rank, downgrade meaningless.
  exclusive_label_groups:
    accounts.setup_channel_configs: {column: channel_type, group: [EmailChannel, ChatChannel, SocialChannel, VoiceChannel]}
    crm.deals:                      {column: stage, group: [WonDeal, LostDeal]}
    crm.contact_activities:         {column: type, group: [EmailActivity, TaskActivity, MeetingActivity]}
    ticketing.tickets:              {column: status, group: [BreachedCase, ResolvedCase]}
    ticketing.ticket_notes:         {column: visibility, group: [PublicReply, PrivateNote]}
    campaign.campaigns:             {column: status, group: [LiveCampaign, ScheduledCampaign]}
    campaign.regulated_channel_templates: {column: status, group: [PendingApproval, RejectedTemplate]}
    ccass.conversations:            {columns: [bot_active, lifecycle_state], group: [BotHandled, AgentHandled]}

  # Independent flags: SET when true, REMOVE when false. Not a group.
  removable_flags:
    cdp.customer_sessions:                {AttributedVisit: "utm_campaign IS NOT NULL"}
    crm.companies:                        {ChannelPartner: "channel_role IN ('franchise','owned_store','brand_hq')"}
    crm.invoices:                         {OverdueInvoice: "escalation_severity IS NOT NULL"}
    crm.contracts:                        {RenewingContract: "auto_renew = true"}
    campaign.email_domains:               {AuthenticatedDomain: "spf_ok AND dkim_ok AND dmarc_ok"}
    campaign.campaign_contact_engagement: {Unsubscribed: "email_unsubscribed = true"}
    campaign.campaign_send_recipients:
      OpenedMessage:  {expr: "opened_at IS NOT NULL",  monotonic: true}
      ClickedMessage: {expr: "clicked_at IS NOT NULL", monotonic: true}
      FailedDelivery: {expr: "status IN ('failed','skipped')"}

  # ---------------------------------------------------------------------------
  # C. REFERENCE PROBE — catch id-space bugs before they load empty.
  # ---------------------------------------------------------------------------
  reference_probe:
    sample_size: 1000
    min_match_rate: 0.90
    on_below_floor: halt_table
    report_to: pipeline_metrics
    blocking_verifications:
      V1: {table: ccass.conversations, column: contact_id, question: "cdp.contacts.id or customer_profile.cdp_id?"}
      V2: {table: cdp.order_items, column: product_id, question: "cdp.products UUID or inventory.products bigint?"}
      V3: {table: campaign.organization_products, column: product_code, question: "enum vs setup_roles.product_id slug"}
      V4: {table: campaign.regulated_channel_templates, column: channel_config_id, question: "bigint here vs uuid in accounts"}
      V6: {table: cdp.identity_links, question: "does the table exist?"}
      V7: {table: ccass.agent_missed_contacts, question: "does the table exist?"}
      V8: {table: cdp.anomaly_rules, question: "organization_id present, or detectors global?"}
      V9: {table: ticketing.agent_queues, question: "does external_id carry the team reference?"}

  # ---------------------------------------------------------------------------
  # D. DELETION
  # ---------------------------------------------------------------------------
  deletion:
    mode: cascade_owned
    cascade_edges: [HAS_*, CONTAINS]
    never_cascade: [FOR_*, OF_*, projection_of, role_of, "*_BY"]
    tombstone: {enabled: true, property: _deleted_at, retention_days: 7, purge: scheduled}
    resurrection_guard: "an upsert whose source version < _deleted_at is discarded"
    sweep_empty_buckets: true
  erasure:
    trigger: crm.privacy_requests.executed_at
    tombstone: false
    clear_pending: true
    null_retained_keys: true

  # ---------------------------------------------------------------------------
  # E. WRITE SEMANTICS
  # ---------------------------------------------------------------------------
  write_semantics:
    version_column: [version, lifecycle_version, updated_at, source_ts]
    version_property: _source_version
    guard: skip_when_stale
    counters: recompute_never_increment
    replay: byte_identical

  # ---------------------------------------------------------------------------
  # F. POLYMORPHIC REFERENCES
  # ---------------------------------------------------------------------------
  polymorphic:
    require_discriminator: true
    campaign.app_notifications: {discriminator: subject_kind, id: subject_id, status: resolved}
    crm.agent_memories:         {discriminator: scope_type,   id: scope_id,   status: implement}
    ccass.conversation_participants: {discriminator: null, id: identity_ref, status: blocked,
                                      reason: "no identity_type column; resolve through ContactIdentity once available"}

  # ---------------------------------------------------------------------------
  # COUNT INTEGRITY
  # ---------------------------------------------------------------------------
  count_integrity:
    provenance_property: {name: _owner, value: "<owning table>"}
    canonical_counts:
      contacts:  "MATCH (c:Contact)          WHERE c._owner = 'cdp.customer_profile' AND c._deleted_at IS NULL RETURN count(c)"
      leads:     "MATCH (c:Contact:Lead)     WHERE c._owner = 'cdp.customer_profile' AND c._deleted_at IS NULL RETURN count(c)"
      prospects: "MATCH (c:Contact:Prospect) WHERE c._owner = 'cdp.customer_profile' AND c._deleted_at IS NULL RETURN count(c)"
      customers: "MATCH (c:Contact:Contact) WHERE c._owner = 'cdp.customer_profile' AND c._deleted_at IS NULL RETURN count(c)"
    invariant: "contacts = leads + prospects + customers + unclassified"

merged_labels:
  IntentRoutingProfile: [accounts.setup_queue_routing_profiles, ccass.queue_routing_profiles]
  Agent:            [ccass.agents, ticketing.agents]
  ContactIdentity:      [cdp.identity_keys, cdp.contact_identities]
  SLA:   [ccass.sla_policies, ticketing.sla_policies]
  AutomationPolicy:     [ccass.channel_automation_policies, ccass.email_mailbox_policies,
                         ccass.whatsapp_channel_policies]
  DocumentTemplate:     [crm.proposal_templates, crm.quote_templates, crm.invoice_templates]
  LineItem:             [crm.quote_lines, crm.order_lines, crm.invoice_lines]
  Notification:         [crm.notifications, ticketing.notifications, campaign.app_notifications]
  AgentJob:             [crm.lead_scoring_jobs, crm.lead_nurture_jobs,
                         crm.lead_lifecycle_jobs, crm.lead_enrichment_jobs]
  InternalNote:         [ccass.conversation_notes, ccass.workspace_common_notes]
  ChannelAccount:       [accounts.setup_channel_configs, accounts.setup_email_configs,
                         accounts.setup_webchat_configs, accounts.setup_social_configs]
  ChannelSendingConfig: [campaign.push_channel_settings, campaign.sms_channel_settings]


# -----------------------------------------------------------------------------
# SENSITIVITY RUBRIC — derived from columns, not hand-set. CI recomputes and
# fails on drift. This replaces the v1 classification, which had PII-bearing
# tables at L1 and a date-only billing schedule at L3.
# -----------------------------------------------------------------------------
sensitivity_rubric:
  L1: "operational metadata only — ids, statuses, counts, timestamps, config"
  L2: "contains direct PII (name, email, phone, address) OR customer-authored content"
  L3: "special-category PII (DOB, gender, health), credentials metadata, or financial account detail"


# =============================================================================
# TABLES
# Relationship direction is explicit:
#   to:   this node -[:TYPE]-> target
#   from: target    -[:TYPE]-> this node
# `collection:` replaces owner edges entirely — the loader builds
# owner -> collection -> [period] -> this node. Never add a direct owner edge
# alongside it.
# =============================================================================
tables:

  # ===========================================================================
  # TENANT AND WORKFORCE  (source: accounts)
  # ===========================================================================

  accounts.organizations:
    embed:
      fields: [company_name, industry_type, business_type, country]
      property: _embedding
    product: platform
    label: Tenant
    key: id
    access: {domain: common, module: identity, sensitivity: L2}
    edge_budget: 9
    properties: [id, tenant_id, company_name, industry_type, business_type,
                 contact_name, designation, work_email, admin_email, tax_number,
                 billing_address, website_url, country, company_size,
                 mobile_country_code, mobile_number, lifecycle_status,
                 converted_at, reseller_id, source_lead_id, created_at, updated_at]
    creates_hubs: [SetupHub, ContactCentreHub, CustomerDataHub,
                   MarketingHub, SupportHub, WebTrackingHub, ProductCatalog]
    # industry_type is the ONLY input to overlay resolution. Do not read the
    # crm or campaign copies of this value.
    overlay_selector: industry_type

  accounts.setup_users:
    product: platform
    label: Employee
    key: id
    access: {domain: common, module: identity, sensitivity: L2}
    edge_budget: 3
    properties: [id, organization_id, employee_id, first_name, last_name,
                 work_email, mobile_number, primary_language, secondary_language,
                 skills, shift_types, city, state, country, location_id, status,
                 team_id, business_hours_id, invite_status, password_set_at,
                 invited_at, created_at, updated_at]
    relationships:
      - {type: has_employee, from: SetupHub, from_column: organization_id}
      - {type: member_of, to: Team, to_key: id, from_column: team_id}
      - {type: follows_hours, to: BusinessHours, to_key: id, from_column: business_hours_id}
    # v1 emitted HAS_MEMBER from a member_ids column that does not exist on
    # this table. Membership is Employee -> Team, single edge, above.

  accounts.setup_teams:
    product: platform
    label: Team
    key: id
    access: {domain: common, module: identity, sensitivity: L1}
    edge_budget: 2
    properties: [id, organization_id, name, description, business_hours_id,
                 available_products, status, created_at, updated_at]
    relationships:
      - {type: has_team, from: SetupHub, from_column: organization_id}
      - {type: follows_hours, to: BusinessHours, to_key: id, from_column: business_hours_id}
    # member_ids jsonb stays a property, not an edge — Employee.team_id is the
    # authoritative direction and avoids a list-expansion write per team save.

  accounts.setup_roles:
    product: platform
    label: Role
    key: id
    access: {domain: common, module: identity, sensitivity: L1}
    edge_budget: 2
    properties: [id, organization_id, name, description, product_id,
                 accessible_products, module_permission, module_permissions,
                 can_view, can_create, can_edit, can_delete, can_export,
                 can_approve, created_at, updated_at]
    relationships:
      - {type: has_role, from: SetupHub, from_column: organization_id}
      - {type: gives_access_to, to: PlatformApp, to_key: code, from_column: product_id, create_target: true}

  accounts.setup_user_product_access:
    product: platform
    mode: relationship_only
    access: {domain: common, module: identity, sensitivity: L1}
    from: {label: Employee, key: id, column: user_id}
    to: {label: Role, key: id, column: role_id}
    type: holds_role

  # --- business hours --------------------------------------------------------

  accounts.setup_business_hours:
    product: platform
    readable_by: [ccaas, ticketing]
    label: BusinessHours
    key: id
    access: {domain: common, module: setup, sensitivity: L1}
    edge_budget: 2
    properties: [id, organization_id, name, description, timezone, status,
                 open_time, close_time, timing_mode, working_days, day_timings,
                 holiday_calendar_id, created_at, updated_at]
    relationships:
      - {type: has_business_hours, from: SetupHub, from_column: organization_id}
      - {type: follows_holidays, to: HolidayCalendar, to_key: id, from_column: holiday_calendar_id}

  accounts.setup_business_hour_shifts:
    product: platform
    readable_by: [ccaas, ticketing]
    tenant:
      via:
        - {column: business_hours_id, parent: accounts.setup_business_hours, parent_key: id}
    label: Shift
    key: id
    access: {domain: common, module: setup, sensitivity: L1}
    edge_budget: 1
    properties: [id, business_hours_id, shift_type, day_of_week, end_day_of_week,
                 start_time, end_time, crosses_midnight, break_start_time,
                 break_end_time, break_start_time_2, break_end_time_2, created_at]
    relationships:
      - {type: has_shift, from: BusinessHours, from_key: id, from_column: business_hours_id}

  accounts.setup_holiday_calendars:
    product: platform
    readable_by: [ccaas, ticketing]
    label: HolidayCalendar
    key: id
    access: {domain: common, module: setup, sensitivity: L1}
    edge_budget: 1
    properties: [id, organization_id, name, country, created_at, updated_at]
    relationships:
      - {type: has_holiday_calendar, from: SetupHub, from_column: organization_id}

  accounts.setup_holidays:
    product: platform
    readable_by: [ccaas, ticketing]
    tenant:
      via:
        - {column: calendar_id, parent: accounts.setup_holiday_calendars, parent_key: id}
    label: Holiday
    key: id
    access: {domain: common, module: setup, sensitivity: L1}
    edge_budget: 1
    properties: [id, calendar_id, name, holiday_date, created_at]
    relationships:
      - {type: has_holiday, from: HolidayCalendar, from_key: id, from_column: calendar_id}

  # --- connected channels ----------------------------------------------------
  # Four tables, one concept. setup_channel_configs is the base row; the three
  # medium-specific tables are strictly 1:1 with it and merge onto the same
  # node keyed by channel_config_id. This removes three labels and three edges
  # per configured channel, and makes "how is email set up here" one lookup.
  # Medium-specific columns are prefixed on merge (L8) to avoid collision.

  accounts.setup_channel_configs:
    product: platform
    readable_by: [ccaas, campaign, ticketing]
    label: ConnectedChannel
    key: id
    access: {domain: common, module: setup, sensitivity: L1}
    edge_budget: 2
    sublabels:
      column: channel_type
      mapping: {email: EmailChannel, webchat: ChatChannel, web_chat: ChatChannel, social: SocialChannel, voice: VoiceChannel}
    properties: [id, organization_id, channel_type, name, status, product_ids,
                 created_at, updated_at]
    relationships:
      - {type: has_connected_channel, from: SetupHub, from_column: organization_id}
      - {type: uses_channel, to: Channel, to_key: name, from_column: channel_type, create_target: true}

  accounts.setup_email_configs:
    product: platform
    readable_by: [ccaas, campaign, ticketing]
    tenant:
      via:
        - {column: channel_config_id, parent: accounts.setup_channel_configs, parent_key: id}
    merges_into: ConnectedChannel
    key: id
    key_column: channel_config_id
    access: {domain: common, module: setup, sensitivity: L2}
    edge_budget: 0
    properties:
      - channel_config_id
      - {from: provider_type,        as: email_provider_type}
      - {from: sender_email,         as: email_sender_address}
      - {from: sender_name,          as: email_sender_name}
      - {from: reply_to,             as: email_reply_to}
      - {from: domain,               as: email_domain}
      - {from: oauth_provider,       as: email_oauth_provider}
      - {from: ccaas_handler,        as: email_service_handler}
      - {from: is_bot,               as: email_bot_mailbox}
      - {from: provisioning_status,  as: email_provisioning_status}
    # secrets excluded by policy: smtp_*, imap_*, *_encrypted, oauth_connection_id

  accounts.setup_webchat_configs:
    product: platform
    readable_by: [ccaas]
    tenant:
      via:
        - {column: channel_config_id, parent: accounts.setup_channel_configs, parent_key: id}
    merges_into: ConnectedChannel
    key: id
    key_column: channel_config_id
    access: {domain: common, module: setup, sensitivity: L1}
    edge_budget: 1
    custom_field: personalisation
    custom_dynamic: true
    properties:
      - channel_config_id
      - routing_queue_id
      - {from: webchat_id,        as: chat_widget_id}
      - {from: title,             as: chat_title}
      - {from: alias_title,       as: chat_alias_title}
      - {from: description,       as: chat_description}
      - {from: greeting_message,  as: chat_greeting}
      - {from: trigger_message,   as: chat_trigger}
    relationships:
      - {type: routes_to, to: QueueSetup, to_key: id, from_column: routing_queue_id}

  accounts.setup_social_configs:
    product: platform
    readable_by: [ccaas, campaign]
    tenant:
      via:
        - {column: channel_config_id, parent: accounts.setup_channel_configs, parent_key: id}
    merges_into: ConnectedChannel
    key: id
    key_column: channel_config_id
    access: {domain: common, module: setup, sensitivity: L1}
    edge_budget: 0
    properties:
      - channel_config_id
      - {from: provider,               as: social_provider}
      - {from: bot_enabled,            as: social_bot_enabled}
      - {from: usage_mode,             as: social_usage_mode}
      - {from: display_number,         as: social_display_number}
      - {from: waba_id,                as: social_waba_id}
      - {from: phone_number_id,        as: social_phone_number_id}
      - {from: page_id,                as: social_page_id}
      - {from: ig_business_account_id, as: social_ig_account_id}
      - {from: meta_auth_type,         as: social_auth_type}
      - {from: meta_connection_status, as: social_connection_status}
    # secrets excluded by policy: access_token_encrypted, token_expires_at

  # --- voice -----------------------------------------------------------------

  accounts.setup_voice_dids:
    product: ccaas
    label: PhoneNumber
    key: id
    access: {domain: common, module: setup, sensitivity: L2}
    edge_budget: 4
    properties: [id, organization_id, phone_number, product_id, routing_type,
                 status, prompt_profile_id, routing_queue_id, routing_user_id,
                 created_at, updated_at]
    relationships:
      - {type: has_phone_number, from: SetupHub, from_column: organization_id}
      - {type: routes_to, to: QueueSetup, to_key: id, from_column: routing_queue_id}
      - {type: routes_to, to: Employee, to_key: id, from_column: routing_user_id}
      - {type: uses_prompts, to: VoicePromptSet, to_key: id, from_column: prompt_profile_id}
    # PlatformApp reference stays a property (product_id); phone numbers are
    # bounded per tenant but the app is an enum, not a traversal target.

  accounts.setup_voice_prompt_profiles:
    product: ccaas
    label: VoicePromptSet
    key: id
    access: {domain: common, module: setup, sensitivity: L1}
    edge_budget: 1
    custom_field: slots
    custom_dynamic: true
    properties: [id, organization_id, name, description, status, created_at, updated_at]
    relationships:
      - {type: has_voice_prompt_set, from: SetupHub, from_column: organization_id}

  # --- queue setup -----------------------------------------------------------

  accounts.setup_ccaas_queues:
    product: ccaas
    label: QueueSetup
    key: id
    access: {domain: common, module: setup, sensitivity: L1}
    edge_budget: 3
    properties: [id, organization_id, team_id, name, description, status,
                 business_hours_id, shift_types, skills,
                 missed_callback_grace_minutes, created_at, updated_at]
    relationships:
      - {type: has_queue_setup, from: SetupHub, from_column: organization_id}
      - {type: owned_by_team, to: Team, to_key: id, from_column: team_id}
      - {type: follows_hours, to: BusinessHours, to_key: id, from_column: business_hours_id}

  accounts.setup_ccaas_queue_agents:
    product: ccaas
    tenant:
      via:
        - {column: queue_id, parent: accounts.setup_ccaas_queues, parent_key: id}
    mode: relationship_only
    access: {domain: common, module: setup, sensitivity: L1}
    from: {label: QueueSetup, key: id, column: queue_id}
    to: {label: Employee, key: id, column: user_id}
    type: has_member
    properties: [shift_type, call_type, handles_calls, handles_chat, handles_email,
                 handles_social, handles_whatsapp, handles_instagram, handles_facebook,
                 chat_concurrency, email_concurrency, social_concurrency]

  accounts.setup_queue_routing_profiles:
    product: ccaas
    label: RoutingProfile
    key: uid
    synthesize_key: "setup:{id}"
    access: {domain: common, module: setup, sensitivity: L1}
    edge_budget: 1
    sublabels: {static: DraftRoutingProfile}
    custom_field: skill_mapping
    custom_dynamic: true
    properties: [id, organization_id, queue_id, description, supported_intents,
                 example_phrases, language_codes, classifier_version,
                 created_at, updated_at]
    relationships:
      - {type: has_routing_profile, from: QueueSetup, from_key: id, from_column: queue_id}

  # --- knowledge -------------------------------------------------------------

  accounts.setup_knowledge_documents:
    embed:
      fields: [file_name, category, product_id]
      property: _embedding
    product: platform
    readable_by: [ccaas, ticketing]
    label: KnowledgeFile
    key: id
    access: {domain: common, module: setup, sensitivity: L2}
    edge_budget: 2
    properties: [id, organization_id, category, file_name, file_type,
                 file_size_bytes, storage_path, product_id, ccaas_audience,
                 all_branches, assigned_branch_ids, uploaded_by, created_at]
    relationships:
      - {type: has_knowledge_file, from: SetupHub, from_column: organization_id}
      - {type: uploaded_by, to: Employee, to_key: id, from_column: uploaded_by}

  accounts.setup_knowledge_org_profiles:
    product: platform
    readable_by: [ccaas, ticketing]
    label: BusinessProfile
    key: organization_id
    access: {domain: common, module: setup, sensitivity: L1}
    edge_budget: 1
    custom_field: product
    custom_dynamic: true
    properties: [organization_id, updated_at]
    relationships:
      - {type: has_business_profile, from: SetupHub, from_column: organization_id}

  # ===========================================================================
  # CUSTOMER AND BEHAVIOUR  (source: cdp — the hub of the hub-and-spoke model)
  # ===========================================================================

  cdp.customer_profile:
    embed:
      fields: [first_name, last_name, company, city, country, contact_type, acquisition_channel]
      property: _embedding
    product: platform
    readable_by: [crm, cdp, campaign, ccaas, ticketing]
    label: Customer
    key: cdp_id
    access: {domain: common, module: customer, sensitivity: L3}
    edge_budget: 11               # collection owner edges only, created once
    sublabels:
      column: contact_type
      mapping: {lead: Lead, prospect: Prospect, customer: PayingCustomer}
    custom_field: custom_fields
    custom_dynamic: true
    properties: [cdp_id, organization_id, first_name, last_name, gender,
                 date_of_birth, company, city, region, country, language,
                 timezone, contact_type, acquisition_channel, acquisition_date,
                 first_referrer, first_seen_at, last_seen_at, created_at, updated_at]
    owns_collections: [EventHistory, SessionHistory, TouchpointHistory,
                       ConversationHistory, JourneyHistory, MetricHistory,
                       ActivityHistory, MessageHistory, MemoryStore, InsightSet,
                       NextBestActionSet]
    # L3 because gender + date_of_birth are special-category. If an overlay
    # removes those columns for a tenant, CI recomputes this to L2.
    # NOT attached to Tenant: unbounded. Tenant scope is organization_id and
    # the per-tenant database.

  cdp.identity_keys:
    product: platform
    readable_by: [crm, cdp, campaign, ccaas, ticketing]
    label: CustomerIdentity
    key: uid
    synthesize_key: "{organization_id}:{key_type}:{key_value}"
    access: {domain: cdp, module: customer, sensitivity: L2}
    edge_budget: 1
    custom_field: custom_fields
    custom_dynamic: true
    properties:
      - {from: identity_id,  as: source_row_id}
      - {from: key_type,     as: identity_type}
      - {from: key_value,    as: identity_value}
      - cdp_id
      - organization_id
      - source_system
      - {name: confidence_score, type: decimal, scale: 4}
      - verified
      - created_at
    relationships:
      - {type: identified_by, from: Customer, from_key: cdp_id, from_column: cdp_id}

  cdp.contact_identities:
    product: platform
    readable_by: [crm, cdp, campaign, ccaas, ticketing]
    merges_into: CustomerIdentity
    key: uid
    synthesize_key: "{organization_id}:{identity_type}:{identity_value}"
    access: {domain: cdp, module: customer, sensitivity: L2}
    edge_budget: 1
    properties: [id, organization_id, contact_id, identity_type, identity_value,
                 source_channel, first_seen_at, last_seen_at, created_at, updated_at]
    relationships:
      - {type: identified_by, from: Customer, from_key: cdp_id, from_column: contact_id}
    # Merges onto the same natural key (org, type, value) as identity_keys.
    # Two tables, one identity concept — v1 had ContactPoint and ChannelIdentity
    # as separate labels describing the same thing.

  cdp.identity_links:
    product: platform
    mode: relationship_only
    access: {domain: cdp, module: customer, sensitivity: L2}
    from: {label: Customer, key: cdp_id, column: cdp_id}
    to: {label: Customer, key: cdp_id, column: linked_cdp_id}
    type: same_person_as
    verify: "table not present in the CDP schema reference — confirm before enabling"

  # --- behaviour (high volume, bucketed) -------------------------------------

  cdp.customer_events:
    embed:
      fields: [event_name, event_category, channel, page_title]
      property: _embedding
    product: cdp
    readable_by: [campaign, crm, webtracking]
    label: Event
    key: event_id
    access: {domain: cdp, module: behaviour, sensitivity: L2}
    edge_budget: 2
    collection: {name: EventHistory, owner_column: cdp_id, bucket_column: occurred_at}
    extra_labels:
      # Generic only. Commerce, lending, clinical and enrolment vocabularies
      # belong in domains/<industry>.yaml, which may add members here.
      - {label: OnlineEvent,  when: {channel: [web, mobile, app]}}
      - {label: PageView,     when: {event_name: [page_view, pageview, screen_view]}}
      - {label: FormEvent,    when: {event_category: [form]}}
      - {label: Interaction,  when: {event_category: [interaction]}}
      - {label: Conversion,   when: {event_category: [conversion]}}
    custom_field: custom_fields
    custom_dynamic: true
    properties: [event_id, cdp_id, organization_id, site_id, event_name, event_category,
                 source_name, source_event_id, channel, visitor_id, session_id,
                 page_view_id, page_path, page_title, referrer, utm_source, utm_medium,
                 utm_campaign, utm_term, utm_content, device_type, browser, country,
                 occurred_at, ingested_at, amount, currency, quantity, status, reference_id]
    relationships:
      - {type: occurs_in, to: Session, to_key: session_id, from_column: session_id}
      - {type: on_website, to: Website, to_key: site_id, from_column: site_id, create_target: true}
    requires_migration: [site_id, page_view_id]
    # v1 emitted FOR_CONTACT, THROUGH(Channel) and FROM_SOURCE on top of the
    # collection edge: 5 edges/row on the highest-volume table in the platform.
    # channel and source_name are properties; Channel and DataSource stay at
    # hub level. extra_labels drive category queries without a per-row edge.

  cdp.customer_sessions:
    product: cdp
    readable_by: [campaign, webtracking]
    label: Session
    key: session_id
    access: {domain: cdp, module: behaviour, sensitivity: L2}
    edge_budget: 2
    collection: {name: SessionHistory, owner_column: cdp_id, bucket_column: started_at}
    extra_labels:
      - {label: OnlineSession,   when: {channel: [web, mobile, app]}}
      - {label: CampaignSession, when: {utm_campaign: not_null}}
    custom_field: custom_fields
    custom_dynamic: true
    properties: [session_id, cdp_id, organization_id, site_id, visitor_id, started_at,
                 ended_at, duration_seconds, entry_page, exit_page, pageview_count,
                 is_bounce, referrer, referrer_domain, utm_source, utm_medium,
                 utm_campaign, utm_term, utm_content, campaign_ref_id, contact_ref_id,
                 device_type, browser, platform, language, country, region, city, created_at]
    relationships:
      - {type: on_website, to: Website, to_key: site_id, from_column: site_id, create_target: true}
    requires_migration: [site_id, campaign_ref_id, contact_ref_id]
    # campaign_ref_id stays a property. One edge per attributed session would
    # make Campaign a supernode on the second-highest-volume table; campaign
    # attribution is answered from Message, which is already scoped.
    # is_bounce is NOT promoted to a label. The web-tracking pipeline documents
    # this column as stale; bounce is answered from the session-activity view,
    # not from the graph.

  cdp.customer_interactions:
    product: cdp
    label: Touchpoint
    key: interaction_id
    access: {domain: cdp, module: behaviour, sensitivity: L2}
    edge_budget: 2
    collection: {name: TouchpointHistory, owner_column: cdp_id, bucket_column: started_at}
    custom_field: custom_fields
    custom_dynamic: true
    properties: [interaction_id, cdp_id, organization_id, interaction_source,
                 interaction_type, channel, direction, page_path, element_name,
                 agent_id, session_id, sentiment_score, summary, started_at, ended_at]
    relationships:
      - {type: occurs_in, to: Session, to_key: session_id, from_column: session_id}

  cdp.customer_journey:
    product: cdp
    label: JourneyStep
    key: journey_event_id
    access: {domain: cdp, module: behaviour, sensitivity: L1}
    edge_budget: 2
    collection: {name: JourneyHistory, owner_column: cdp_id, bucket_column: occurred_at}
    custom_field: custom_fields
    custom_dynamic: true
    properties: [journey_event_id, cdp_id, organization_id, journey_name,
                 journey_channel, touchpoint, from_stage, to_stage, trigger_event,
                 session_id, source, occurred_at]
    relationships:
      - {type: occurs_in, to: Session, to_key: session_id, from_column: session_id}
    # Stage names are deliberately free text in core. A domain overlay may add
    # extra_labels for its own funnel (e.g. KycStage, UnderwritingStage).

  cdp.journey_states:
    product: cdp
    label: JourneyStatus
    key: uid
    synthesize_key: "{organization_id}:{cdp_id}:{journey_name}"
    access: {domain: cdp, module: behaviour, sensitivity: L1}
    edge_budget: 1
    properties: [cdp_id, organization_id, journey_name, current_stage, entered_at, updated_at]
    relationships:
      - {type: has_journey_status, from: Customer, from_key: cdp_id, from_column: cdp_id}
    # Bounded (one row per journey per customer) so it stays a direct edge.

  # --- scores, metrics, insight ----------------------------------------------

  cdp.customer_scores:
    product: cdp
    readable_by: [crm, campaign]
    label: CustomerScore
    key: cdp_id
    access: {domain: cdp, module: intelligence, sensitivity: L1}
    edge_budget: 1
    properties: [cdp_id, organization_id, engagement_score, value_score,
                 loyalty_score, churn_score, purchase_probability, retention_score,
                 advocacy_score, web_engagement_score, intent_score,
                 digital_activity_score, updated_at]
    relationships:
      - {type: has_score, from: Customer, from_key: cdp_id, from_column: cdp_id}

  cdp.gold_customer_metrics:
    product: cdp
    readable_by: [crm, campaign]
    label: CustomerValue
    key: cdp_id
    access: {domain: cdp, module: intelligence, sensitivity: L1}
    edge_budget: 1
    properties: [cdp_id, organization_id, total_events, total_orders,
                 {name: total_spend, type: decimal, scale: 2},
                 {name: avg_order_value, type: decimal, scale: 2},
                 last_event_at, last_purchase_at, engagement_score, value_score,
                 loyalty_score, churn_score, purchase_probability, predicted_ltv,
                 journey_stage, segment_count, updated_at]
    relationships:
      - {type: has_value, from: Customer, from_key: cdp_id, from_column: cdp_id}

  cdp.customer_metrics:
    product: cdp
    label: DailyMetric
    key: uid
    synthesize_key: "{cdp_id}:{metric_date}"
    access: {domain: cdp, module: intelligence, sensitivity: L1}
    edge_budget: 1
    collection: {name: MetricHistory, owner_column: cdp_id, bucket_column: metric_date}
    properties: [metric_date, cdp_id, organization_id, session_count,
                 total_page_views, avg_session_duration, bounce_rate, avg_scroll_depth,
                 conversion_count, engagement_score, value_score, loyalty_score,
                 campaign_engagement_score, last_seen_days]

  cdp.gold_campaign_lookup:
    product: cdp
    label: KeyMetric
    key: uid
    synthesize_key: "{organization_id}:{metric_key}"
    access: {domain: cdp, module: intelligence, sensitivity: L1}
    edge_budget: 1
    properties: [organization_id, metric_key, metric_label, metric_value, updated_at]
    relationships:
      - {type: has_metric, from: KeyMetricSet, from_column: organization_id}
    # v1 also emitted HAS_ORG_METRICS to the platform hub on every metric row.
    # That edge now lives once on KeyMetricSet (see hubs:).

  cdp.ai_insights:
    product: cdp
    readable_by: [crm, campaign]
    label: CustomerInsight
    key: insight_id
    access: {domain: cdp, module: intelligence, sensitivity: L2}
    edge_budget: 1
    collection: {name: InsightSet, owner_column: cdp_id}
    custom_field: custom_fields
    custom_dynamic: true
    properties: [insight_id, cdp_id, organization_id, insight_type, score,
                 summary, explanation, generated_at]

  cdp.customer_recommendations:
    embed:
      fields: [recommendation_type, recommendation]
      property: _embedding
    product: cdp
    readable_by: [crm, campaign]
    label: NextBestAction
    key: recommendation_id
    access: {domain: cdp, module: intelligence, sensitivity: L2}
    edge_budget: 1
    collection: {name: NextBestActionSet, owner_column: cdp_id}
    custom_field: custom_fields
    custom_dynamic: true
    properties: [recommendation_id, cdp_id, organization_id, recommendation_type,
                 recommendation, confidence, generated_at]

  # --- grouping --------------------------------------------------------------

  cdp.segments:
    product: cdp
    readable_by: [campaign]
    label: Segment
    key: segment_id
    access: {domain: cdp, module: intelligence, sensitivity: L1}
    edge_budget: 1
    custom_field: custom_fields
    custom_dynamic: true
    properties: [segment_id, organization_id, segment_name, description, created_at]
    relationships:
      - {type: has_segment, from: CustomerDataHub, from_column: organization_id}

  cdp.customer_segments:
    product: cdp
    readable_by: [campaign]
    mode: relationship_only
    access: {domain: cdp, module: intelligence, sensitivity: L1}
    from: {label: Customer, key: cdp_id, column: cdp_id}
    to: {label: Segment, key: segment_id, column: segment_id}
    type: in_segment
    properties: [source, assigned_at]
    fan_in_warning: "Segment is a legitimate supernode. Never traverse out of it without a LIMIT; use segment_id as a Customer property filter for counts."

  cdp.persona_definitions:
    embed:
      fields: [name, summary, industry, persona_type]
      property: _embedding
    product: cdp
    label: Persona
    key: persona_id
    access: {domain: cdp, module: intelligence, sensitivity: L1}
    edge_budget: 1
    custom_field: custom_fields
    custom_dynamic: true
    properties: [persona_id, organization_id, persona_key, name, summary, industry,
                 persona_type, status, version, confidence, evidence_count,
                 decision_role, model_version, created_at, updated_at]
    relationships:
      - {type: has_persona, from: CustomerDataHub, from_column: organization_id}
    # Persona content (goals, pain points, channels) is industry-shaped but the
    # STRUCTURE is generic, so the label stays in core and overlays fill it.

  cdp.customer_persona_assignments:
    product: cdp
    mode: relationship_only
    access: {domain: cdp, module: intelligence, sensitivity: L1}
    from: {label: Customer, key: cdp_id, column: cdp_id}
    to: {label: Persona, key: persona_id, column: persona_id}
    type: matches_persona
    filter: "is_active = true"
    properties: [confidence, drift_score, assignment_source, assigned_at]

  cdp.persona_snapshots:
    product: cdp
    label: PersonaEvidence
    key: snapshot_id
    access: {domain: cdp, module: intelligence, sensitivity: L1}
    edge_budget: 2
    collection: {name: InsightSet, owner_column: cdp_id}
    properties: [snapshot_id, organization_id, cdp_id, persona_id, inference_run_id,
                 confidence, model_version, inference_path, created_at]
    relationships:
      - {type: evidence_for, to: Persona, to_key: persona_id, from_column: persona_id}

  # --- agent memory ----------------------------------------------------------

  cdp.episodic_memory:
    product: cdp
    table: cdp.episodic_memory
    label: EventMemory
    key: memory_id
    access: {domain: cdp, module: intelligence, sensitivity: L2}
    edge_budget: 1
    collection: {name: MemoryStore, owner_column: cdp_id}
    properties: [memory_id, organization_id, cdp_id, event_id, summary,
                 importance_score, sentiment, occurred_at, recorded_at]

  cdp.semantic_memory:
    product: cdp
    table: cdp.semantic_memory
    label: CustomerFact
    key: memory_id
    access: {domain: cdp, module: intelligence, sensitivity: L2}
    edge_budget: 1
    collection: {name: MemoryStore, owner_column: cdp_id}
    properties: [memory_id, organization_id, cdp_id, fact, confidence, source, created_at]

  cdp.procedural_memory:
    product: cdp
    table: cdp.procedural_memory
    label: EngagementRule
    key: rule_id
    access: {domain: cdp, module: intelligence, sensitivity: L1}
    edge_budget: 1
    properties: [rule_id, organization_id, name, priority, active, created_at]
    relationships:
      - {type: has_engagement_rule, from: CustomerDataHub, from_column: organization_id}

  cdp.activation_tasks:
    product: cdp
    table: cdp.activation_tasks
    label: ActivationTask
    key: task_id
    access: {domain: cdp, module: intelligence, sensitivity: L1}
    edge_budget: 1
    collection: {name: ActivityHistory, owner_column: cdp_id, bucket_column: created_at}
    properties: [task_id, organization_id, cdp_id, channel, task_type, status,
                 created_at, emitted_at]

  # --- monitoring and models -------------------------------------------------

  cdp.anomaly_rules:
    product: cdp
    tenant:
      scope: global
      replicate: all_tenants
      note: "detector definitions are platform-wide; confirmed no organization_id in Postgres"
    label: AlertRule
    key: rule_id
    access: {domain: cdp, module: intelligence, sensitivity: L1}
    edge_budget: 1
    properties: [rule_id, organization_id, spoke, metric_key, metric_name, condition,
                 threshold, threshold_unit, window_minutes, severity, enabled,
                 cooldown_minutes, threshold_mode, trigger_mode, evaluator_key,
                 created_at, updated_at]
    # No hub edge: the table has no organization_id and cannot get one.
    # Detectors are replicated into every tenant database as reference data.
    # v1 read organization_id here but never declared it. Either the column
    # exists and was omitted from properties, or detectors are global and this
    # edge must be dropped. Blocking — resolve before enabling.

  cdp.anomaly_alerts:
    embed:
      fields: [severity, condition, message]
      property: _embedding
    product: cdp
    label: Alert
    key: alert_id
    access: {domain: cdp, module: intelligence, sensitivity: L1}
    edge_budget: 2
    properties: [alert_id, rule_id, organization_id, spoke, metric_key, severity,
                 observed_value, threshold, condition, message, email_status,
                 delivery_status, handoff_status, created_at, acknowledged_at]
    relationships:
      - {type: has_alert, from: AlertSet, from_column: organization_id}
      - {type: triggered_by, to: AlertRule, to_key: rule_id, from_column: rule_id}

  cdp.anomaly_threshold_state:
    product: cdp
    label: AlertThreshold
    key: uid
    synthesize_key: "{organization_id}:{rule_id}"
    access: {domain: cdp, module: intelligence, sensitivity: L1}
    edge_budget: 1
    properties: [organization_id, rule_id, dynamic_threshold, method,
                 sample_size, confidence, computed_at]
    relationships:
      - {type: has_threshold, from: AlertRule, from_key: rule_id, from_column: rule_id}

  cdp.agentic_model:
    product: cdp
    label: PredictionModel
    key: uid
    synthesize_key: "{organization_id}:{model_name}"
    access: {domain: cdp, module: intelligence, sensitivity: L1}
    edge_budget: 1
    properties: [organization_id, products, model_name, job_id, model_id, status,
                 dirty, dirty_reason, dirty_at, onboarded_at, trained_at,
                 last_predict_at, last_error, updated_at]
    relationships:
      - {type: has_prediction_model, from: CustomerDataHub, from_column: organization_id}

  cdp.source_systems:
    product: cdp
    label: DataSource
    key: source_id
    access: {domain: cdp, module: intelligence, sensitivity: L1}
    edge_budget: 1
    custom_field: custom_fields
    custom_dynamic: true
    properties: [source_id, organization_id, source_name, source_type, active, created_at]
    relationships:
      - {type: has_data_source, from: CustomerDataHub, from_column: organization_id}
    # Hub-level only. Facts carry source_name as a property; v1 emitted
    # FROM_SOURCE per event, which made this a supernode for zero query value.

  # --- observed commerce (generic: any tenant that sells anything) -----------

  cdp.orders:
    product: cdp
    readable_by: [crm, campaign]
    label: Purchase
    key: order_id
    access: {domain: cdp, module: commerce, sensitivity: L2}
    edge_budget: 1
    collection: {name: ActivityHistory, owner_column: cdp_id, bucket_column: created_at}
    custom_field: custom_fields
    custom_dynamic: true
    properties: [order_id, cdp_id, organization_id, order_number, status,
                 {name: total_amount, type: decimal, scale: 2, currency_column: currency},
                 currency, payment_status, fulfillment_status, shipping_country,
                 created_at, updated_at]

  cdp.order_items:
    product: cdp
    readable_by: [crm]
    mode: relationship_only
    access: {domain: cdp, module: commerce, sensitivity: L1}
    from: {label: Purchase, key: order_id, column: order_id}
    to: {label: Product, key: id, column: product_id}
    type: includes
    properties: [quantity, unit_price, subtotal_amount]
    verify: "CDP reference points order_items.product_id at cdp.products (UUID), not inventory.products. Confirm the repoint before enabling."
    fan_in_warning: "Product accumulates one includes edge per line item. Traverse purchase -> product only; never product -> purchases."

  # ===========================================================================
  # WEB TRACKING  (source: web tracking — generic, no industry assumption)
  # ===========================================================================

  digital.tracked_sites:
    product: webtracking
    label: Website
    key: site_id
    access: {domain: webtracking, module: digital, sensitivity: L1}
    edge_budget: 1
    properties: [site_id, organization_id, site_url, site_type, status,
                 created_at, updated_at]
    relationships:
      - {type: has_website, from: WebTrackingHub, from_column: organization_id}
    source: "v_web_tracking_ingest_registry (Postgres view) — authoritative site registry"
    # v1 declared WebTrackingCatalog and then attached nothing to it. This is
    # the missing writer: the hub now has a reason to exist.

  # ===========================================================================
  # CONTACT CENTRE  (source: ccass — contact centre runtime)
  # ===========================================================================

  ccass.agents:
    product: platform
    readable_by: [ccaas, ticketing]
    label: Staff
    key: uid
    synthesize_key: "service:{id}"
    access: {domain: ccaas, module: workforce, sensitivity: L2}
    edge_budget: 1
    sublabels: {static: ContactCentreStaff}
    properties: [id, organization_id, display_name, email, status, setup_user_id,
                 created_at, updated_at]
    relationships:
      - {type: role_of, to: Employee, to_key: id, from_column: setup_user_id}
    # One label for "a role a person holds in a product". ticketing.agents
    # merges here as SupportStaff. A query for "everything this person does"
    # is now (:Employee)<-[:role_of]-(:Staff), not two product-specific
    # traversals with differently named back-edges.

  ccass.skills:
    product: ccaas
    label: Skill
    key: id
    access: {domain: ccaas, module: workforce, sensitivity: L1}
    edge_budget: 1
    properties: [id, organization_id, key, name, description, is_active,
                 created_at, updated_at]
    relationships:
      - {type: has_skill, from: ContactCentreHub, from_column: organization_id}

  ccass.agent_skills:
    product: ccaas
    mode: relationship_only
    access: {domain: ccaas, module: workforce, sensitivity: L1}
    from: {label: Staff, key: uid, column: agent_id, key_template: "service:{agent_id}"}
    to: {label: Skill, key: id, column: skill_id}
    type: skilled_in
    properties: [proficiency, priority, verified_at, expires_at]

  ccass.agent_capacity:
    product: ccaas
    label: ChannelCapacity
    key: id
    access: {domain: ccaas, module: workforce, sensitivity: L1}
    edge_budget: 1
    properties: [id, organization_id, agent_id, channel, max_concurrency,
                 reserved_count, active_count, version, updated_at]
    relationships:
      - {type: has_capacity, from: Staff, from_key: uid, from_column: agent_id, from_key_template: "service:{agent_id}"}

  ccass.agent_presence:
    product: ccaas
    label: StaffAvailability
    key: id
    access: {domain: ccaas, module: workforce, sensitivity: L1}
    edge_budget: 1
    properties: [id, organization_id, agent_id, status, presence_state, reason_code,
                 heartbeat_at, lease_expires_at, version, source, updated_at]
    relationships:
      - {type: has_availability, from: Staff, from_key: uid, from_column: agent_id, from_key_template: "service:{agent_id}"}
    # reason_code stays a property. StatusReason is a config node under the
    # hub; linking it per presence row bought nothing.

  ccass.presence_reason_codes:
    product: ccaas
    label: StatusReason
    key: id
    access: {domain: ccaas, module: workforce, sensitivity: L1}
    edge_budget: 1
    properties: [id, organization_id, code, label, presence_state, requires_note,
                 is_active, created_at, updated_at]
    relationships:
      - {type: has_status_reason, from: ContactCentreHub, from_column: organization_id}

  # --- routing ---------------------------------------------------------------

  ccass.queues:
    product: ccaas
    label: Queue
    key: id
    access: {domain: ccaas, module: routing, sensitivity: L1}
    edge_budget: 5
    properties: [id, organization_id, setup_queue_id, name, team_id,
                 business_hours_id, shift_types, skills, status, published_at, updated_at]
    owns_collections: [RoutingHistory]
    relationships:
      - {type: has_queue, from: ContactCentreHub, from_column: organization_id}
      - {type: copy_of, to: QueueSetup, to_key: id, from_column: setup_queue_id}
      - {type: owned_by_team, to: Team, to_key: id, from_column: team_id}
      - {type: follows_hours, to: BusinessHours, to_key: id, from_column: business_hours_id}
    # copy_of replaces v1's PUBLISHED_FROM / MIRRORED_FROM, which named
    # the same relation two ways across two products.

  ccass.queue_members:
    product: ccaas
    tenant:
      via:
        - {column: queue_id, parent: ccass.queues, parent_key: id}
    mode: relationship_only
    access: {domain: ccaas, module: routing, sensitivity: L1}
    from: {label: Queue, key: id, column: queue_id}
    to: {label: Staff, key: uid, column: agent_id, key_template: "service:{agent_id}"}
    type: has_member
    properties: [shift_type, call_type, handles_calls, handles_email, handles_chat,
                 handles_social, chat_concurrency, email_concurrency, social_concurrency]

  ccass.queue_skills:
    product: ccaas
    mode: relationship_only
    access: {domain: ccaas, module: routing, sensitivity: L1}
    from: {label: Queue, key: id, column: queue_id}
    to: {label: Skill, key: id, column: skill_id}
    type: requires_skill
    properties: [requirement_type, min_proficiency, weight]

  ccass.queue_routing_profiles:
    product: ccaas
    merges_into: RoutingProfile
    key: uid
    synthesize_key: "live:{id}"
    access: {domain: ccaas, module: routing, sensitivity: L1}
    edge_budget: 1
    sublabels: {static: LiveRoutingProfile}
    custom_field: skill_mapping
    custom_dynamic: true
    properties: [id, organization_id, queue_id, description, supported_intents,
                 example_phrases, keywords, language_codes, classifier_version, updated_at]
    relationships:
      - {type: has_routing_profile, from: Queue, from_key: id, from_column: queue_id}

  ccass.routing_policies:
    product: ccaas
    label: RoutingPolicy
    key: id
    access: {domain: ccaas, module: routing, sensitivity: L1}
    edge_budget: 2
    properties: [id, organization_id, queue_id, strategy, priority,
                 offer_timeout_seconds, max_attempts, overflow_queue_id,
                 after_contact_work_seconds, email_offer_timeout_seconds,
                 email_first_response_sla_seconds, email_resolution_sla_seconds,
                 email_after_contact_work_seconds, missed_callback_grace_minutes,
                 created_at, updated_at]
    relationships:
      - {type: has_routing_policy, from: Queue, from_key: id, from_column: queue_id}
      - {type: overflows_to, to: Queue, to_key: id, from_column: overflow_queue_id}

  # --- policies (three tables, one concept) ----------------------------------

  ccass.channel_automation_policies:
    product: ccaas
    label: BotPolicy
    key: uid
    synthesize_key: "channel:{id}"
    access: {domain: ccaas, module: automation, sensitivity: L1}
    edge_budget: 3
    sublabels: {static: ChannelBotPolicy}
    custom_field: channel_settings
    custom_dynamic: true
    properties: [id, organization_id, channel_config_id, channel, bot_enabled,
                 live_agent_enabled, automation_mode,
                 {name: confidence_threshold, type: decimal, scale: 3},
                 default_queue_id, handoff_message, no_agent_behavior,
                 inactivity_close_seconds, shadow_mode, policy_version, status,
                 created_at, updated_at]
    relationships:
      - {type: has_bot_policy, from: ContactCentreHub, from_column: organization_id}
      - {type: policy_for, to: ConnectedChannel, to_key: id, from_column: channel_config_id}
      - {type: default_queue, to: Queue, to_key: id, from_column: default_queue_id}

  ccass.email_mailbox_policies:
    product: ccaas
    merges_into: BotPolicy
    key: uid
    synthesize_key: "mailbox:{id}"
    access: {domain: ccaas, module: automation, sensitivity: L2}
    edge_budget: 2
    sublabels: {static: EmailBotPolicy}
    properties: [id, organization_id, connection_id, account_email, bot_enabled,
                 live_agent_enabled, shadow_mode, auto_send_enabled,
                 {name: confidence_threshold, type: decimal, scale: 3},
                 default_queue_id, business_hours_mode, policy_version, status,
                 inactivity_close_hours, created_at, updated_at]
    relationships:
      - {type: has_bot_policy, from: ContactCentreHub, from_column: organization_id}
      - {type: default_queue, to: Queue, to_key: id, from_column: default_queue_id}

  ccass.whatsapp_channel_policies:
    product: ccaas
    merges_into: BotPolicy
    key: uid
    synthesize_key: "whatsapp:{id}"
    access: {domain: ccaas, module: automation, sensitivity: L1}
    edge_budget: 3
    sublabels: {static: WhatsAppBotPolicy}
    properties: [id, organization_id, channel_config_id, bot_enabled,
                 live_agent_enabled,
                 {name: confidence_threshold, type: decimal, scale: 3},
                 default_queue_id, approved_handoff_message, inactivity_close_hours,
                 status, created_at, updated_at]
    relationships:
      - {type: has_bot_policy, from: ContactCentreHub, from_column: organization_id}
      - {type: policy_for, to: ConnectedChannel, to_key: id, from_column: channel_config_id}
      - {type: default_queue, to: Queue, to_key: id, from_column: default_queue_id}

  ccass.sla_policies:
    product: platform
    readable_by: [ccaas, ticketing]
    label: SLA
    key: uid
    synthesize_key: "service:{id}"
    access: {domain: ccaas, module: automation, sensitivity: L1}
    edge_budget: 1
    sublabels: {static: ConversationSLA}
    custom_field: escalation_policy
    custom_dynamic: true
    properties: [id, organization_id, name, first_response_seconds, resolution_seconds,
                 warning_threshold_pct, business_hours_mode, is_active,
                 created_at, updated_at]
    relationships:
      - {type: has_sla, from: ContactCentreHub, from_column: organization_id}

  ccass.dispositions:
    product: ccaas
    label: OutcomeCode
    key: id
    access: {domain: ccaas, module: automation, sensitivity: L1}
    edge_budget: 1
    properties: [id, organization_id, code, label, description, category, outcome,
                 requires_note, requires_resolution, is_active, sort_order,
                 created_at, updated_at]
    relationships:
      - {type: has_outcome_code, from: ContactCentreHub, from_column: organization_id}

  # --- conversations ---------------------------------------------------------

  ccass.conversations:
    product: ccaas
    label: Conversation
    key: id
    access: {domain: ccaas, module: conversations, sensitivity: L2}
    edge_budget: 4
    collection: {name: ConversationHistory, owner_column: contact_id, bucket_column: created_at}
    extra_labels:
      - {label: BotHandled,   when: {bot_active: [true]}}
      - {label: StaffHandled, when: {lifecycle_state: [connected, wrap_up]}}
    custom_field: resolution_data
    custom_dynamic: true
    properties: [id, organization_id, channel, external_thread_id, provider_thread_id,
                 webchat_id, visitor_id, contact_id, profile_id, queue_id,
                 assigned_agent_id, assigned_user_id, status, lifecycle_state,
                 lifecycle_version, priority, subject, handoff_reason, bot_active,
                 nlp_enabled, live_agent_enabled, automation_policy_version,
                 disposition_code, disposition_note, resolution_code, resolution_summary,
                 sla_status, version, queued_at, assigned_at, first_response_at,
                 transferred_at, resolved_at, closed_at, ended_at, end_reason, end_actor,
                 first_response_due_at, resolution_due_at, first_agent_response_at,
                 mailbox_connection_id, channel_config_id, previous_conversation_id,
                 created_at, updated_at]
    relationships:
      - {type: routed_to, to: Queue, to_key: id, from_column: queue_id}
      - {type: handled_by, to: Staff, to_key: uid, from_column: assigned_agent_id, to_key_template: "service:{assigned_agent_id}"}
      - {type: continues, to: Conversation, to_key: id, from_column: previous_conversation_id}
    verify: "contact_id: the CCaaS reference points this at cdp.contacts.id, not customer_profile.cdp_id. If those id spaces differ, the ConversationHistory collection attaches under the wrong person. Blocking."
    # v1 emitted 9 edges/row here, including THROUGH(Channel), HAS_STATUS
    # (GlobalTicketStatus) and HAS_PROACTIVE_HISTORY — the last of which minted
    # one dead node per conversation. All three removed.

  ccass.conversation_memory:
    product: ccaas
    label: ConversationMemory
    key: id
    access: {domain: ccaas, module: conversations, sensitivity: L2}
    edge_budget: 1
    properties: [id, organization_id, conversation_id, rolling_summary,
                 extracted_facts, latest_summarized_message_id, model_name,
                 token_estimate, version, updated_at]
    relationships:
      - {type: has_memory, from: Conversation, from_key: id, from_column: conversation_id}

  ccass.conversation_sla_state:
    product: ccaas
    label: SlaTimer
    key: id
    access: {domain: ccaas, module: conversations, sensitivity: L1}
    edge_budget: 2
    properties: [id, organization_id, conversation_id, sla_policy_id,
                 first_response_due_at, resolution_due_at, first_response_warning_at,
                 resolution_warning_at, breached_at, updated_at]
    relationships:
      - {type: has_sla_timer, from: Conversation, from_key: id, from_column: conversation_id}
      - {type: governed_by, to: SLA, to_key: uid, from_column: sla_policy_id, to_key_template: "service:{sla_policy_id}"}

  ccass.conversation_dispositions:
    product: ccaas
    label: ConversationOutcome
    key: id
    access: {domain: ccaas, module: conversations, sensitivity: L1}
    edge_budget: 2
    custom_field: resolution_data
    custom_dynamic: true
    properties: [id, organization_id, conversation_id, disposition_id, agent_id,
                 applied_by_user_id, note, source, resolution_code, is_final,
                 applied_at, updated_at]
    relationships:
      - {type: has_outcome, from: Conversation, from_key: id, from_column: conversation_id}
      - {type: applied_by, to: Employee, to_key: id, from_column: applied_by_user_id}
    # disposition_id stays a property. OutcomeCode is config; joining every
    # wrap-up to it made a per-tenant supernode out of a picklist.

  ccass.conversation_message_attachments:
    product: ccaas
    label: Attachment
    key: id
    access: {domain: ccaas, module: conversations, sensitivity: L2}
    edge_budget: 1
    properties: [id, organization_id, conversation_id, message_id, external_id,
                 storage_key, file_name, content_type, byte_size, checksum_sha256,
                 status, created_at]
    relationships:
      - {type: has_attachment, from: Conversation, from_key: id, from_column: conversation_id}
    note: "message_id is a property only — conversation_messages is deliberately not in the graph (volume). Message bodies are retrieved from Postgres by id."

  ccass.conversation_notes:
    embed:
      fields: [body]
      property: _embedding
    product: ccaas
    label: InternalNote
    key: uid
    synthesize_key: "conversation:{id}"
    access: {domain: ccaas, module: conversations, sensitivity: L2}
    edge_budget: 2
    sublabels: {static: ConversationNote}
    properties: [id, organization_id, conversation_id, author_user_id, body,
                 created_at, updated_at]
    relationships:
      - {type: has_note, from: Conversation, from_key: id, from_column: conversation_id}
      - {type: written_by, to: Employee, to_key: id, from_column: author_user_id}

  ccass.workspace_common_notes:
    product: ccaas
    merges_into: InternalNote
    key: uid
    synthesize_key: "workspace:{id}"
    access: {domain: ccaas, module: conversations, sensitivity: L2}
    edge_budget: 2
    sublabels: {static: WorkspaceNote}
    properties: [id, organization_id, author_user_id, body, created_at, updated_at]
    relationships:
      - {type: has_note, from: ContactCentreHub, from_column: organization_id}
      - {type: written_by, to: Employee, to_key: id, from_column: author_user_id}

  ccass.conversation_participants:
    product: ccaas
    label: Participant
    key: id
    access: {domain: ccaas, module: conversations, sensitivity: L2}
    edge_budget: 1
    properties: [id, organization_id, conversation_id, participant_type,
                 identity_ref, joined_at, left_at]
    relationships:
      - {type: has_participant, from: Conversation, from_key: id, from_column: conversation_id}
    resolve_later:
      - "identity_ref is a channel identity string (email / visitor id / psid), not an agent id and not a cdp_id. Resolve through CustomerIdentity (org, type, value) once identity_type is available on this table, then add participant_is -> Customer | Staff."
    # v1 pointed identity_ref at both Staff.id and Customer.cdp_id from the same
    # column. Both missed on nearly every row.

  ccass.conversation_assignments:
    product: ccaas
    label: Assignment
    key: id
    access: {domain: ccaas, module: routing, sensitivity: L1}
    edge_budget: 3
    collection: {name: RoutingHistory, owner_column: queue_id, bucket_column: offered_at}
    properties: [id, organization_id, conversation_id, queue_id, agent_id,
                 routing_attempt_id, state, reason, offered_at, accepted_at,
                 rejected_at, expired_at, ended_at, expires_at]
    relationships:
      - {type: assigns, to: Conversation, to_key: id, from_column: conversation_id}
      - {type: offered_to, to: Staff, to_key: uid, from_column: agent_id, to_key_template: "service:{agent_id}"}

  ccass.conversation_transfers:
    product: ccaas
    label: Transfer
    key: id
    access: {domain: ccaas, module: routing, sensitivity: L1}
    edge_budget: 3
    collection: {name: RoutingHistory, owner_column: to_queue_id, bucket_column: requested_at}
    properties: [id, organization_id, conversation_id, from_queue_id, from_agent_id,
                 to_queue_id, requested_agent_id, offered_agent_id, state, notes,
                 disposition_code, resolution_code, requested_at, offered_at,
                 accepted_at, completed_at, cancelled_at, updated_at]
    relationships:
      - {type: transfers, to: Conversation, to_key: id, from_column: conversation_id}
      - {type: from_queue, to: Queue, to_key: id, from_column: from_queue_id}
    # v1 emitted six edges here, three of them to Staff from three different
    # columns. from_agent_id / requested_agent_id / offered_agent_id are
    # properties; the transfer is a queue-level fact.

  ccass.routing_attempts:
    product: ccaas
    label: RoutingAttempt
    key: id
    access: {domain: ccaas, module: routing, sensitivity: L1}
    edge_budget: 2
    collection: {name: RoutingHistory, owner_column: queue_id, bucket_column: created_at}
    properties: [id, organization_id, conversation_id, queue_id, agent_id,
                 attempt_number, outcome, created_at, completed_at]
    relationships:
      - {type: attempt_for, to: Conversation, to_key: id, from_column: conversation_id}

  ccass.webchat_sessions:
    product: ccaas
    label: ChatSession
    key: id
    access: {domain: ccaas, module: conversations, sensitivity: L2}
    edge_budget: 1
    custom_field: prechat_answers
    custom_dynamic: true
    properties: [id, organization_id, conversation_id, webchat_id, visitor_id,
                 page_origin, page_url, created_at, updated_at, ended_at,
                 end_reason, ended_by]
    relationships:
      - {type: has_chat_session, from: Conversation, from_key: id, from_column: conversation_id}

  ccass.agent_missed_contacts:
    product: ccaas
    label: MissedConversation
    key: id
    access: {domain: ccaas, module: routing, sensitivity: L2}
    edge_budget: 2
    collection: {name: Inbox, owner_column: assigned_user_id, bucket_column: missed_at}
    custom_field: metadata
    custom_dynamic: true
    properties: [id, organization_id, agent_id, assigned_user_id, conversation_id,
                 assignment_id, contact_id, queue_id, channel, reason,
                 customer_name, customer_email, customer_phone, offered_at,
                 missed_at, acknowledged_at, created_at]
    relationships:
      - {type: missed, to: Conversation, to_key: id, from_column: conversation_id}
    verify: "table is not present in the introspected ccass reference — confirm it exists"

  ccass.agent_tasks:
    product: ccaas
    label: Task
    key: id
    access: {domain: ccaas, module: workspace, sensitivity: L1}
    edge_budget: 3
    collection: {name: Inbox, owner_column: assigned_user_id, bucket_column: created_at}
    custom_field: metadata
    custom_dynamic: true
    properties: [id, organization_id, assigned_user_id, created_by_user_id,
                 assigned_by_user_id, assigned_by_label, contact_id, conversation_id,
                 task_type, status, priority, source, title, summary, notes, channel,
                 due_at, completed_at, dismissed_at, created_at, updated_at]
    relationships:
      - {type: about_conversation, to: Conversation, to_key: id, from_column: conversation_id}
      - {type: created_by, to: Employee, to_key: id, from_column: created_by_user_id}

  # --- bot runtime -----------------------------------------------------------

  ccass.nlp_skills:
    product: ccaas
    label: BotSkill
    key: id
    access: {domain: ccaas, module: automation, sensitivity: L1}
    edge_budget: 2
    properties: [id, organization_id, skill_key, name, description, skill_type,
                 owner_user_id, state, created_at, updated_at]
    relationships:
      - {type: has_bot_skill, from: ContactCentreHub, from_column: organization_id}
