    key: id
    access: {domain: ticketing, module: support, sensitivity: L1}
    edge_budget: 1
    properties: [id, organization_id, title, body, created_by_id, created_by_name,
                 created_at, updated_at]
    relationships:
      - {type: has_macro, from: SupportHub, from_column: organization_id}

  ticketing.automation_rules:
    product: ticketing
    label: AutomationRule
    key: id
    access: {domain: ticketing, module: support, sensitivity: L1}
    edge_budget: 1
    properties: [id, organization_id, name, event, enabled, priority,
                 created_by_id, created_by_name, created_at, updated_at]
    relationships:
      - {type: has_rule, from: SupportHub, from_column: organization_id}

  # ticketing.dashboard_metrics: excluded from graph (definitions/entities.yml)

  ticketing.audit_events:
    product: ticketing
    label: AuditEvent
    key: id
    access: {domain: ticketing, module: compliance, sensitivity: L1}
    edge_budget: 2
    collection: {name: TicketHistory, owner_column: ticket_id}
    properties: [id, organization_id, actor_id, actor_name, action, ticket_id,
                 ticket_number, created_at]
    relationships:
      - {type: performed_by, to: Staff, to_key: uid, from_column: actor_id, to_key_template: "support:{actor_id}"}

  ticketing.email_message_refs:
    product: ticketing
    label: InboundEmail
    key: id
    access: {domain: ticketing, module: support, sensitivity: L2}
    edge_budget: 1
    properties: [id, organization_id, message_id, ticket_id, ticket_number, created_at]
    relationships:
      - {type: about_ticket, to: Ticket, to_key: id, from_column: ticket_id}

  ticketing.outbound_email_log:
    product: ticketing
    label: OutboundEmail
    key: id
    access: {domain: ticketing, module: support, sensitivity: L2}
    edge_budget: 1
    collection: {name: TicketHistory, owner_column: ticket_id}
    properties: [id, organization_id, ticket_id, ticket_number, kind, to_email,
                 subject, body_preview, status, error, created_at]

  ticketing.conversation_contexts:
    product: ticketing
    label: AssistantSession
    key: id
    access: {domain: ticketing, module: workspace, sensitivity: L2}
    edge_budget: 1
    properties: [id, organization_id, user_id, user_key, session_key, version,
                 created_at, updated_at, expires_at]
    relationships:
      - {type: used_by, to: Staff, to_key: uid, from_column: user_id, to_key_template: "support:{user_id}"}
    # v1 filed this under domain ccaas / module conversations. It is a
    # ticketing workspace table; a misfiled domain is an RBAC defect.

  ticketing.workflow_events:
    product: ticketing
    label: WorkflowEvent
    key: id
    access: {domain: ticketing, module: workspace, sensitivity: L1}
    edge_budget: 1
    properties: [id, organization_id, user_id, user_key, session_key, request_id,
                 conversation_context_id, workflow_id, workflow_type, event_type,
                 version, created_at, expires_at]
    relationships:
      - {type: has_event, from: AssistantSession, from_key: id, from_column: conversation_context_id}

  # --- proactive support agents ----------------------------------------------

  # ticketing.proactive_outbox: excluded from graph (definitions/entities.yml)

  ticketing.proactive_recommendations:
    embed:
      fields: [status, reason]
      property: _embedding
    product: ticketing
    label: Recommendation
    key: id
    access: {domain: ticketing, module: automation, sensitivity: L1}
    edge_budget: 1
    collection: {name: ProactiveHistory, owner_column: ticket_id, coerce_owner_to_int: true}
    properties: [id, organization_id, agent_id, ticket_id, status, reason,
                 dedupe_key, created_at]
    note: "agent_id here is a proactive agent code (sema | wloa | tiaa | rcaa), not a Staff node. Property only."

  ticketing.proactive_approvals:
    product: ticketing
    label: Approval
    key: id
    access: {domain: ticketing, module: automation, sensitivity: L1}
    edge_budget: 1
    collection: {name: ProactiveHistory, owner_column: ticket_id, coerce_owner_to_int: true}
    properties: [id, organization_id, agent_id, ticket_id, status, tool_name, created_at]

  ticketing.proactive_audit:
    product: ticketing
    label: ProactiveDecision
    key: id
    access: {domain: ticketing, module: automation, sensitivity: L1}
    edge_budget: 2
    collection: {name: ProactiveHistory, owner_column: ticket_id, coerce_owner_to_int: true}
    properties: [id, organization_id, agent_id, ticket_id, event_id, decision,
                 reason, tool_name, created_at]
    relationships:
      - {type: decided_on, to: ProactiveEvent, to_key: id, from_column: event_id}

  # ticketing.proactive_routing_weights: excluded from graph (definitions/entities.yml)

  ticketing.notifications:
    product: platform
    readable_by: [crm, ticketing, campaign]
    merges_into: Notification
    key: uid
    synthesize_key: "support:{id}"
    access: {domain: ticketing, module: workspace, sensitivity: L1}
    edge_budget: 1
    sublabels: {static: SupportNotification}
    properties: [id, organization_id, user_id, title, message, ticket_id,
                 customer_name, is_read, kind, created_at]
    relationships:
      - {type: about_ticket, to: Ticket, to_key: id, from_column: ticket_id}

  # ===========================================================================
  # MARKETING  (source: campaign)
  # ===========================================================================

  campaign.branches:
    product: platform
    label: Branch
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 1
    properties: [id, organization_id, name, is_default, created_at, updated_at]
    relationships:
      - {type: has_branch, from: SetupHub, from_column: organization_id}
    # Generic scoping concept, not campaign-specific. Any product may scope to
    # a Branch; campaign happens to be the first that does.

  campaign.organization_products:
    product: platform
    label: Subscription
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 2
    properties: [id, organization_id, branch_id, product_code, status,
                 starts_at, ends_at, created_at, updated_at]
    relationships:
      - {type: has_subscription, from: Branch, from_key: id, from_column: branch_id}
      - {type: for_app, to: PlatformApp, to_key: code, from_column: product_code, create_target: true}
    verify: "product_code is a Prisma enum (campaign | crm). Role.product_id uses slugs (crm | contact-center). Both MERGE into PlatformApp — reconcile the vocabularies or the label holds two id spaces."

  campaign.campaigns:
    embed:
      fields: [name, description, source_channel, goal, objective, audience_summary]
      property: _embedding
    product: campaign
    label: Campaign
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 3
    extra_labels:
      - {label: LiveCampaign,      when: {status: [live]}}
      - {label: ScheduledCampaign, when: {status: [scheduled]}}
    custom_field: launch_plan
    custom_dynamic: true
    properties: [id, organization_id, branch_id, name, description, status,
                 starts_at, ends_at, source_channel, created_by_user_id, goal,
                 objective, session_id, audience_summary, audience_filters,
                 audience_count, launch_local_date, launch_local_time, timezone,
                 created_at, updated_at]
    relationships:
      - {type: has_campaign, from: MarketingHub, from_column: organization_id}
      - {type: in_branch, to: Branch, to_key: id, from_column: branch_id}
      - {type: from_draft, to: CampaignDraft, to_key: id, from_column: session_id}
    # Audience membership is NOT an edge from Campaign. v1 emitted three edges
    # per audience row (TARGETED_IN, HAS_AUDIENCE_MEMBER, MEMBER_OF_AUDIENCE),
    # making Campaign a 1.2M-degree supernode. Membership is reachable from the
    # customer side through MessageHistory; size is audience_count.

  campaign.campaign_channels:
    product: campaign
    label: ChannelPlan
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 2
    properties: [id, campaign_id, organization_id, channel, template_id,
                 how_it_works, planned_launch_at, status, created_at, updated_at]
    relationships:
      - {type: has_channel_plan, from: Campaign, from_key: id, from_column: campaign_id}
      - {type: uses_template, to: MessageTemplate, to_key: id, from_column: template_id}

  campaign.campaign_audience:
    product: campaign
    tenant:
      via:
        - {column: campaign_id, parent: campaign.campaigns, parent_key: id}
    mode: relationship_only
    access: {domain: campaign, module: marketing, sensitivity: L2}
    from: {label: Customer, key: cdp_id, column: contact_id}
    to: {label: Campaign, key: id, column: campaign_id}
    type: targeted_by
    properties: [created_at]
    fan_in_warning: "Campaign is a legitimate supernode on this edge. Traverse customer -> campaign only. For 'who is in this campaign', query Postgres or use audience_count."

  campaign.campaign_agent_sessions:
    product: campaign
    label: CampaignDraft
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 3
    properties: [id, organization_id, branch_id, created_by_user_id, module, stage,
                 created_at, updated_at]
    owns_collections: [DraftAudience, ContentBatch]
    relationships:
      - {type: in_branch, to: Branch, to_key: id, from_column: branch_id}
      - {type: created_by, to: Employee, to_key: id, from_column: created_by_user_id}

  campaign.campaign_audience_refs:
    product: campaign
    tenant:
      via:
        - {column: session_id, parent: campaign.campaign_agent_sessions, parent_key: id}
    mode: relationship_only
    access: {domain: campaign, module: marketing, sensitivity: L2}
    from: {label: DraftAudience, key: id, column: session_id}
    to: {label: Customer, key: cdp_id, column: contact_id}
    type: contains

  campaign.campaign_channel_templates:
    embed:
      fields: [channel, how_it_works]
      property: _embedding
    product: campaign
    label: MessageTemplate
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 3
    custom_field: fields
    custom_dynamic: true
    properties: [id, session_id, organization_id, branch_id, channel, logo,
                 launch_at, how_it_works, generation_batch_id, created_at, updated_at]
    collection: {name: ContentBatch, owner_column: generation_batch_id}
    relationships:
      - {type: drafted_in, to: CampaignDraft, to_key: id, from_column: session_id}
      - {type: in_branch, to: Branch, to_key: id, from_column: branch_id}

  campaign.campaign_template_messages:
    product: campaign
    tenant:
      via:
        - {column: template_id, parent: campaign.campaign_channel_templates, parent_key: id}
    label: TemplateVersion
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 1
    properties: [id, template_id, role, seq, kind, created_at]
    relationships:
      - {type: has_version, from: MessageTemplate, from_key: id, from_column: template_id}

  campaign.regulated_channel_templates:
    product: campaign
    label: RegisteredTemplate
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 3
    extra_labels:
      - {label: PendingTemplate,  when: {status: [pending]}}
      - {label: RejectedTemplate, when: {status: [rejected]}}
    properties: [id, organization_id, channel, name, external_id,
                 provider_template_id, language, category, header, body, footer,
                 buttons, status, rejected_reason, channel_config_id, submitted_at,
                 last_status_checked_at, created_by_user_id, campaign_name, goal,
                 objective, source_campaign_id, created_at, updated_at]
    relationships:
      - {type: has_registered_template, from: MarketingHub, from_column: organization_id}
      - {type: sends_via, to: ConnectedChannel, to_key: id, from_column: channel_config_id}
      - {type: for_campaign, to: Campaign, to_key: id, from_column: source_campaign_id}
    verify: "channel_config_id is bigint in the campaign schema and uuid in the accounts schema per its reference. Confirm the type before enabling sends_via."

  # --- sending readiness -----------------------------------------------------

  campaign.channel_sending_profiles:
    product: campaign
    label: ChannelReadiness
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 2
    custom_field: checklist
    custom_dynamic: true
    properties: [id, organization_id, channel, status, created_at, updated_at]
    relationships:
      - {type: has_channel_readiness, from: MarketingHub, from_column: organization_id}
      - {type: for_channel, to: Channel, to_key: name, from_column: channel, create_target: true}
    # v1 emitted FOR_CHANNEL and THROUGH to the same node from the same column.

  campaign.push_channel_settings:
    product: campaign
    label: ChannelSettings
    key: uid
    synthesize_key: "push:{id}"
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 1
    sublabels: {static: PushSettings}
    properties: [id, organization_id, channel, status, created_at, updated_at]
    relationships:
      - {type: has_channel_settings, from: MarketingHub, from_column: organization_id}

  campaign.sms_channel_settings:
    product: campaign
    merges_into: ChannelSettings
    key: uid
    synthesize_key: "sms:{id}"
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 1
    sublabels: {static: SmsSettings}
    properties: [id, organization_id, channel, status, created_at, updated_at]
    relationships:
      - {type: has_channel_settings, from: MarketingHub, from_column: organization_id}

  campaign.email_org_profiles:
    product: campaign
    label: SenderProfile
    key: organization_id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 1
    properties: [organization_id, legal_name, street, city, country, phone,
                 created_at, updated_at]
    relationships:
      - {type: has_sender_profile, from: MarketingHub, from_column: organization_id}
    # v1 pointed every Message at this node (COMPLIES_WITH), giving the
    # highest-volume table in the platform an edge to a per-org singleton.
    # Compliance is a property of the send, resolved at batch level.

  campaign.email_senders:
    product: campaign
    label: SenderEmail
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L2}
    edge_budget: 2
    properties: [id, organization_id, display_name, from_email, reply_to, status,
                 verified_at, is_active, created_at, updated_at]
    relationships:
      - {type: has_sender_email, from: MarketingHub, from_column: organization_id}
      - {type: verified_on, to: EmailDomain, match_fields: {domain: sender_domain, organization_id: organization_id}}
    derived_here: {sender_domain: "lower(split_part(from_email, '@', 2))"}

  campaign.email_domains:
    product: campaign
    label: EmailDomain
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 1
    extra_labels:
      - {label: VerifiedDomain, when: {spf_ok: [true], dkim_ok: [true], dmarc_ok: [true]}}
    properties: [id, organization_id, domain, spf_ok, dkim_ok, dmarc_ok, status,
                 provider_domain_id, dns_records, dkim_selector, dkim_public_key,
                 created_at, updated_at]
    relationships:
      - {type: has_email_domain, from: MarketingHub, from_column: organization_id}

  campaign.email_return_paths:
    product: campaign
    label: BounceDomain
    key: organization_id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 1
    properties: [organization_id, domain, status, created_at, updated_at]
    relationships:
      - {type: has_bounce_domain, from: MarketingHub, from_column: organization_id}

  campaign.email_sending_caps:
    product: campaign
    label: SendingLimit
    key: organization_id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 1
    custom_field: health_stats
    custom_dynamic: true
    properties: [organization_id, batch_size, hourly_cap, daily_cap, warmup_stage,
                 health_status, created_at, updated_at]
    relationships:
      - {type: has_sending_limit, from: MarketingHub, from_column: organization_id}

  campaign.email_suppressions:
    product: campaign
    label: BlockedEmail
    key: uid
    synthesize_key: "{organization_id}:{email}"
    access: {domain: campaign, module: compliance, sensitivity: L2}
    edge_budget: 0
    properties: [organization_id, email, reason, created_at]
    indexes_required: ["BlockedEmail(uid) — checked per recipient at send time"]
    # No edge to the hub: suppression is an email-keyed lookup, not a browsable
    # child. v1 hung every suppressed address off MarketingHub.

  # --- send path (highest volume in the platform) ----------------------------

  campaign.campaign_send_batches:
    product: campaign
    label: SendBatch
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 3
    properties: [id, organization_id, campaign_id, channel, seq, scheduled_for,
                 status, size, created_at, updated_at]
    relationships:
      - {type: has_batch, from: Campaign, from_key: id, from_column: campaign_id}
      - {type: limited_by, to: SendingLimit, to_key: organization_id, from_column: organization_id}
      - {type: complies_with, to: SenderProfile, to_key: organization_id, from_column: organization_id}

  campaign.campaign_send_recipients:
    product: campaign
    label: Message
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L2}
    edge_budget: 2
    extra_labels:
      - {label: OpenedMessage,  when: {opened_at: not_null}}
      - {label: ClickedMessage, when: {clicked_at: not_null}}
      - {label: FailedMessage,  when: {status: [failed, skipped]}}
    collection: {name: MessageHistory, owner_column: contact_id, bucket_column: created_at}
    properties: [id, organization_id, batch_id, campaign_id, contact_id, email,
                 destination, platform, status, skip_fail_reason,
                 provider_message_id, attempt_count, ab_variant, opened_at,
                 clicked_at, open_count, click_count, delivery_channel,
                 created_at, updated_at]
    relationships:
      - {type: in_batch, to: SendBatch, to_key: id, from_column: batch_id}
    # 6 edges/row in v1 -> 2. On a 1.2M-recipient campaign that is 7.2M
    # relationships down to 2.4M. campaign_id and delivery_channel are
    # properties; the campaign is one hop up through the batch.

  campaign.push_endpoints:
    product: campaign
    label: PushSubscription
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L2}
    edge_budget: 1
    properties: [id, organization_id, contact_id, channel, platform, endpoint,
                 label, active, created_at, updated_at]
    relationships:
      - {type: has_push_subscription, from: Customer, from_key: cdp_id, from_column: contact_id}
    # Bounded per customer (a handful of devices) so this stays a direct edge.

  campaign.website_contacts:
    product: campaign
    label: Visitor
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L2}
    edge_budget: 1
    sublabels:
      column: visitor_state
      mapping: {anonymous: AnonymousVisitor, identified: KnownVisitor}
    properties: [id, organization_id, visitor_id, contact_id, email, phone,
                 first_name, last_name, origin, path, user_agent, subscribed,
                 endpoint, platform, visit_count, first_seen_at, last_seen_at,
                 subscribed_at, visitor_state, created_at, updated_at]
    relationships:
      - {type: identified_as, to: Customer, to_key: cdp_id, from_column: contact_id}

  campaign.campaign_contact_engagement:
    product: campaign
    label: EmailEngagement
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 1
    extra_labels:
      - {label: Unsubscribed, when: {email_unsubscribed: [true]}}
    properties: [id, organization_id, contact_id, email_unsubscribed,
                 email_unsubscribed_at, email_unsubscribe_reason,
                 last_email_opened_at, last_email_clicked_at, email_open_count,
                 email_click_count, created_at, updated_at]
    relationships:
      - {type: has_email_engagement, from: Customer, from_key: cdp_id, from_column: contact_id}
    # One row per customer, so a direct edge is correct here.

  campaign.tenant_industry_packs:
    product: platform
    label: IndustryPack
    key: organization_id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 1
    properties: [organization_id, pack_id, seed_industry_type, created_at, updated_at]
    relationships:
      - {type: has_industry_pack, from: SetupHub, from_column: organization_id}
    # Moved from MarketingHub to SetupHub: the pack shapes contact
    # fields for every product, not just campaign. This is the seam an
    # industry overlay reads.

  campaign.campaign_recommendations:
    product: campaign
    label: CampaignIdea
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 2
    properties: [id, organization_id, branch_id, created_by_user_id, public_id,
                 status, title, created_at, updated_at]
    relationships:
      - {type: has_campaign_idea, from: MarketingHub, from_column: organization_id}
      - {type: in_branch, to: Branch, to_key: id, from_column: branch_id}
    resolve_later:
      - "status=used has no column recording which campaign or draft consumed the idea. Persist used_campaign_id, then add used_in -> Campaign."

  campaign.app_notifications:
    embed:
      fields: [kind, title, body]
      property: _embedding
    product: platform
    readable_by: [crm, ticketing, campaign]
    merges_into: Notification
    key: uid
    synthesize_key: "campaign:{id}"
    access: {domain: campaign, module: workspace, sensitivity: L1}
    edge_budget: 2
    sublabels: {static: MarketingNotification}
    properties: [id, organization_id, user_id, kind, title, body, href, source_key,
                 subject_kind, subject_id, created_at, read_at]
    relationships:
      - {type: about_campaign, to: Campaign, to_key: id, from_column: subject_id, when: {subject_kind: [campaign]}}
      - {type: about_template, to: RegisteredTemplate, to_key: id, from_column: subject_id, when: {subject_kind: [template, whatsapp]}}
    # v1 used one ABOUT type pointing at two labels from two columns. Typed
    # edges with a `when` guard remove the ambiguity for query authors.

ci_rules:
  - {id: R01, rule: "every table declares product, access.domain, access.sensitivity and edge_budget"}
  - {id: R02, rule: "relationships emitted per row <= edge_budget"}
  - {id: R03, rule: "sensitivity recomputed from columns against sensitivity_rubric; fail on drift"}
  - {id: R04, rule: "no entry in properties_not_nodes may be re-promoted to a node"}
  - {id: R05, rule: "a table with `collection:` may not also declare an owner edge to that collection's owner"}
  - {id: R06, rule: "every derived column referenced by a mapping exists in `derived:`"}
  - {id: R07, rule: "every relationship target label is declared as a table label, merged label, hub, collection or stub"}
  - {id: R08, rule: "for each entry in `bundles:`, pairwise connectivity holds across visible labels"}
  - {id: R09, rule: "every product: platform label is reachable in every bundle"}
  - {id: R10, rule: "readable_by may only name sellable products; a label may not be readable_by its own product"}
  - {id: R11, rule: "no table declares a direct edge to Tenant other than hub creation"}
  - {id: R12, rule: "every `key: uid` declares synthesize_key, and the template references existing columns"}
  - {id: R13, rule: "merged label contributors have disjoint property sets after rename"}
  - {id: R14, rule: "type of from_column matches type of target key; coerce_to_int / coerce_to_string declared explicitly"}
  - {id: R15, rule: "projection cache key includes tenant, entitled products and role access domains"}
  - {id: R16, rule: "every unresolved `verify:` and `resolve_later:` blocks release of the table it sits on"}
