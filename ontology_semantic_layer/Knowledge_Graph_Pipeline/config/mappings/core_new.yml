                 created_at, updated_at]
    relationships:
      - {type: has_bot_session, from: Conversation, from_key: id, from_column: conversation_id}
      - {type: used_version, to: BotSkillVersion, to_key: id, from_column: skill_version_id}

  # --- cross-product interaction rollup --------------------------------------

  cdp.interactions:
    product: cdp
    readable_by: [crm, ccaas]
    label: ConversationSummary
    key: id
    access: {domain: cdp, module: conversations, sensitivity: L2}
    edge_budget: 3
    collection: {name: TouchpointHistory, owner_column: contact_id, bucket_column: started_at}
    custom_field: topics
    custom_dynamic: true
    properties: [id, organization_id, conversation_id, contact_id, profile_id,
                 visitor_id, channel, queue_id, agent_id, status, started_at,
                 ended_at, outcome, summary, sentiment, disposition_code,
                 sla_result, last_activity_at, created_at, updated_at]
    relationships:
      - {type: summary_of, to: Conversation, to_key: id, from_column: conversation_id}
      - {type: routed_to, to: Queue, to_key: id, from_column: queue_id}

  # ===========================================================================
  # PRODUCT CATALOG  (generic commercial spine — any tenant that sells)
  # ===========================================================================

  inventory.products:
    embed:
      fields: [name, tagline, description, category, subcategory, brand]
      property: _embedding
    product: platform
    readable_by: [crm, cdp, campaign]
    label: Product
    key: id
    access: {domain: common, module: commerce, sensitivity: L1}
    edge_budget: 1
    properties: [id, organization_id, name, tagline, description, specifications,
                 image_url, product_url, sku, brand, category, subcategory, tags,
                 stock_on_hand,
                 {name: price, type: decimal, scale: 2, currency_column: currency},
                 currency, max_discount_percent, status, product_type,
                 billing_type, billing_frequency, unit_of_measure,
                 created_at, updated_at]
    relationships:
      - {type: has_product, from: ProductCatalog, from_column: organization_id}
    fan_in_warning: "Product accumulates LineItem and Purchase references. Never traverse outward from Product without a period or LIMIT filter."

  crm.product_offers:
    product: crm
    readable_by: [cdp, campaign]
    label: ProductPlan
    key: id
    access: {domain: crm, module: commerce, sensitivity: L1}
    edge_budget: 1
    properties: [id, organization_id, product_id, name, code, billing_type,
                 billing_frequency, included_qty, meter_key, sort_order, status,
                 created_at, updated_at]
    relationships:
      - {type: plan_for, to: Product, to_key: id, from_column: product_id}

  crm.product_addons:
    product: crm
    readable_by: [cdp, campaign]
    label: AddOn
    key: id
    access: {domain: crm, module: commerce, sensitivity: L1}
    edge_budget: 1
    properties: [id, organization_id, product_id, name, unit_label, meter_key,
                 is_overage, pricing_model,
                 {name: flat_price, type: decimal, scale: 2},
                 {name: unit_price, type: decimal, scale: 4},
                 step_size,
                 {name: step_price, type: decimal, scale: 2},
                 sort_order, created_at, updated_at]
    relationships:
      - {type: add_on_for, to: Product, to_key: id, from_column: product_id}

  crm.product_addon_tiers:
    product: crm
    readable_by: [cdp]
    label: PricingTier
    key: id
    access: {domain: crm, module: commerce, sensitivity: L1}
    edge_budget: 1
    properties: [id, organization_id, addon_id, min_qty, max_qty,
                 {name: unit_price, type: decimal, scale: 4},
                 created_at, updated_at]
    relationships:
      - {type: has_tier, from: AddOn, from_key: id, from_column: addon_id}

  crm.price_books:
    product: crm
    label: PriceList
    key: id
    access: {domain: crm, module: commerce, sensitivity: L1}
    edge_budget: 1
    properties: [id, organization_id, name, code, currency, is_default,
                 created_at, updated_at]
    relationships:
      - {type: has_price_list, from: ProductCatalog, from_column: organization_id}

  crm.price_book_entries:
    product: crm
    label: PriceListEntry
    key: id
    access: {domain: crm, module: commerce, sensitivity: L1}
    edge_budget: 4
    properties: [id, organization_id, price_book_id, product_id, offer_id, addon_id,
                 {name: amount, type: decimal, scale: 2},
                 billing_frequency, created_at, updated_at]
    relationships:
      - {type: has_entry, from: PriceList, from_key: id, from_column: price_book_id}
      - {type: price_for, to: Product, to_key: id, from_column: product_id}
      - {type: price_for, to: ProductPlan, to_key: id, from_column: offer_id}
      - {type: price_for, to: AddOn, to_key: id, from_column: addon_id}

  # ===========================================================================
  # SALES AND REVENUE  (source: crm)
  # ===========================================================================

  crm.organization_profiles:
    product: crm
    label: IndustryProfile
    key: organization_id
    access: {domain: crm, module: sales, sensitivity: L1}
    edge_budget: 1
    custom_field: vertical_config
    custom_dynamic: true
    properties: [organization_id, vertical, created_at, updated_at]
    relationships:
      - {type: has_industry_profile, from: SetupHub, from_column: organization_id}
    note: "vertical here is a CRM pack override. accounts.organizations.industry_type remains the only overlay selector."

  crm.companies:
    product: crm
    label: Account
    key: id
    access: {domain: crm, module: sales, sensitivity: L1}
    edge_budget: 2
    extra_labels:
      - {label: Partner, when: {channel_role: [franchise, owned_store, brand_hq]}}
    properties: [id, organization_id, name, domain, industry, employee_count,
                 linkedin_url, logo_url, owner_user_id, channel_role,
                 parent_company_id, expansion_signal, expansion_reason,
                 expansion_draft, expansion_last_run_at, created_at, updated_at]
    relationships:
      - {type: owned_by, to: Employee, to_key: id, from_column: owner_user_id}
      - {type: part_of, to: Account, to_key: id, from_column: parent_company_id}
    # Not attached to Tenant: unbounded in large B2B tenants.

  crm.company_locations:
    product: crm
    label: AccountLocation
    key: id
    access: {domain: crm, module: sales, sensitivity: L1}
    edge_budget: 2
    properties: [id, organization_id, company_id, name, type, address, city,
                 industry, employee_count, owner_user_id, created_at, updated_at]
    relationships:
      - {type: has_location, from: Account, from_key: id, from_column: company_id}
      - {type: owned_by, to: Employee, to_key: id, from_column: owner_user_id}

  crm.contact_profiles:
    embed:
      fields: [lead_source, lead_status, crm_status, nurture_status, notes]
      property: _embedding
    product: crm
    label: SalesProfile
    key: id
    access: {domain: crm, module: sales, sensitivity: L2}
    edge_budget: 5
    custom_field: custom_attributes
    custom_dynamic: true
    properties: [id, organization_id, account_contact_id, company_id, location_id,
                 owner_user_id, created_by_user_id, lifecycle_stage, lead_source,
                 lead_status, disqualify_reason, crm_status, notes, tags, is_pinned,
                 assignment_reason, sla_deadline, assigned_at, assignment_escalated,
                 nurture_status, nurture_sequence_step, nurture_started_at,
                 nurture_last_touch_at, flagged_for_review, flag_reason,
                 lifecycle_last_action, lifecycle_last_reason, lifecycle_last_run_at,
                 bant_budget, bant_authority, bant_need, bant_timeline,
                 converted_deal_id, marketing_opt_out, marketing_opt_out_at,
                 created_at, updated_at]
    relationships:
      - {type: sales_view_of, to: Customer, to_key: cdp_id, from_column: account_contact_id}
      - {type: works_at, to: Account, to_key: id, from_column: company_id}
      - {type: at_location, to: AccountLocation, to_key: id, from_column: location_id}
      - {type: owned_by, to: Employee, to_key: id, from_column: owner_user_id}
      - {type: converted_to, to: Deal, to_key: id, from_column: converted_deal_id}
    # sales_view_of replaces OVERLAY_OF. Ticketing's SupportProfile uses
    # support_view_of: same pattern, one readable verb per product view.

  crm.deals:
    embed:
      fields: [title, stage, notes, lost_reason]
      property: _embedding
    product: crm
    label: Deal
    key: id
    access: {domain: crm, module: sales, sensitivity: L2}
    edge_budget: 4
    extra_labels:
      - {label: WonDeal,  when: {stage: [closed_won]}}
      - {label: LostDeal, when: {stage: [closed_lost]}}
    properties: [id, organization_id, title, stage,
                 {name: amount, type: decimal, scale: 2},
                 company_id, location_id, contact_id, contact_name, contact_email,
                 owner_user_id, notes, lost_reason, expected_close_date, closed_at,
                 forecast_category, forecast_confidence_percent, forecast_flagged,
                 forecast_reason, forecast_last_run_at, created_at, updated_at]
    relationships:
      - {type: with_account, to: Account, to_key: id, from_column: company_id}
      - {type: at_location, to: AccountLocation, to_key: id, from_column: location_id}
      - {type: primary_contact, to: Customer, to_key: cdp_id, from_column: contact_id}
      - {type: owned_by, to: Employee, to_key: id, from_column: owner_user_id}

  crm.deal_activities:
    product: crm
    label: DealActivity
    key: id
    access: {domain: crm, module: sales, sensitivity: L2}
    edge_budget: 2
    properties: [id, organization_id, deal_id, type, subject, body, due_at,
                 completed_at, created_by_user_id, created_at, updated_at]
    relationships:
      - {type: has_activity, from: Deal, from_key: id, from_column: deal_id}
      - {type: created_by, to: Employee, to_key: id, from_column: created_by_user_id}

  crm.contact_activities:
    product: crm
    label: CustomerActivity
    key: id
    access: {domain: crm, module: sales, sensitivity: L2}
    edge_budget: 2
    collection: {name: ActivityHistory, owner_column: contact_id, bucket_column: created_at}
    extra_labels:
      - {label: EmailActivity, when: {type: [email]}}
      - {label: TaskActivity,  when: {type: [task]}}
      - {label: MeetingActivity, when: {type: [meeting]}}
    custom_field: transcript_insights
    custom_dynamic: true
    properties: [id, organization_id, contact_id, type, folder, thread_id,
                 provider_message_id, provider_thread_id, mail_provider,
                 rfc_message_id, email_direction, needs_manual_response,
                 subject, body, due_at, assignee_user_id, task_status,
                 reminder_sent_at, reminder_24h_sent_at, reminder_1h_sent_at,
                 miss_escalated_at, mom_sent_at, transcript_text, transcript_source,
                 transcript_analyzed_at, completed_at, created_by_user_id,
                 created_at, updated_at]
    relationships:
      - {type: assigned_to, to: Employee, to_key: id, from_column: assignee_user_id}

  crm.appointments:
    product: crm
    label: Meeting
    key: id
    access: {domain: crm, module: sales, sensitivity: L2}
    edge_budget: 2
    properties: [id, organization_id, contact_id, host_user_id, activity_id,
                 source, status, title, starts_at, ends_at, timezone, provider,
                 join_url, calendar_event_id, assignment_reason, guest_emails,
                 canceled_at, completed_at, created_at, updated_at]
    relationships:
      - {type: scheduled_as, from: CustomerActivity, from_key: id, from_column: activity_id}
      - {type: hosted_by, to: Employee, to_key: id, from_column: host_user_id}
    # Meeting hangs off its CustomerActivity record, not off ActivityHistory
    # itself. v1 put both on the timeline, so every meeting appeared twice.

  # --- documents (three template tables, one concept) ------------------------

  crm.proposal_templates:
    product: crm
    label: DocumentTemplate
    key: uid
    synthesize_key: "proposal:{id}"
    access: {domain: crm, module: sales, sensitivity: L1}
    edge_budget: 1
    sublabels: {static: ProposalTemplate}
    custom_field: sections
    custom_dynamic: true
    properties: [id, organization_id, name, code, kind, blueprint, assets,
                 is_default, created_at, updated_at]
    relationships:
      - {type: has_template, from: SetupHub, from_column: organization_id}

  crm.quote_templates:
    product: crm
    merges_into: DocumentTemplate
    key: uid
    synthesize_key: "quote:{id}"
    access: {domain: crm, module: sales, sensitivity: L1}
    edge_budget: 1
    sublabels: {static: QuoteTemplate}
    custom_field: sections
    custom_dynamic: true
    properties: [id, organization_id, name, code, kind, blueprint, assets,
                 is_default, created_at, updated_at]
    relationships:
      - {type: has_template, from: SetupHub, from_column: organization_id}

  crm.invoice_templates:
    product: crm
    merges_into: DocumentTemplate
    key: uid
    synthesize_key: "invoice:{id}"
    access: {domain: crm, module: sales, sensitivity: L1}
    edge_budget: 1
    sublabels: {static: InvoiceTemplate}
    custom_field: sections
    custom_dynamic: true
    properties: [id, organization_id, name, code, kind, blueprint, assets,
                 is_default, created_at, updated_at]
    relationships:
