# Kafka + Kafka Connect ONLY.
#
# Use this when you already have PostgreSQL and Neo4j Enterprise running
# elsewhere. Kafka is the one component you cannot skip: without it, a Neo4j
# outage stops offset acknowledgement, the replication slot stops advancing, and
# PostgreSQL retains WAL until the disk fills.
#
#   cd docker && docker compose -f docker-compose.external.yml --env-file ../.env up -d
#
# NOTE ON REACHING YOUR POSTGRES
# Debezium connects from INSIDE a container, so its source address is a Docker
# bridge address (172.x.x.x), not your host. Your pg_hba.conf must allow it:
#     host  <db>  <user>  172.16.0.0/12  scram-sha-256
# If your PostgreSQL is on the Docker host itself, PG_HOST must be
# host.docker.internal (mapped below for Linux), not localhost -- inside the
# container, localhost is the container.

name: cdc-external

services:

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: on-failure
    ports: ["${KAFKA_HOST_PORT:-9092}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # Allow 10MB messages
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20

  connect:
    image: debezium/connect:2.7.3.Final
    restart: on-failure
    depends_on:
      kafka: {condition: service_healthy}
    ports: ["${CONNECT_HOST_PORT:-8083}:8083"]
    # Lets the container reach a PostgreSQL running on the Docker host itself.
    # Set PG_HOST=host.docker.internal in .env if that is your situation.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: cdc-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      # Schemas ON. The coercion layer is driven by the Debezium value schema:
      # without it a MicroTimestamp is indistinguishable from an ordinary bigint
      # and every timestamp silently becomes a number. Roughly doubles message
      # size. Do not turn this off as an "optimisation".
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "true"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "true"
      # Allow 10MB messages
      CONNECT_PRODUCER_MAX_REQUEST_SIZE: 10485760
      CONNECT_CONSUMER_MAX_PARTITION_FETCH_BYTES: 10485760
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
