semantic_models:

# ==========================================
# Conversations
# ==========================================
  - name: conversations
    model: ref('mart_conversations')
    defaults:
      agg_time_dimension: created_at
    entities:
      - name: conversation
        type: primary
        expr: conversation_id
      - name: queue
        type: foreign
        expr: queue_id
      - name: agent
        type: foreign
        expr: assigned_agent_id
      - name: organization
        type: foreign
        expr: organization_id
      - name: contact
        type: foreign
        expr: contact_id
    dimensions:
      - name: organization_id
        type: categorical
        expr: organization_id
      - name: created_at
        type: time
        type_params:
          time_granularity: day
      - name: channel
        type: categorical
      - name: direction
        type: categorical
      - name: queue_name
        type: categorical
      - name: assigned_agent_name
        type: categorical
      - name: status
        type: categorical
      - name: lifecycle_state
        type: categorical
      - name: sla_status
        type: categorical
      - name: disposition_code
        type: categorical
      - name: resolution_code
        type: categorical
      - name: priority
        type: categorical
      - name: had_handoff
        type: categorical
      - name: is_ai_only_completed
        type: categorical
      - name: is_handled
        type: categorical
      - name: is_resolved
        type: categorical
      - name: is_open
        type: categorical
      - name: resolved_at
        type: time
        type_params:
          time_granularity: day
      - name: closed_at
        type: time
        type_params:
          time_granularity: day
    measures:
      - name: conversation_count
        agg: count
        expr: conversation_id
      - name: unique_contact_count
        agg: count_distinct
        expr: contact_id
      - name: handoff_conversation_count
        agg: count
        expr: conversation_id
      - name: handled_conversation_count
        agg: count
        expr: "CASE WHEN is_handled = true THEN conversation_id END"
      # NOTE: bucketed by created_at (model default). Counts conversations
      # CREATED in the window that are now resolved — not conversations
      # RESOLVED in the window. Use resolved_conversation_count_by_resolved_at
      # for a true "resolved in this window" number.
      - name: resolved_conversation_count
        agg: count
        expr: "CASE WHEN is_resolved = true THEN conversation_id END"
      # bucketed by the actual resolved_at column — use this for any
      # "resolved last N days / this week" style query.
      - name: resolved_conversation_count_by_resolved_at
        agg: count
        expr: "CASE WHEN is_resolved = true THEN conversation_id END"
        agg_time_dimension: resolved_at
      - name: avg_speed_of_answer_seconds
        agg: average
        expr: speed_of_answer_seconds
      - name: avg_first_response_seconds
        agg: average
        expr: first_response_seconds

# ==========================================
# Conversation Assignments (also canonical AHT source)
# ==========================================
  - name: conversation_assignments
    model: ref('mart_conversation_assignments')
    defaults:
      agg_time_dimension: offered_at
    entities:
      - name: assignment
        type: primary
        expr: assignment_id
      - name: conversation
        type: foreign
        expr: conversation_id
      - name: agent
        type: foreign
        expr: agent_id
      - name: queue
        type: foreign
        expr: queue_id
      - name: organization        # NEW — shared join path for ratio/bundle metrics
        type: foreign
        expr: organization_id
    dimensions:
      - name: organization_id
        type: categorical
        expr: organization_id
      - name: offered_at
        type: time
        type_params:
          time_granularity: day
      - name: channel
        type: categorical
      - name: direction
        type: categorical
      - name: queue_name
        type: categorical
      - name: agent_name
        type: categorical
      - name: state
        type: categorical
      - name: reason
        type: categorical
      - name: is_completed_leg
        type: categorical
    measures:
      - name: assignment_count
        agg: count
        expr: assignment_id
      - name: human_handle_seconds_sum
        agg: sum
        expr: human_handle_seconds
      - name: completed_leg_count
        agg: count
        expr: "CASE WHEN is_completed_leg = true THEN assignment_id END"

# ==========================================
# SLA State
# ==========================================
  - name: conversation_sla_state
    model: ref('mart_conversation_sla_state')
    defaults:
      agg_time_dimension: updated_at
    entities:
      - name: sla_state
        type: primary
        expr: sla_state_id
      - name: conversation
        type: foreign
        expr: conversation_id
      - name: queue                    # NEW
        type: foreign                  # NEW
        expr: queue_id                 # NEW
      - name: organization             # NEW — shared join path for ratio/bundle metrics
        type: foreign
        expr: organization_id
    dimensions:
      - name: organization_id
        type: categorical
        expr: organization_id
      - name: updated_at
        type: time
        type_params:
          time_granularity: day
      - name: channel
        type: categorical
      - name: direction
        type: categorical
      - name: queue_name
        type: categorical
      - name: priority
        type: categorical
    measures:
      - name: sla_state_count
        agg: count
        expr: sla_state_id
      - name: breached_count
        agg: sum
        expr: "CASE WHEN breached_at IS NOT NULL THEN 1 ELSE 0 END"

# ==========================================
# Agents (operational CCaaS profile — has display name)
