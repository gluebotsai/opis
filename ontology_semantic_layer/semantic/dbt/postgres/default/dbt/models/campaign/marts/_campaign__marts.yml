version: 2

models:
  - name: mart_campaign_overview
    description: >
      Campaign-grain overview. Answers: how many campaigns, how many live/scheduled,
      how big is each campaign's audience. NOT built: campaign_touch_volume-style
      time_dimension slicing beyond starts/ends (no campaign_schedule table exists).
    columns:
      - name: campaign_id
        tests: [unique, not_null]

  - name: mart_campaign_touch_performance
    description: >
      Campaign-grain send/engagement performance built from campaign_send_recipients,
      the closest real analog to the metrics doc's "campaign_touch" entity (which does
      not exist in this schema). delivery_rate is a proxy using status='sent', since no
      literal 'delivered' status exists. conversion_rate, converted_touch_count are
      NOT built — no conversion/response field exists anywhere in the source schema.
    columns:
      - name: campaign_id
        tests: [unique, not_null]

  - name: mart_template_approval
    description: >
      Org+channel grain. template_count and template_approval_rate from
      regulated_channel_templates (sms/whatsapp only — the only templates with a
      real approval lifecycle). compliance_denial_rate is NOT built — no
      compliance_evaluation table exists.
    columns:
      - name: organization_id
        tests: [not_null]

  - name: mart_contact_engagement_org
    description: >
      Org grain. unsubscribe_rate and suppression rates are proxies — both source
      tables are org-level, not per-campaign, so this cannot answer "unsubscribe rate
      for campaign X", only "unsubscribe rate across an org's known contacts."
      suppression_rate and bounce/complaint shares are similarly weak proxies: no
      per-send bounce/complaint field exists anywhere in the schema, so these are
      measured against engaged_contact_count, not total sends.
    columns:
      - name: organization_id
        tests: [unique, not_null]

  - name: mart_campaign_variant_performance
    description: >
      Campaign x ab_variant x recipient_platform grain. Lets you compare open/click
      performance across A/B variants and delivery platforms. Same delivery_rate
      proxy caveat as mart_campaign_touch_performance applies to sent_touch_count.

  - name: mart_campaign_batch_health
    description: >
      Campaign x channel grain. Batch-level send infrastructure health (failure rate,
      processing time) — distinct from per-recipient outcomes in
      mart_campaign_touch_performance.

  - name: mart_template_rejection_reasons
    description: >
      Org x channel x rejected_reason grain. Breakdown of why regulated_channel_templates
      were rejected. Kept as a separate mart because rejected_reason is free-form text,
      not a fixed enum — pivoting it into mart_template_approval would break grain
      additivity.