      SELECT uniqExact(visitor_id) AS new_visitor_count
      FROM (
        SELECT visitor_id
        FROM webtracking_marts.mart_web_sessions
        WHERE organization_id = %s{{extra_where}}
        GROUP BY visitor_id
        HAVING uniqExact(session_id) = 1
