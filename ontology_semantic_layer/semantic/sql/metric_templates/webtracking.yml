      WHERE organization_id = %s{{extra_where}}
    engine: clickhouse
    default_zero: true
  landing_page_conversion_rate:
    product: webtracking
    result_column: landing_page_conversion_rate
    time_column: started_at
    time_column_sessions: started_at
    time_column_events: created_at
    table: mart_web_sessions
    engine: clickhouse
    default_zero: true
    sql: |
      SELECT
        uniqExactIf(
          s.session_id,
          c.conversion_id IS NOT NULL AND c.conversion_id != ''
        ) * 100.0
        / nullIf(uniqExact(s.session_id), 0) AS landing_page_conversion_rate
      FROM webtracking_marts.mart_web_sessions s
      LEFT JOIN webtracking_marts.mart_conversion_events c
        ON s.session_id = c.session_id
       AND s.organization_id = c.organization_id
       AND s.website_id = c.website_id
      WHERE s.organization_id = %s{{extra_where_sessions}}
