    result_column: returning_visitor_rate
    time_column: started_at
    time_column_events: created_at
    time_column_sessions: started_at
    table: mart_web_sessions
    default_zero: true
    sql: |
      SELECT
        (SELECT uniqExact(visitor_id)
         FROM (
           SELECT visitor_id
           FROM webtracking_marts.mart_web_sessions
           WHERE organization_id = %s{{extra_where_sessions}}
           GROUP BY visitor_id
           HAVING uniqExact(session_id) > 1
         )) * 100.0 / nullIf((SELECT uniqExact(visitor_id)
