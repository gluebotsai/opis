metrics:
  average_order_value:
    product: webtracking
    result_column: average_order_value
    time_column: created_at
    table: mart_conversion_events
    sql: |
      SELECT
        sum(value)
        / nullIf(countIf(conversion_type = 'purchase'), 0) AS average_order_value
      FROM webtracking_marts.mart_conversion_events
      WHERE organization_id = %s{{extra_where}}
    engine: clickhouse
    default_zero: true
  average_session_duration:
    product: webtracking
    engine: clickhouse
    result_column: average_session_duration
    time_column: started_at
    table: mart_web_sessions
    sql: |
      SELECT avgIf(duration_seconds, page_view_count > 0) AS average_session_duration
      FROM webtracking_marts.mart_web_sessions
      WHERE organization_id = %s{{extra_where}}
  avg_cls:
    product: webtracking
    result_column: avg_cls
    time_column: created_at
    table: mart_performance_events
    sql: |
      SELECT avg(case when metric_name = 'CLS' then metric_value end) AS avg_cls
      FROM webtracking_marts.mart_performance_events
      WHERE organization_id = %s{{extra_where}}
    engine: clickhouse
  avg_fcp_ms:
