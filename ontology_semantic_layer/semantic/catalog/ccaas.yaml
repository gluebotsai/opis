product: ccaas
engine: postgres
default_schema: ccass_marts_aiccaas
tenant_column: organization_id
tables:
- name: mart_agent_capacity
  schema: ccass_marts_aiccaas
  engine: postgres
  grain: agent_channel_capacity
  tenant_column: organization_id
  sql_agent_only: false
  columns:
  - name: capacity_id
  - name: organization_id
  semantic_model: agent_capacity
  semantic_dimensions:
  - organization_id
  - updated_at
  - channel
  semantic_measures:
