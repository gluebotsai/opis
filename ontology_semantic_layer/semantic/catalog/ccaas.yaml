- name: mart_conversations
  schema: ccass_marts_aiccaas
  engine: postgres
  description: One row per CCaaS conversation with queue/agent names denormalized.
  grain: conversation
  purpose: Primary CCaaS fact for volume, SLA, channel, and resolution metrics.
  tenant_column: organization_id
  row_scope_column: assigned_agent_id
  sql_agent_only: false
  columns:
  - name: conversation_id
  - name: organization_id
    description: Multi-tenant isolation key — required on every query.
  - name: status
    description: Conversation lifecycle status from source.
  - name: channel
    description: Interaction channel (voice, chat, email, etc.).
  - name: direction
    description: Customer-initiated (inbound) vs agent callback/proactive (outbound).
  - name: queue_name
    description: Denormalized queue display name for reporting group_by.
  - name: assigned_agent_name
    description: Denormalized agent display name on the conversation.
  - name: created_at
    description: Conversation creation timestamp (time filter / ordering).
  - name: is_open
    description: True when conversation is still open (status not terminal).
  semantic_model: conversations
  semantic_dimensions:
  - organization_id
  - created_at
  - channel
  - direction
  - queue_name
  - assigned_agent_name
  - status
  - lifecycle_state
  - sla_status
  - disposition_code
  - resolution_code
  - priority
  - had_handoff
  - is_ai_only_completed
  - is_handled
  - is_resolved
  - resolved_at
  - closed_at
  semantic_measures:
  - conversation_count
  - unique_contact_count
  - handoff_conversation_count
  - handled_conversation_count
  - resolved_conversation_count
  - resolved_conversation_count_by_resolved_at
  - avg_speed_of_answer_seconds
  - avg_first_response_seconds
- name: mart_copilot_skill_executions
  schema: ccass_marts_aiccaas
  engine: postgres
  grain: skill_execution
  tenant_column: organization_id
  sql_agent_only: false
