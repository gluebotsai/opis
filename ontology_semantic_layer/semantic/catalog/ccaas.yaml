- name: mart_conversation_assignments
  schema: ccass_marts_aiccaas
  engine: postgres
  description: Assignment offer/accept events; canonical AHT source.
  grain: assignment
  purpose: Handle time, missed contacts, occupancy numerators.
  tenant_column: organization_id
  row_scope_column: agent_id
  sql_agent_only: false
  columns:
  - name: assignment_id
  - name: organization_id
  - name: channel
    description: Denormalized from conversation for group_by without join ambiguity.
  - name: direction
    description: Denormalized from conversation (inbound/outbound).
  - name: queue_name
  - name: agent_name
  semantic_model: conversation_assignments
  semantic_dimensions:
  - organization_id
  - offered_at
  - channel
  - direction
  - queue_name
  - agent_name
  - state
  - reason
  - is_completed_leg
  semantic_measures:
  - assignment_count
  - human_handle_seconds_sum
  - completed_leg_count
- name: mart_conversation_dispositions
  schema: ccass_marts_aiccaas
  engine: postgres
  grain: disposition_event
  tenant_column: organization_id
  sql_agent_only: false
  columns:
  - name: disposition_entry_id
  - name: organization_id
  semantic_model: conversation_dispositions
  semantic_dimensions:
  - organization_id
  - applied_at
  - resolution_code
  - is_final
  semantic_measures:
  - disposition_entry_count
- name: mart_conversation_sla_state
  schema: ccass_marts_aiccaas
  engine: postgres
  description: Per-conversation SLA breach state.
  grain: conversation_sla
  purpose: SLA breach rate numerator/denominator.
  tenant_column: organization_id
  sql_agent_only: false
  columns:
  - name: sla_state_id
  - name: organization_id
  - name: channel
  - name: direction
  - name: queue_name
  - name: priority
