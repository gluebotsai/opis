# Super agents keep catalog snapshots — not expanded by sync
preserve_prompt_metrics:
  - cc.super
  - hub.orchestrator
  - crm.super
  - camp.super

specialist_rules:
  aiccaas:
    - patterns:
        - active_agents*
        - total_agents*
        - total_active_agent_count
        - human_agent_occupancy*
        - logged_in*
        - handling_or_wrap*
        - human_handle_seconds*
        - total_agent_capacity
      agents: [cc.presence, cc.wfm]
    - patterns: [total_queues_configured, total_queue_agent_assignments, total_teams]
      agents: [cc.queue, cc.wfm]
    - patterns:
        - "*_volume"
        - unique_contacts_handled
      agents: [cc.omnichannel, cc.channel_adaptation]
    - patterns: [agent_assist_*]
      agents: [cc.agent_assist]
    - patterns:
        - callback_tasks
        - follow_up_tasks
        - suggestion_tasks
        - open_agent_tasks
        - agents_assigned_callback
      agents: [cc.followup, cc.presence]
    - patterns: [missed_*]
      agents: [cc.recovery, cc.anomaly]
    - patterns:
        - ai_containment_rate
        - ai_handover_rate
        - handover_rate
        - handoff_conversations
        - ai_only_completed_conversations
      agents: [cc.ai_support]
    - patterns:
        - average_handle_time
        - average_speed_of_answer
        - average_first_response_time
        - human_handle_seconds_sum
        - completed_leg_count
      agents: [cc.performance]
    - patterns:
        - sla_breach_rate
        - breached_sla_count
        - total_sla_states
      agents: [cc.anomaly, cc.performance]
    - patterns: [resolution_rate, resolved_conversations_count, resolved_dispositions]
      agents: [cc.closure]
    - patterns:
        - total_conversations
        - handled_volume
        - open_conversations
      agents: [cc.interaction_ops, cc.performance, cc.wfm]
    - patterns: [tool_*]
      agents: [cc.agent_assist]
    - patterns: [total_transfers]
      agents: [cc.interaction_ops]
    - patterns:
        - total_conversations
        - average_handle_time
        - human_agent_occupancy_rate_presence
        - open_conversations
      agents: [cc.forecast, cc.wfm]

  crm:
    - patterns:
        - "*deal*"
        - "*pipeline*"
        - won_deal_rate
        - open_pipeline_value
        - deal_volume
      agents: [crm.deals]
    - patterns:
        - "*forecast*"
        - average_win_rate*
        - average_loss_rate
      agents: [audit-forecast]

  campaign:
    - patterns:
        - delivery_rate
        - open_rate
        - click_rate
        - engaged_contact*
        - unsubscribe_rate
        - batch_*
        - avg_batch*
        - approved_template*
        - variant_*
      agents: [camp.monitoring, camp.reports]
    - patterns: [template*, approved_template*, rejected_template*]
      agents: [camp.templates]
