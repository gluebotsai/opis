# Metric ownership: reporting catalog (API) + MAS specialist assignment.
# Runtime API entitlement for reporting agents uses full certified product catalogs
# (see semantic/ownership.py). prompt.metrics stays headline-sized for LLM grounding.

version: 2026.09.1

headline_max: 15

# Product (normalized) -> reporting agent id
reporting_agents:
  contact_centre: cc.reporting
  ccaas: cc.reporting
  ticketing: tk.reporting
  crm: crm.reports
  campaign: camp.reports
  cdp: cdp.profile
  webtracking: webtracking.analytics

# Registry source id -> reporting agent (for certified metric lists)
registry_reporting:
  aiccaas: cc.reporting
  ticketing: tk.reporting
  crm: crm.reports
  campaign: camp.reports
  webtracking: webtracking.analytics

# Headline KPIs stay in catalog prompt.metrics (LLM context only)
headline_metrics:
  cc.reporting:
    - total_conversations
    - handled_volume
    - open_conversations
    - missed_contact_rate
    - sla_breach_rate
    - ai_containment_rate
    - average_handle_time
    - average_speed_of_answer
    - average_first_response_time
    - human_agent_occupancy_rate_presence
    - callback_tasks
  tk.reporting: &tk_reporting_headlines
    - open_tickets_metric
    - high_priority_ticket_volume
    - ticket_volume
    - average_resolution_time_hours
    - average_csat_score
    - reopen_rate
    - resolution_sla_compliance_rate
    - breached_tickets_metric
    - current_overdue_tickets_metric
    - due_today_tickets_metric
    - unassigned_tickets_metric
    - tickets_created_today_metric
    - tickets_created_by_me
  tk.analytics_audit_query_executor: *tk_reporting_headlines
  tk.insights_analytics_executor: *tk_reporting_headlines
  crm.reports:
    - won_deal_rate
    - open_pipeline_value
    - mql_rate
    - customer_conversion_rate
  camp.reports:
    - delivery_rate
    - open_rate
    - click_rate
    - campaign_attributed_session_rate
  cdp.profile:
    - web_session_volume
    - open_rate
    - contact_volume
    - mql_rate
    - visitor_identification_rate
  webtracking.analytics:
    - unique_visitors
    - web_session_volume
    - bounce_rate
    - average_session_duration
    - conversion_rate
    - page_views
    - engagement_rate
    - campaign_attributed_sessions
    - form_success_rate
    - error_session_rate
    - avg_lcp_ms
    - visitor_identification_rate

