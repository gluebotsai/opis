metrics:
  open_tickets_metric:
    product: ticketing
    result_column: open_tickets_metric
    default_zero: true
    time_column: created_at
    table: mart_tickets
    sql: 'SELECT COUNT(ticket_id)::bigint AS open_tickets_metric

      FROM ticketing_marts.mart_tickets

      WHERE organization_id = %s AND lower(status) = ''open''{{extra_where}}

      '
  sla_breach_rate:
    product: ticketing
    result_column: sla_breach_rate
    default_zero: true
    time_column: created_at
    table: mart_tickets
    sql: "SELECT\n  COUNT(*) FILTER (WHERE is_breached_proxy = true)::float\n  / NULLIF(COUNT(*)\
      \ FILTER (WHERE has_resolution_sla_target = true), 0)\n  AS sla_breach_rate\n\
      FROM ticketing_marts.mart_tickets\nWHERE organization_id = %s{{extra_where}}\n"
  average_resolution_time_hours:
    product: ticketing
    result_column: average_resolution_time_hours
    time_column: resolved_at
    table: mart_tickets
    sql: "SELECT\n  SUM(resolution_hours)::float\n  / NULLIF(COUNT(*) FILTER (WHERE\
      \ resolved_at IS NOT NULL), 0)\n  AS average_resolution_time_hours\nFROM ticketing_marts.mart_tickets\n\
      WHERE organization_id = %s{{extra_where}}\n"
  average_csat_score:
    product: ticketing
    result_column: average_csat_score
    time_column: created_at
    table: mart_tickets
    sql: 'SELECT AVG(csat_score)::float AS average_csat_score

      FROM ticketing_marts.mart_tickets

      WHERE organization_id = %s AND csat_score IS NOT NULL{{extra_where}}

      '
  high_priority_ticket_volume:
    product: ticketing
    result_column: high_priority_ticket_volume
    default_zero: true
    time_column: created_at
    table: mart_tickets
    sql: 'SELECT COUNT(ticket_id)::bigint AS high_priority_ticket_volume

      FROM ticketing_marts.mart_tickets

      WHERE organization_id = %s AND lower(priority) IN (''high'', ''urgent''){{extra_where}}

      '
  reopen_rate:
    product: ticketing
    result_column: reopen_rate
    time_column: created_at
    table: mart_tickets
    sql: "SELECT\n  COUNT(*) FILTER (WHERE is_reopened = true)::float\n  / NULLIF(COUNT(*)\
      \ FILTER (WHERE is_resolved = true), 0) AS reopen_rate\nFROM ticketing_marts.mart_tickets\n\
      WHERE organization_id = %s{{extra_where}}\n"
  ticket_volume:
    product: ticketing
    result_column: ticket_volume
    default_zero: true
    time_column: created_at
    table: mart_tickets
    sql: 'SELECT COUNT(ticket_id)::bigint AS ticket_volume

      FROM ticketing_marts.mart_tickets

      WHERE organization_id = %s{{extra_where}}

      '
  tickets_created_by_me:
    product: ticketing
    result_column: tickets_created_by_me
    default_zero: true
    time_column: created_at
    table: mart_tickets
    row_scope_column: created_by_id
    sql: 'SELECT COUNT(ticket_id)::bigint AS tickets_created_by_me

      FROM ticketing_marts.mart_tickets

      WHERE organization_id = %s{{extra_where}}

      '
  resolution_rate:
    product: ticketing
    result_column: resolution_rate
    time_column: created_at
    table: mart_tickets
    sql: "SELECT\n  COUNT(*) FILTER (WHERE is_resolved = true)::float\n  / NULLIF(COUNT(*),\
      \ 0) AS resolution_rate\nFROM ticketing_marts.mart_tickets\nWHERE organization_id\
      \ = %s{{extra_where}}\n"
  sla_at_risk_tickets_metric:
