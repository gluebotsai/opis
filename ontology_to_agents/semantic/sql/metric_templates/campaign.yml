metrics:
  approved_template_count:
    product: campaign
    result_column: approved_template_count
    time_column: first_submitted_at
    table: mart_template_approval
    sql: 'SELECT SUM(approved_template_count) AS approved_template_count

      FROM campaign_marts.mart_template_approval

      WHERE organization_id = %s{{extra_where}}

      '
  audience_reached:
    product: campaign
    result_column: audience_reached
    time_column: created_at
    table: mart_campaign_overview
    sql: 'SELECT SUM(audience_reached) AS audience_reached

      FROM campaign_marts.mart_campaign_overview

      WHERE organization_id = %s{{extra_where}}

      '
  avg_attempt_count:
    product: campaign
    result_column: avg_attempt_count
    time_column: campaign_created_at
    table: mart_campaign_touch_performance
    sql: 'SELECT AVG(avg_attempt_count)::float AS avg_attempt_count

      FROM campaign_marts.mart_campaign_touch_performance

      WHERE organization_id = %s{{extra_where}}

      '
  avg_batch_processing_seconds:
    product: campaign
    result_column: avg_batch_processing_seconds
    time_column: first_batch_created_at
    table: mart_campaign_batch_health
    sql: 'SELECT AVG(avg_batch_processing_seconds)::float AS avg_batch_processing_seconds

      FROM campaign_marts.mart_campaign_batch_health

      WHERE organization_id = %s{{extra_where}}

      '
  avg_planned_duration_seconds:
    product: campaign
    result_column: avg_planned_duration_seconds
    time_column: created_at
    table: mart_campaign_overview
    sql: 'SELECT AVG(planned_duration_seconds)::float AS avg_planned_duration_seconds

      FROM campaign_marts.mart_campaign_overview

      WHERE organization_id = %s{{extra_where}}

      '
  avg_seconds_open_to_click:
    product: campaign
    result_column: avg_seconds_open_to_click
    time_column: campaign_created_at
    table: mart_campaign_touch_performance
    sql: 'SELECT AVG(avg_seconds_open_to_click)::float AS avg_seconds_open_to_click

      FROM campaign_marts.mart_campaign_touch_performance

      WHERE organization_id = %s{{extra_where}}

      '
  avg_seconds_to_open:
    product: campaign
    result_column: avg_seconds_to_open
    time_column: campaign_created_at
    table: mart_campaign_touch_performance
    sql: 'SELECT AVG(avg_seconds_to_open)::float AS avg_seconds_to_open

      FROM campaign_marts.mart_campaign_touch_performance

      WHERE organization_id = %s{{extra_where}}

      '
  batch_count:
    product: campaign
    result_column: batch_count
    time_column: first_batch_created_at
    table: mart_campaign_batch_health
    sql: 'SELECT SUM(batch_count) AS batch_count

      FROM campaign_marts.mart_campaign_batch_health

      WHERE organization_id = %s{{extra_where}}

      '
  batch_failure_rate:
    product: campaign
    result_column: batch_failure_rate
    time_column: first_batch_created_at
    table: mart_campaign_batch_health
    sql: "SELECT\n  (SUM(failed_batch_count))::float\n  / nullIf((SUM(batch_count)),\
      \ 0) AS batch_failure_rate\nFROM campaign_marts.mart_campaign_batch_health\n\
      WHERE organization_id = %s{{extra_where}}\n"
    default_zero: true
  bounce_share_of_suppressions:
    product: campaign
    result_column: bounce_share_of_suppressions
    time_column: first_engagement_at
    table: mart_contact_engagement_org
    sql: "SELECT\n  (SUM(bounce_suppressed_count))::float\n  / nullIf((SUM(suppressed_email_count)),\
      \ 0) AS bounce_share_of_suppressions\nFROM campaign_marts.mart_contact_engagement_org\n\
      WHERE organization_id = %s{{extra_where}}\n"
    default_zero: true
  bounce_suppressed_count:
    product: campaign
    result_column: bounce_suppressed_count
    time_column: first_engagement_at
    table: mart_contact_engagement_org
    sql: 'SELECT SUM(bounce_suppressed_count) AS bounce_suppressed_count

      FROM campaign_marts.mart_contact_engagement_org

      WHERE organization_id = %s{{extra_where}}

      '
  campaign_volume:
    product: campaign
    result_column: campaign_volume
    time_column: created_at
    table: mart_campaign_overview
    sql: 'SELECT COUNT(DISTINCT campaign_id)::bigint AS campaign_volume

      FROM campaign_marts.mart_campaign_overview

      WHERE organization_id = %s{{extra_where}}

      '
    default_zero: true
  click_rate:
    product: campaign
    result_column: click_rate
    time_column: campaign_created_at
    table: mart_campaign_touch_performance
    sql: "SELECT\n  (SUM(clicked_touch_count))::float\n  / nullIf((SUM(sent_touch_count)),\
      \ 0) AS click_rate\nFROM campaign_marts.mart_campaign_touch_performance\nWHERE\
      \ organization_id = %s{{extra_where}}\n"
    default_zero: true
  clicked_touch_count:
    product: campaign
    result_column: clicked_touch_count
    time_column: campaign_created_at
    table: mart_campaign_touch_performance
    sql: 'SELECT SUM(clicked_touch_count) AS clicked_touch_count

