      '
  failure_rate:
    product: campaign
    result_column: failure_rate
    time_column: campaign_created_at
    table: mart_campaign_touch_performance
    sql: "SELECT\n  (SUM(failed_touch_count))::float\n  / nullIf((SUM(touch_count)),\
