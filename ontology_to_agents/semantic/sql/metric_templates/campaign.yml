    time_column: campaign_created_at
    table: mart_campaign_touch_performance
    sql: "SELECT\n  (SUM(sent_touch_count))::float\n  / nullIf((SUM(touch_count)),\
      \ 0) AS delivery_rate\nFROM campaign_marts.mart_campaign_touch_performance\n\
      WHERE organization_id = %s{{extra_where}}\n"
    default_zero: true
