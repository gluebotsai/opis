    default_zero: true
  frequency_per_contact:
    product: campaign
    result_column: frequency_per_contact
    time_column: campaign_created_at
    table: mart_campaign_touch_performance
    sql: 'SELECT ((SELECT SUM(touch_count) FROM campaign_marts.mart_campaign_touch_performance
      WHERE organization_id = %s{{extra_where}}) / nullif((SELECT SUM(unique_contacts_touched)
      FROM campaign_marts.mart_campaign_touch_performance WHERE organization_id =
      %s{{extra_where}}), 0))::float AS frequency_per_contact

      '
    default_zero: true
  open_rate:
