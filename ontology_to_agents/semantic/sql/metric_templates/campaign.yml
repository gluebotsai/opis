      WHERE organization_id = %s{{extra_where}}

      '
  complaint_share_of_suppressions:
    product: campaign
    result_column: complaint_share_of_suppressions
    time_column: first_engagement_at
    table: mart_contact_engagement_org
    sql: "SELECT\n  (SUM(complaint_suppressed_count))::float\n  / nullIf((SUM(suppressed_email_count)),\
      \ 0) AS complaint_share_of_suppressions\nFROM campaign_marts.mart_contact_engagement_org\n\
      WHERE organization_id = %s{{extra_where}}\n"
    default_zero: true
  complaint_suppressed_count:
    product: campaign
    result_column: complaint_suppressed_count
    time_column: first_engagement_at
    table: mart_contact_engagement_org
    sql: 'SELECT SUM(complaint_suppressed_count) AS complaint_suppressed_count

