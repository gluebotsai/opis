    result_column: logged_in_eligible_seconds
    time_column: started_at
    table: mart_agent_presence_history
    sql: 'SELECT SUM(interval_seconds) AS logged_in_eligible_seconds

      FROM ccass_marts_aiccaas.mart_agent_presence_history

      WHERE organization_id = %s{{extra_where}} AND is_logged_in_eligible = true

      '
  missed_assignments:
    product: ccaas
    result_column: missed_assignments
    time_column: offered_at
    table: mart_conversation_assignments
    sql: 'SELECT COUNT(assignment_id)::bigint AS missed_assignments

      FROM ccass_marts_aiccaas.mart_conversation_assignments

      WHERE organization_id = %s{{extra_where}} AND lower(state) IN (''rejected'',
      ''expired'')

      '
  open_agent_tasks:
    product: ccaas
    result_column: open_agent_tasks
    time_column: created_at
    table: mart_agent_tasks
    sql: 'SELECT COUNT(task_id)::bigint AS open_agent_tasks

      FROM ccass_marts_aiccaas.mart_agent_tasks

      WHERE organization_id = %s{{extra_where}} AND lower(status) = ''open''

      '
  resolution_rate:
    product: ccaas
    result_column: resolution_rate
    time_column: created_at
    table: mart_conversations
    sql: "SELECT\n  (COUNT(*) FILTER (WHERE is_resolved = true)::bigint)::float\n\
      \  / NULLIF((COUNT(conversation_id)::bigint), 0) AS resolution_rate\nFROM ccass_marts_aiccaas.mart_conversations\n\
      WHERE organization_id = %s{{extra_where}}\n"
    default_zero: true
  resolved_conversations_count:
    product: ccaas
    result_column: resolved_conversations_count
    time_column: created_at
    table: mart_conversations
    sql: 'SELECT COUNT(*) FILTER (WHERE is_resolved = true)::bigint AS resolved_conversations_count

      FROM ccass_marts_aiccaas.mart_conversations

      WHERE organization_id = %s{{extra_where}}

      '
    default_zero: true
  resolved_dispositions:
    product: ccaas
    result_column: resolved_dispositions
    time_column: applied_at
    table: mart_conversation_dispositions
    sql: 'SELECT COUNT(disposition_entry_id)::bigint AS resolved_dispositions

      FROM ccass_marts_aiccaas.mart_conversation_dispositions

      WHERE organization_id = %s{{extra_where}} AND lower(resolution_code) = ''resolved''

      '
  social_media_volume:
    product: ccaas
    result_column: social_media_volume
    time_column: created_at
    table: mart_conversations
    sql: 'SELECT COUNT(conversation_id)::bigint AS social_media_volume

      FROM ccass_marts_aiccaas.mart_conversations

      WHERE organization_id = %s{{extra_where}} AND lower(channel) IN (''whatsapp'',
      ''instagram'', ''facebook'')

      '
    default_zero: true
  suggestion_tasks:
    product: ccaas
    result_column: suggestion_tasks
    time_column: created_at
    table: mart_agent_tasks
    sql: 'SELECT COUNT(task_id)::bigint AS suggestion_tasks

      FROM ccass_marts_aiccaas.mart_agent_tasks

      WHERE organization_id = %s{{extra_where}} AND lower(task_type) = ''suggestion''

      '
  tool_executions_succeeded:
    product: ccaas
    result_column: tool_executions_succeeded
    time_column: created_at
    table: mart_copilot_skill_executions
    sql: 'SELECT COUNT(execution_id)::bigint AS tool_executions_succeeded

      FROM ccass_marts_aiccaas.mart_copilot_skill_executions

      WHERE organization_id = %s{{extra_where}} AND lower(execution_status) = ''succeeded''

      '
  tool_executions_total:
    product: ccaas
    result_column: tool_executions_total
    time_column: created_at
    table: mart_copilot_skill_executions
    sql: 'SELECT COUNT(execution_id)::bigint AS tool_executions_total

