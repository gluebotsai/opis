    result_column: tool_success_rate
    time_column: created_at
    table: mart_copilot_skill_executions
    sql: "SELECT\n  (COUNT(execution_id)::bigint)::float\n  / NULLIF((COUNT(execution_id)::bigint),\
      \ 0) AS tool_success_rate\nFROM ccass_marts_aiccaas.mart_copilot_skill_executions\n\
      WHERE organization_id = %s{{extra_where}} AND lower(execution_status) = 'succeeded'\n"
