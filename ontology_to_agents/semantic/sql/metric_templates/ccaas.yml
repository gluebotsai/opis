metrics:
  total_conversations:
    product: ccaas
    result_column: total_conversations
    default_zero: true
    sql: 'SELECT COUNT(conversation_id)::bigint AS total_conversations

      FROM ccass_marts_aiccaas.mart_conversations

      WHERE organization_id = %s{{extra_where}}

      '
  open_conversations:
    product: ccaas
    result_column: open_conversations
    default_zero: true
    sql: 'SELECT COUNT(conversation_id)::bigint AS open_conversations

      FROM ccass_marts_aiccaas.mart_conversations

      WHERE organization_id = %s AND is_open = true{{extra_where}}

      '
  ai_containment_rate:
    product: ccaas
    result_column: ai_containment_rate
    sql: "SELECT\n  COUNT(*) FILTER (WHERE is_ai_only_completed = true)::float\n \
      \ / NULLIF(COUNT(*), 0) AS ai_containment_rate\nFROM ccass_marts_aiccaas.mart_conversations\n\
      WHERE organization_id = %s{{extra_where}}\n"
  average_handle_time:
    product: ccaas
    result_column: average_handle_time
    sql: "SELECT\n  SUM(human_handle_seconds)::float\n  / NULLIF(COUNT(*) FILTER (WHERE\
      \ is_completed_leg = true), 0) AS average_handle_time\nFROM ccass_marts_aiccaas.mart_conversation_assignments\n\
      WHERE organization_id = %s{{extra_where}}\n"
  sla_breach_rate:
    product: ccaas
    result_column: sla_breach_rate
    default_zero: true
    time_column: updated_at
    table: mart_conversation_sla_state
    sql: "SELECT\n  COUNT(*) FILTER (WHERE breached_at IS NOT NULL)::float\n  / NULLIF(COUNT(*),\
      \ 0) AS sla_breach_rate\nFROM ccass_marts_aiccaas.mart_conversation_sla_state\n\
      WHERE organization_id = %s{{extra_where}}\n"
  missed_contact_rate:
    product: ccaas
    result_column: missed_contact_rate
    default_zero: true
    time_column: offered_at
    table: mart_conversation_assignments
    sql: "SELECT\n  COUNT(*) FILTER (WHERE lower(state) IN ('rejected', 'expired'))::float\n\
      \  / NULLIF(COUNT(*), 0) AS missed_contact_rate\nFROM ccass_marts_aiccaas.mart_conversation_assignments\n\
      WHERE organization_id = %s{{extra_where}}\n"
  agent_assist_adoption_rate:
    product: ccaas
    result_column: agent_assist_adoption_rate
    time_column: created_at
    table: mart_copilot_turns
    sql: "SELECT\n  COUNT(*) FILTER (WHERE suggestion_disposition IN ('accepted',\
      \ 'modified'))::float\n  / NULLIF(COUNT(*), 0) AS agent_assist_adoption_rate\n\
      FROM ccass_marts_aiccaas.mart_copilot_turns\nWHERE organization_id = %s{{extra_where}}\n"
    default_zero: true
  agent_assist_modification_rate:
    product: ccaas
    result_column: agent_assist_modification_rate
    time_column: created_at
    table: mart_copilot_turns
    sql: "SELECT\n  COUNT(*) FILTER (WHERE suggestion_disposition = 'modified')::float\n\
      \  / NULLIF(\n    COUNT(*) FILTER (WHERE suggestion_disposition IN ('accepted',\
      \ 'modified')),\n    0\n  ) AS agent_assist_modification_rate\nFROM ccass_marts_aiccaas.mart_copilot_turns\n\
      WHERE organization_id = %s{{extra_where}}\n"
  active_agents:
    product: ccaas
    result_column: active_agents
    time_column: created_at
    table: mart_agents
    sql: 'SELECT COUNT(agent_id)::bigint AS active_agents

      FROM ccass_marts_aiccaas.mart_agents

      WHERE organization_id = %s{{extra_where}} AND lower(status) = ''active''

      '
  active_agents_setup:
    product: ccaas
    result_column: active_agents_setup
    time_column: created_at
    table: mart_setup_users
    sql: 'SELECT COUNT(user_id)::bigint AS active_agents_setup

      FROM ccass_marts_aiccaas.mart_setup_users

      WHERE organization_id = %s{{extra_where}} AND lower(status) = ''active''

      '
  agent_assist_accepted_or_modified:
    product: ccaas
    result_column: agent_assist_accepted_or_modified
    time_column: created_at
    table: mart_copilot_turns
    sql: 'SELECT COUNT(suggestion_id)::bigint AS agent_assist_accepted_or_modified

      FROM ccass_marts_aiccaas.mart_copilot_turns

      WHERE organization_id = %s{{extra_where}} AND suggestion_disposition IN (''accepted'',
      ''modified'')

      '
  agent_assist_modified:
    product: ccaas
    result_column: agent_assist_modified
    time_column: created_at
    table: mart_copilot_turns
    sql: 'SELECT COUNT(suggestion_id)::bigint AS agent_assist_modified

      FROM ccass_marts_aiccaas.mart_copilot_turns

      WHERE organization_id = %s{{extra_where}} AND suggestion_disposition = ''modified''

      '
  agent_assist_suggestions_total:
    product: ccaas
    result_column: agent_assist_suggestions_total
    time_column: created_at
    table: mart_copilot_turns
    sql: 'SELECT COUNT(suggestion_id)::bigint AS agent_assist_suggestions_total

      FROM ccass_marts_aiccaas.mart_copilot_turns

      WHERE organization_id = %s{{extra_where}}

      '
  agents_assigned_callback:
    product: ccaas
    result_column: agents_assigned_callback
    time_column: created_at
    table: mart_agent_tasks
    sql: 'SELECT COUNT(DISTINCT assigned_user_id)::bigint AS agents_assigned_callback

      FROM ccass_marts_aiccaas.mart_agent_tasks

      WHERE organization_id = %s{{extra_where}} AND lower(task_type) = ''callback''

      '
  ai_handover_rate:
    product: ccaas
    result_column: ai_handover_rate
    time_column: created_at
    table: mart_conversations
    sql: "SELECT\n  COUNT(*) FILTER (WHERE had_handoff = true)::float\n  / NULLIF(COUNT(*),\
      \ 0) AS ai_handover_rate\nFROM ccass_marts_aiccaas.mart_conversations\nWHERE\
      \ organization_id = %s{{extra_where}}\n"
    default_zero: true
  ai_only_completed_conversations:
    product: ccaas
    result_column: ai_only_completed_conversations
    time_column: created_at
    table: mart_conversations
    sql: 'SELECT COUNT(conversation_id)::bigint AS ai_only_completed_conversations

      FROM ccass_marts_aiccaas.mart_conversations

      WHERE organization_id = %s{{extra_where}} AND is_ai_only_completed = true

      '
  average_first_response_time:
    product: ccaas
    result_column: average_first_response_time
    time_column: created_at
    table: mart_conversations
    sql: 'SELECT AVG(first_response_seconds)::float AS average_first_response_time

      FROM ccass_marts_aiccaas.mart_conversations

      WHERE organization_id = %s{{extra_where}}

      '
  average_speed_of_answer:
    product: ccaas
    result_column: average_speed_of_answer
    time_column: created_at
    table: mart_conversations
    sql: 'SELECT AVG(speed_of_answer_seconds)::float AS average_speed_of_answer

      FROM ccass_marts_aiccaas.mart_conversations

      WHERE organization_id = %s{{extra_where}}

      '
  breached_sla_count:
    product: ccaas
    result_column: breached_sla_count
    time_column: updated_at
    table: mart_conversation_sla_state
    sql: 'SELECT SUM(CASE WHEN breached_at IS NOT NULL THEN 1 ELSE 0 END) AS breached_sla_count

      FROM ccass_marts_aiccaas.mart_conversation_sla_state

      WHERE organization_id = %s{{extra_where}}

      '
    default_zero: true
  call_volume:
    product: ccaas
    result_column: call_volume
    time_column: created_at
    table: mart_conversations
    sql: 'SELECT COUNT(conversation_id)::bigint AS call_volume

      FROM ccass_marts_aiccaas.mart_conversations

      WHERE organization_id = %s{{extra_where}} AND lower(channel) = ''voice''

      '
    default_zero: true
  callback_tasks:
    product: ccaas
    result_column: callback_tasks
    time_column: created_at
    table: mart_agent_tasks
    sql: 'SELECT COUNT(task_id)::bigint AS callback_tasks

      FROM ccass_marts_aiccaas.mart_agent_tasks

      WHERE organization_id = %s{{extra_where}} AND lower(task_type) = ''callback''

      '
  chat_volume:
    product: ccaas
    result_column: chat_volume
    time_column: created_at
    table: mart_conversations
    sql: 'SELECT COUNT(conversation_id)::bigint AS chat_volume

      FROM ccass_marts_aiccaas.mart_conversations

      WHERE organization_id = %s{{extra_where}} AND lower(channel) != ''voice''

      '
    default_zero: true
  completed_leg_count:
    product: ccaas
    result_column: completed_leg_count
    time_column: offered_at
    table: mart_conversation_assignments
    sql: 'SELECT COUNT(*) FILTER (WHERE is_completed_leg = true)::bigint AS completed_leg_count

      FROM ccass_marts_aiccaas.mart_conversation_assignments

      WHERE organization_id = %s{{extra_where}}

      '
    default_zero: true
  email_volume:
    product: ccaas
    result_column: email_volume
    time_column: created_at
    table: mart_conversations
    sql: 'SELECT COUNT(conversation_id)::bigint AS email_volume

      FROM ccass_marts_aiccaas.mart_conversations

      WHERE organization_id = %s{{extra_where}} AND lower(channel) = ''email''

      '
    default_zero: true
  facebook_volume:
    product: ccaas
    result_column: facebook_volume
    time_column: created_at
    table: mart_conversations
    sql: 'SELECT COUNT(conversation_id)::bigint AS facebook_volume

      FROM ccass_marts_aiccaas.mart_conversations

      WHERE organization_id = %s{{extra_where}} AND lower(channel) = ''facebook''

      '
    default_zero: true
  follow_up_tasks:
    product: ccaas
    result_column: follow_up_tasks
    time_column: created_at
    table: mart_agent_tasks
    sql: 'SELECT COUNT(task_id)::bigint AS follow_up_tasks

      FROM ccass_marts_aiccaas.mart_agent_tasks

      WHERE organization_id = %s{{extra_where}} AND lower(task_type) = ''follow_up''

      '
  handled_volume:
    product: ccaas
    result_column: handled_volume
    time_column: created_at
    table: mart_conversations
    sql: 'SELECT COUNT(*) FILTER (WHERE is_handled = true)::bigint AS handled_volume

      FROM ccass_marts_aiccaas.mart_conversations

      WHERE organization_id = %s{{extra_where}}

      '
    default_zero: true
  handling_or_wrap_seconds:
    product: ccaas
    result_column: handling_or_wrap_seconds
    time_column: started_at
    table: mart_agent_presence_history
    sql: 'SELECT SUM(interval_seconds) AS handling_or_wrap_seconds

      FROM ccass_marts_aiccaas.mart_agent_presence_history

      WHERE organization_id = %s{{extra_where}} AND is_handling_or_wrap = true

      '
  handoff_conversations:
    product: ccaas
    result_column: handoff_conversations
    time_column: created_at
    table: mart_conversations
    sql: 'SELECT COUNT(conversation_id)::bigint AS handoff_conversations

      FROM ccass_marts_aiccaas.mart_conversations

      WHERE organization_id = %s{{extra_where}} AND had_handoff = true

      '
  handover_rate:
    product: ccaas
    result_column: handover_rate
    time_column: requested_at
    table: mart_conversation_transfers
    sql: "SELECT\n  (SELECT COUNT(transfer_id)::bigint FROM ccass_marts_aiccaas.mart_conversation_transfers\
      \ WHERE organization_id = %s{{extra_where}})::float\n  / NULLIF((SELECT COUNT(conversation_id)::bigint\
      \ FROM ccass_marts_aiccaas.mart_conversations WHERE organization_id = %s{{extra_where}}),\
      \ 0)\n  AS handover_rate\n"
    default_zero: true
  human_agent_occupancy_rate_capacity:
    product: ccaas
    result_column: human_agent_occupancy_rate_capacity
    time_column: updated_at
    table: mart_agent_capacity
    sql: "SELECT\n  (SUM(active_count))::float\n  / NULLIF((SUM(max_concurrency)),\
      \ 0) AS human_agent_occupancy_rate_capacity\nFROM ccass_marts_aiccaas.mart_agent_capacity\n\
      WHERE organization_id = %s{{extra_where}}\n"
    default_zero: true
  human_agent_occupancy_rate_presence:
    product: ccaas
    result_column: human_agent_occupancy_rate_presence
    time_column: started_at
    table: mart_agent_presence_history
    sql: "SELECT\n  (SUM(interval_seconds))::float\n  / NULLIF((SUM(interval_seconds)),\
      \ 0) AS human_agent_occupancy_rate_presence\nFROM ccass_marts_aiccaas.mart_agent_presence_history\n\
      WHERE organization_id = %s{{extra_where}} AND is_handling_or_wrap = true\n"
    default_zero: true
  human_handle_seconds_sum:
    product: ccaas
    result_column: human_handle_seconds_sum
    time_column: offered_at
    table: mart_conversation_assignments
    sql: 'SELECT SUM(human_handle_seconds) AS human_handle_seconds_sum

      FROM ccass_marts_aiccaas.mart_conversation_assignments

      WHERE organization_id = %s{{extra_where}}

      '
  instagram_volume:
    product: ccaas
    result_column: instagram_volume
    time_column: created_at
    table: mart_conversations
    sql: 'SELECT COUNT(conversation_id)::bigint AS instagram_volume

