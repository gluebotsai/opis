version: 1
presets:
  tk.tickets:
    product: ticketing
    purpose: List tickets with status, assignee, priority, queue
    tables: [mart_tickets]
    default_table: mart_tickets
    default_select:
      - ticket_id
      - status
      - priority
      - queue_name
      - assignee_name
      - created_at

  tk.queue:
    product: ticketing
    purpose: Queue depth, membership, SLA status
    tables: [mart_agent_queues, mart_agent_queue_members]
    default_table: mart_agent_queues
    default_select:
      - queue_id
      - queue_name
      - queue_type
      - sla_status
      - open_tickets
      - assigned

  tk.notes:
    product: ticketing
    purpose: Ticket comments, replies, internal notes
    tables: [mart_ticket_notes, mart_tickets]
    default_table: mart_ticket_notes
    default_select:
      - ticket_note_id
      - ticket_id
      - author_name
      - visibility
      - is_internal_note
      - created_at

  tk.audit:
    product: ticketing
    purpose: Ticket history, escalations, audit trail
    tables: [mart_audit_events]
    default_table: mart_audit_events
    default_select:
      - audit_event_id
      - ticket_id
      - action
      - queue_name
      - actor_name
      - assignee_name
      - created_at

  cc.conversations:
    product: ccaas
    purpose: List contact-centre conversations
    tables: [mart_conversations]
    default_table: mart_conversations
    default_select:
      - conversation_id
      - channel
      - status
      - queue_name
      - assigned_agent_name
      - created_at

  cc.queue:
    product: ccaas
    purpose: CCaaS queue depth and SLA state
    tables: [mart_conversation_sla_state, mart_setup_ccaas_queues, mart_conversations]
    default_table: mart_setup_ccaas_queues
    default_select:
      - queue_id
      - queue_name
      - sla_policy
      - is_active

  crm.deals:
    product: crm
    purpose: CRM pipeline and deal lists
    tables: [mart_deals]
    default_table: mart_deals
    default_select:
      - deal_id
      - stage
      - owner_name
      - deal_status_proxy
      - created_at

  crm.contacts:
    product: crm
    purpose: CRM contact and lead lists
    tables: [mart_contacts]
    default_table: mart_contacts
    default_select:
      - contact_id
      - lifecycle_stage
      - lead_status
      - owner_name
      - created_at

  camp.overview:
    product: campaign
    purpose: Marketing campaign overview lists
    tables: [mart_campaign_overview]
    default_table: mart_campaign_overview
    default_select:
      - campaign_id
      - campaign_name
      - campaign_status
      - source_channel
      - created_at

  wt.sessions:
    product: webtracking
    purpose: Web session and visitor activity lists
    tables: [mart_web_sessions]
    default_table: mart_web_sessions
    default_select:
      - session_id
      - visitor_id
      - device
      - country
      - utm_source
      - started_at

  metric.certified:
    product: any
    purpose: Certified KPI fallback when MetricFlow unavailable
    tables: []
    default_table: null
    default_select: []
    certified_only: true
