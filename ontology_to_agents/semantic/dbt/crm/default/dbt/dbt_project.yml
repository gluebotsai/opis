name: crm_default_dbt
version: '1.0.0'
profile: crm_default_dbt

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

flags:
  require_ref_prefers_node_package_to_root: true

clean-targets:
  - "target"
  - "dbt_packages"

models:
  crm_default_dbt:
    semantic_layer:
      +materialized: view
  postgres_warehouse_dbt:
    shared:
      +enabled: true
    crm:
      +enabled: true
      marts:
        mart_contact_campaign_engagement:
          +enabled: false
    ticketing:
      +enabled: false
    ccaas:
      +enabled: false
    campaign:
      +enabled: false

tests:
  postgres_warehouse_dbt:
    +enabled: false
