name: 'webtracking_default_dbt'
version: '1.0.0'
config-version: 2

profile: 'webtracking_default_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  webtracking_default_dbt:
    staging:
      +materialized: view
      +schema: webtracking_staging
    marts:
      +materialized: view
      +schema: webtracking_marts
