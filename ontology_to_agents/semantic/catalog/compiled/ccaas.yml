joins:
- from: mart_conversations
  to: mart_setup_ccaas_queues
  keys:
  - left: queue_id
    right: queue_id
  - left: organization_id
    right: organization_id
  cardinality: many_to_one
  purpose: Queue name on conversation
- from: mart_conversations
  to: mart_agents
  keys:
  - left: assigned_agent_id
    right: agent_id
  - left: organization_id
    right: organization_id
  cardinality: many_to_one
  purpose: Assigned agent display name
- from: mart_conversation_assignments
  to: mart_conversations
  keys:
  - left: conversation_id
    right: conversation_id
  - left: organization_id
    right: organization_id
  cardinality: many_to_one
  purpose: Assignment to conversation header
- from: mart_conversation_sla_state
