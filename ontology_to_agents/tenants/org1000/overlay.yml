# Org 1000 overlay — thresholds, labels, extra grants. SKU/channel stay in accounts DB.
organizationId: 1000

thresholds:
  high_priority_ticket_volume:
    threshold: { warn: 1, critical: 2 }
  open_tickets_metric:
    threshold: { warn: 25, critical: 60 }
  sla_breach_rate:
    threshold: { warn_percent: 5, critical_percent: 10 }
  missed_contact_rate:
    threshold: { warn_percent: 8, critical_percent: 15 }
  human_agent_occupancy_rate_presence:
    threshold: { warn_percent: 85 }
  average_csat_score:
    threshold: { warn_lt: 3.5 }
