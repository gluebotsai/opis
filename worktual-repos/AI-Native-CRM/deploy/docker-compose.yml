# QA/production runtime. Images come from GitHub Actions (manual workflow) or local docker build.
# Meeting Sales Assist (Path B) is meeting-service, proxied by nginx at /addons/meet/.
# Run from this directory:  docker compose --env-file .env --env-file .env.images up -d
#
# Required: copy .env.example → .env and fill secrets. Never commit .env.

name: worktual-crm

services:
  web:
    image: ${IMAGE_REGISTRY}/web:${IMAGE_TAG}
    restart: unless-stopped
    volumes:
      # Runtime nginx config — avoids rebuilding the web image for port/listener changes.
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5173:5173"
      - "80:5173"
      - "4001:4001"
    depends_on:
      api:
        condition: service_healthy
      meeting-service:
        condition: service_healthy

  api:
    image: ${IMAGE_REGISTRY}/api:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "${API_PORT:-4000}:4000"
    env_file: .env
    volumes:
      # Proposal pattern uploads — must survive container recreate / redeploy.
      - proposal-corpus-data:/app/backend/data/proposal-corpus
      # Daily JSONL nurture API request/response audit logs.
      - nurture-api-logs:/app/backend/logs
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "4000"
      # Plain http://IP QA: browser will not store Secure cookies.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://rebuild-crm.worktual.com}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://rebuild-crm.worktual.com}
      # Campaign embed (iframe SSO) — must match Campaign CRM_JWT_* secrets.
      MARKETING_MS_URL: ${MARKETING_MS_URL:-https://rebuild-campaign.worktual.com}
      CAMPAIGN_UI_URL: ${CAMPAIGN_UI_URL:-https://rebuild-campaign.worktual.com}
      CAMPAIGN_API_BASE_URL: ${CAMPAIGN_API_BASE_URL:-https://rebuild-campaign-api.worktual.com}
      CRM_INTEGRATION_KEY: ${CRM_INTEGRATION_KEY:-}
      CC_CORE_API_BASE_URL: ${CC_CORE_API_BASE_URL:-}
      CC_CORE_INTERNAL_SERVICE_KEY: ${CC_CORE_INTERNAL_SERVICE_KEY:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      CRM_JWT_ISSUER: ${CRM_JWT_ISSUER:-worktual-crm}
      MARKETING_MS_TOKEN: ${MARKETING_MS_TOKEN:-}
      CRON_SCHEDULER_ENABLED: "false"
      AI_WORKER_ENABLED: "false"
      AI_SERVICE_BASE_URL: http://ai-orchestrator:8000
      MCP_BASE_URL: http://ai-mcp:8010/mcp/v1
      REDIS_URL: redis://redis:6379/0
      # Audio-gateway Redis. Call captions, the SIP REGISTER password, and agent
      # Ready/Not Ready presence are written here. Falls back to REDIS_URL when empty.
      TRANSCRIPT_REDIS_URL: ${TRANSCRIPT_REDIS_URL:-}
      READINESS_REQUIRE_REDIS: "true"
      NOTETAKER_PROVIDER: ${NOTETAKER_PROVIDER:-vexa}
      # Each CRM employee's configured Google mailbox identifies that person in Meet.
      # Tiles no mailbox recognizes are the customer. Set 0 to use hostMeetName only.
      MEET_CHANNEL_BINDINGS: ${MEET_CHANNEL_BINDINGS:-1}
      MEETING_SERVICE_URL: http://meeting-service:8030
      MEETING_SERVICE_PUBLIC_URL: ${MEETING_SERVICE_PUBLIC_URL:-${FRONTEND_ORIGIN:-https://rebuild-crm.worktual.com}}
    command:
      [
        "npx",
        "tsx",
        "--tsconfig",
        "tsconfig.json",
        "src/index.ts",
      ]
    depends_on:
      redis:
        condition: service_healthy
      ai-orchestrator:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s

  scheduler:
    image: ${IMAGE_REGISTRY}/api:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    volumes:
      - nurture-api-logs:/app/backend/logs
    environment:
      NODE_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CRON_SCHEDULER_ENABLED: "true"
      AI_WORKER_ENABLED: "false"
      CAMPAIGN_API_BASE_URL: ${CAMPAIGN_API_BASE_URL:-https://rebuild-campaign-api.worktual.com}
      CRM_INTEGRATION_KEY: ${CRM_INTEGRATION_KEY:-}
      CC_CORE_API_BASE_URL: ${CC_CORE_API_BASE_URL:-}
      CC_CORE_INTERNAL_SERVICE_KEY: ${CC_CORE_INTERNAL_SERVICE_KEY:-}
      LEAD_NURTURE_CRON_ENABLED: ${LEAD_NURTURE_CRON_ENABLED:-}
      AI_SERVICE_BASE_URL: http://ai-orchestrator:8000
      MCP_BASE_URL: http://ai-mcp:8010/mcp/v1
      REDIS_URL: redis://redis:6379/0
      NOTETAKER_PROVIDER: ${NOTETAKER_PROVIDER:-vexa}
      MEETING_SERVICE_URL: http://meeting-service:8030
      MEETING_SERVICE_PUBLIC_URL: ${MEETING_SERVICE_PUBLIC_URL:-${FRONTEND_ORIGIN:-https://rebuild-crm.worktual.com}}
    command:
      [
        "npx",
        "tsx",
        "--tsconfig",
        "tsconfig.json",
        "src/scheduler.ts",
      ]
    depends_on:
      api:
        condition: service_healthy
      meeting-service:
        condition: service_healthy

  worker:
    image: ${IMAGE_REGISTRY}/api:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    volumes:
      - proposal-corpus-data:/app/backend/data/proposal-corpus
      - nurture-api-logs:/app/backend/logs
    environment:
      NODE_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CRON_SCHEDULER_ENABLED: "false"
      AI_WORKER_ENABLED: "true"
      CAMPAIGN_API_BASE_URL: ${CAMPAIGN_API_BASE_URL:-https://rebuild-campaign-api.worktual.com}
      CRM_INTEGRATION_KEY: ${CRM_INTEGRATION_KEY:-}
      AI_SERVICE_BASE_URL: http://ai-orchestrator:8000
      MCP_BASE_URL: http://ai-mcp:8010/mcp/v1
      REDIS_URL: redis://redis:6379/0
      NOTETAKER_PROVIDER: ${NOTETAKER_PROVIDER:-vexa}
      MEETING_SERVICE_URL: http://meeting-service:8030
      MEETING_SERVICE_PUBLIC_URL: ${MEETING_SERVICE_PUBLIC_URL:-${FRONTEND_ORIGIN:-https://rebuild-crm.worktual.com}}
    command:
      [
        "npx",
        "tsx",
        "--tsconfig",
        "tsconfig.json",
        "src/worker.ts",
      ]
    depends_on:
      api:
        condition: service_healthy
      meeting-service:
        condition: service_healthy

  ai-orchestrator:
    image: ${IMAGE_REGISTRY}/ai:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: "8000"
      LLM_API_KEY: ${LLM_API_KEY:-EMPTY}
      LLM_MODEL: ${LLM_MODEL:-worktual-qwen-27B}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://81.17.61.149:8066/v1}
      PROPOSAL_LLM_API_KEY: ${PROPOSAL_LLM_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PROPOSAL_LLM_MODEL: ${PROPOSAL_LLM_MODEL:-gemini-3.5-flash}
      PROPOSAL_LLM_THINKING_LEVEL: ${PROPOSAL_LLM_THINKING_LEVEL:-high}
      MCP_MOUNT_IN_API: "false"
      MCP_PREFER_HTTP: "true"
      MCP_BASE_URL: http://ai-mcp:8010/mcp/v1
      CRM_API_BASE_URL: http://api:4000
      ORCHESTRATOR_REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost}
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    depends_on:
      redis:
        condition: service_healthy
      ai-mcp:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  ai-mcp:
    image: ${IMAGE_REGISTRY}/ai:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: "8010"
      LLM_API_KEY: ${LLM_API_KEY:-EMPTY}
      LLM_MODEL: ${LLM_MODEL:-worktual-qwen-27B}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://81.17.61.149:8066/v1}
      PROPOSAL_LLM_API_KEY: ${PROPOSAL_LLM_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PROPOSAL_LLM_MODEL: ${PROPOSAL_LLM_MODEL:-gemini-3.5-flash}
      PROPOSAL_LLM_THINKING_LEVEL: ${PROPOSAL_LLM_THINKING_LEVEL:-high}
      MCP_MOUNT_IN_API: "false"
      CRM_API_BASE_URL: http://api:4000
    command:
      [
        "uvicorn",
        "app.mcp_main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8010",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',8010),2); s.close()",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  ai-a2a:
    image: ${IMAGE_REGISTRY}/ai:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: "8020"
      LLM_API_KEY: ${LLM_API_KEY:-EMPTY}
      LLM_MODEL: ${LLM_MODEL:-worktual-qwen-27B}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://81.17.61.149:8066/v1}
      PROPOSAL_LLM_API_KEY: ${PROPOSAL_LLM_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PROPOSAL_LLM_MODEL: ${PROPOSAL_LLM_MODEL:-gemini-3.5-flash}
      PROPOSAL_LLM_THINKING_LEVEL: ${PROPOSAL_LLM_THINKING_LEVEL:-high}
      MCP_MOUNT_IN_API: "false"
      MCP_PREFER_HTTP: "true"
      MCP_BASE_URL: http://ai-mcp:8010/mcp/v1
      CRM_API_BASE_URL: http://api:4000
      A2A_PUBLIC_URL: ${A2A_PUBLIC_URL:-http://ai-a2a:8020}
    command:
      [
        "uvicorn",
        "app.a2a_main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8020",
      ]
    depends_on:
      ai-mcp:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',8020),2); s.close()",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  meeting-postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: meeting
      POSTGRES_PASSWORD: ${MEETING_POSTGRES_PASSWORD:-meeting}
      POSTGRES_DB: meeting_service
    volumes:
      - meeting-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting -d meeting_service"]
      interval: 10s
      timeout: 5s
      retries: 10

  meeting-whisper:
    image: ${IMAGE_REGISTRY}/whisper-adapter:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      WHISPER_UPSTREAM_URL: ${WHISPER_UPSTREAM_URL:-http://173.234.75.165:7789/v1/audio/translations}
      WHISPER_UPSTREAM_TOKEN: ${WHISPER_UPSTREAM_TOKEN:-EMPTY}
      WHISPER_UPSTREAM_MODEL: ${WHISPER_UPSTREAM_MODEL:-worktual-large-v3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  meeting-service:
    image: ${IMAGE_REGISTRY}/meeting:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8030:8030"
    environment:
      DATABASE_URL: postgresql+psycopg://meeting:${MEETING_POSTGRES_PASSWORD:-meeting}@meeting-postgres:5432/meeting_service
      REDIS_URL: redis://redis:6379/1
      WHISPER_BASE_URL: http://meeting-whisper:8000
      WHISPER_API_TOKEN: EMPTY
      WHISPER_MODEL: ${WHISPER_UPSTREAM_MODEL:-worktual-large-v3}
      ENABLE_TEST_UI: "false"
      CRM_BOT_BASE_URL: http://api:4000
      CRM_USERS_BASE_URL: http://api:4000
      CRM_COMPLETED_WEBHOOK_URL: http://api:4000/api/webhooks/meeting-service/completed
      CRM_SERVICE_JWT_SECRET: ${CRM_SERVICE_JWT_SECRET}
      WEBHOOK_SECRET: ${MEETING_SERVICE_WEBHOOK_SECRET}
      CRM_BOT_API_KEY: ${CRM_BOT_API_KEY}
      CRM_USERS_API_KEY: ${CRM_USERS_API_KEY:-}
      GOOGLE_ADDON_CLIENT_ID: ${GOOGLE_ADDON_CLIENT_ID:-${ACCOUNTS_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}}
      GOOGLE_ADDON_CLOUD_PROJECT_NUMBER: ${GOOGLE_ADDON_CLOUD_PROJECT_NUMBER:-${VITE_GOOGLE_CLOUD_PROJECT_NUMBER:-}}
      VEXA_API_BASE: ${VEXA_API_BASE:-http://vexa-lite:8056}
      VEXA_API_KEY: ${VEXA_API_KEY:-}
      LIVE_PCM_ENABLED: "true"
      PUBLIC_BASE_URL: ${MEETING_SERVICE_VEXA_WEBHOOK_URL:-http://meeting-service:8030/internal/vexa/webhook}
      DEFAULT_BOT_NAME: ${MEETING_CAPTURE_BOT_DISPLAY_NAME:-Worktual Notetaker}
    depends_on:
      meeting-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meeting-whisper:
        condition: service_started
      vexa-lite:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8030/healthz"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s

  meeting-worker:
    image: ${IMAGE_REGISTRY}/meeting:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://meeting:${MEETING_POSTGRES_PASSWORD:-meeting}@meeting-postgres:5432/meeting_service
      REDIS_URL: redis://redis:6379/1
      WHISPER_BASE_URL: http://meeting-whisper:8000
      ENABLE_TEST_UI: "false"
      CRM_BOT_BASE_URL: http://api:4000
      CRM_USERS_BASE_URL: http://api:4000
      CRM_COMPLETED_WEBHOOK_URL: http://api:4000/api/webhooks/meeting-service/completed
      CRM_SERVICE_JWT_SECRET: ${CRM_SERVICE_JWT_SECRET}
      WEBHOOK_SECRET: ${MEETING_SERVICE_WEBHOOK_SECRET}
      CRM_BOT_API_KEY: ${CRM_BOT_API_KEY}
      CRM_USERS_API_KEY: ${CRM_USERS_API_KEY:-}
      VEXA_API_BASE: ${VEXA_API_BASE:-http://vexa-lite:8056}
      VEXA_API_KEY: ${VEXA_API_KEY:-}
      LIVE_PCM_ENABLED: "true"
      PUBLIC_BASE_URL: ${MEETING_SERVICE_VEXA_WEBHOOK_URL:-http://meeting-service:8030/internal/vexa/webhook}
    healthcheck:
      disable: true
    depends_on:
      meeting-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meeting-service:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  vexa-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "idle_in_transaction_session_timeout=60000"]
    environment:
      POSTGRES_DB: vexa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${VEXA_DB_PASSWORD:-postgres}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - vexa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vexa"]
      interval: 5s
      timeout: 5s
      retries: 12

  vexa-minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${VEXA_MINIO_ACCESS_KEY:-vexa-access-key}
      MINIO_ROOT_PASSWORD: ${VEXA_MINIO_SECRET_KEY:-vexa-secret-key}
    volumes:
      - vexa-miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  vexa-minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      vexa-minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set vexa http://vexa-minio:9000 $${MINIO_ROOT_USER:-vexa-access-key} $${MINIO_ROOT_PASSWORD:-vexa-secret-key}
        mc mb --ignore-existing vexa/$${MINIO_BUCKET:-vexa}
    environment:
      MINIO_ROOT_USER: ${VEXA_MINIO_ACCESS_KEY:-vexa-access-key}
      MINIO_ROOT_PASSWORD: ${VEXA_MINIO_SECRET_KEY:-vexa-secret-key}
      MINIO_BUCKET: vexa
    restart: "no"

  vexa-lite:
    image: vexaai/vexa-lite:${VEXA_IMAGE_TAG:-v012}
    container_name: vexa-lite
    restart: unless-stopped
    shm_size: "2gb"
    environment:
      DB_HOST: vexa-postgres
      DB_PORT: "5432"
      DB_NAME: vexa
      DB_USER: postgres
      DB_PASSWORD: ${VEXA_DB_PASSWORD:-postgres}
      ADMIN_API_TOKEN: ${VEXA_ADMIN_TOKEN:-dev-admin-token-local}
      ADMIN_TOKEN: ${VEXA_ADMIN_TOKEN:-dev-admin-token-local}
      INTERNAL_API_SECRET: ${VEXA_INTERNAL_API_SECRET:-local-vexa-internal-secret}
      TRANSCRIPTION_SERVICE_URL: http://meeting-whisper:8000
      TRANSCRIPTION_SERVICE_TOKEN: EMPTY
      TRANSCRIPTION_MODEL: ${WHISPER_UPSTREAM_MODEL:-worktual-large-v3}
      MINIO_ENDPOINT: vexa-minio:9000
      MINIO_ACCESS_KEY: ${VEXA_MINIO_ACCESS_KEY:-vexa-access-key}
      MINIO_SECRET_KEY: ${VEXA_MINIO_SECRET_KEY:-vexa-secret-key}
      MINIO_BUCKET: vexa
      MINIO_SECURE: "false"
      VEXA_LIVE_PCM_WS_BASE: ws://meeting-service:8030
      VEXA_LIVE_PCM_BOT_KEY: ${CRM_BOT_API_KEY:-local-meeting-bot-key}
      DEFAULT_BOT_NAME: ${MEETING_CAPTURE_BOT_DISPLAY_NAME:-Worktual Notetaker}
      BROWSER_IMAGE: vexaai/vexa-bot:${VEXA_IMAGE_TAG:-v012}
      IMAGE_TAG: ${VEXA_IMAGE_TAG:-v012}
      VEXA_ENV: development
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      vexa-postgres:
        condition: service_healthy
      vexa-minio-init:
        condition: service_completed_successfully
      meeting-whisper:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8056/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

volumes:
  redis-data:
  proposal-corpus-data:
  nurture-api-logs:
  meeting-pgdata:
  vexa-pgdata:
  vexa-miniodata:
