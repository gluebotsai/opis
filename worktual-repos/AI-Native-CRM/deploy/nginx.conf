# Browser never talks to ai-service or MCP — only Fastify (api:4000).
# Docker Compose: re-resolve service names when api/meeting containers are recreated
# (nginx otherwise caches IPs from web container start → 502 Bad Gateway).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        set $crm_api_upstream http://api:4000;
        proxy_pass $crm_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
    }

    location /socket-io/ {
        set $crm_api_upstream http://api:4000;
        proxy_pass $crm_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location = /health {
        set $crm_api_upstream http://api:4000;
        proxy_pass $crm_api_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /ready {
        set $crm_api_upstream http://api:4000;
        proxy_pass $crm_api_upstream/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Path B: Google Meet Sales Assist add-on (meeting-service).
    # Same origin as the CRM SPA so Marketplace sidePanelUrl can use FRONTEND_ORIGIN.
    location = /addons/meet {
        return 301 /addons/meet/$is_args$args;
    }

    location /addons/meet/ {
        set $meet_upstream http://meeting-service:8030;
        proxy_pass $meet_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_read_timeout 60s;
    }

    location /v1/assist/ {
        set $meet_upstream http://meeting-service:8030;
        proxy_pass $meet_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /v1/meetings/ {
        set $meet_upstream http://meeting-service:8030;
        proxy_pass $meet_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Dedicated Socket.IO port (same upstream as SPA — browser uses :5173/socket-io for cookies).
server {
    listen 4001;
    server_name _;

    location /socket-io/ {
        set $crm_api_upstream http://api:4000;
        proxy_pass $crm_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
