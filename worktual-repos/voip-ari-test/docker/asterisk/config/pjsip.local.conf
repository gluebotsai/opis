; Prefer username identify so LAN WebRTC REGISTERs are not stolen by trunk IP matches
[global]
type=global
endpoint_identifier_order=username,ip,anonymous

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=192.168.13.164
external_signaling_address=192.168.13.164
local_net=192.168.0.0/16
local_net=10.0.0.0/8
local_net=172.16.0.0/12

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
external_media_address=192.168.13.164
external_signaling_address=192.168.13.164
local_net=192.168.0.0/16
local_net=10.0.0.0/8
local_net=172.16.0.0/12

; WebSocket transport for browser WebRTC softphones
; Shares Asterisk HTTP server on 8088 (path /ws) — verified on production
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088
external_media_address=192.168.13.164
external_signaling_address=192.168.13.164
local_net=192.168.0.0/16
local_net=10.0.0.0/8
local_net=172.16.0.0/12

; Team Endpoint Definition
[nlp_ccaas_sipserver]
type=endpoint
context=from-pstn
disallow=all
allow=ulaw,alaw
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no
send_pai=yes
send_rpid=no
transport=transport-udp
aors=nlp_ccaas_sipserver_aor

; Outbound PSTN via gateway (Linux team path reverse of inbound)
[nlp_ccaas_sipserver_aor]
type=aor
contact=sip:192.168.12.166:5060

; IMPORTANT: do NOT match entire private ranges — that breaks WebRTC REGISTER from LAN
[nlp_ccaas_sipserver_identify]
type=identify
endpoint=nlp_ccaas_sipserver
# match=82.113.92.45/32 (production only)
match=192.168.12.166/32

; Trunk Endpoint for Asterisk Gateway 192.168.12.166
[provider_192_168_12_166]
type=endpoint
context=from-pstn
disallow=all
allow=ulaw,alaw
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no
send_pai=yes
send_rpid=no
transport=transport-udp
aors=provider_192_168_12_166_aor

[provider_192_168_12_166_aor]
type=aor
contact=sip:192.168.12.166:5060

[provider_192_168_12_166_identify]
type=identify
endpoint=provider_192_168_12_166
match=192.168.12.166/32

; Anonymous Fallback Endpoint (Disabled to block internet SIP scanners)
; [anonymous]
; type=endpoint
; context=from-pstn
; disallow=all
; allow=ulaw,alaw
; rtp_symmetric=yes
; force_rport=yes
; rewrite_contact=yes
; direct_media=no

; Template for Linphone Softphone Endpoints
[endpoint-template](!)
type=endpoint
context=from-internal
disallow=all
allow=ulaw,alaw,g722,opus
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes

; Template for browser WebRTC softphone endpoints
[webrtc-endpoint-template](!)
type=endpoint
context=from-internal
disallow=all
allow=ulaw,alaw,opus
webrtc=yes
media_encryption=dtls
dtls_auto_generate_cert=yes
dtls_verify=fingerprint
dtls_setup=actpass
ice_support=yes
use_avpf=yes
rtcp_mux=yes
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
transport=transport-ws
identify_by=username

; Extension 1001 (Agent 1 - Linphone)
[1001](endpoint-template)
auth=auth1001
aors=1001

[auth1001]
type=auth
auth_type=userpass
password=password1001
username=1001

[1001]
type=aor
max_contacts=5
remove_existing=yes

