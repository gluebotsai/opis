[general]
static=yes
writeprotect=no
clearglobalvars=no

; Inbound PSTN / SIP Trunk Contexts (outbound-pstn, from-pstn, default, public)
[outbound-pstn]
exten => h,1,Hangup()
exten => i,1,Hangup()
exten => s,1,NoOp(Inbound SIP Trunk Call on Start Extension from ${CALLERID(num)})
exten => s,n,Stasis(telephony,inbound,${EXTEN},${CALLERID(num)})
exten => s,n,Hangup()

exten => _+X.,1,NoOp(Inbound PSTN Call + ${EXTEN} from ${CALLERID(num)})
exten => _+X.,n,Stasis(telephony,inbound,${EXTEN},${CALLERID(num)})
exten => _+X.,n,Hangup()

exten => _X.,1,NoOp(Inbound PSTN Call ${EXTEN} from ${CALLERID(num)})
exten => _X.,n,Stasis(telephony,inbound,${EXTEN},${CALLERID(num)})
exten => _X.,n,Hangup()

[from-pstn]
exten => h,1,Hangup()
exten => i,1,Hangup()
exten => s,1,NoOp(Inbound SIP Trunk Call on Start Extension from ${CALLERID(num)})
exten => s,n,Stasis(telephony,inbound,${EXTEN},${CALLERID(num)})
exten => s,n,Hangup()

exten => _+X.,1,NoOp(Inbound PSTN Call + ${EXTEN} from ${CALLERID(num)})
exten => _+X.,n,Stasis(telephony,inbound,${EXTEN},${CALLERID(num)})
exten => _+X.,n,Hangup()

exten => _X.,1,NoOp(Inbound PSTN Call ${EXTEN} from ${CALLERID(num)})
exten => _X.,n,Stasis(telephony,inbound,${EXTEN},${CALLERID(num)})
exten => _X.,n,Hangup()

[default]
exten => h,1,Hangup()
exten => i,1,Hangup()
exten => s,1,NoOp(Default Context Start Extension from ${CALLERID(num)})
exten => s,n,Stasis(telephony,inbound,${EXTEN},${CALLERID(num)})
exten => s,n,Hangup()

exten => _+X.,1,NoOp(Default Context Routing ${EXTEN} from ${CALLERID(num)})
exten => _+X.,n,Stasis(telephony,inbound,${EXTEN},${CALLERID(num)})
exten => _+X.,n,Hangup()

exten => _X.,1,NoOp(Default Context Routing ${EXTEN} from ${CALLERID(num)})
exten => _X.,n,Stasis(telephony,inbound,${EXTEN},${CALLERID(num)})
exten => _X.,n,Hangup()

[public]
exten => h,1,Hangup()
exten => i,1,Hangup()
exten => s,1,NoOp(Public Context Start Extension from ${CALLERID(num)})
exten => s,n,Stasis(telephony,inbound,${EXTEN},${CALLERID(num)})
exten => s,n,Hangup()

exten => _+X.,1,NoOp(Public Context Routing ${EXTEN} from ${CALLERID(num)})
exten => _+X.,n,Stasis(telephony,inbound,${EXTEN},${CALLERID(num)})
exten => _+X.,n,Hangup()

exten => _X.,1,NoOp(Public Context Routing ${EXTEN} from ${CALLERID(num)})
exten => _X.,n,Stasis(telephony,inbound,${EXTEN},${CALLERID(num)})
exten => _X.,n,Hangup()

; E2E Local-channel media legs (;2 side stays up while ;1 is in Stasis bridge)
[e2e]
exten => hold,1,NoOp(E2E hold leg)
exten => hold,n,Answer()
exten => hold,n,Wait(120)
exten => hold,n,Hangup()

[from-internal]
exten => h,1,Hangup()
exten => i,1,Hangup()
exten => 600,1,NoOp(Linphone Audio Echo Test Started)
exten => 600,n,Answer()
exten => 600,n,Playback(demo-echotest)
exten => 600,n,Echo()
exten => 600,n,Hangup()

exten => _1XXX,1,NoOp(Incoming Linphone Call from ${CALLERID(num)} to ${EXTEN})
exten => _1XXX,n,Stasis(telephony,inbound,${EXTEN},${CALLERID(num)})
exten => _1XXX,n,Hangup()

exten => _wXXXX,1,NoOp(Incoming WebRTC Call from ${CALLERID(num)} to ${EXTEN})
exten => _wXXXX,n,Stasis(telephony,inbound,${EXTEN},${CALLERID(num)})
exten => _wXXXX,n,Hangup()

exten => _+X.,1,NoOp(Routing pattern ${EXTEN} to Telephony Platform Stasis)
exten => _+X.,n,Stasis(telephony,inbound,${EXTEN},${CALLERID(num)})
exten => _+X.,n,Hangup()

exten => _X.,1,NoOp(Routing pattern ${EXTEN} to Telephony Platform Stasis)
exten => _X.,n,Stasis(telephony,inbound,${EXTEN},${CALLERID(num)})
exten => _X.,n,Hangup()
