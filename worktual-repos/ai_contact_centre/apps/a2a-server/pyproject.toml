[project]
name = "ai-contact-center-a2a"
version = "0.1.0"
description = "Worktual Contact Centre A2A v1.0 spoke server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "ai-contact-center-nlp",
    "a2a-sdk[fastapi]>=1.0.0",
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.43.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.13.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.9",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv.sources]
ai-contact-center-nlp = { path = "../nlp", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_a2a"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "../nlp/src"]
