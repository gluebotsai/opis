<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E2E Webchat Customer</title>
    <style>
      :root {
        font-family: Inter, system-ui, sans-serif;
        color: #111;
        background: #f8fafc;
      }
      body {
        margin: 0;
        padding: 24px;
        max-width: 480px;
      }
      h1 {
        font-size: 1.1rem;
        margin: 0 0 8px;
      }
      #status {
        font-size: 0.85rem;
        color: #475569;
        margin-bottom: 12px;
      }
      #messages {
        min-height: 280px;
        max-height: 420px;
        overflow-y: auto;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        background: #fff;
        padding: 12px;
        margin-bottom: 12px;
      }
      .msg {
        margin: 8px 0;
        padding: 8px 10px;
        border-radius: 10px;
        font-size: 0.9rem;
        line-height: 1.4;
        max-width: 90%;
      }
      .msg.user {
        margin-left: auto;
        background: #4f46e5;
        color: #fff;
      }
      .msg.bot,
      .msg.agent,
      .msg.system {
        background: #f1f5f9;
        color: #0f172a;
      }
      .msg .from {
        display: block;
        font-size: 0.7rem;
        opacity: 0.7;
        margin-bottom: 2px;
      }
      .composer {
        display: flex;
        gap: 8px;
      }
      #input {
        flex: 1;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 0.95rem;
      }
      button {
        border: none;
        border-radius: 10px;
        padding: 10px 14px;
        font-weight: 600;
        cursor: pointer;
      }
      #send {
        background: #4f46e5;
        color: #fff;
      }
      #end {
        margin-top: 8px;
        background: #fee2e2;
        color: #991b1b;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h1>Customer Webchat</h1>
    <div id="status" data-testid="webchat-status">Connecting…</div>
    <div id="messages" data-testid="webchat-messages" aria-live="polite"></div>
    <div class="composer">
      <input id="input" data-testid="webchat-input" placeholder="Type a message…" />
      <button id="send" type="button" data-testid="webchat-send">Send</button>
    </div>
    <button id="end" type="button" data-testid="webchat-end">End chat</button>

    <script>
      const params = new URLSearchParams(location.search);
      const webchatId =
        params.get("webchatId") || "wc_5d80cd9b1ace4080bc70717552472611";
      const visitorId = params.get("visitorId") || `v_e2e_${Date.now()}`;
      const wsUrl =
        params.get("wsUrl") ||
        `ws://localhost:3002/ws/webchat?webchatId=${encodeURIComponent(webchatId)}&visitorId=${encodeURIComponent(visitorId)}`;

      const statusEl = document.getElementById("status");
      const messagesEl = document.getElementById("messages");
      const inputEl = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const endBtn = document.getElementById("end");

      let socket = null;
      let sessionReady = false;

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function appendMessage(from, text) {
        const item = document.createElement("div");
        item.className = `msg ${from}`;
        item.dataset.from = from;
        item.dataset.testid = `webchat-msg-${from}`;
        item.innerHTML = `<span class="from">${from}</span>${text}`;
        messagesEl.appendChild(item);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      let conversationId = null;

      function connect() {
        socket = new WebSocket(wsUrl);
        socket.addEventListener("open", () => {
          setStatus("Connected. Starting session…");
          socket.send(
            JSON.stringify({
              type: "session.start",
              webchatId,
              visitorId,
              pageUrl: location.href,
              consent: { accepted: true },
            }),
          );
        });

        socket.addEventListener("message", (event) => {
          let frame;
          try {
            frame = JSON.parse(event.data);
          } catch {
            return;
          }

          if (frame.type === "session.ready") {
            sessionReady = true;
            conversationId = frame.conversationId || null;
            setStatus(`Session ready (${frame.conversationId || "active"})`);
            window.__webchatReady = true;
            return;
          }

          if (frame.type === "message" && frame.text) {
            appendMessage(frame.from || "bot", frame.text);
            return;
          }

          if (frame.type === "system" && frame.text) {
            appendMessage("system", frame.text);
          }
        });

        socket.addEventListener("close", () => {
          sessionReady = false;
          setStatus("Disconnected");
          window.__webchatReady = false;
        });

        socket.addEventListener("error", () => {
          setStatus("Connection error");
        });
      }

      function sendMessage(text) {
        if (!socket || socket.readyState !== WebSocket.OPEN || !sessionReady) return false;
        socket.send(
          JSON.stringify({
            type: "message",
            webchatId,
            visitorId,
            text,
          }),
        );
        appendMessage("user", text);
        return true;
      }

      function endSession() {
        if (!socket || socket.readyState !== WebSocket.OPEN) return;
        socket.send(
          JSON.stringify({
            type: "session.end",
            webchatId,
            visitorId,
            reason: "customer_ended",
          }),
        );
        setStatus("Chat ended");
      }

      sendBtn.addEventListener("click", () => {
        const text = inputEl.value.trim();
        if (!text) return;
        if (sendMessage(text)) inputEl.value = "";
      });

      inputEl.addEventListener("keydown", (event) => {
        if (event.key === "Enter") sendBtn.click();
      });

      endBtn.addEventListener("click", endSession);

      window.__webchat = {
        webchatId,
        visitorId,
        get conversationId() {
          return conversationId;
        },
        sendMessage,
        endSession,
        isReady: () => sessionReady,
      };

      connect();
    </script>
  </body>
</html>
