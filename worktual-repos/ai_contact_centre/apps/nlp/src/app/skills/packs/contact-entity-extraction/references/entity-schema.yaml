fields:
  email: primary email identity (identity_keys.email -> Contacts primaryEmail)
  phone: primary phone identity (identity_keys.phone -> Contacts primaryPhone)
  first_name: customer given / first name (customer_profile.first_name)
  last_name: customer surname / family name (customer_profile.last_name)
  company: company name (customer_profile.company)
  city: city (customer_profile.city)
  country: country (customer_profile.country)
