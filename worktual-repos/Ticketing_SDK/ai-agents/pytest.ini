[pytest]
markers =
    auth_boundary: Express RBAC rejects even if graph allows route
    regression: fixed labeled transcripts (run every deploy)
    contract: schema / registry contracts
    security: role mutations, injection, no direct DB from agents
    load: latency budgets and concurrency isolation
    chaos: timeouts / RETRYABLE mid-workflow
    e2e: chat happy paths (fake LLM)
    integration: real Express + Postgres (RUN_INTEGRATION=1)
    migration: workflow draft schema forward-compat
